<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F2A38">
<title>Live Scoring · Flagstick</title>
<link rel="icon" href="favicon.png?v=3">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<style>
:root{--navy:#0F2A38;--deep:#0A1C27;--gold:#8C6A1F;--goldl:#D8B75F;--ivory:#FBFAF5;--paper:#F4F0E6;--line:#E3DCC9;--muted:#56626A;--ink:#14222B;--pos:#1F6B4A;--neg:#A1402B;
  --serif:'Cormorant Garamond',Georgia,serif;--sans:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box} html,body{margin:0;height:100%} [hidden]{display:none!important}
html,body,button,.scale button,.opts button{touch-action:manipulation}   /* no double-tap zoom on the +/− and score buttons */
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit} button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
body{font-variant-numeric:lining-nums}
.num{font-variant-numeric:lining-nums tabular-nums}
.top{background:var(--navy);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 14px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
.top img{width:42px;height:42px;object-fit:contain}
.top .t{display:flex;flex-direction:column;min-width:0;flex:1}
.top b{font-family:var(--serif);font-size:22px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top small{color:var(--goldl);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(111,191,142,.18);color:#bfe8cf;white-space:nowrap}
.pill.off{background:rgba(224,123,98,.2);color:#f3c1b4} .pill.wait{background:rgba(216,183,95,.2);color:var(--goldl)}
main{max-width:640px;margin:0 auto;padding:18px 14px calc(96px + env(safe-area-inset-bottom,0px))}
.card{background:#fff;border:1px solid var(--line);border-radius:12px}
.pad{padding:20px}
h1{font-family:var(--serif);font-weight:700;color:var(--navy);font-size:32px;margin:0;line-height:1.05}
.muted{color:var(--muted)} .pos{color:var(--pos)} .neg{color:var(--neg)}
.inp{width:100%;height:56px;border:1px solid #CFC6AE;border-radius:10px;padding:0 16px;font-size:24px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;text-align:center;background:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--navy);font-weight:700;font-size:15px}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff} .btn.wide{width:100%} .btn[disabled]{opacity:.45}
.err{color:var(--neg);font-weight:600;min-height:20px;margin:10px 0 0;text-align:center}
.holehead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.holehead .n{font-family:var(--serif);font-size:44px;font-weight:700;color:var(--navy);line-height:1}
.holehead .meta{font-size:14px;color:var(--muted)} .holehead .meta b{color:var(--ink)}
.nav{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:22px;color:var(--navy)}
.pl{display:grid;grid-template-columns:minmax(0,1fr) 56px 64px 56px;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.pl:first-child{border-top:none}
.pl .nm{font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .sub{font-size:12.5px;color:var(--muted)}
.step{height:56px;border-radius:12px;border:1px solid var(--line);background:var(--ivory);font-size:28px;font-weight:600;color:var(--navy)}
.val{height:56px;border-radius:12px;border:2px solid var(--navy);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;background:#fff}
/* an untouched hole reads as the par it will be saved as — no grey, nothing to "fix" (the owner: the dashed grey made people think they had to move it) */
.val.empty{border-color:var(--navy);color:var(--ink)}
.val.under{background:#E3F0E8;border-color:var(--pos);color:var(--pos)} .val.over{background:#F8E6DF;border-color:var(--neg);color:var(--neg)}
.strip{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px;margin-top:14px}
.strip button{height:38px;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:13px;color:var(--muted)}
.strip button.done{background:var(--navy);border-color:var(--navy);color:#fff} .strip button.part{border-color:var(--gold);color:var(--gold)}
.strip button.cur{outline:2px solid var(--gold);outline-offset:1px}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.tabbar button{flex:1 1 0;min-width:0}
.tabbar button{height:62px;border:none;background:none;font-weight:700;font-size:13.5px;color:var(--muted);border-top:3px solid transparent}
.tabbar button.on{color:var(--navy);border-top-color:var(--gold)}
.lb{display:grid;grid-template-columns:44px minmax(0,1fr) 44px 48px;gap:8px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.lb.h{font-size:12px;font-weight:700;color:var(--muted);border-top:none;background:var(--ivory);padding-top:10px;padding-bottom:10px}
.lb .tp{font-weight:800;font-size:17px;text-align:right} .lb .r{text-align:right}
.lb.me{background:#FBF4E0}
.sc{width:100%;border-collapse:collapse;font-size:14px} .sc th,.sc td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:center}
.sc th{font-size:12px;color:var(--muted);font-weight:700;background:var(--ivory)} .sc td:first-child,.sc th:first-child{text-align:left;padding-left:14px}
.sc tr.tot td{font-weight:800;background:var(--ivory)}
.banner{background:#F6ECCF;border:1px solid #E5CF8E;color:#5C4410;border-radius:10px;padding:12px 14px;font-size:14px;margin-bottom:14px}
.big .lb{grid-template-columns:clamp(40px,4.5vw,64px) minmax(0,1fr) clamp(44px,5.5vw,80px) clamp(56px,7vw,100px);font-size:clamp(15px,1.7vw,22px);padding:clamp(10px,1.2vw,16px) clamp(14px,2vw,24px)}
.chips{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -14px 10px;padding:0 14px 2px;-webkit-overflow-scrolling:touch}.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:13px;color:var(--muted);white-space:nowrap}.chips button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chips.sub button{height:32px;font-size:12.5px;padding:0 12px}
.lb.sk{grid-template-columns:44px minmax(0,1fr) 40px} .big .lb.sk{grid-template-columns:clamp(44px,5vw,80px) minmax(0,1fr) clamp(44px,6vw,90px)} .big .lb.h{font-size:clamp(12px,1.1vw,15px)}
.lb.none{display:block;text-align:center;padding:26px 16px}
.lb.m{grid-template-columns:40px minmax(0,1fr) 36px 92px} .big .lb.m{grid-template-columns:clamp(40px,4.5vw,64px) minmax(0,1fr) clamp(36px,5vw,70px) clamp(92px,13vw,190px)} .big .lb .muted{font-size:clamp(12px,1.2vw,16px)}
.fmtpill{display:inline-block;padding:4px 12px;border-radius:999px;background:#F6ECCF;border:1px solid #E5CF8E;color:#6B4F12;font-weight:800;font-size:12.5px}
.pop{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);margin-left:6px;vertical-align:2px}
.big .lb .tp{font-size:clamp(18px,2vw,26px)} .big main{max-width:1100px} .big h1{font-size:clamp(24px,3vw,38px)!important;margin:4px 2px 14px!important;line-height:1.1}
/* desktop: the same board with room to breathe — a wider card, larger rows, the title above the competitions */
.ttl{display:none}
@media (min-width:900px){
  body:not(.big) main{max-width:1040px;padding:26px 28px 80px}
  body:not(.big) .ttl{display:block;font-family:var(--serif);font-size:38px;line-height:1.05;margin:4px 2px 16px;color:var(--navy)} body:not(.big) .ttl small{display:block;font-family:var(--sans);font-size:14px;font-weight:600;color:var(--muted);margin-top:6px;letter-spacing:.02em}
  body:not(.big) .chips button{height:44px;font-size:15px;padding:0 20px}
  body:not(.big) .lb{grid-template-columns:64px minmax(0,1fr) 90px 120px;gap:14px;padding:16px 24px;font-size:19px}
  body:not(.big) .lb.h{font-size:13px;padding-top:12px;padding-bottom:12px}
  body:not(.big) .lb .tp{font-size:26px} body:not(.big) .lb .muted{font-size:14px}
  body:not(.big) .lb.sk{grid-template-columns:72px minmax(0,1fr) 90px} body:not(.big) .lb.m{grid-template-columns:64px minmax(0,1fr) 70px 220px}
  body:not(.big) .lb.none{padding:40px 24px;font-size:17px}
  body:not(.big) main>p.muted,body:not(.big) .card+p.muted{font-size:14px}
}
/* the Finish tab: the wrap-up as numbered steps */
.wstep{margin-bottom:12px;overflow:hidden} .wstep .sh{display:flex;align-items:center;gap:12px;padding:14px 16px}
.wstep .sn{width:30px;height:30px;border-radius:50%;background:var(--ivory);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--navy);flex:none;font-size:14px}
.wstep.done .sn{background:var(--pos);border-color:var(--pos);color:#fff} .wstep.now .sn{background:var(--navy);border-color:var(--navy);color:#fff} .wstep.later{opacity:.55}
.wstep .st{font-weight:800;font-size:17px;color:var(--navy);line-height:1.2} .wstep .ss{font-size:13px;color:var(--muted)} .wstep .sb{padding:0 16px 16px}
.ln{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14.5px;align-items:center} .ln:first-child{border-top:none}
.ln .k{font-weight:700;color:var(--navy);margin-right:8px} .ln .amt{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap} .ln .sub{font-size:12.5px;color:var(--muted)}
.ln.tot{border-top:2px solid var(--line);font-weight:800}
.act{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap} .act .btn{flex:1 1 180px}
.btn.gold{background:var(--goldl);border-color:var(--goldl);color:var(--navy);height:54px;font-size:16px}
.sel{height:46px;border:1px solid #CFC6AE;border-radius:10px;padding:0 12px;background:#fff;font-size:15px;font-weight:600;width:100%}
.note{background:var(--ivory);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;color:var(--muted);margin-top:10px}
/* the stage: the skins call-out and the draw, full screen on navy */
.ov{position:fixed;inset:0;background:var(--navy);color:#fff;z-index:50;display:flex;flex-direction:column}
.ov .hd{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 10px;border-bottom:1px solid rgba(255,255,255,.14)}
.ov .hd b{font-family:var(--serif);font-size:22px;line-height:1.05;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .ov .hd small{display:block;color:var(--goldl);font-size:12.5px;font-family:var(--sans)}
.ov .x{width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;font-size:18px}
.ov .bd{flex:1;overflow:auto;padding:6px 16px 16px;-webkit-overflow-scrolling:touch}
.ov .bar{display:flex;gap:12px;align-items:center;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid rgba(255,255,255,.14);font-size:13px;color:rgba(255,255,255,.8)}
.ov .bar b{color:#fff} .ov .go{margin-left:auto;background:var(--goldl);color:var(--navy);font-weight:800;height:52px;border-radius:12px;border:none;padding:0 22px;font-size:16px;white-space:nowrap}
.ov .lbl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--goldl);margin:12px 0 6px;font-weight:700}
.skl{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.12);align-items:center}
.skl b{font-family:var(--serif);font-size:28px;line-height:1} .skl span{font-weight:600} .skl small{display:block;opacity:.72;font-size:12.5px;margin-top:2px}
.skl.won span{color:#bfe8cf} .skl.void span{opacity:.6;text-decoration:line-through} .skl.pending span{color:var(--goldl)} .skl.muted{opacity:.6}
.flash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:10px}
.flash .fh{font-size:15px;color:rgba(255,255,255,.8)} .flash .big{font-family:var(--serif);font-size:54px;font-weight:700;line-height:1} .flash.ok .big{color:#bfe8cf} .flash.bad .big{color:#f3c1b4} .flash .fs{font-size:14px;color:rgba(255,255,255,.8);max-width:320px}
.dteam{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 0}
.dslot{min-width:200px;padding:14px 20px;border-radius:14px;border:1px solid rgba(255,255,255,.25);font-family:var(--serif);font-size:30px;font-weight:700;text-align:center;line-height:1.1}
.dslot.rolling{color:var(--goldl);opacity:.85} .dslot.won{background:rgba(216,183,95,.16);border-color:var(--goldl)} .dslot.empty{opacity:0}
.dsum{display:grid;grid-template-columns:80px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.12);font-size:15px} .dsum span{color:var(--goldl);font-weight:700} .dsum b{font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><img src="flagstick-crest-light.svg" alt="Flagstick"><div class="t"><b id="evName">Live Scoring</b><small id="evSub">Walnut Creek Country Club</small></div><span class="pill" id="sync" hidden></span></header>
<main id="main"><div class="card pad"><p class="muted">Loading…</p></div></main>
<nav class="tabbar" id="tabs" hidden aria-label="Scoring"><button data-t="score">Score</button><button data-t="board">Leaderboard</button><button data-t="card">Scorecard</button><button data-t="finish" id="tabFinish" hidden>Finish</button></nav>
<script>
/*GOLFCORE*/

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CFG=window.MM_CONFIG||{}; const sb=(CFG.url&&CFG.anonKey&&window.supabase)?window.supabase.createClient(CFG.url,CFG.anonKey,{auth:{persistSession:false}}):null;
const qs=new URLSearchParams(location.search), SLUG=(qs.get('e')||'').trim(), BIG=qs.get('view')==='board';
if(BIG) document.body.classList.add('big');
let pub=null, wrap=null, scores={}, groupId=null, code='', tab=BIG?'board':'score', holeIdx=0, lbFlight=qs.get('flight')||'', lbSort=null, lbView=qs.get('players')?'players':'teams', lbComp=null;
const KEY='mga_score_'+SLUG, QKEY='mga_scoreq_'+SLUG;
let queue=[]; try{ queue=JSON.parse(localStorage.getItem(QKEY)||'[]'); }catch(_){}
const saveQ=()=>{ try{ localStorage.setItem(QKEY,JSON.stringify(queue)); }catch(_){} };
const group=()=>pub&&pub.groups.find(g=>g.id===groupId);
function setSync(){ const s=$('sync'); if(!groupId&&!BIG){ s.hidden=true; return; } s.hidden=false;
  if(queue.length){ s.className='pill '+(navigator.onLine?'wait':'off'); s.textContent=navigator.onLine?`Saving ${queue.length}…`:`Offline · ${queue.length} waiting`; }
  else { s.className='pill'; s.textContent=pub&&pub.status==='live'?'● Live':pub&&pub.status==='final'?'Final':'Saved'; } }
function fail(msg){ $('main').innerHTML=`<div class="card pad"><h1>Live scoring</h1><p class="muted" style="margin-top:10px">${msg}</p></div>`; }

async function loadScores(){
  const {data,error}=await sb.from('golf_scores').select('player_id,hole,strokes').eq('event_id',pub.id);
  if(error) return; const m={}; for(const r of data||[]) (m[r.player_id]=m[r.player_id]||{})[r.hole]=r.strokes;
  for(const q of queue){ (m[q.p]=m[q.p]||{}); if(q.s) m[q.p][q.h]=q.s; else delete m[q.p][q.h]; } // local edits win until they're saved
  scores=m;
}
/* the event itself (groups, tees, handicaps, competitions) is re-read every 30 s and whenever the page comes back
   into view, so a mid-round change in the hub — an index corrected, a player moved, a competition added — reaches
   every phone and board without a reload */
let pubSig='', TENANT=null;
/* which club this address belongs to (tenants-setup.sql); nothing until that has run, and the look-up then matches the slug alone */
async function resolveTenant(){ try{ const {data,error}=await sb.rpc('tenant_lookup',{p_host:qs.get('tenant')||location.hostname}); if(!error&&data&&data.slug) TENANT=data.slug; }catch(_){} }
const evArgs=o=>TENANT?Object.assign({p_tenant:TENANT},o):o;
async function loadEvent(){
  const {data,error}=await sb.rpc('golf_event',evArgs({p_slug:SLUG}));
  if(error) return 'error'; if(!data) return 'none';
  const sig=JSON.stringify(data), changed=sig!==pubSig; pubSig=sig; pub=data; wrap=pub.wrap||null; applyWrap();
  if(changed){ const comps=(pub.comps||[]).length, name=String(pub.name||'').replace(/\s·\s[A-Z][a-z]{2} \d{1,2}(, \d{4})?$/,'');
    $('evName').textContent=name; $('evSub').textContent=[pub.date&&new Date(pub.date+'T12:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}),comps?comps+' competition'+(comps===1?'':'s'):formatSummary(pub)].filter(Boolean).join(' · '); document.title=name+' · '+pub.club+' · Live Scoring';
    if(groupId&&!group()){ groupId=null; code=''; tab='score'; } } // our group was removed from the event
  return changed;
}
const typing=()=>{ const a=document.activeElement; return !!a&&(a.tagName==='INPUT'||a.tagName==='SELECT'||a.tagName==='TEXTAREA'); };
async function refresh(){
  if(document.visibilityState!=='visible') return;
  const changed=await loadEvent(); if(changed==='error'||changed==='none') return;
  if(BIG||tab==='board'||tab==='finish'){ await loadScores(); if(!document.querySelector('.ov')) render(); }
  else if(changed&&!typing()) render();
}
async function boot(){
  if(!SLUG) return fail('This link is missing its event. Ask the committee for the scoring link.');
  if(!sb) return fail('Live scoring isn’t connected yet.');
  await resolveTenant();
  const r=await loadEvent();
  if(r==='error') return fail('Couldn’t reach live scoring. Check your signal and reload.');
  if(r==='none') return fail('No event found for this link. Check the link with the committee.');
  await loadScores();
  sb.channel('s-'+pub.id).on('postgres_changes',{event:'*',schema:'public',table:'golf_scores',filter:'event_id=eq.'+pub.id},p=>{
    const r=p.eventType==='DELETE'?p.old:p.new; if(!r) return; if(queue.some(q=>q.p===r.player_id&&q.h===r.hole)) return;
    scores[r.player_id]=scores[r.player_id]||{}; if(p.eventType==='DELETE') delete scores[r.player_id][r.hole]; else scores[r.player_id][r.hole]=r.strokes;
    if(tab!=='score') render(); }).subscribe();
  setInterval(refresh,30000); setInterval(()=>{ if(tab==='finish'&&!BIG) refresh(); },10000);
  if(BIG) setInterval(()=>{ const fl=(pub&&pub.flights)||[]; if(fl.length<2||qs.get('flight')) return; lbFlight=fl[(fl.indexOf(lbFlight)+1)%fl.length]; render(); },12000);   // the wall screen walks through the flights, 12 s each; ?flight=A pins one document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') refresh(); });
  const saved=(()=>{ try{ return JSON.parse(localStorage.getItem(KEY)||'null'); }catch(_){ return null; } })();
  const qg=(qs.get('g')||'').trim();
  if(qg&&!BIG){ const ok=await join(qg,true); if(ok) history.replaceState(null,'',location.pathname+'?e='+encodeURIComponent(SLUG)); }
  else if(saved&&saved.code&&!BIG) await join(saved.code,true);
  render(); flush();
}
async function join(c,silent){
  c=String(c||'').trim().toUpperCase(); if(!c) return;
  const {data,error}=await sb.rpc('golf_join',evArgs({p_slug:SLUG,p_code:c}));
  if(error||!data||!pub.groups.find(g=>g.id===data)){ if(!silent){ $('joinErr').textContent=error?'Couldn’t check that — try again.':'That group ID isn’t in this event.'; } else localStorage.removeItem(KEY); return false; }
  groupId=data; code=c; try{ localStorage.setItem(KEY,JSON.stringify({code:c})); }catch(_){}
  const g=group(), order=playOrder(g.startHole);

/* ============ the Finish tab: a game wrapped up by the players themselves ============
   Anyone who has joined with a group ID walks the room through it, in order: close scoring (nothing changes after
   this) → call out the skins → draw the partners → the winners and what they get → who's owed what. Every step is saved
   through golf_wrap with a compare-and-swap on the wrap's version, so two phones never record a step twice: the second

async function wrapCall(action,data){
  if(wrapBusy) return null; wrapBusy=true;

    if(error){ if(/conflict/i.test(error.message)){ await loadEvent(); await loadScores(); return 'conflict'; } alert(error.message||'Couldn’t save that — try again.'); return null; }
    wrap=w; pub.wrap=w; if(action==='close') pub.status='final'; applyWrap(); return w; }

function wrapSteps(){

/* the skins call-out, on stage: hole by hole in play order, one tap each; a won skin reads as a skin until the hole that

function calloutStage(comp){

    if(w){ const name=`${w.name} · ${w.score}${sk.net&&w.net!==w.score?' (net '+w.net+')':''}`, fin=i>=order.length, worth=per?`${w.count>1?w.count+' holes':'1 hole'} · ${money(val*w.count)}`:fin?`skin · ${money(val)}`:'skin';
      if(validating&&w.checkHole!=null&&!revealed.has(w.hole)) return {h,txt:name,sub:`skin — needs ${vtxt} or better on hole ${w.checkHole} to hold`,cls:'pending'};

  const paint=()=>{ const done=i>=order.length&&!flash;
    ov.innerHTML=`<div class="hd"><b>${esc(comp.name)}<small>${esc(pub.name)} · from the cards</small></b><button class="x" id="ovX" aria-label="Close">✕</button></div>
      ${flash?`<div class="flash ${flash.ok?'ok':'bad'}"><div class="fh">Hole ${flash.w.hole} · ${esc(flash.w.name)}</div><div class="big">${flash.ok?'Validated':esc(((pub.game||{}).failWord)||'Didn’t validate')}</div><div class="fs">${esc(madeOn(flash.w)||'')}${flash.ok?` — ${esc(vtxt)} or better, the skin stands`:` — needed ${esc(vtxt)}${per?', carried on':', no skin'}`}</div></div>`

        ${done?`<div class="lbl" style="margin-top:18px">The skins</div>${r.total?Object.entries(r.per).map(([pid,n])=>`<div class="dsum"><span>${n} ${per?'hole':'skin'}${n===1?'':'s'}</span><b>${esc(pubNames(pub)[pid]||'?')} · ${money(val*n)}</b></div>`).join(''):'<div class="dsum"><span>—</span><b>No skins today — the pot stays put</b></div>'}${r.pending?`<div class="dsum"><span>${r.pending}</span><b>still pending a validation hole</b></div>`:''}`:''}</div>`}
      <div class="bar"><span><b>${(comp.players||[]).length}</b> in</span><span><b>${money(total)}</b> pot</span>${done?`<button class="go" id="ovGo">Done</button>`:`<button class="go" id="ovGo">${flash?'Show hole '+order[i]:i?'Next hole':'Start at hole '+order[0]}</button>`}</div>`;
    ov.querySelector('#ovX').onclick=close; ov.querySelector('#ovGo').onclick=done?close:next; const bd=ov.querySelector('.bd'); if(bd) bd.scrollTop=bd.scrollHeight; };
  const next=()=>{ if(flash){ revealed.add(flash.w.hole); flash=null; if(!decidedBy(order[i])) i++; paint(); return; }   // on to the hole itself (or the next verdict it decides)
    const w=decidedBy(order[i]); if(w){ flash={w,ok:w.status==='won'}; paint(); return; }   // the hole about to be called decides a skin: the verdict first
    i++; paint(); };
  paint();
}
/* the draw, on stage: saved first, then revealed one team at a time */
async function drawStage(comp){
  const ps=evPlayersOf(comp.players), size=+comp.teamSize||2, method=($('wfMethod')||{}).value||'random', odd=($('wfOdd')||{}).value||'join';
  const D=drawFor(ps,size,method,hcpOf,odd,comp.nTeams||null); if(!D){ alert('Not enough players to draw'); return; }
  const w=await wrapCall('draw',{comp:comp.id,teams:D.teams,sitOut:D.sitOut,method,size}); if(!w||w==='conflict'){ render(); return; }
  const teams=D.list, nm=pubNames(pub), ov=document.createElement('div'); ov.className='ov'; document.body.appendChild(ov);
  let timer=null; const wait=ms=>new Promise(r=>{ timer=setTimeout(r,ms); }); let open=true;
  const close=()=>{ open=false; clearTimeout(timer); ov.remove(); render(); };
  const maxLen=Math.max(...teams.map(t=>t.length));
  ov.innerHTML=`<div class="hd"><b>${esc(comp.name)}<small>${esc(pub.name)} · the draw</small></b><button class="x" id="ovX" aria-label="Close">✕</button></div>
    <div class="bd"><div class="lbl" id="dLbl">Team 1 of ${teams.length}</div>${method==='abcd'?`<div style="display:flex;gap:16px;justify-content:center;color:var(--goldl);font-weight:800;letter-spacing:.2em">${Array.from({length:maxLen},(_,k)=>`<span>${TIER_LETTERS[k]||''}</span>`).join('')}</div>`:''}
      <div class="dteam" id="dTeam">${Array.from({length:maxLen},(_,k)=>`<div class="dslot" id="dS${k}">?</div>`).join('')}</div><div id="dDone"></div></div>
    <div class="bar"><span><b>${teams.length}</b> teams</span><span>Saved before the reveal</span><button class="go" id="ovGo" hidden>Done</button></div>`;
  ov.querySelector('#ovX').onclick=close; ov.querySelector('#ovGo').onclick=close;
  const pool=ps.map(p=>p.name), slot=k=>ov.querySelector('#dS'+k), done=ov.querySelector('#dDone');
  for(let i=0;i<teams.length&&open;i++){ const t=teams[i]; ov.querySelector('#dLbl').textContent=`Team ${i+1} of ${teams.length}`;
    for(let k=0;k<maxLen;k++){ const s=slot(k); if(s){ s.textContent=k<t.length?'?':''; s.className='dslot'+(k<t.length?'':' empty'); } }
    for(let k=0;k<t.length&&open;k++){ const s=slot(k); s.classList.add('rolling'); for(let z=0;z<14;z++){ s.textContent=pool[secureInt(pool.length)]; await wait(40+Math.round(z*z*1.3)); }
      s.textContent=t[k].name; s.classList.remove('rolling'); s.classList.add('won'); await wait(i===teams.length-1&&k===t.length-1?1200:700); }
    if(!open) break; done.insertAdjacentHTML('beforeend',`<div class="dsum"><span>Team ${i+1}</span><b>${esc(t.map(p=>p.name).join(' & '))}</b></div>`); await wait(800); }
  if(!open) return;
  ov.querySelector('#dLbl').textContent='The partners'; ov.querySelector('#dTeam').style.display='none';
  if(D.sitOut.length) done.insertAdjacentHTML('beforeend',`<div class="dsum"><span>Sitting out</span><b>${esc(D.sitOut.map(id=>nm[id]||'?').join(', '))}</b></div>`);
  ov.querySelector('#ovGo').hidden=false;
}
boot();
