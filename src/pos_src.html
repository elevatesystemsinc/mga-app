<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{--navy:#0F2A38;--gold:#C7A13A;--goldl:#D8B75F;--golddk:#7E5F1A;--paper:#F4F0E6;--ivory:#FBFAF5;--line:#E3DCC9;--muted:#56626A;--ink:#14222B;--pos:#1F6B4A;--neg:#B5443A;
  --serif:'Cormorant Garamond',Georgia,serif;--sans:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent} html,body{margin:0;height:100%} [hidden]{display:none!important}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased;font-variant-numeric:lining-nums;overscroll-behavior:none;user-select:none}
button,input{font:inherit;color:inherit} button{cursor:pointer}
.top{background:radial-gradient(circle at 10% 40%,#1B3D50,var(--navy) 65%);color:#fff;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;display:flex;align-items:center;gap:12px;border-bottom:3px solid var(--gold);min-height:56px}
.top img{height:34px;max-width:120px;object-fit:contain} .top .t{flex:1;min-width:0} .top b{display:block;font-family:var(--serif);font-size:20px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .top small{color:#C9CFD2;font-size:12px;display:block}
.top button{background:none;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;height:36px;padding:0 12px;font-size:13px;font-weight:600}
.top .who{background:rgba(216,183,95,.18);border-color:rgba(216,183,95,.5)}
main{padding:12px;max-width:1280px;margin:0 auto}
.btn{height:48px;padding:0 18px;border-radius:12px;border:1.5px solid #CFC6AE;background:#fff;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;color:var(--navy)} .btn.pri{background:var(--navy);border-color:var(--navy);color:#fff} .btn.gold{background:var(--gold);border-color:var(--gold);color:var(--navy)} .btn.sm{height:38px;padding:0 12px;font-size:13.5px;border-radius:9px} .btn:disabled{opacity:.45} .btn.w{width:100%} .btn.danger{color:var(--neg)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
h1{font-family:var(--serif);font-size:30px;line-height:1.05;margin:0 0 6px;color:var(--navy)} h2{font-family:var(--serif);font-size:22px;margin:0 0 8px;color:var(--navy)} .muted{color:var(--muted)} .hint{font-size:13px;color:var(--muted)}
/* lock */
.lock{max-width:380px;margin:30px auto;text-align:center} .pin{font-size:34px;letter-spacing:12px;height:54px;color:var(--navy);font-weight:800} .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px} .pad button{height:64px;border-radius:14px;border:1.5px solid #CFC6AE;background:#fff;font-size:24px;font-weight:700;color:var(--navy)} .pad button:active{background:var(--ivory)} .pad button.go{background:var(--navy);color:#fff;border-color:var(--navy)}
.lock.err .pin{color:var(--neg);animation:sh .3s} @keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* floor */
.seg{display:flex;gap:6px;flex-wrap:wrap} .seg button{height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:13.5px;color:var(--muted)} .seg button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.floor{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;margin-top:12px}
.tbl.slip{border-style:dashed;border-color:var(--gold);background:#FFFBEF} .tbl{min-height:82px;border:1.5px solid #CFC6AE;border-radius:14px;background:#fff;padding:10px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:4px} .tbl b{font-size:18px;color:var(--navy)} .tbl small{font-size:11.5px;color:var(--muted);display:block} .tbl.open{background:#FBF3DC;border-color:var(--gold)} .tbl.mine{background:#E3F0E8;border-color:var(--pos)} .tbl.new{border-style:dashed;justify-content:center;align-items:center;color:var(--muted);font-weight:700}
/* check */
.chk{display:grid;grid-template-columns:minmax(300px,2fr) minmax(0,3fr);gap:12px;align-items:start} .chk>.card:first-child{position:sticky;top:8px;display:flex;flex-direction:column;max-height:calc(100vh - 150px)} .chk>.card:first-child .lines{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain} .chk>.card:first-child .bar{position:static;background:none;backdrop-filter:none;padding-bottom:0} .menu{display:flex;flex-direction:column;max-height:calc(100vh - 150px);min-height:320px} .menu .pg{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;min-height:0;align-content:start;padding:2px 2px 8px} .find{display:flex;gap:8px;margin-bottom:8px} .find .inp{flex:1;height:44px} .find .btn.sm{height:44px;padding:0 14px}
@media (max-width:860px){ .chk{grid-template-columns:minmax(0,1fr)} .chk>.card:first-child{position:static;max-height:none} .chk>.card:first-child .lines{max-height:38vh} .menu{max-height:none} .menu .pg{max-height:60vh} }
.lines .ln{display:grid;grid-template-columns:34px minmax(0,1fr) 80px;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:15px} .lines .ln:first-child{border-top:none} .lines .ln .q{font-weight:800;color:var(--navy);text-align:center} .lines .ln.fired{color:var(--muted)} .lines .ln.fired .q::after{content:' ✓';color:var(--pos);font-size:11px} .lines .ln small{display:block;font-size:12px;color:var(--muted)} .lines .ln .p{text-align:right;font-weight:700}
.lines .ln.sel{background:var(--ivory);margin:0 -8px;padding:9px 8px;border-radius:8px}
.tot{display:grid;grid-template-columns:1fr auto;gap:4px 12px;border-top:2px solid var(--line);padding-top:10px;margin-top:8px;font-size:14px} .tot .big{font-size:20px;font-weight:800;color:var(--navy)}
.menu .cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px} .pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px} .pb{min-height:66px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px 10px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:4px} .pb:active{background:var(--ivory)} .pb b{font-size:14px;color:var(--navy);line-height:1.2} .pb span{font-weight:700;font-size:13px} .pb small{color:var(--muted);font-size:11px}
.bar{position:sticky;bottom:0;background:rgba(244,240,230,.95);backdrop-filter:blur(8px);padding:10px 0 calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;flex-wrap:wrap;margin-top:10px} .bar .btn{flex:1 1 120px}
.lineacts{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 2px} .lineacts .btn{height:36px;padding:0 12px;font-size:13px}
.sheet{position:fixed;inset:0;background:rgba(15,42,56,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50} .sheet>div{background:#fff;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));width:100%;max-width:600px;max-height:92vh;overflow:auto}
.inp{width:100%;height:46px;border:1.5px solid #CFC6AE;border-radius:10px;padding:0 12px;background:#fff;font-size:16px} .lbl{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--golddk);margin:10px 0 6px}
.pick{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:6px} .pick button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:none;border-top:1px solid var(--line);background:#fff;padding:10px 12px;font-size:15px} .pick button:first-child{border-top:none} .pick button small{margin-left:auto;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;font-weight:600;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:92vw;text-align:center}
.chip{display:inline-flex;align-items:center;min-height:24px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--ivory);border:1px solid var(--line)}
</style>
</head>
<body>
<header class="top"><img id="hLogo" src="flagstick-crest-light.svg" alt=""><div class="t"><b id="hTitle">Register</b><small id="hSub">Station</small></div><button class="who" id="hWho" hidden></button><button id="hLock" hidden>Lock</button></header>
<main id="main"><div class="card"><p class="muted">Starting the station…</p></div></main>
<script>
/*PDFFONTS*/
/*BILLCORE*/
/*POSCORE*/
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CFG=window.MM_CONFIG||{}; const sb=(CFG.url&&CFG.anonKey&&window.supabase)?window.supabase.createClient(CFG.url,CFG.anonKey,{auth:{persistSession:false}}):null;
const qs=new URLSearchParams(location.search); const ls={get(k){ try{ return localStorage.getItem(k); }catch(_){ return null; } },set(k,v){ try{ localStorage.setItem(k,v); }catch(_){ } },del(k){ try{ localStorage.removeItem(k); }catch(_){ } }};
let KEY=(qs.get('s')||'').trim()||ls.get('fs_station')||'', B=null, USER=null, CHECKS=[], CUR=null, SEL=null, VIEW='lock', MINE=true, MENU='', CAT='', Q='', PIN='', pollT=null, idleT=null, busy=false, CLOCKMODE=false;
if(qs.get('s')){ ls.set('fs_station',KEY); history.replaceState(null,'',location.pathname); }
const fmt=pcFmt; const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));
function toast(m){ const d=document.createElement('div'); d.className='toast'; d.textContent=m; document.body.appendChild(d); setTimeout(()=>d.remove(),2600); }
async function rpc(fn,args){ const {data,error}=await sb.rpc(fn,Object.assign({p_key:KEY},args||{})); if(error){ const msg=error.message||'failed'; if(/not valid|42501/i.test(msg)){ ls.del('fs_station'); KEY=''; B=null; render(); } throw new Error(msg.replace(/^.*?: /,'')); } return data; }
const localDay=()=>{ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }; const rates=()=>B?B.rates:{tax:0,svc:0}; const totals=c=>checkTotals(c.lines,c.tip,rates());
const isFnb=()=>B&&B.outlet&&B.outlet.kind==='fnb'; const tables=()=>(B&&B.outlet&&B.outlet.tables)||[]; const expos=()=>(B&&B.outlet&&B.outlet.expos)||[];
const menusOn=()=>((B&&B.outlet&&B.outlet.menus)||[]).filter(m=>m.active!==false);
const products=()=>{ const on=menusOn().map(m=>m.id); return (B.products||[]).filter(p=>!on.length||!(p.menus||[]).length||p.menus.some(id=>on.includes(id))).filter(p=>!MENU||(p.menus||[]).includes(MENU)||!(p.menus||[]).length); };
const byDate=(a,b)=>String(a.created_at||'').localeCompare(String(b.created_at||''));
const age=t=>{ const m=Math.floor((Date.now()-new Date(t))/60000); return m<1?'just now':m<60?m+' min':Math.floor(m/60)+' h '+(m%60)+' m'; };
function header(){ if(B){ $('hTitle').textContent=B.outlet?B.outlet.name:'Register'; $('hSub').textContent=`${B.station.name} · ${B.club}`; if(B.brand) $('hLogo').src=B.brand; document.title=`${B.outlet?B.outlet.name:'Register'} · ${B.station.name}`; } $('hWho').hidden=!USER; $('hLock').hidden=!USER; if(USER) $('hWho').textContent=USER.name; }
async function boot(){ if(!sb) return msg('Not connected','The station is not available right now.'); if(!KEY) return msg('No station link','Open this page from the station link the club made for this register (Settings → Food & beverage).');
  try{ B=await rpc('pos_boot'); }catch(e){ return msg('This station link is not valid',e.message+' — ask a manager for a new link.'); } header(); render(); }
function msg(t,x){ $('main').innerHTML=`<div class="card" style="max-width:520px;margin:30px auto;text-align:center"><h1>${esc(t)}</h1><p class="muted">${esc(x)}</p></div>`; }
function touch(){ clearTimeout(idleT); if(USER) idleT=setTimeout(()=>{ if(!busy) lock(); },4*60*1000); }
document.addEventListener('pointerdown',touch,{passive:true});
function lock(){ USER=null; CUR=null; VIEW='lock'; PIN=''; clearInterval(pollT); header(); render(); reboot(); }
/* the menu, staff and rates again at every lock, so products added in the hub show without a reload */
async function reboot(){ try{ const b=await rpc('pos_boot'); if(b&&VIEW==='lock'){ B=b; header(); } }catch(_){} }
$('hLock').onclick=lock; $('hWho').onclick=()=>{ if(confirm(`Switch server? ${USER.name} is signed out of this station.`)) lock(); };
/* ---- screens ---- */
function render(){ touch(); if(!B) return; if(VIEW==='lock') return renderLock(); if(VIEW==='check'&&CUR) return renderCheck(); return renderFloor(); }
function renderLock(){ $('main').innerHTML=`<div class="lock" id="lock"><h1>${CLOCKMODE?'Time clock':esc(B.outlet?B.outlet.name:'Register')}</h1><p class="muted">${esc(B.station.name)} · ${CLOCKMODE?'enter your PIN to clock in or out':'enter your PIN'}</p><div class="pin" id="pinV">${'•'.repeat(PIN.length)}</div>
    <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join('')}<button data-k="x">⌫</button><button data-k="0">0</button><button class="go" data-k="go">Go</button></div>
    <p class="hint" style="margin-top:22px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn sm" id="clockBtn">${CLOCKMODE?'Back to the register':'Clock in / out'}</button><button class="btn sm" id="leave">Leave this station</button></p></div>`;
  document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{ const k=b.dataset.k; if(k==='x') PIN=PIN.slice(0,-1); else if(k==='go') return unlock(); else if(PIN.length<6) PIN+=k; $('pinV').textContent='•'.repeat(PIN.length); if(PIN.length>=4&&k!=='x'&&PIN.length===6) unlock(); });
  $('leave').onclick=leaveStation; $('clockBtn').onclick=()=>{ CLOCKMODE=!CLOCKMODE; PIN=''; render(); }; }
/* the time clock from the lock screen: the same PIN, status → in or out, then back to the lock */
async function clockFlow(){ try{ const u=await rpc('staff_clock',{p_pin:PIN,p_action:'status'}); if(!u){ PIN=''; $('lock').classList.add('err'); $('pinV').textContent=''; setTimeout(()=>$('lock').classList.remove('err'),400); return; } const open=u.open; const pin=PIN; PIN='';
    const d=document.createElement('div'); d.className='sheet'; d.innerHTML=`<div><h2>${esc(u.name)}</h2><p class="muted">${open?'On the clock since '+new Date(open.in_at).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}):'Not clocked in'}</p><div class="bar" style="position:static;background:none;padding:0"><button class="btn pri" id="ckGo">${open?'Clock out':'Clock in'}</button><button class="btn" id="ckX">Cancel</button></div></div>`; document.body.appendChild(d);
    d.querySelector('#ckX').onclick=()=>d.remove(); d.querySelector('#ckGo').onclick=async()=>{ try{ await rpc('staff_clock',{p_pin:pin,p_action:open?'out':'in'}); d.remove(); toast(`${u.name} clocked ${open?'out':'in'}`); CLOCKMODE=false; render(); }catch(e){ toast(e.message); } }; }catch(e){ toast(e.message); } }
async function unlock(){ if(PIN.length<4) return; if(CLOCKMODE) return clockFlow(); try{ const u=await rpc('pos_pin',{p_pin:PIN}); if(!u){ PIN=''; $('lock').classList.add('err'); $('pinV').textContent=''; setTimeout(()=>$('lock').classList.remove('err'),400); return; } USER=u; PIN=''; VIEW='floor'; header(); await loadChecks(); render(); clearInterval(pollT); pollT=setInterval(()=>{ if(VIEW==='floor'&&!busy) loadChecks().then(()=>{ if(VIEW==='floor') render(); }); },8000); }catch(e){ toast(e.message); } }
async function leaveStation(){ const pin=prompt('Manager PIN to leave this station'); if(!pin) return; try{ const u=await rpc('pos_pin',{p_pin:pin}); if(!u||u.role!=='manager'){ toast('A manager’s PIN is needed'); return; } ls.del('fs_station'); location.href=(CFG.siteBase||'/'); }catch(e){ toast(e.message); } }
async function loadChecks(){ try{ CHECKS=await rpc('pos_checks'); }catch(e){ toast(e.message); } }
function renderFloor(){ const open=CHECKS.filter(c=>c.status==='open'), slips=CHECKS.filter(c=>c.status==='slip'&&(!MINE||c.server_id===USER.id)), mineF=c=>c.server_id===USER.id; const show=MINE?open.filter(mineF):open; const T=tables(); const byT={}; open.forEach(c=>{ if(c.table_no&&T.includes(c.table_no)) byT[c.table_no]=c; }); const tabs=open.filter(c=>!c.table_no||!T.includes(c.table_no));   // a check on a table that is not on the list is still a tab here
  $('main').innerHTML=`<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><div class="seg"><button class="${MINE?'on':''}" data-m="1">My checks · ${open.filter(mineF).length}</button><button class="${MINE?'':'on'}" data-m="0">All open · ${open.length}</button></div><span style="flex:1"></span>${USER.role==='manager'?'<button class="btn" id="closedBtn">Closed today</button>':''}<button class="btn pri" id="newTab">${isFnb()?'New tab':'New sale'}</button></div>
    ${T.length?`<h2 style="margin-top:16px">Tables</h2><div class="floor">${T.map(t=>{ const c=byT[t]; const cls=c?(mineF(c)?'mine':'open'):''; const hide=MINE&&c&&!mineF(c); return `<button class="tbl ${cls}" data-t="${esc(t)}"${hide?' style="opacity:.45"':''}><b>${esc(t)}</b>${c?`<small>${esc(c.server||'')} · ${fmt(totals(c).total)}<br>${age(c.created_at)}${c.guests?' · '+c.guests+' guests':''}</small>`:'<small>open</small>'}</button>`; }).join('')}</div>`:''}
    ${tabs.length||!T.length?`<h2 style="margin-top:16px">${isFnb()?'Tabs':'Open sales'}</h2><div class="floor">${tabs.filter(c=>!MINE||mineF(c)).map(c=>`<button class="tbl ${mineF(c)?'mine':'open'}" data-c="${c.id}"><b>${esc(c.table_no?'Table '+c.table_no:c.guest||(c.member_id?'Member':'Tab'))}</b><small>${esc(c.server||'')} · ${fmt(totals(c).total)}<br>${checkText(c.lines).slice(0,40)||age(c.created_at)}</small></button>`).join('')||'<span class="muted">Nothing open.</span>'}</div>`:''}`;
  if(slips.length){ const h=document.createElement('div'); h.innerHTML=`<h2 style="margin-top:16px">Slips out · ${slips.length} <small class="muted" style="font-weight:500;font-size:13px">— signed, the tip to be entered</small></h2><div class="floor">${slips.map(c=>`<button class="tbl slip" data-s="${c.id}"><b>${esc(c.table_no?'Table '+c.table_no:c.guest||(c.member_id?'Member':'Tab'))}</b><small>${esc(c.server||'')} · ${fmt(totals(c).total)}<br>${(c.payments||[]).some(p=>p.method==='account')?'on account':'card'} · ${age(c.closed_at||c.created_at)}</small></button>`).join('')}</div>`; $('main').appendChild(h); h.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>settleSheet(slips.find(c=>c.id===b.dataset.s))); }
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{ MINE=b.dataset.m==='1'; render(); });
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{ const c=byT[b.dataset.t]; if(c) openCheck(c); else newCheck({table_no:b.dataset.t}); });
  document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>openCheck(open.find(c=>c.id===b.dataset.c)));
  const cb=$('closedBtn'); if(cb) cb.onclick=()=>closedSheet(new Date().toISOString().slice(0,10));
  $('newTab').onclick=()=>{ const name=isFnb()?prompt('Name for the tab (a first name, a seat at the bar)'):''; if(isFnb()&&!name) return; newCheck({guest:name||''}); }; }
/* a manager's list of the day's closed checks — any day — with Reopen: payments cleared, the account charge voided, back on the floor */
async function closedSheet(day){ let L=[]; try{ L=await rpc('pos_shift',{p_date:day}); }catch(e){ toast(e.message); return; } L=(L||[]).slice().sort((a,b)=>String(b.closed_at||b.void_at||'').localeCompare(String(a.closed_at||a.void_at||'')));

    const close=async method=>{ if(busy) return; busy=true; try{ const r0=rates(), t=checkTotals(c.lines,0,r0), P=portion(); const amount=Math.round(P.amount*100)/100, tip=(method==='account'||method==='card')?null:0;   // the slip carries the tip
        const r=await rpc('pos_pay',{p_ticket:c.id,p_pay:{method,amount,tip,member_id:method==='account'?c.member_id:null,label:P.label,totals:{subtotal:t.subtotal,svc:t.svc,tax:t.tax},lines:c.lines}});
        Object.assign(c,r||{}); who=null; pickIds=new Set();
        if(c.status==='slip'){ d.remove(); const ci=CHECKS.findIndex(x=>x.id===c.id); if(ci>=0) CHECKS[ci]=c; else CHECKS.push(c); toast(method==='account'?'Charged to the account — the slip is out for the tip and signature':'Card taken — the slip is out for the tip'); if(confirm('Print the slip for the tip and signature?')) receipt(c); CUR=null; VIEW='floor'; render(); }
        else if(c.status==='closed'){ d.remove(); toast(method==='account'?'Charged to the account — check closed':`Closed · ${method}`); CHECKS=CHECKS.filter(x=>x.id!==c.id); if(confirm('Print or send the receipt?')) receipt(c); CUR=null; VIEW='floor'; render(); }
        else { toast(`${fmt(amount)} taken · ${fmt(balanceDue(c,r0))} still due`); if(mode==='items') mode='all'; draw(); render(); } }catch(e){ toast(e.message); } finally{ busy=false; } };
    const pa=d.querySelector('#payAcct'); if(pa) pa.onclick=()=>close('account'); d.querySelector('#payCash').onclick=()=>close('cash'); d.querySelector('#payCard').onclick=()=>close('card'); d.querySelector('#payX').onclick=()=>{ d.remove(); render(); save(); };
    const pv=d.querySelector('#payVoid'); if(pv) pv.onclick=async()=>{ const why=prompt('Why is this check voided?'); if(!why) return; try{ await rpc('pos_void',{p_ticket:c.id,p_reason:why}); d.remove(); CHECKS=CHECKS.filter(x=>x.id!==c.id); CUR=null; VIEW='floor'; toast('Voided'); render(); }catch(e){ toast(e.message); } }; };
  document.body.appendChild(d); draw(); }
/* closing out a signed slip: the tip written on it, per payment that waits for one; an account tip goes onto the member's charge */
function settleSheet(c){ const pend=(c.payments||[]).filter(p=>p.method==='account'||p.method==='card'); const d=document.createElement('div'); d.className='sheet'; const base=p=>Math.round(((parseFloat(p.amount)||0)-(parseFloat(p.tip)||0))*100)/100;
  d.innerHTML=`<div><h2>Close out ${esc(c.table_no?'table '+c.table_no:c.guest||'the check')}</h2><p class="muted" style="margin:4px 0 10px">${fmt(totals(c).total)} · ${esc(c.server||'')} · paid ${age(c.closed_at||c.created_at)}. Enter the tip written on the slip${pend.length>1?' for each payment':''}.</p>
    ${pend.map(p=>`<div class="ln" style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px"><span><b>${p.method==='account'?'Member account':'Card'}</b> · ${fmt(base(p))}${p.label?`<br><small class="muted">${esc(p.label)}</small>`:''}</span><span style="display:flex;gap:6px;align-items:center"><span class="lbl" style="margin:0">Tip</span><input class="inp" data-st="${p.id}" inputmode="decimal" placeholder="0.00" value="${p.tip!=null?p.tip:''}" style="width:96px;height:40px"></span></div>`).join('')}
    <div class="acts" style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" id="stOk" style="flex:1">Close out</button><button class="btn" id="stPrint">Print the slip again</button><button class="btn" id="stX">Back</button></div></div>`;
  document.body.appendChild(d); d.querySelector('#stX').onclick=()=>d.remove(); d.querySelector('#stPrint').onclick=()=>receipt(c); const first=d.querySelector('[data-st]'); if(first) first.focus();
  d.querySelector('#stOk').onclick=async()=>{ if(busy) return; busy=true; try{ const tips=[...d.querySelectorAll('[data-st]')].map(i=>({id:i.dataset.st,tip:Math.round((parseFloat(i.value)||0)*100)/100})); const big=tips.find(x=>{ const p=pend.find(q=>q.id===x.id); return x.tip>20&&x.tip>base(p); }); if(big&&!confirm(`A ${fmt(big.tip)} tip on a ${fmt(base(pend.find(q=>q.id===big.id)))} payment — is that what is written on the slip?`)){ busy=false; return; } const r=await rpc('pos_settle',{p_ticket:c.id,p_tips:tips}); Object.assign(c,r||{}); d.remove(); CHECKS=CHECKS.filter(x=>x.id!==c.id); const tt=tips.reduce((t,x)=>t+x.tip,0); toast(tt?`Closed out · ${fmt(tt)} tip`:'Closed out · no tip'); if(CUR&&CUR.id===c.id){ CUR=null; VIEW='floor'; } render(); }catch(e){ toast(e.message); } finally{ busy=false; } }; }
/* the receipt: a narrow branded slip (jsPDF loaded on demand); a check paid on account or by card that is still out for its tip gets the tip, total and signature lines */
function loadJsPDF(){ if(window.jspdf) return Promise.resolve(); return new Promise((res,rej)=>{ const sc=document.createElement('script'); sc.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'; sc.onload=()=>res(); sc.onerror=()=>rej(new Error('Couldn’t load the PDF maker')); document.head.appendChild(sc); }); }
async function receipt(c){ try{ await loadJsPDF(); }catch(e){ toast(e.message); return; } await loadQRLib().catch(()=>{}); const t=totals(c), lines=c.lines||[], W=RECEIPT.W, L=RECEIPT.L, R=RECEIPT.R, logo=await monoLogo(B.brand), slips=c.status==='slip'?(c.payments||[]).filter(p=>(p.method==='account'||p.method==='card')&&p.tip==null):[], H=176+(logo?42:0)+(c.check_no?20:0)+lines.length*13+(t.svc?13:0)+(t.tax?13:0)+(t.tip?13:0)+slips.length*(92+58)+(slips.length?0:58);   // the page is cut to the content: thermal paper
  const doc=new window.jspdf.jsPDF({unit:'pt',format:[W,H]}); bcFonts(doc); const font=(f,s,z,col)=>{ doc.setFont(f,s); doc.setFontSize(z); doc.setTextColor(...col); }; const INK=RECEIPT.INK,MUTED=RECEIPT.INK,NAVY=RECEIPT.INK; let y=18;   // thermal: black only
  if(logo){ const h=34, w=crestW(doc,logo,h); if(drawCrest(doc,logo,(W-w)/2,y,h)) y+=h+8; }
  font('Cormorant','bold',15,NAVY); doc.text(B.club||'',W/2,y,{align:'center'}); y+=13; font('PublicSans','bold',9,INK); doc.text(B.outlet.name,W/2,y,{align:'center'}); y+=11;
  font('PublicSans','normal',8.5,MUTED); doc.text(new Date(c.closed_at||c.created_at).toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'}),W/2,y,{align:'center'}); y+=11; doc.text(`${c.table_no?'Table '+c.table_no+' · ':''}${c.server||''}${c.guests?' · '+c.guests+' guests':''}`,W/2,y,{align:'center'}); y+=12; if(c.check_no){ font('PublicSansXB','normal',14,INK); doc.text(`CHECK ${c.check_no}`,W/2,y+6,{align:'center',charSpace:1}); y+=20; } doc.setDrawColor(0,0,0); doc.setLineWidth(1); doc.line(L,y,R,y); y+=11;
  font('PublicSans','normal',8.5,INK); for(const l of lines){ doc.text(doc.splitTextToSize(`${l.qty>1?l.qty+' × ':''}${l.name}`,R-L-50)[0],L,y); doc.text(fmt(l.qty*l.price),R,y,{align:'right'}); y+=13; }
  doc.setDrawColor(0,0,0); doc.setLineWidth(.75); doc.line(L,y-4,R,y-4); y+=4; const tot=(k,v,b)=>{ font('PublicSans',b?'bold':'normal',b?10.5:8.5,INK); doc.text(k,L,y); doc.text(v,R,y,{align:'right'}); y+=b?15:13; };
  tot('Subtotal',fmt(t.subtotal)); if(t.svc) tot(`Service charge ${rates().svc}%`,fmt(t.svc)); if(t.tax) tot(`Tax ${rates().tax}%`,fmt(t.tax)); if(t.tip) tot('Tip',fmt(t.tip)); tot('Total',fmt(t.total),true);
  for(const p of slips){ const base=Math.round(((parseFloat(p.amount)||0)-(parseFloat(p.tip)||0))*100)/100; y+=4; doc.setDrawColor(0,0,0); doc.setLineWidth(1); doc.line(L,y,R,y); y+=12; font('PublicSans','bold',9,NAVY); doc.text(`${p.method==='account'?'Charged to member account':'Card'}${p.label?' · '+p.label:''}`,L,y); doc.text(fmt(base),R,y,{align:'right'}); y+=17;
    font('PublicSans','normal',9,INK); doc.setDrawColor(0,0,0); doc.setLineWidth(.75); doc.text('Additional tip',L,y); doc.line(R-80,y+1,R,y+1); y+=19; doc.text('Total',L,y); doc.line(R-80,y+1,R,y+1); y+=22; doc.text('Signature',L,y); doc.line(L+50,y+1,R,y+1); y+=18; const qh=drawQR(doc,`fs:${c.id}:${p.id}`,W/2-24,y,48); y+=qh?qh+10:0; }
  if(!slips.length){ const p1=(c.payments||[]).find(p=>p.method==='account'||p.method==='card'); const qh=drawQR(doc,`fs:${c.id}:${p1?p1.id:''}`,W/2-24,y,48); y+=qh?qh+10:0; }
  font('PublicSans','normal',8,MUTED); doc.text(slips.length?'Please add a tip, total and sign.':c.paid==='account'?'Charged to member account':c.paid==='cash'?'Paid in cash':c.paid==='card'?'Paid by card':'Open check',W/2,y,{align:'center'}); y+=14; font('PublicSans','normal',8.5,MUTED); doc.text(`Thank you — ${B.club||''}`,W/2,y,{align:'center'});
  const blob=doc.output('blob'), name=`receipt-${String(c.id).slice(0,8)}.pdf`, file=new File([blob],name,{type:'application/pdf'});
  if(navigator.canShare&&navigator.canShare({files:[file]})&&navigator.share&&/iPhone|iPad|Android/i.test(navigator.userAgent)){ try{ await navigator.share({files:[file],title:'Receipt'}); return; }catch(e){ if(e&&e.name==='AbortError') return; } }
  const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); }
boot();
