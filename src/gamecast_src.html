<style>
:root{--navy:#0F2A38;--deep:#0A1C27;--gold:#8C6A1F;--goldl:#D8B75F;--ivory:#FBFAF5;--paper:#F4F0E6;--line:#E3DCC9;--muted:#56626A;--ink:#14222B;--pos:#1F6B4A;--neg:#A1402B;
  --rough:#D9E4CC;--fair:#9CC48F;--green:#6FAE6B;--sand:#EBDDB0;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box} html,body{margin:0;min-height:100%} [hidden]{display:none!important}
html,body,button{touch-action:manipulation}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;font-variant-numeric:lining-nums}
button,select{font:inherit;color:inherit} button{cursor:pointer} :focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:lining-nums tabular-nums}
.top{background:var(--navy);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 14px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
.top img{width:42px;height:42px;object-fit:contain} .top .t{display:flex;flex-direction:column;min-width:0;flex:1}
.top b{font-family:var(--serif);font-size:22px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .top b em{font-style:normal;color:var(--goldl);font-weight:600;font-size:15px;font-family:var(--sans);letter-spacing:.12em;text-transform:uppercase;margin-right:10px}
.top small{color:var(--goldl);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(111,191,142,.18);color:#bfe8cf;white-space:nowrap} .pill.off{background:rgba(224,123,98,.2);color:#f3c1b4}
main{max-width:1180px;margin:0 auto;padding:16px 14px calc(40px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){ main{grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr);padding:22px 24px 60px;gap:18px} .col{display:flex;flex-direction:column;gap:18px} }
.col{display:flex;flex-direction:column;gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ch{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:12px 16px 8px} .ch h2{font-family:var(--serif);font-size:22px;margin:0;color:var(--navy);font-weight:700} .ch small{color:var(--muted);font-size:12.5px}
.muted{color:var(--muted)} .pos{color:var(--pos)} .neg{color:var(--neg)}
/* the course: 18 holes drawn, the groups on the hole they are playing */
.course{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px;padding:6px 10px 12px}
/* the real course: an aerial map with the hole centerlines; under it a slim bar of hole numbers to tap */
.map{height:clamp(280px,52vh,560px);width:100%;background:#243528;position:relative;z-index:0}
.map .leaflet-container{font-family:var(--sans)} .map .leaflet-control-attribution{font-size:9.5px;background:rgba(255,255,255,.7)}
.mapbar{display:flex;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);flex-wrap:wrap} .mapbar .btn{height:32px;font-size:12.5px;padding:0 10px}
.course.bar{display:grid;grid-template-columns:repeat(18,minmax(0,1fr));gap:4px;padding:8px 10px 10px;overflow:visible}
.course.bar .hole{height:44px;background:var(--ivory);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;flex:1 1 0;border:2px solid transparent}
.course.bar .hole svg,.course.bar .hole .p{display:none} .course.bar .hole .n{position:static;font-size:15px;text-shadow:none} .course.bar .hole .gs{position:static;gap:2px;padding:0}
.course.bar .gm{min-width:14px;height:14px;font-size:0;border-width:1.5px;padding:0} .course.bar .hole.on{border-color:var(--gold);background:#FBF4E0}
@media (max-width:640px){ .course.bar{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));overflow:visible} .course.bar .hole{flex:none} }
.hl{background:rgba(15,42,56,.9);color:#fff;border:1.5px solid var(--goldl);border-radius:999px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;font-family:var(--sans);box-shadow:0 1px 4px rgba(0,0,0,.4)} .hl.on{background:var(--goldl);color:var(--navy);border-color:#fff}
.gmk{background:var(--navy);color:#fff;border:2px solid #fff;border-radius:999px;min-width:28px;height:28px;padding:0 6px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11.5px;font-family:var(--sans);box-shadow:0 2px 6px rgba(0,0,0,.45);white-space:nowrap} .gmk.me{background:var(--neg)} .gmk.fin{background:var(--pos)}
@media (max-width:640px){ .course{display:flex;overflow-x:auto;scrollbar-width:none;padding:6px 10px 12px;-webkit-overflow-scrolling:touch} .course::-webkit-scrollbar{display:none} .hole{flex:0 0 96px} }
.hole{border:2px solid transparent;border-radius:10px;background:var(--rough);padding:0;position:relative;overflow:hidden;text-align:left}
.hole svg{display:block;width:100%;height:auto} .hole.on{border-color:var(--gold)} .hole.me{box-shadow:inset 0 0 0 2px var(--navy)}
.hole .n{position:absolute;left:7px;top:4px;font-family:var(--serif);font-weight:700;font-size:22px;color:var(--navy);line-height:1;text-shadow:0 0 6px var(--rough)}
.hole .p{position:absolute;left:7px;bottom:5px;font-size:10px;font-weight:800;color:var(--navy);opacity:.8;letter-spacing:.02em;background:rgba(255,255,255,.55);border-radius:4px;padding:1px 4px}
.hole .p em{font-style:normal;font-weight:600} @media (min-width:641px) and (max-width:1399px){ .hole .p em{display:none} }   /* the yardage only where the cards are wide enough; it is always in the hole panel */
.hole .gs{bottom:auto;top:46%}
.hole .gs{position:absolute;left:0;right:0;display:flex;justify-content:center;gap:3px;flex-wrap:wrap;padding:0 4px}
.gm{min-width:22px;height:22px;border-radius:999px;background:var(--navy);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.25)} .gm.fo{background:var(--gold)} .gm.me{background:var(--neg)}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:0 16px 12px;font-size:12.5px;color:var(--muted)} .legend .gm{display:inline-flex;vertical-align:middle;margin-right:4px}
/* the hole panel */
.hp{padding:4px 16px 14px} .hp .hh{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap} .hp .hh b{font-family:var(--serif);font-size:30px;color:var(--navy);line-height:1} .hp .hh span{color:var(--muted);font-size:13.5px}
.tally{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 6px} .chip{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--ivory);color:var(--navy)} .chip.eagle{background:#E3F0E8;border-color:#BCD9C7;color:var(--pos)} .chip.birdie{background:#E3F0E8;border-color:#BCD9C7;color:var(--pos)} .chip.bogey{background:#F8E6DF;border-color:#EBC2B3;color:var(--neg)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14.5px} .row:first-child{border-top:none} .row .sc{font-weight:800;min-width:26px;text-align:center;border-radius:6px;padding:2px 0} .row .sc.u{background:#E3F0E8;color:var(--pos)} .row .sc.o{background:#F8E6DF;color:var(--neg)} .row .sc.uu{background:var(--pos);color:#fff} .row small{color:var(--muted)}
/* the feed */
.feed{padding:0 16px 10px;max-height:60vh;overflow:auto} .fi{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:start} .fi:first-child{border-top:none}
.fi time{font-size:11.5px;color:var(--muted);padding-top:3px;white-space:nowrap} .fi b{color:var(--navy)} .fi .k{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-right:6px} .fi.big b{font-size:16px} .fi .ic{font-size:16px;margin-right:4px}
/* the board */
.chips{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:0 16px 8px} .chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:12.5px;color:var(--muted);white-space:nowrap} .chips button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.lb{display:grid;grid-template-columns:36px minmax(0,1fr) 40px 54px;gap:8px;align-items:center;padding:9px 16px;border-top:1px solid var(--line);font-size:14px} .lb.h{font-size:11.5px;font-weight:700;color:var(--muted);background:var(--ivory);border-top:none} .lb .tp{font-weight:800;text-align:right;font-size:15px} .lb .r{text-align:right} .lb.me{background:#FBF4E0}
.bar{display:flex;gap:10px;align-items:center;padding:10px 16px;border-top:1px solid var(--line);flex-wrap:wrap} .sel{height:38px;border:1px solid #CFC6AE;border-radius:10px;padding:0 10px;background:#fff;font-size:14px;font-weight:600;max-width:100%} .btn{height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--navy);font-weight:700;font-size:13.5px}
.empty{padding:22px 16px;color:var(--muted);text-align:center;font-size:14px}
/* TV: the bar screen — everything larger, two columns always */
body.tv main{max-width:1600px;grid-template-columns:minmax(0,1.6fr) minmax(420px,1fr);font-size:18px}
body.tv .hole .n{font-size:26px} body.tv .gm{min-width:28px;height:28px;font-size:12px} body.tv .fi{font-size:18px} body.tv .fi time{font-size:14px} body.tv .lb{font-size:19px;padding:12px 18px} body.tv .lb .tp{font-size:22px} body.tv .ch h2{font-size:28px} body.tv .hp .hh b{font-size:40px} body.tv .row{font-size:18px} body.tv .bar{display:none} body.tv .feed{max-height:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<header class="top"><img src="flagstick-crest-light.svg" alt="Flagstick"><div class="t"><b id="evName"><em>GameCast</em></b><small id="evSub">Follow along live</small></div><span class="pill" id="sync" hidden></span></header>
<main id="main"><div class="card"><div class="empty">Loading…</div></div></main>
<script>
/*GOLFCORE*/

/* ============ GameCast: follow a game live, without a group ID ============
   Read-only. Reads the same published event and scores the scoring page reads (golf_event, golf_scores + realtime)
   and never writes. Shows the course with every group on the hole it is playing, a hole's story, a feed of what
   just happened, and the live board. Quiet competitions (skins kept for the call-out) stay quiet here too: only
   competitions marked live are ever shown or mentioned. */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CFG=window.MM_CONFIG||{}; const sb=(CFG.url&&CFG.anonKey&&window.supabase)?window.supabase.createClient(CFG.url,CFG.anonKey,{auth:{persistSession:false}}):null;
const qs=new URLSearchParams(location.search), SLUG=(qs.get('e')||'').trim(), TV=qs.get('view')==='tv';
if(TV) document.body.classList.add('tv');
let pub=null, scores={}, stamps=[], TENANT=null, pubSig='', holeSel=null, follow=qs.get('follow')||'', comp=null, tvTimer=null;
const liveComps=()=>(pub.comps||[]).filter(c=>c.live!==false&&c.kind!=='dots');
const first=n=>String(n||'').split(' ')[0];
const money=v=>'$'+(Math.abs(v-Math.round(v))<0.005?String(Math.round(v)):(+v).toFixed(2));
const when=t=>t?new Date(t).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):'';
function fail(msg){ $('main').innerHTML=`<div class="card"><div class="empty">${msg}</div></div>`; }
async function resolveTenant(){ try{ const {data,error}=await sb.rpc('tenant_lookup',{p_host:qs.get('tenant')||location.hostname}); if(!error&&data&&data.slug) TENANT=data.slug; }catch(_){} }
const evArgs=o=>TENANT?Object.assign({p_tenant:TENANT},o):o;
async function loadEvent(){ const {data,error}=await sb.rpc('golf_event',evArgs({p_slug:SLUG})); if(error) return 'error'; if(!data) return 'none';
  const sig=JSON.stringify(data), changed=sig!==pubSig; pubSig=sig; pub=data;
  if(changed){ const name=String(pub.name||'').replace(/\s·\s[A-Z][a-z]{2} \d{1,2}(, \d{4})?$/,''); $('evName').innerHTML=`<em>GameCast</em>${esc(name)}`;
    $('evSub').textContent=[pub.club,pub.date&&new Date(pub.date+'T12:00').toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'})].filter(Boolean).join(' · '); document.title=name+' · GameCast'; }
  return changed; }
async function loadScores(){ const {data,error}=await sb.from('golf_scores').select('player_id,hole,strokes,updated_at').eq('event_id',pub.id); if(error) return;
  const m={}; stamps=[]; for(const r of data||[]){ (m[r.player_id]=m[r.player_id]||{})[r.hole]=r.strokes; stamps.push({p:r.player_id,h:r.hole,s:r.strokes,at:r.updated_at||''}); } scores=m; stamps.sort((a,b)=>String(a.at).localeCompare(String(b.at))); }
function setSync(){ const s=$('sync'); s.hidden=false; s.className='pill'+(pub.status==='live'?'':' off'); s.textContent=pub.status==='live'?'● Live':pub.status==='final'?'Final':'Not open'; }

/* ---- where everyone is ---- */
const allPlayers=()=>{ const out=[]; for(const g of pub.groups||[]) for(const p of g.players||[]) out.push(Object.assign({},p,{grp:g})); return out; };
const nameOf=id=>{ const p=allPlayers().find(x=>x.id===id); return p?p.name:'?'; };
function groupPos(g){ const order=playOrder(g.startHole), done=h=>(g.players||[]).length>0&&g.players.every(p=>(scores[p.id]||{})[h]); let n=0; for(const h of order){ if(done(h)) n++; else break; }
  const started=g.players.some(p=>Object.keys(scores[p.id]||{}).length); return {thru:n,cur:n>=18?null:order[n],started,order}; }
const parOf=(p,h)=>{ const c=pub.courses[p.grp.course]; return c?(c.par[p.set||'M']||c.par.M)[h-1]:4; };
const relName=r=>r<=-3?'Albatross':r===-2?'Eagle':r===-1?'Birdie':r===0?'Par':r===1?'Bogey':r===2?'Double':'+'+r;
/* ---- the feed: replayed from the scores in the order they came in ---- */
function buildFeed(){
  const P=new Map(allPlayers().map(p=>[p.id,p])), items=[], cp=comp?compPub(pub,comp):pub, sofar={}; let leader=null;   // comp false/null → the round itself
  const boardLeader=()=>{ try{ const rows=eventBoard(cp,sofar,{sort:cp.scoring||'gross',view:'teams'}).filter(r=>r.n); return rows.length&&rows[0].posTxt&&!rows[0].posTxt.startsWith('T')?rows[0]:null; }catch(_){ return null; } };
  for(const s of stamps){ const p=P.get(s.p); if(!p||!s.s) continue; (sofar[s.p]=sofar[s.p]||{})[s.h]=s.s; const par=parOf(p,s.h), r=s.s-par;
    if(s.s===1) items.push({at:s.at,k:'ace',big:true,who:[s.p],html:`<span class="ic">⛳</span><b>${esc(p.name)}</b> — a hole-in-one on ${s.h}!`});
    else if(r<=-1) items.push({at:s.at,k:relName(r).toLowerCase(),big:r<=-2,who:[s.p],html:`<span class="ic">${r<=-2?'🦅':'🐦'}</span><b>${esc(p.name)}</b> ${relName(r).toLowerCase()} on ${s.h}${r<=-2?'!':''}`});
    else if(r>=3) items.push({at:s.at,k:'blowup',who:[s.p],html:`<b>${esc(p.name)}</b> a ${s.s} on the par ${par} ${s.h}`});
    const L=boardLeader(); if(L&&L.n>=3&&L.id!==leader){ const v=unitOf(cp)==='strokes'?toParTxt((cp.scoring||'gross')==='net'&&L.netToPar!=null?L.netToPar:L.toPar):unitOf(cp)==='points'?(L.quota!=null?ptsTxt(L):L.pts+' pts'):L.status; if(leader!==null) items.push({at:s.at,k:'lead',big:true,who:L.members||[L.id],html:`<span class="ic">👑</span><b>${esc(L.name)}</b> ${leader?'takes the lead':'leads'} · ${esc(v)} thru ${L.thru}`}); leader=L.id; } }
  // live skins only: a skin that stands on a hole everyone in the pot has played
  for(const c of liveComps().filter(c=>c.kind==='skins')){ const r=skinsResult(compPub(pub,c),scores,c.skins||{},c.players);
    for(const w of r.wins){ if(w.status!=='won'&&w.status!=='void') continue; const at=stamps.filter(x=>x.h===w.hole&&(c.players||[]).includes(x.p)).map(x=>x.at).sort().pop()||'';
      items.push({at,k:'skin',who:[w.pid],html:w.status==='won'?`<span class="ic">💰</span><b>${esc(w.name)}</b> takes the skin on ${w.hole} with a ${w.score}${c.skins&&c.skins.net&&w.net!==w.score?' (net '+w.net+')':''}`:`<b>${esc(w.name)}</b>’s skin on ${w.hole} didn’t hold`}); } }
  items.sort((a,b)=>String(b.at).localeCompare(String(a.at))); return items; }

/* ---- drawing a hole: tee at the bottom, green at the top, a fairway that bends by hole number ---- */
function holeSVG(h,par,groupsHere){
  const W=100,H=150, bend=(h%2?1:-1)*(par>=5?22:par===4?14:0), tee={x:50,y:132}, grn={x:50-bend*.4,y:28};
  const fw=par>=4?`<path d="M${tee.x} ${tee.y-10} C ${tee.x+bend} ${tee.y-40}, ${grn.x-bend} ${grn.y+50}, ${grn.x} ${grn.y+12}" stroke="var(--fair)" stroke-width="${par>=5?24:22}" stroke-linecap="round" fill="none"/>`:`<path d="M${tee.x} ${tee.y-10} L ${grn.x} ${grn.y+14}" stroke="#C7D7BA" stroke-width="2" stroke-dasharray="3 4" fill="none"/>`;
  const bunk=par>=4?`<ellipse cx="${grn.x+(h%3?16:-16)}" cy="${grn.y+16}" rx="6" ry="4" fill="var(--sand)"/>`:`<ellipse cx="${grn.x-12}" cy="${grn.y+14}" rx="6" ry="3.5" fill="var(--sand)"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true">${fw}${bunk}<ellipse cx="${grn.x}" cy="${grn.y}" rx="15" ry="11" fill="var(--green)"/><line x1="${grn.x+3}" y1="${grn.y}" x2="${grn.x+3}" y2="${grn.y-16}" stroke="#fff" stroke-width="1.6"/><path d="M${grn.x+3} ${grn.y-16} l 9 3.5 l -9 3.5 z" fill="#C7A13A"/><rect x="${tee.x-9}" y="${tee.y-6}" width="18" height="9" rx="2.5" fill="#A7C7A0"/></svg>`; }

/* ---- the map: the real course (COURSE_GEO: tee → green centerlines, from OpenStreetMap) on aerial imagery ---- */
let L_=null, MAP=null, mapHost=null, mapLayers=null, mapLines={}, mapFit=false, mapLoading=null, mapFailed=false;
function loadLeaflet(){ if(window.L) return Promise.resolve(window.L); if(mapLoading) return mapLoading;
  mapLoading=new Promise((ok,bad)=>{ const css=document.createElement('link'); css.rel='stylesheet'; css.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'; document.head.appendChild(css);
    const s=document.createElement('script'); s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'; s.onload=()=>ok(window.L); s.onerror=()=>bad(new Error('leaflet')); document.head.appendChild(s); setTimeout(()=>bad(new Error('timeout')),12000); });
  return mapLoading; }
const geoCourses=()=>[...new Set((pub.groups||[]).map(g=>g.course))].filter(c=>typeof COURSE_GEO!=='undefined'&&COURSE_GEO[c]);
const hasGeo=()=>geoCourses().length>0;
function holeLine(course,h){ const c=COURSE_GEO[course]||COURSE_GEO[geoCourses()[0]]; return c?c[String(h)]:null; }
const along=(line,t)=>{ if(!line||line.length<2) return line&&line[0]; const segs=[]; let tot=0; for(let i=0;i<line.length-1;i++){ const d=Math.hypot(line[i+1][0]-line[i][0],(line[i+1][1]-line[i][1])*Math.cos(line[i][0]*Math.PI/180)); segs.push(d); tot+=d; } let want=tot*t; for(let i=0;i<segs.length;i++){ if(want<=segs[i]){ const f=segs[i]?want/segs[i]:0; return [line[i][0]+(line[i+1][0]-line[i][0])*f,line[i][1]+(line[i+1][1]-line[i][1])*f]; } want-=segs[i]; } return line[line.length-1]; };
/* mount the map into the current card (the same Leaflet map survives every render), then redraw the moving parts */
function drawMap(pos,fg,moveTo){
  const slot=$('mapSlot'); if(!slot) return;
  if(!window.L){ loadLeaflet().then(()=>render(),()=>{ mapFailed=true; render(); }); return; }
  const L=window.L;
  if(!mapHost){ mapHost=document.createElement('div'); mapHost.className='map'; }
  slot.replaceWith(mapHost); mapHost.id='mapSlot';
  if(!MAP){ MAP=L.map(mapHost,{zoomControl:true,attributionControl:true,scrollWheelZoom:false,zoomSnap:.5}); 
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Imagery © Esri · Holes © OpenStreetMap contributors'}).addTo(MAP);
    mapLayers=L.layerGroup().addTo(MAP); }
  MAP.invalidateSize();
  mapLayers.clearLayers(); mapLines={}; const all=[];
  for(const course of geoCourses()){ const G=COURSE_GEO[course]; for(let h=1;h<=18;h++){ const line=G[String(h)]; if(!line) continue; all.push(...line); const on=h===holeSel;
      L.polyline(line,{color:'#fff',weight:on?8:5,opacity:on?.9:.55,lineCap:'round',interactive:false}).addTo(mapLayers);
      const pl=L.polyline(line,{color:on?'#F2D27A':'#D8B75F',weight:on?4:2.5,opacity:.95,lineCap:'round'}).addTo(mapLayers); pl.on('click',()=>{ holeSel=h; render(true); });
      L.circleMarker(line[line.length-1],{radius:on?6:4.5,color:'#fff',weight:1.5,fillColor:'#6FAE6B',fillOpacity:1}).addTo(mapLayers);
      L.marker(along(line,.08),{icon:L.divIcon({className:'',html:`<div class="hl${on?' on':''}">${h}</div>`,iconSize:[24,24],iconAnchor:[12,12]}),keyboard:false}).on('click',()=>{ holeSel=h; render(true); }).addTo(mapLayers);
      mapLines[course+':'+h]=line; } }
  // the groups: on the tee of the hole they are playing (spread along the first stretch when several share it); finished groups on 18's green
  const byHole={}; pos.forEach(x=>{ const key=x.cur?x.g.course+':'+x.cur:x.started?x.g.course+':fin':x.g.course+':'+x.order[0]; (byHole[key]=byHole[key]||[]).push(x); });
  for(const [key,xs] of Object.entries(byHole)){ const [course,hs]=key.split(':'); const line=hs==='fin'?holeLine(course,18):holeLine(course,+hs); if(!line) continue;
    xs.forEach((x,i)=>{ const pt=hs==='fin'?line[line.length-1]:along(line,.3+i*.1), me=fg&&x.g.id===fg.grp.id, lbl=x.g.label?x.g.label.replace(/^Group\s*/i,''):x.g.code;
      L.marker(pt,{icon:L.divIcon({className:'',html:`<div class="gmk${me?' me':hs==='fin'?' fin':''}" title="${esc(x.g.players.map(p=>first(p.name)).join(', '))}">${esc(lbl)}</div>`,iconSize:[28,28],iconAnchor:[14,14]}),zIndexOffset:1000}).on('click',()=>{ if(x.cur){ holeSel=x.cur; render(true); } }).addTo(mapLayers); }); }
  if(!all.length) return;
  if(moveTo&&holeSel){ const line=holeLine(geoCourses()[0],holeSel); if(line) MAP.flyToBounds(L.latLngBounds(line).pad(.35),{duration:.8,maxZoom:18}); }
  else if(!mapFit){ MAP.fitBounds(L.latLngBounds(all).pad(.04)); mapFit=true; }
}
/* ---- render ---- */
function render(moveTo){ if(!pub) return; setSync();
  const groups=pub.groups||[], P=allPlayers(), cs=liveComps(); if(comp==null||(comp&&!cs.some(c=>c.id===comp.id))) comp=cs[0]||false;   // false = the round itself (everyone's own gross / net)
  const c0=pub.courses[(groups[0]||{}).course]||Object.values(pub.courses||{})[0]||{par:{M:[]},hcp:{M:[]},tees:{}};
  const pos=groups.map(g=>Object.assign({g},groupPos(g))), fg=follow?P.find(p=>p.id===follow):null;
  if(holeSel==null) holeSel=fg&&pos.find(x=>x.g.id===fg.grp.id)?.cur||pos.find(x=>x.cur)?.cur||1;
  const holes=Array.from({length:18},(_,i)=>i+1).map(h=>{ const here=pos.filter(x=>x.cur===h), par=(c0.par.M||[])[h-1]||4, yds=((c0.tees||{})[(groups[0]&&groups[0].players[0]||{}).tee||'White']||[])[h-1];
    return `<button class="hole${h===holeSel?' on':''}${fg&&here.some(x=>x.g.id===fg.grp.id)?' me':''}" data-h="${h}" aria-label="Hole ${h}"><span class="n">${h}</span><span class="p">Par ${par}${yds?`<em> · ${yds}</em>`:''}</span>${holeSVG(h,par,here)}<span class="gs">${here.map(x=>`<span class="gm${fg&&x.g.id===fg.grp.id?' me':''}" title="${esc(x.g.label||'')}: ${esc(x.g.players.map(p=>first(p.name)).join(', '))}">${esc(x.g.label?x.g.label.replace(/^Group\s*/i,''):x.g.code)}</span>`).join('')}</span></button>`; }).join('');
  const fin=pos.filter(x=>x.started&&!x.cur), idle=pos.filter(x=>!x.started);
  // the hole's story
  const h=holeSel, par=(c0.par.M||[])[h-1]||4, hcp=(c0.hcp.M||[])[h-1], yd=t=>((c0.tees||{})[t]||[])[h-1];
  const played=P.map(p=>({p,s:(scores[p.id]||{})[h]})).filter(x=>x.s).map(x=>Object.assign(x,{r:x.s-parOf(x.p,h)})).sort((a,b)=>a.r-b.r||a.p.name.localeCompare(b.p.name));
  const tally=[['eagle',played.filter(x=>x.r<=-2).length,'eagle'],['birdie',played.filter(x=>x.r===-1).length,'birdie'],['par',played.filter(x=>x.r===0).length,''],['bogey',played.filter(x=>x.r===1).length,'bogey'],['double+',played.filter(x=>x.r>=2).length,'bogey']].filter(x=>x[1]);
  const onIt=pos.filter(x=>x.cur===h), tees=Object.entries(c0.tees||{}).filter(([,a])=>a&&a[h-1]).map(([t,a])=>`${t} ${a[h-1]}`).slice(0,4).join(' · ');
  const skinsLine=cs.filter(c=>c.kind==='skins').map(c=>{ const r=skinsResult(compPub(pub,c),scores,c.skins||{},c.players), w=r.wins.find(x=>x.hole===h); if(!w) return ''; return `<div class="row"><span>💰 <b>${esc(c.name)}</b>: ${esc(w.name)} ${w.status==='won'?'holds the skin':w.status==='void'?'— skin didn’t hold':w.status==='lead'?'leads it · '+w.open+' still to play':'— pending hole '+w.checkHole}</span><span></span><span></span></div>`; }).join('');
  const holePanel=`<div class="hp"><div class="hh"><b>Hole ${h}</b><span>Par ${par}${hcp?' · Hcp '+hcp:''}${tees?' · '+esc(tees)+' yds':''}</span></div>
    ${onIt.length?`<div class="muted" style="font-size:13px;margin-top:4px">On it now: ${esc(onIt.map(x=>(x.g.label||x.g.code)+' — '+x.g.players.map(p=>first(p.name)).join(', ')).join(' · '))}</div>`:''}
    ${tally.length?`<div class="tally">${tally.map(([l,n,cls])=>`<span class="chip ${cls}">${n} ${l}${n===1||l==='double+'?'':'s'}</span>`).join('')}</div>`:'<div class="muted" style="margin:10px 0 6px;font-size:13.5px">Nobody has played it yet.</div>'}
    ${skinsLine}${played.map(x=>`<div class="row${fg&&x.p.id===fg.id?' me':''}"><span><b>${esc(x.p.name)}</b> <small>· ${esc(x.p.grp.label||x.p.grp.code)}</small></span><small>${relName(x.r)}</small><span class="sc ${x.r<=-2?'uu':x.r<0?'u':x.r>0?'o':''}">${x.s}</span></div>`).join('')}</div>`;
  // the feed and the board
  const feed=buildFeed().filter(it=>!fg||it.k==='lead'||(it.who||[]).includes(fg.id));
  const cp=comp?compPub(pub,comp):pub, unit=unitOf(cp), MATCH=unit==='match', net=(cp.scoring||'gross')==='net', lb=eventBoard(cp,scores,{sort:net?'net':'gross',view:'teams'}).slice(0,TV?14:10);
  const val=r=>MATCH?(r.segs?(r.segs.find(s=>s.k==='18')||{}).txt||r.status:r.status):unit==='points'?(r.quota!=null?ptsTxt(r):r.pts+' pts'):unit==='holes'?(r.holesUp>0?'+':'')+r.holesUp:(r.n&&r.toPar!=null?toParTxt(net&&r.netToPar!=null?r.netToPar:r.toPar):'—');
  $('main').innerHTML=`<div class="col">
    <div class="card"><div class="ch"><h2>The course</h2><small>${esc(c0.name||'')} · ${groups.length} group${groups.length===1?'':'s'}${fin.length?` · ${fin.length} finished`:''}${idle.length?` · ${idle.length} not started`:''}</small></div>
      ${hasGeo()&&!mapFailed?`<div id="mapSlot" class="map"></div><div class="mapbar"><button class="btn" id="mapAll">Whole course</button><span class="muted" style="font-size:12.5px">Tap a hole number on the map or below · groups sit on the tee of the hole they are playing</span></div><div class="course bar">${holes}</div>`:`<div class="course">${holes}</div>`}
      <div class="legend"><span><span class="gm">A</span>a group on the hole it’s playing</span>${fg?`<span><span class="gm me">●</span>${esc(fg.name)}’s group</span>`:''}${fin.length?`<span>Finished: ${esc(fin.map(x=>x.g.label||x.g.code).join(', '))}</span>`:''}</div></div>
    <div class="card" id="holeCard">${holePanel}</div></div>
   <div class="col">
    <div class="card"><div class="ch"><h2>Live</h2><small>${feed.length?feed.length+' moments':'as it happens'}</small></div>
      <div class="feed">${feed.length?feed.slice(0,TV?18:40).map(it=>`<div class="fi${it.big?' big':''}"><time>${when(it.at)}</time><div>${it.html}</div></div>`).join(''):'<div class="empty">Nothing yet — the first birdie, skin or lead change shows here.</div>'}</div></div>
    <div class="card"><div class="ch"><h2>${esc(comp?comp.name:cs.length?'Individual':'Leaderboard')}</h2><small>${esc(MATCH?formatSummary(cp):(net?'net':'gross')+' · '+formatSummary(cp).toLowerCase())}</small></div>
      ${cs.length?`<div class="chips">${cs.map(c=>`<button data-comp="${esc(c.id)}" class="${comp&&comp.id===c.id?'on':''}">${esc(c.name)}</button>`).join('')}<button data-comp="" class="${comp===false?'on':''}">Individual</button></div>`:''}
      <div class="lb h"><span>Pos</span><span>${MATCH?'Side':'Player'}</span><span class="r">Thru</span><span class="r">${MATCH?'Match':unit==='points'?'Pts':unit==='holes'?'Holes':net?'Net':'To par'}</span></div>
      ${lb.map(r=>`<div class="lb num${fg&&(r.id===fg.id||(r.members||[]).includes(fg.id))?' me':''}"><b>${r.posTxt}</b><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.name)}</span><span class="r muted">${r.n?r.thru:'—'}</span><span class="tp ${r.n&&String(val(r)).startsWith('−')?'pos':''}">${esc(val(r))}</span></div>`).join('')||'<div class="empty">No scores yet.</div>'}
      <div class="bar"><label class="muted" style="font-size:13px">Follow</label><select class="sel" id="follow"><option value="">Everyone</option>${P.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(p=>`<option value="${esc(p.id)}"${p.id===follow?' selected':''}>${esc(p.name)}</option>`).join('')}</select>${TV?'':`<a class="btn" href="${esc(location.pathname+'?e='+encodeURIComponent(SLUG)+'&view=tv')}" style="margin-left:auto;display:inline-flex;align-items:center;text-decoration:none">TV screen</a>`}</div></div></div>`;
  document.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{ holeSel=+b.dataset.h; render(true); if(innerWidth<900&&!hasGeo()) $('holeCard').scrollIntoView({behavior:'smooth',block:'start'}); });
  if(hasGeo()&&!mapFailed){ drawMap(pos,fg,moveTo===true); const ma=$('mapAll'); if(ma) ma.onclick=()=>{ mapFit=false; if(MAP){ const all=Object.values(mapLines).flat(); if(all.length) MAP.flyToBounds(window.L.latLngBounds(all).pad(.04),{duration:.8}); mapFit=true; } }; }
  document.querySelectorAll('[data-comp]').forEach(b=>b.onclick=()=>{ comp=cs.find(c=>c.id===b.dataset.comp)||false; render(); });
  const fs=$('follow'); if(fs) fs.onchange=()=>{ follow=fs.value; holeSel=null; render(); };
}
async function refresh(){ if(document.visibilityState!=='visible') return; const r=await loadEvent(); if(r==='error'||r==='none') return; await loadScores(); render(); }
async function boot(){
  if(!SLUG) return fail('This link is missing its event. Ask whoever set up the game for the GameCast link.');
  if(!sb) return fail('GameCast isn’t connected yet.');
  await resolveTenant(); const r=await loadEvent();
  if(r==='error') return fail('Couldn’t reach live scoring. Check your signal and reload.');
  if(r==='none') return fail('No event found for this link.');
  await loadScores(); render();
  sb.channel('gc-'+pub.id).on('postgres_changes',{event:'*',schema:'public',table:'golf_scores',filter:'event_id=eq.'+pub.id},p=>{ const r=p.eventType==='DELETE'?p.old:p.new; if(!r) return;
    scores[r.player_id]=scores[r.player_id]||{}; if(p.eventType==='DELETE'){ delete scores[r.player_id][r.hole]; stamps=stamps.filter(x=>!(x.p===r.player_id&&x.h===r.hole)); } else { scores[r.player_id][r.hole]=r.strokes; stamps=stamps.filter(x=>!(x.p===r.player_id&&x.h===r.hole)); stamps.push({p:r.player_id,h:r.hole,s:r.strokes,at:r.updated_at||new Date().toISOString()}); stamps.sort((a,b)=>String(a.at).localeCompare(String(b.at))); }
    if(!TV&&holeSel!=null&&!follow){ /* keep the hole the viewer picked */ } render(); }).subscribe();
  setInterval(refresh,30000); document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') refresh(); });
  if(TV){ tvTimer=setInterval(()=>{ const pos=(pub.groups||[]).map(groupPos).map(x=>x.cur).filter(Boolean); if(!pos.length) return; const i=pos.indexOf(holeSel); holeSel=pos[(i+1)%pos.length]; render(true); },8000); }
}
boot();
window.__canReload=()=>true;
/*AUTOUPDATE*/

</script>
