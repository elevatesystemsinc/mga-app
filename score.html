<script>
/* =====================================================================
   Golf core — shared by the hub and the public scoring page.
   Walnut Creek CC course data transcribed from the Oak and Pecan scorecards
   (every nine and total checked against the printed card).
   ===================================================================== */
const WCCC_COURSES=[

   par:{M:[5,4,4,3,4,4,4,3,4, 4,4,4,3,4,4,3,4,5], W:[5,4,4,3,4,4,4,3,4, 4,5,4,3,4,4,3,4,5]},
   hcp:{M:[17,15,1,9,5,13,7,11,3, 12,2,14,10,4,8,16,6,18], W:[9,7,1,17,5,13,11,15,3, 6,14,10,16,2,8,12,4,18]},
   tees:[{name:'Gold',rating:{M:{cr:73.1,slope:133},W:{cr:80.4,slope:146}},yards:[457,391,434,153,373,339,381,200,404, 432,446,366,213,445,450,191,412,531]},
         {name:'Blue',rating:{M:{cr:71.3,slope:132},W:{cr:78.2,slope:142}},yards:[448,367,415,141,352,318,375,169,388, 414,437,346,197,418,402,186,398,496]},
         {name:'Blue/White',rating:{M:{cr:70.3,slope:131},W:{cr:77.0,slope:141}},yards:[448,367,380,141,352,318,356,169,355, 394,428,346,182,365,391,186,374,496]},
         {name:'White',rating:{M:{cr:69.5,slope:127},W:{cr:75.6,slope:139}},yards:[433,344,380,122,310,292,356,146,355, 394,428,330,182,365,391,176,374,478]},

];
const RATINGS_VERSION=2; // ratings from the club's printed rating card
const G_SUM=a=>a.reduce((x,y)=>x+(+y||0),0);
/* holes in playing order for a group (shotgun starts wrap around) */
function playOrder(start){ const s=Math.min(18,Math.max(1,+start||1)); return Array.from({length:18},(_,i)=>((s-1+i)%18)+1); }
function toParTxt(v){ return v===0?'E':(v>0?'+'+v:'−'+Math.abs(v)); }
/* stroke-play leaderboard. pub = public event, scores = {playerId:{hole:strokes}} */
function leaderboard(pub,scores,opt){ opt=opt||{};
  const rows=[];
  for(const g of pub.groups||[]){ const c=pub.courses[g.course]; if(!c) continue;
    for(const p of g.players||[]){ const par=c.par[p.set||'M']||c.par.M, sc=scores[p.id]||{};
      const hc=c.hcp[p.set||'M']||c.hcp.M, ph=typeof p.ph==='number'?p.ph:null;
      let n=0,gross=0,parPlayed=0,out=0,inn=0,got=0;
      for(let h=1;h<=18;h++){ const s=+sc[h]; if(!s) continue; n++; gross+=s; parPlayed+=par[h-1]; if(h<=9) out+=s; else inn+=s; if(ph!=null) got+=strokesOn(ph,hc[h-1]); }
      rows.push({id:p.id,name:p.name,group:g.label||'',groupId:g.id,course:g.course,courseName:c.name,tee:p.tee,n,gross,toPar:gross-parPlayed,out,inn,thru:n===18?'F':String(n),par,ph,flight:p.flight||'',net:ph==null?null:gross-got,netToPar:ph==null?null:gross-got-parPlayed});
    } }
  const byNet=opt.sort==='net';
  const key=r=>byNet?(r.netToPar==null?9999:r.netToPar):r.toPar;
  const pool=opt.flight?rows.filter(r=>r.flight===opt.flight):rows;
  const played=pool.filter(r=>r.n>0).sort((a,b)=>key(a)-key(b)||b.n-a.n||a.gross-b.gross||a.name.localeCompare(b.name));
  const idle=pool.filter(r=>!r.n).sort((a,b)=>a.name.localeCompare(b.name));
  let pos=0,prev=null; played.forEach((r,i)=>{ const k=key(r); if(prev===null||k!==prev){ pos=i+1; prev=k; } r.pos=pos; });
  played.forEach(r=>{ r.posTxt=(played.filter(x=>x.pos===r.pos).length>1?'T':'')+r.pos; });
  idle.forEach(r=>{ r.posTxt='—'; });
  return played.concat(idle);
}

/* ---------- handicaps (World Handicap System) ----------
   Course Handicap = Index × Slope ÷ 113 + (Course Rating − Par), rounded (.5 up).
   Playing Handicap = Course Handicap × allowance %, rounded. */
function parseIndex(v){ if(v==null) return null; const s=String(v).trim(); if(!s) return null; const plus=/^\+/.test(s); const n=parseFloat(s.replace('+','')); if(!isFinite(n)) return null; return plus?-Math.abs(n):n; }
const idxTxt=n=>n==null?'—':(n<0?'+'+Math.abs(n).toFixed(1):n.toFixed(1));
const whsRound=x=>Math.sign(x)*Math.floor(Math.abs(x)+0.5);
function teeRating(course,teeName,set){ const t=(course.tees||[]).find(x=>x.name===teeName); const r=t&&t.rating&&t.rating[set||'M']; return r&&+r.cr&&+r.slope?{cr:+r.cr,slope:+r.slope}:null; }
function courseHcp(index,course,teeName,set){ if(index==null) return null; const r=teeRating(course,teeName,set); if(!r) return null;
  const par=G_SUM(course.par[set||'M']||course.par.M); return whsRound(index*r.slope/113+(r.cr-par)); }
/* strokes a player gets on one hole from a playing handicap (plus handicaps give strokes back, from hcp 18 up) */
function strokesOn(ph,holeHcp){ if(!ph) return 0; if(ph>0) return Math.floor(ph/18)+(holeHcp<=ph%18?1:0); const g=-ph; return -(Math.floor(g/18)+(holeHcp>18-(g%18)?1:0)); }

/* ---------- best ball ----------
   Each player plays their own ball; the team's score on a hole is the best (lowest) score among
   its players who've posted that hole — gross, or net after each player's strokes. */
function teamKey(p){ return p.team||('solo:'+p.id); }
function bestBallBoard(pub,scores,opt){
  opt=opt||{}; const teams=new Map();
  for(const g of pub.groups||[]){ const c=pub.courses[g.course]; if(!c) continue;
    for(const p of g.players||[]){ const k=teamKey(p); if(!teams.has(k)) teams.set(k,{id:k,members:[],group:g.label||'',groupId:g.id,course:g.course,courseName:c.name}); teams.get(k).members.push({p,c}); } }
  const rows=[];
  for(const t of teams.values()){
    let n=0,gross=0,toPar=0,net=0,netToPar=0,netOK=t.members.every(m=>typeof m.p.ph==='number');
    for(let h=1;h<=18;h++){ let bg=null,bgp=null,bn=null,bnp=null;
      for(const {p,c} of t.members){ const s=+((scores[p.id]||{})[h]); if(!s) continue; const par=(c.par[p.set||'M']||c.par.M)[h-1];
        if(bg===null||s-par<bgp){ bg=s; bgp=s-par; }
        if(netOK){ const k=strokesOn(p.ph,(c.hcp[p.set||'M']||c.hcp.M)[h-1]); if(bn===null||s-k-par<bnp){ bn=s-k; bnp=s-k-par; } } }
      if(bg===null) continue; n++; gross+=bg; toPar+=bgp; if(netOK){ net+=bn; netToPar+=bnp; } }
    const flights=[...new Set(t.members.map(m=>m.p.flight).filter(Boolean))];
    rows.push({id:t.id,name:t.members.map(m=>m.p.name).join(' / '),members:t.members.map(m=>m.p.id),group:t.group,groupId:t.groupId,course:t.course,courseName:t.courseName,
      n,gross,toPar,thru:n===18?'F':String(n),net:netOK?net:null,netToPar:netOK?netToPar:null,flight:flights.length===1?flights[0]:flights.join('/'),team:true});
  }
  const byNet=opt.sort==='net', key=r=>byNet?(r.netToPar==null?9999:r.netToPar):r.toPar;
  const pool=opt.flight?rows.filter(r=>r.flight===opt.flight):rows;
  const played=pool.filter(r=>r.n>0).sort((a,b)=>key(a)-key(b)||b.n-a.n||a.gross-b.gross||a.name.localeCompare(b.name));
  const idle=pool.filter(r=>!r.n).sort((a,b)=>a.name.localeCompare(b.name));
  let pos=0,prev=null; played.forEach((r,i)=>{ const k=key(r); if(prev===null||k!==prev){ pos=i+1; prev=k; } r.pos=pos; });
  played.forEach(r=>{ r.posTxt=(played.filter(x=>x.pos===r.pos).length>1?'T':'')+r.pos; }); idle.forEach(r=>{ r.posTxt='—'; });
  return played.concat(idle);
}
/* the board for an event: teams for best ball (unless players are asked for), players for stroke play */
function eventBoard(pub,scores,opt){ opt=opt||{}; return pub.format==='bestball'&&opt.view!=='players'?bestBallBoard(pub,scores,opt):leaderboard(pub,scores,opt); }
const FORMAT_LABEL={stroke:'Stroke play',bestball:'Best ball'};

/* ---------- WCCC-style scorecard ----------
   Styled after the club's printed card: course header, tee rows in their colors, par and
   handicap rows, then players. Gross in every cell; where a player gets a stroke the net
   score sits small in the corner. Totals end with HCP and NET like the printed card.
   Best ball adds a team row per team (the counting score each hole, on the event's basis),
   and the ball that counted is underlined in gold. */
const WC_CSS=`

function ensureCardCSS(){ if(typeof document==='undefined'||document.getElementById('wc-css')) return; const s=document.createElement('style'); s.id='wc-css'; s.textContent=WC_CSS; document.head.appendChild(s); }
function scorecardHTML(pub,g,scores,opt){

  const accent=g.course==='pecan'?'#A2343A':'#1F3552';

  const sc=p=>scores[p.id]||{}, k=(p,h)=>typeof p.ph==='number'?strokesOn(p.ph,hc(p)[h-1]):0;

  const counted=new Set(), teamCell={};
  teams.forEach(t=>{ teamCell[t.tk]={}; for(let h=1;h<=18;h++){ let best=null;
      for(const p of t.ms){ const s=+sc(p)[h]; if(!s) continue; const v=basisNet?s-k(p,h):s, rel=v-par(p)[h-1];
        if(!best||rel<best.rel) best={p,rel,gross:s,net:s-k(p,h)}; }
      if(best){ teamCell[t.tk][h]=best; counted.add(best.p.id+'|'+h); } } });

  const range=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
  const sumH=(fn,a,b)=>{ let t=0,n=0; for(let h=a;h<=b;h++){ const v=fn(h); if(v!=null){ t+=v; n++; } } return n?t:''; };
  const tables=halves.map(([a,b])=>{
    const nines=a===1&&b===18?[[1,9,'Out'],[10,18,'In']]:[[a,b,a===1?'Out':'In']];
    const endCols=(a===1&&b===18)||b===18;
    const head=`<tr class="wc-h"><th>Hole</th>${nines.map(([x,y,l])=>range(x,y).map(h=>`<th>${h}</th>`).join('')+`<th class="wc-tot">${l}</th>`).join('')}${endCols?'<th class="wc-tot">Tot</th><th class="wc-tot">Hcp</th><th class="wc-tot">Net</th>':''}</tr>`;
    const lineRow=(cls,label,valFn,totFn)=>`<tr class="${cls}"><th>${label}</th>${nines.map(([x,y])=>range(x,y).map(h=>`<td>${valFn(h)??''}</td>`).join('')+`<td class="wc-tot">${totFn?totFn(x,y):''}</td>`).join('')}${endCols?`<td class="wc-tot">${totFn?totFn(1,18):''}</td><td class="wc-tot"></td><td class="wc-tot"></td>`:''}</tr>`;
    const tees=teesUsed.map(t=>{ const y=c.tees[t]; return lineRow('t-'+t.toLowerCase().replace('/','-'),E(t),h=>y?y[h-1]:'·',(x,z)=>y?sumH(h=>y[h-1],x,z):''); }).join('');

        return `<td class="${BB&&counted.has(p.id+'|'+h)?'wc-c':''}">${kk>0&&!s?'':''}<span class="wc-s ${shape(s,par(p)[h-1])}">${s}</span>${kk?`<span class="wc-n" title="Net ${s-kk}">${s-kk}</span>`:''}</td>`; }).join('')+`<td class="wc-tot">${gT(x,y)}</td>`).join('');

      return `<tr class="wc-p${opt.highlight&&(opt.highlight===p.id||opt.highlight===p.team)?' wc-me':''}"><th title="${E(p.name)}">${E(short(p.name))}<small>${E(p.tee)}${p.flight?' · Flight '+E(p.flight):''}${typeof p.ph==='number'?' · plays '+(p.ph<0?'+'+(-p.ph):p.ph):''}</small></th>${cells}${endCols?`<td class="wc-tot">${gT(1,18)}</td><td class="wc-tot">${typeof p.ph==='number'?(p.ph<0?'+'+(-p.ph):p.ph):''}</td><td class="wc-tot wc-net">${full&&typeof p.ph==='number'?nT(1,18):''}</td>`:''}</tr>`; }).join('');
    const tRows=teams.map(t=>{ const T=teamCell[t.tk];
      const main=h=>T[h]?(basisNet?T[h].net:T[h].gross):null, other=h=>T[h]?(basisNet?T[h].gross:T[h].net):null;
      const cells=nines.map(([x,y])=>range(x,y).map(h=>{ const v=main(h); if(v==null) return '<td></td>'; const o=other(h);

      const gross=sumH(h=>T[h]?T[h].gross:null,1,18), net=sumH(h=>T[h]?T[h].net:null,1,18);
      return `<tr class="wc-t"><th>${opt.split?'Team':'Best ball'}${basisNet?' net':''}<small>${E(t.ms.map(p=>p.name.split(' ').slice(-1)[0]).join(' & '))}</small></th>${cells}${endCols?`<td class="wc-tot">${basisNet?net:gross}</td><td class="wc-tot"></td><td class="wc-tot wc-net">${net}</td>`:''}</tr>`; }).join('');
    return `<div class="wc-wrap"><table>${head}${tees}${hcpM}${parRow}${pRows}${tRows}${hcpW}</table></div>`;
  }).join(opt.split?'<div style="height:8px"></div>':'');
  const status=pub.status==='final'?'<span class="wc-final">FINAL</span>':'';
  const key=`<div class="wc-key"><span><span class="wc-s b">3</span>Birdie</span><span><span class="wc-s e">2</span>Eagle</span><span><span class="wc-s o">5</span>Bogey</span><span><span class="wc-s d">6</span>Double+</span><span><em>3</em>Net where a stroke is given</span>${BB?`<span><i></i>Ball that counted${basisNet?' (net)':''}</span>`:''}</div>`;
  return `<div class="wc" style="--wc-accent:${accent}"><div class="wc-top"><div><div class="nm">${E(c.name)}</div><small>Walnut Creek Country Club · Mansfield, Texas</small></div><div class="ev"><b>${E(pub.name)}</b>${E([pub.date?new Date(pub.date+'T12:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'',g.label].filter(Boolean).join(' · '))}<br>${status}</div></div>${tables}${key}<div class="wc-sign"><span>Scorer ________________</span><span>Attest ________________</span></div></div>`;
}

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CFG=window.MM_CONFIG||{}; const sb=(CFG.url&&CFG.anonKey&&window.supabase)?window.supabase.createClient(CFG.url,CFG.anonKey,{auth:{persistSession:false}}):null;
const qs=new URLSearchParams(location.search), SLUG=(qs.get('e')||'').trim(), BIG=qs.get('view')==='board';
if(BIG) document.body.classList.add('big');
let pub=null, scores={}, groupId=null, code='', tab=BIG?'board':'score', holeIdx=0, lbFlight=qs.get('flight')||'', lbSort=null, lbView=qs.get('players')?'players':'teams';
const KEY='mga_score_'+SLUG, QKEY='mga_scoreq_'+SLUG;
let queue=[]; try{ queue=JSON.parse(localStorage.getItem(QKEY)||'[]'); }catch(_){}
const saveQ=()=>{ try{ localStorage.setItem(QKEY,JSON.stringify(queue)); }catch(_){} };
const group=()=>pub&&pub.groups.find(g=>g.id===groupId);
function setSync(){ const s=$('sync'); if(!groupId&&!BIG){ s.hidden=true; return; } s.hidden=false;

function fail(msg){ $('main').innerHTML=`<div class="card pad"><h1>Live scoring</h1><p class="muted" style="margin-top:10px">${msg}</p></div>`; }

async function loadScores(){
  const {data,error}=await sb.from('golf_scores').select('player_id,hole,strokes').eq('event_id',pub.id);
  if(error) return; const m={}; for(const r of data||[]) (m[r.player_id]=m[r.player_id]||{})[r.hole]=r.strokes;
  for(const q of queue){ (m[q.p]=m[q.p]||{}); if(q.s) m[q.p][q.h]=q.s; else delete m[q.p][q.h]; } // local edits win until they're saved
  scores=m;
}
async function boot(){

  if(!sb) return fail('Live scoring isn’t connected yet.');
  const {data,error}=await sb.rpc('golf_event',{p_slug:SLUG});
  if(error) return fail('Couldn’t reach live scoring. Check your signal and reload.');
  if(!data) return fail('No event found for this link. Check the link with the committee.');
  pub=data; $('evName').textContent=pub.name; $('evSub').textContent=[pub.date&&new Date(pub.date+'T12:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}),FORMAT_LABEL[pub.format]||'Stroke play',pub.club].filter(Boolean).join(' · ');
  document.title=pub.name+' · Live Scoring';
  await loadScores();
  sb.channel('s-'+pub.id).on('postgres_changes',{event:'*',schema:'public',table:'golf_scores',filter:'event_id=eq.'+pub.id},p=>{
    const r=p.eventType==='DELETE'?p.old:p.new; if(!r) return; if(queue.some(q=>q.p===r.player_id&&q.h===r.hole)) return;
    scores[r.player_id]=scores[r.player_id]||{}; if(p.eventType==='DELETE') delete scores[r.player_id][r.hole]; else scores[r.player_id][r.hole]=r.strokes;

  const saved=(()=>{ try{ return JSON.parse(localStorage.getItem(KEY)||'null'); }catch(_){ return null; } })();
  const qg=(qs.get('g')||'').trim();
  if(qg&&!BIG){ const ok=await join(qg,true); if(ok) history.replaceState(null,'',location.pathname+'?e='+encodeURIComponent(SLUG)); }
  else if(saved&&saved.code&&!BIG) await join(saved.code,true);

}
async function join(c,silent){
  c=String(c||'').trim().toUpperCase(); if(!c) return;
  const {data,error}=await sb.rpc('golf_join',{p_slug:SLUG,p_code:c});

/* scores save instantly on screen and queue for the server; the queue survives a dead zone or a closed tab */
function setStroke(pid,hole,val){
  scores[pid]=scores[pid]||{}; if(val) scores[pid][hole]=val; else delete scores[pid][hole];
  queue=queue.filter(q=>!(q.p===pid&&q.h===hole)); queue.push({p:pid,h:hole,s:val||null}); saveQ(); setSync(); flush();

let flushing=false;
async function flush(){
  if(flushing||!queue.length||!code) return; flushing=true;
  while(queue.length){ const q=queue[0];
    const {error}=await sb.rpc('golf_submit',{p_event:pub.id,p_code:code,p_player:q.p,p_hole:q.h,p_strokes:q.s});
    if(error){ if(/closed/i.test(error.message)){ queue=[]; saveQ(); pub.status='final'; render(); alert('Scoring for this event has been closed by the committee.'); }

      break; }

addEventListener('online',flush); setInterval(flush,15000);

function renderHole(){

  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>bump(b.dataset.m,-1));
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>bump(b.dataset.p,1));
  $('parAll').onclick=()=>{ g.players.forEach(p=>{ if(!(scores[p.id]||{})[h]) setStroke(p.id,h,par(p)); }); renderHole(); };
  $('prev').onclick=()=>{ holeIdx=Math.max(0,holeIdx-1); renderHole(); };
  $('next').onclick=()=>{ holeIdx=Math.min(17,holeIdx+1); renderHole(); };
  $('nextBtn').onclick=()=>{ if(live) g.players.forEach(p=>{ if(!(scores[p.id]||{})[h]) setStroke(p.id,h,par(p)); });
    if(holeIdx===17){ tab='card'; render(); } else { holeIdx++; renderHole(); } window.scrollTo(0,0); };
  document.querySelectorAll('.strip [data-go]').forEach(b=>b.onclick=()=>{ holeIdx=+b.dataset.go; renderHole(); });
  $('leave').onclick=()=>{ if(queue.length&&!confirm('Some scores haven’t reached the server yet. Switch anyway? They’ll keep trying in the background.')) return; groupId=null; code=''; localStorage.removeItem(KEY); render(); };
}
function renderCard(){
  const g=group(), order=playOrder(g.startHole);
  $('main').innerHTML=scorecardHTML(pub,g,scores,{split:true})+
   `<p class="muted" style="text-align:center;font-size:13px;margin:14px 0 6px">${queue.length?queue.length+' score'+(queue.length===1?'':'s')+' still saving…':'All scores saved.'}</p>
   ${pub.status==='live'?`<p style="text-align:center;font-size:13px;margin:0 0 6px" class="muted">Change a hole:</p><div class="strip">${order.map((h,i)=>`<button data-go="${i}">${h}</button>`).join('')}</div>`:''}`;
  document.querySelectorAll('.strip [data-go]').forEach(b=>b.onclick=()=>{ holeIdx=+b.dataset.go; tab='score'; render(); window.scrollTo(0,0); });
}
function showCardFor(gid,pid){
  const g=pub.groups.find(x=>x.id===gid); if(!g) return;
  $('main').innerHTML=`<p style="margin:0 0 12px"><button class="btn" id="cardBack" style="height:40px">‹ Leaderboard</button></p>`+scorecardHTML(pub,g,scores,{split:true,highlight:pid});
  $('cardBack').onclick=()=>renderBoard(); window.scrollTo(0,0);
}
function renderBoard(fromJoin){
  if(lbSort==null) lbSort=pub.scoring||'gross';
  const flights=pub.flights||[], hasNet=(pub.groups||[]).some(g=>g.players.some(p=>typeof p.ph==='number')), net=lbSort==='net'&&hasNet;
  const mine=new Set((group()||{players:[]}).players.map(p=>p.id));
  if(!BIG&&!lbFlight&&group()&&flights.length){ const me=group().players.find(p=>p.flight); if(me&&renderBoard.first!==false){ lbFlight=me.flight; renderBoard.first=false; } }
  const BB=pub.format==='bestball';
  const lb=eventBoard(pub,scores,{flight:lbFlight,sort:net?'net':'gross',view:BB?lbView:'players'});
  $('main').innerHTML=`${BIG?`<h1 style="font-size:44px;margin:6px 4px 16px">${esc(pub.name)}${lbFlight?' · Flight '+esc(lbFlight):''}</h1>`:''}
   ${!BIG&&(flights.length||hasNet||BB)?`<div class="chips">${BB?[['teams','Teams'],['players','Players']].map(([k,l])=>`<button data-vw="${k}" class="${lbView===k?'on':''}">${l}</button>`).join(''):''}${hasNet?['gross','net'].map(x=>`<button data-sort="${x}" class="${(net?'net':'gross')===x?'on':''}">${x==='net'?'Net':'Gross'}</button>`).join(''):''}${flights.length?['',...flights].map(f=>`<button data-fl="${f}" class="${lbFlight===f?'on':''}">${f?'Flight '+f:'All'}</button>`).join(''):''}</div>`:''}
   <div class="card" style="overflow:hidden">
   <div class="lb h"><span>Pos</span><span>${BB&&lbView==='teams'?'Team':'Player'}</span><span class="r">Thru</span><span class="r">${net?'Net':'To par'}</span></div>
   ${lb.map(r=>`<div class="lb num${mine.has(r.id)||(r.members||[]).some(id=>mine.has(id))?' me':''}" data-card="${esc(r.groupId)}|${esc(r.team?(r.members||[])[0]:r.id)}" style="cursor:pointer"><b>${r.posTxt}</b><div style="min-width:0"><div style="font-weight:700;${r.team?'line-height:1.25':'overflow:hidden;text-overflow:ellipsis;white-space:nowrap'}" title="${esc(r.name)}">${r.team?r.name.split(' / ').map(esc).join('<br>'):esc(r.name)}</div>${BIG?'':`<div class="muted" style="font-size:12px">${esc(r.courseName.replace(' Course',''))}${r.flight&&!lbFlight?' · Flt '+esc(r.flight):''}${r.n?' · '+r.gross+(net&&r.net!=null?' / net '+r.net:''):''}</div>`}</div><span class="r muted">${r.n?r.thru:'—'}</span>${(()=>{ const v=net?r.netToPar:r.toPar; return `<span class="tp ${r.n&&v<0?'pos':r.n?'':'muted'}">${r.n&&v!=null?toParTxt(v):'—'}</span>`; })()}</div>`).join('')||'<div class="lb"><span></span><span class="muted">No players yet.</span></div>'}
  </div><p class="muted" style="text-align:center;font-size:12.5px">${pub.status==='final'?'Final · ':''}${net?'Net':'Gross'} ${BB&&lbView==='teams'?'best ball':'stroke play'}${BIG?'':' · tap a row for the scorecard'}${lbFlight?' · Flight '+esc(lbFlight):''} · updates live</p>${fromJoin?'<p style="text-align:center"><button class="btn" id="backJoin">Back</button></p>':''}`;
  const bj=$('backJoin'); if(bj) bj.onclick=()=>renderJoin();
  document.querySelectorAll('[data-fl]').forEach(b=>b.onclick=()=>{ lbFlight=b.dataset.fl; renderBoard.first=false; renderBoard(fromJoin); });
  document.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{ lbSort=b.dataset.sort; renderBoard(fromJoin); });
  document.querySelectorAll('[data-vw]').forEach(b=>b.onclick=()=>{ lbView=b.dataset.vw; renderBoard(fromJoin); });
  if(!BIG) document.querySelectorAll('[data-card]').forEach(r=>r.onclick=()=>{ const [gid,pid]=r.dataset.card.split('|'); showCardFor(gid,pid); });
}
boot();
</script>
</body>
</html>
