<style>
:root{--navy:#0F2A38;--deep:#0A1C27;--gold:#8C6A1F;--goldl:#D8B75F;--ivory:#FBFAF5;--paper:#F4F0E6;--line:#E3DCC9;--muted:#56626A;--ink:#14222B;--pos:#1F6B4A;--neg:#A1402B;

*{box-sizing:border-box} html,body{margin:0;min-height:100%} [hidden]{display:none!important}

/* holes in playing order for a group (shotgun starts wrap around) */
function playOrder(start){ const s=Math.min(18,Math.max(1,+start||1)); return Array.from({length:18},(_,i)=>((s-1+i)%18)+1); }
function toParTxt(v){ return v===0?'E':(v>0?'+'+v:'−'+Math.abs(v)); }
/* stroke-play leaderboard. pub = public event, scores = {playerId:{hole:strokes}} */
/* individual leaderboard: strokes (stroke play), points (Stableford / modified / quota) or holes up (par-bogey) */
function leaderboard(pub,scores,opt){ opt=opt||{};
  const rows=[], fmt=playerFormatOf(pub), unit=unitOf(pub);
  for(const g of pub.groups||[]){ const c=pub.courses[g.course]; if(!c) continue;
    for(const p of g.players||[]){ const par=c.par[p.set||'M']||c.par.M, sc=scores[p.id]||{};

      if(fmt==='quota'){ quota=(+pub.quotaBase||36)-(ph||0); need=n?Math.round(quota*n/18*100)/100:0;   // where the player should be after n holes: the quota pro-rated; whole at 18

    } }

/* a points row's value: quota = how far above or below the quota you should have by now (signed, a half shows as .5),

function ptsTxt(r){ if(!r.n) return '—'; if(r.quota==null) return String(r.pts); const v=r.pts; const a=Math.abs(v), s=Number.isInteger(a)?String(a):a.toFixed(1).replace(/\.0$/,''); return v>0?'+'+s:v<0?'−'+s:'E'; }

/* one hole for one player in an individual format → {pts, up} (points formats; par-bogey holes) */
function holeValue(pub,fmt,gross,net,par){
  if(fmt==='teamstable') fmt='stableford';   // a player's own points inside a team Stableford
  const useNet=pub.scoring!=='gross'||fmt==='stableford'||fmt==='modstable'||fmt==='parbogey'; const d=(fmt==='quota'?gross:(useNet?net:gross))-par;
  if(fmt==='stableford'||fmt==='modstable'||fmt==='quota') return {pts:holePoints(fmt,d,pub.points),up:0};
  if(fmt==='parbogey') return {pts:0,up:d<0?1:d>0?-1:0};

function rankRows(rows,unit,opt){
  const byNet=opt.sort==='net';

  const pool=opt.flight?rows.filter(r=>r.flight===opt.flight):rows;
  const played=pool.filter(r=>r.n>0).sort((a,b)=>key(a)-key(b)||b.n-a.n||a.gross-b.gross||a.name.localeCompare(b.name));
  const idle=pool.filter(r=>!r.n).sort((a,b)=>a.name.localeCompare(b.name));
  let pos=0,prev=null; played.forEach((r,i)=>{ const k=key(r); if(prev===null||k!==prev){ pos=i+1; prev=k; } r.pos=pos; });
  played.forEach(r=>{ r.posTxt=(played.filter(x=>x.pos===r.pos).length>1?'T':'')+r.pos; }); idle.forEach(r=>{ r.posTxt='—'; });
  return played.concat(idle);
}

/* ---------- handicaps (World Handicap System) ----------
   Course Handicap = Index × Slope ÷ 113 + (Course Rating − Par), rounded (.5 up).
   Playing Handicap = Course Handicap × allowance %, rounded. */
function parseIndex(v){ if(v==null) return null; const s=String(v).trim(); if(!s) return null; const plus=/^\+/.test(s); const n=parseFloat(s.replace('+','')); if(!isFinite(n)) return null; return plus?-Math.abs(n):n; }
const idxTxt=n=>n==null?'—':(n<0?'+'+Math.abs(n).toFixed(1):n.toFixed(1));
const whsRound=x=>Math.sign(x)*Math.floor(Math.abs(x)+0.5);
function teeRating(course,teeName,set){ const t=(course.tees||[]).find(x=>x.name===teeName); const r=t&&t.rating&&t.rating[set||'M']; return r&&+r.cr&&+r.slope?{cr:+r.cr,slope:+r.slope}:null; }
function courseHcp(index,course,teeName,set){ if(index==null) return null; const r=teeRating(course,teeName,set); if(!r) return null;
  const par=G_SUM(course.par[set||'M']||course.par.M); return whsRound(index*r.slope/113+(r.cr-par)); }
/* strokes a player gets on one hole from a playing handicap (plus handicaps give strokes back, from hcp 18 up) */
function strokesOn(ph,holeHcp,n){ n=n||18; if(!ph||holeHcp>n) return 0; if(ph>0) return Math.floor(ph/n)+(holeHcp<=ph%n?1:0); const g=-ph; return -(Math.floor(g/n)+(holeHcp>n-(g%n)?1:0)); }
/* No pops on par 3s (pub.noPar3): the stroke index stays as printed on the card, but a par 3 never gives or takes a
   stroke — a stroke that falls on a par 3 is simply lost (the owner: that is the proper way). strokesAt is what every
   net figure goes through. */
function strokesAt(pub,c,set,h,ph){ if(ph==null||!ph||!c) return 0; set=set||'M';
  if(pub&&pub.noPar3&&(c.par[set]||c.par.M)[h-1]===3) return 0;
  return strokesOn(ph,(c.hcp[set]||c.hcp.M)[h-1]); }


/* ---------- skins ----------
   skinsResult(pub, scores, rules, playerIds) → {wins:[{hole,pid,name,score,net,count,status:'won'|'void'|'pending',checkHole}],
   per:{pid:count}, total, carried, lost, incomplete}
   rules: net (play net skins), grossBeatsNet (a net tie goes to the one player who made that score without a stroke),
   carry (ties carry to the next hole), validate: 'none' | 'gross' (par or better on the next hole) | 'net' (net par or
   better). A hole counts once everyone in the game has scored it. A void skin goes back into the carry (or is lost
   when ties don't carry); a skin on a player's last hole needs no validation; one that can't be checked yet is pending. */
/* what a skin winner must make on the next hole: [strokes over par allowed, judged on net score?]. 'gross'/'net' are the

const SKIN_VALID={par:[0,false],gross:[0,false],netpar:[0,true],net:[0,true],bogey:[1,false],netbogey:[1,true]};
const SKIN_VALID_LABEL={none:'None — a skin stands on its own',par:'Par or better on the next hole',netpar:'Net par or better on the next hole',bogey:'Bogey or better on the next hole',netbogey:'Net bogey or better on the next hole'};
/* a uniformly random integer in [0,n) from the browser's cryptographic generator (rejection sampling, no modulo bias) */
function secureInt(n){ if(n<=1) return 0; const buf=new Uint32Array(1), lim=Math.floor(4294967296/n)*n; let x; do{ crypto.getRandomValues(buf); x=buf[0]; }while(x>=lim); return x%n; }
/* one line under a skins board: what the next undecided hole is waiting on */
function skinsWaitTxt(r){ const bits=[]; if(r.waitingOn) bits.push(`hole ${r.waitingOn.hole} waits on ${r.waitingOn.names.length<=3?r.waitingOn.names.join(', '):r.waitingOn.names.length+' players'}`); if(r.notStarted&&r.notStarted.length) bits.push(`${r.notStarted.length<=4?r.notStarted.join(', '):r.notStarted.length+' players'} not started`); return bits.join(' · '); }
function skinsResult(pub,scores,rules,playerIds){

  const at=(x,h)=>{ const s=+((scores[x.p.id]||{})[h]); if(!s) return null; const set=x.p.set||'M', hc=(x.c.hcp[set]||x.c.hcp.M)[h-1], par=(x.c.par[set]||x.c.par.M)[h-1];
    const k=rules.net&&typeof x.p.ph==='number'?strokesAt(pub,x.c,set,h,x.p.ph):0; return {s,net:s-k,par,k}; };
  // a player with no scores at all has not started (a no-show, or a late group): they do not hold a hole up, and they
  // join the reckoning the moment their first score lands. A hole counts once every player who HAS started has it.
  const started=pl.filter(x=>Object.values(scores[x.p.id]||{}).some(v=>+v>0)), notStarted=pl.filter(x=>!started.includes(x)).map(x=>x.p.name);
  const wins=[], per={}; let carried=0, lost=0, incomplete=0, waitingOn=null;
  for(let h=1;h<=18;h++){
    const rows=started.map(x=>({x,r:at(x,h)})); if(!rows.length){ incomplete++; continue; }
    const missing=rows.filter(r=>!r.r), have=rows.filter(r=>r.r);
    if(!have.length){ incomplete++; if(!waitingOn) waitingOn={hole:h,names:missing.map(r=>r.x.p.name)}; continue; }
    // skins to date: in pot mode a hole is reckoned from the cards in so far — the outright low LEADS until everyone who
    // has started has played it, then it is won. (Per-hole carries wait for the hole to be complete.)
    const open=missing.length; if(open){ if(!waitingOn) waitingOn={hole:h,names:missing.map(r=>r.x.p.name)}; if(rules.carry){ incomplete++; continue; } }
    const key=r=>rules.net?r.r.net:r.r.s, low=Math.min(...have.map(key)); let lows=have.filter(r=>key(r)===low);
    if(lows.length>1&&rules.net&&rules.grossBeatsNet){ const g=lows.filter(r=>r.r.k===0); if(g.length===1) lows=g; }
    if(lows.length!==1){ if(rules.carry) carried++; continue; }
    const {x,r}=lows[0], w={hole:h,pid:x.p.id,name:x.p.name,score:r.s,net:r.net,count:1+(rules.carry?carried:0),status:open?'lead':'won',open,checkHole:null}; carried=0;

function ensureCardCSS(){ if(typeof document==='undefined'||document.getElementById('wc-css')) return; const s=document.createElement('style'); s.id='wc-css'; s.textContent=WC_CSS; document.head.appendChild(s); }
function scorecardHTML(pub,g,scores,opt){

  const accent=g.course==='pecan'?'#A2343A':'#1F3552';
  const halves=opt.split?[[1,9],[10,18]]:[[1,18]];
  const ps=g.players, TEAM=isTeamEvent(pub), basisNet=(pub.scoring==='net'), split=pub.format==='split';
  const par=p=>c.par[p.set||'M']||c.par.M, hc=p=>c.hcp[p.set||'M']||c.hcp.M;
  const sc=p=>scores[p.id]||{};

  const LB=!TEAM&&unit!=='strokes'&&unit!=='match'?leaderboard(pub,scores,{}):[];

  const k=(p,h)=>{ const ph=phFor(p,h); return typeof ph==='number'?strokesAt(pub,c,p.set,h,ph):0; };

  const short=n=>{ const w=String(n).trim().split(/\s+/); return opt.split&&w.length>1?w[0][0]+'. '+w.slice(1).join(' '):n; };
  const shape=(s,pr)=>{ const d=s-pr; return d<=-2?'e':d===-1?'b':d===1?'o':d>=2?'d':''; };
  const range=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);

  const phTxt=v=>typeof v==='number'?(v<0?'+'+(-v):v):'';
  const plFmt=eventFormats(pub).find(f=>(FORMATS[f]||{}).entry==='player');
  const tables=halves.map(([a,b])=>{
    const nines=a===1&&b===18?[[1,9,'Out'],[10,18,'In']]:[[a,b,a===1?'Out':'In']];
    const endCols=(a===1&&b===18)||b===18;
    const fmtRow=split?`<tr class="wc-fmt"><th>Format</th>${nines.map(([x,y])=>`<td colspan="${y-x+2}">${E(FORMAT_LABEL[holeFormat(pub,x)])}${oneBallH(x)?' · team score':''}</td>`).join('')}${endCols?'<td colspan="3"></td>':''}</tr>`:'';
    const lastCol=ptsMode?'Pts':unit==='holes'?'+/−':'Net';
    const head=`<tr class="wc-h"><th>Hole</th>${nines.map(([x,y,l])=>range(x,y).map(h=>`<th>${h}</th>`).join('')+`<th class="wc-tot">${l}</th>`).join('')}${endCols?`<th class="wc-tot">Tot</th><th class="wc-tot">Hcp</th><th class="wc-tot">${lastCol}</th>`:''}</tr>`;
    const lineRow=(cls,label,valFn,totFn)=>`<tr class="${cls}"><th>${label}</th>${nines.map(([x,y])=>range(x,y).map(h=>`<td>${valFn(h)??''}</td>`).join('')+`<td class="wc-tot">${totFn?totFn(x,y):''}</td>`).join('')}${endCols?`<td class="wc-tot">${totFn?totFn(1,18):''}</td><td class="wc-tot"></td><td class="wc-tot"></td>`:''}</tr>`;
    const tees=teesUsed.map(t=>{ const y=c.tees[t]; return lineRow('t-'+t.toLowerCase().replace('/','-'),E(t),h=>y?y[h-1]:'·',(x,z)=>y?sumH(h=>y[h-1],x,z):''); }).join('');

    const parRow=lineRow('wc-par','Par',h=>(anyW&&c.par.W[h-1]!==c.par.M[h-1])?c.par.M[h-1]+'/'+c.par.W[h-1]:c.par.M[h-1],(x,z)=>sumH(h=>c.par.M[h-1],x,z));
    const hcpW=anyW?lineRow('wc-hc','Women’s Handicap',h=>c.hcp.W[h-1]):'';
    const pRow=p=>{ const S=sc(p), own=h=>!oneBallH(h)&&S[h]?+S[h]:null;
      const gT=(x,z)=>sumH(own,x,z), nT=(x,z)=>sumH(h=>own(h)!=null?own(h)-k(p,h):null,x,z);
      const me=LB.find(r=>r.id===p.id), lastVal=ptsMode?(me&&me.n?me.pts:''):unit==='holes'?(me&&me.n?(me.holesUp>0?'+':'')+me.holesUp:''):null;
      const cells=nines.map(([x,y])=>range(x,y).map(h=>{ if(oneBallH(h)) return '<td class="wc-x"></td>';
        const s=+S[h], kk=k(p,h);
        if(!s) return `<td>${kk>0?'<span class="wc-dot"></span>'.repeat(Math.min(kk,2)):''}</td>`;
        return `<td class="${TEAM&&counted.has(p.id+'|'+h)?'wc-c':''}"><span class="wc-s ${shape(s,par(p)[h-1])}">${s}</span>${kk?`<span class="wc-n" title="Net ${s-kk}">${s-kk}</span>`:''}</td>`; }).join('')+`<td class="wc-tot">${gT(x,y)}</td>`).join('');

    const L=boardLeader(); if(L&&L.n>=3&&L.id!==leader){ const v=unitOf(cp)==='strokes'?toParTxt((cp.scoring||'gross')==='net'&&L.netToPar!=null?L.netToPar:L.toPar):unitOf(cp)==='points'?(L.quota!=null?ptsTxt(L):L.pts+' pts'):L.status; if(leader!==null) items.push({at:s.at,k:'lead',big:true,who:L.members||[L.id],html:`<span class="ic">👑</span><b>${esc(L.name)}</b> ${leader?'takes the lead':'leads'} · ${esc(v)} thru ${L.thru}`}); leader=L.id; } }
  // live skins only: a skin that stands on a hole everyone in the pot has played
  for(const c of liveComps().filter(c=>c.kind==='skins')){ const r=skinsResult(compPub(pub,c),scores,c.skins||{},c.players);
    for(const w of r.wins){ if(w.status!=='won'&&w.status!=='void') continue; const at=stamps.filter(x=>x.h===w.hole&&(c.players||[]).includes(x.p)).map(x=>x.at).sort().pop()||'';
      items.push({at,k:'skin',who:[w.pid],html:w.status==='won'?`<span class="ic">💰</span><b>${esc(w.name)}</b> takes the skin on ${w.hole} with a ${w.score}${c.skins&&c.skins.net&&w.net!==w.score?' (net '+w.net+')':''}`:`<b>${esc(w.name)}</b>’s skin on ${w.hole} didn’t hold`}); } }
  items.sort((a,b)=>String(b.at).localeCompare(String(a.at))); return items; }

/* ---- drawing a hole: tee at the bottom, green at the top, a fairway that bends by hole number ---- */
function holeSVG(h,par,groupsHere){
  const W=100,H=150, bend=(h%2?1:-1)*(par>=5?22:par===4?14:0), tee={x:50,y:132}, grn={x:50-bend*.4,y:28};
  const fw=par>=4?`<path d="M${tee.x} ${tee.y-10} C ${tee.x+bend} ${tee.y-40}, ${grn.x-bend} ${grn.y+50}, ${grn.x} ${grn.y+12}" stroke="var(--fair)" stroke-width="${par>=5?24:22}" stroke-linecap="round" fill="none"/>`:`<path d="M${tee.x} ${tee.y-10} L ${grn.x} ${grn.y+14}" stroke="#C7D7BA" stroke-width="2" stroke-dasharray="3 4" fill="none"/>`;
  const bunk=par>=4?`<ellipse cx="${grn.x+(h%3?16:-16)}" cy="${grn.y+16}" rx="6" ry="4" fill="var(--sand)"/>`:`<ellipse cx="${grn.x-12}" cy="${grn.y+14}" rx="6" ry="3.5" fill="var(--sand)"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true">${fw}${bunk}<ellipse cx="${grn.x}" cy="${grn.y}" rx="15" ry="11" fill="var(--green)"/><line x1="${grn.x+3}" y1="${grn.y}" x2="${grn.x+3}" y2="${grn.y-16}" stroke="#fff" stroke-width="1.6"/><path d="M${grn.x+3} ${grn.y-16} l 9 3.5 l -9 3.5 z" fill="#C7A13A"/><rect x="${tee.x-9}" y="${tee.y-6}" width="18" height="9" rx="2.5" fill="#A7C7A0"/></svg>`; }

/* ---- the map: the real course (COURSE_GEO: tee → green centerlines, from OpenStreetMap) on aerial imagery ---- */
let L_=null, MAP=null, mapHost=null, mapLayers=null, mapLines={}, mapFit=false, mapLoading=null, mapFailed=false;
function loadLeaflet(){ if(window.L) return Promise.resolve(window.L); if(mapLoading) return mapLoading;
  mapLoading=new Promise((ok,bad)=>{ const css=document.createElement('link'); css.rel='stylesheet'; css.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'; document.head.appendChild(css);
    const s=document.createElement('script'); s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'; s.onload=()=>ok(window.L); s.onerror=()=>bad(new Error('leaflet')); document.head.appendChild(s); setTimeout(()=>bad(new Error('timeout')),12000); });
  return mapLoading; }
const geoCourses=()=>[...new Set((pub.groups||[]).map(g=>g.course))].filter(c=>typeof COURSE_GEO!=='undefined'&&COURSE_GEO[c]);
const hasGeo=()=>geoCourses().length>0;
function holeLine(course,h){ const c=COURSE_GEO[course]||COURSE_GEO[geoCourses()[0]]; return c?c[String(h)]:null; }
const along=(line,t)=>{ if(!line||line.length<2) return line&&line[0]; const segs=[]; let tot=0; for(let i=0;i<line.length-1;i++){ const d=Math.hypot(line[i+1][0]-line[i][0],(line[i+1][1]-line[i][1])*Math.cos(line[i][0]*Math.PI/180)); segs.push(d); tot+=d; } let want=tot*t; for(let i=0;i<segs.length;i++){ if(want<=segs[i]){ const f=segs[i]?want/segs[i]:0; return [line[i][0]+(line[i+1][0]-line[i][0])*f,line[i][1]+(line[i+1][1]-line[i][1])*f]; } want-=segs[i]; } return line[line.length-1]; };
/* mount the map into the current card (the same Leaflet map survives every render), then redraw the moving parts */
function drawMap(pos,fg,moveTo){

  slot.replaceWith(mapHost); mapHost.id='mapSlot';
  if(!MAP){ MAP=L.map(mapHost,{zoomControl:true,attributionControl:true,scrollWheelZoom:false,zoomSnap:.5}); 
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Imagery © Esri · Holes © OpenStreetMap contributors'}).addTo(MAP);
    mapLayers=L.layerGroup().addTo(MAP); }

      L.polyline(line,{color:'#fff',weight:on?8:5,opacity:on?.9:.55,lineCap:'round',interactive:false}).addTo(mapLayers);
      const pl=L.polyline(line,{color:on?'#F2D27A':'#D8B75F',weight:on?4:2.5,opacity:.95,lineCap:'round'}).addTo(mapLayers); pl.on('click',()=>{ holeSel=h; render(true); });

  for(const [key,xs] of Object.entries(byHole)){ const [course,hs]=key.split(':'); const line=hs==='fin'?holeLine(course,18):holeLine(course,+hs); if(!line) continue;
    xs.forEach((x,i)=>{ const pt=hs==='fin'?line[line.length-1]:along(line,.3+i*.1), me=fg&&x.g.id===fg.grp.id, lbl=x.g.label?x.g.label.replace(/^Group\s*/i,''):x.g.code;
      L.marker(pt,{icon:L.divIcon({className:'',html:`<div class="gmk${me?' me':hs==='fin'?' fin':''}" title="${esc(x.g.players.map(p=>first(p.name)).join(', '))}">${esc(lbl)}</div>`,iconSize:[28,28],iconAnchor:[14,14]}),zIndexOffset:1000}).on('click',()=>{ if(x.cur){ holeSel=x.cur; render(true); } }).addTo(mapLayers); }); }
  if(!all.length) return;
  if(moveTo&&holeSel){ const line=holeLine(geoCourses()[0],holeSel); if(line) MAP.flyToBounds(L.latLngBounds(line).pad(.35),{duration:.8,maxZoom:18}); }

}
/* ---- render ---- */
function render(moveTo){ if(!pub) return; setSync();

  const holes=Array.from({length:18},(_,i)=>i+1).map(h=>{ const here=pos.filter(x=>x.cur===h), par=(c0.par.M||[])[h-1]||4, yds=((c0.tees||{})[(groups[0]&&groups[0].players[0]||{}).tee||'White']||[])[h-1];
    return `<button class="hole${h===holeSel?' on':''}${fg&&here.some(x=>x.g.id===fg.grp.id)?' me':''}" data-h="${h}" aria-label="Hole ${h}"><span class="n">${h}</span><span class="p">Par ${par}${yds?`<em> · ${yds}</em>`:''}</span>${holeSVG(h,par,here)}<span class="gs">${here.map(x=>`<span class="gm${fg&&x.g.id===fg.grp.id?' me':''}" title="${esc(x.g.label||'')}: ${esc(x.g.players.map(p=>first(p.name)).join(', '))}">${esc(x.g.label?x.g.label.replace(/^Group\s*/i,''):x.g.code)}</span>`).join('')}</span></button>`; }).join('');
  const fin=pos.filter(x=>x.started&&!x.cur), idle=pos.filter(x=>!x.started);
  // the hole's story

  const played=P.map(p=>({p,s:(scores[p.id]||{})[h]})).filter(x=>x.s).map(x=>Object.assign(x,{r:x.s-parOf(x.p,h)})).sort((a,b)=>a.r-b.r||a.p.name.localeCompare(b.p.name));
  const tally=[['eagle',played.filter(x=>x.r<=-2).length,'eagle'],['birdie',played.filter(x=>x.r===-1).length,'birdie'],['par',played.filter(x=>x.r===0).length,''],['bogey',played.filter(x=>x.r===1).length,'bogey'],['double+',played.filter(x=>x.r>=2).length,'bogey']].filter(x=>x[1]);
  const onIt=pos.filter(x=>x.cur===h), tees=Object.entries(c0.tees||{}).filter(([,a])=>a&&a[h-1]).map(([t,a])=>`${t} ${a[h-1]}`).slice(0,4).join(' · ');
  const skinsLine=cs.filter(c=>c.kind==='skins').map(c=>{ const r=skinsResult(compPub(pub,c),scores,c.skins||{},c.players), w=r.wins.find(x=>x.hole===h); if(!w) return ''; return `<div class="row"><span>💰 <b>${esc(c.name)}</b>: ${esc(w.name)} ${w.status==='won'?'holds the skin':w.status==='void'?'— skin didn’t hold':w.status==='lead'?'leads it · '+w.open+' still to play':'— pending hole '+w.checkHole}</span><span></span><span></span></div>`; }).join('');
  const holePanel=`<div class="hp"><div class="hh"><b>Hole ${h}</b><span>Par ${par}${hcp?' · Hcp '+hcp:''}${tees?' · '+esc(tees)+' yds':''}</span></div>
    ${onIt.length?`<div class="muted" style="font-size:13px;margin-top:4px">On it now: ${esc(onIt.map(x=>(x.g.label||x.g.code)+' — '+x.g.players.map(p=>first(p.name)).join(', ')).join(' · '))}</div>`:''}
    ${tally.length?`<div class="tally">${tally.map(([l,n,cls])=>`<span class="chip ${cls}">${n} ${l}${n===1||l==='double+'?'':'s'}</span>`).join('')}</div>`:'<div class="muted" style="margin:10px 0 6px;font-size:13.5px">Nobody has played it yet.</div>'}
    ${skinsLine}${played.map(x=>`<div class="row${fg&&x.p.id===fg.id?' me':''}"><span><b>${esc(x.p.name)}</b> <small>· ${esc(x.p.grp.label||x.p.grp.code)}</small></span><small>${relName(x.r)}</small><span class="sc ${x.r<=-2?'uu':x.r<0?'u':x.r>0?'o':''}">${x.s}</span></div>`).join('')}</div>`;

  $('main').innerHTML=`<div class="col">
    <div class="card"><div class="ch"><h2>The course</h2><small>${esc(c0.name||'')} · ${groups.length} group${groups.length===1?'':'s'}${fin.length?` · ${fin.length} finished`:''}${idle.length?` · ${idle.length} not started`:''}</small></div>
      ${hasGeo()&&!mapFailed?`<div id="mapSlot" class="map"></div><div class="mapbar"><button class="btn" id="mapAll">Whole course</button><span class="muted" style="font-size:12.5px">Tap a hole number on the map or below · groups sit on the tee of the hole they are playing</span></div><div class="course bar">${holes}</div>`:`<div class="course">${holes}</div>`}
      <div class="legend"><span><span class="gm">A</span>a group on the hole it’s playing</span>${fg?`<span><span class="gm me">●</span>${esc(fg.name)}’s group</span>`:''}${fin.length?`<span>Finished: ${esc(fin.map(x=>x.g.label||x.g.code).join(', '))}</span>`:''}</div></div>

   <div class="col">
    <div class="card"><div class="ch"><h2>Live</h2><small>${feed.length?feed.length+' moments':'as it happens'}</small></div>
      <div class="feed">${feed.length?feed.slice(0,TV?18:40).map(it=>`<div class="fi${it.big?' big':''}"><time>${when(it.at)}</time><div>${it.html}</div></div>`).join(''):'<div class="empty">Nothing yet — the first birdie, skin or lead change shows here.</div>'}</div></div>
    <div class="card"><div class="ch"><h2>${esc(comp?comp.name:cs.length?'Individual':'Leaderboard')}</h2><small>${esc(MATCH?formatSummary(cp):(net?'net':'gross')+' · '+formatSummary(cp).toLowerCase())}</small></div>

      ${lb.map(r=>`<div class="lb num${fg&&(r.id===fg.id||(r.members||[]).includes(fg.id))?' me':''}"><b>${r.posTxt}</b><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.name)}</span><span class="r muted">${r.n?r.thru:'—'}</span><span class="tp ${r.n&&String(val(r)).startsWith('−')?'pos':''}">${esc(val(r))}</span></div>`).join('')||'<div class="empty">No scores yet.</div>'}

async function refresh(){ if(document.visibilityState!=='visible') return; const r=await loadEvent(); if(r==='error'||r==='none') return; await loadScores(); render(); }
async function boot(){

  if(!sb) return fail('GameCast isn’t connected yet.');

  sb.channel('gc-'+pub.id).on('postgres_changes',{event:'*',schema:'public',table:'golf_scores',filter:'event_id=eq.'+pub.id},p=>{ const r=p.eventType==='DELETE'?p.old:p.new; if(!r) return;

window.__canReload=()=>true;
/* Keeps every open device on the latest version: checks version.json about once a minute and, when a
   newer build is live, reloads at a safe moment (nothing unsaved, no editor open, not mid-typing).
   The host's CDN caches version.json and the pages separately (up to 5 min each), so right after a deploy they can
   disagree in either direction. Two rules keep that from turning into a reload loop: only a build NEWER than this
   page counts, and a reload is tried once per build — if the page that comes back is still the old one, the CDN
   hasn't caught up; wait a while before trying that build again. */
(function(){
  const ME='20261028152655', KEY='au_tried', RETRY=10*60*1000; let ready=false, lastCheck=0;
  const typing=()=>{ const a=document.activeElement; return a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.value&&a.type!=='search'; };
  const safe=()=>!typing()&&(typeof window.__canReload!=='function'||window.__canReload());
  const tried=()=>{ try{ const [b,t]=(sessionStorage.getItem(KEY)||'').split('|'); return b?{build:b,at:+t||0}:null; }catch(_){ return null; } };
  async function check(){ lastCheck=Date.now(); if(location.protocol==='file:') return;
    try{ const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'}); if(!r.ok) return; const v=await r.json(); if(!v||!v.build||!(v.build>ME)) return;
      const t=tried(); if(t&&t.build===v.build&&Date.now()-t.at<RETRY) return;   // already reloaded for this build and still got the old page
      ready=v.build; }catch(_){} }
  setInterval(()=>{ if(ready){ if(safe()){ try{ sessionStorage.setItem(KEY,ready+'|'+Date.now()); }catch(_){ } location.reload(); } } else if(Date.now()-lastCheck>60000) check(); },3000);
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') check(); });
  window.__build=ME;
})();
