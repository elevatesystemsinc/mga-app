function runAuction(t,startId){
  const c=calc(t); if(!c.lots.length){ toast('Import the team sheet first'); return; }
  let seq=auctionSeq(c), i=startId?seq.findIndex(l=>l.id===startId):seq.findIndex(l=>!l.pooled&&!(n0(l.price)>0)&&!(l.isPool&&l.price>0)); if(i<0) i=0;
  const addBidder=num=>{ let x=bidderByNum(c,num); if(!x){ x={id:uid(),num,name:'Bidder '+num,memberId:'',paid:false,method:''}; c.bidders.push(x); c.bidders.sort((a,z)=>(+a.num||0)-(+z.num||0)); } return x; };
  const draw=r=>{ seq=auctionSeq(c); if(i>=seq.length) i=seq.length-1; const l=seq[i], nx=seq[i+1], tot=calcTotals(t), b=bidderById(c,l.bidderId), P=!!l.isPool;
    const status=l.pooled?`<b style="color:#E8A08A">in the pool (Lot ${poolLotNum(c)})</b>`:(n0(l.price)>0?`<b style="color:#D8B75F">sold ${fmt(l.price)} to ${esc(bidderLabel(b))}</b>`:'');
    r.innerHTML=`<div class="card pad" style="display:flex;gap:18px;align-items:center;background:var(--navy);color:#fff;border-color:var(--navy)">
        <div style="text-align:center;min-width:92px"><div style="font-size:11px;font-weight:800;letter-spacing:.14em;color:#D8B75F">LOT</div><div style="font-family:var(--serif,Georgia);font-size:52px;font-weight:700;line-height:1">${l.lot}</div><div style="font-size:12px;color:#AEB8BE">${P?'the pool':'of '+c.lots.length}</div></div>
        <div style="min-width:0">${P?`<div style="font-family:var(--serif,Georgia);font-size:26px;font-weight:700;line-height:1.15">The Pool</div><div style="margin-top:6px;color:#C9CFD2;font-size:13.5px">${l.count} team${l.count===1?'':'s'} that didn’t reach ${fmt(c.minBid)}, sold together${l.price>0?` · <b style="color:#D8B75F">sold ${fmt(l.price)} to ${esc(bidderLabel(b))}</b>`:''}</div>`
          :`<div style="font-family:var(--serif,Georgia);font-size:26px;font-weight:700;line-height:1.15">${esc(l.p1)}<br>${esc(l.p2)}</div><div style="margin-top:6px;color:#C9CFD2;font-size:13.5px">${esc(flightName(l.flight))} · team index ${idxTxt2(l.idx)}${status?' · '+status:''}</div>`}</div></div>
      ${P?`<div class="mini" style="max-height:220px;overflow:auto">${l.teams.map(x=>`<div class="mr num" style="grid-template-columns:60px minmax(0,1fr) 80px"><span class="muted">Lot ${x.lot}</span><span class="trunc">${esc(teamName(x))}</span><span class="muted">${esc(flightName(x.flight))}</span></div>`).join('')}</div>`:''}
      ${pair(field('Bidder number','raB',b?b.num:'',{ph:'e.g. 27',hint:'<span id="raBn"></span>'}),field('Price','raP',n0(l.price)||'',{type:'number',ph:'0',hint:!P&&c.minBid?`Minimum ${fmt(c.minBid)}`:''}))}
      <div class="actions"><button class="btn pri" type="button" id="raSold" style="flex:1">${P?'Sold':'Sold — next lot'}</button>${P?'':`<button class="btn" type="button" id="raPool">No sale → pool</button>`}<button class="btn" type="button" id="raPrev"${i===0?' disabled':''}>‹ Back</button><button class="btn" type="button" id="raSkip"${i>=seq.length-1?' disabled':''}>Skip</button></div>
      <div class="mini">${[['Pot',fmt(tot.pot)],['Sold',`${tot.sold} of ${tot.auctionLots}${tot.prebuy?` · ${tot.prebuy} pre-bought`:''}`],['In the pool',tot.pooled?`${tot.pooled} team${tot.pooled===1?'':'s'} · Lot ${tot.poolLot}`:'none'],['Top price',fmt(tot.top)]].map(([a,v])=>`<div class="mr num" style="grid-template-columns:minmax(0,1fr) auto"><span class="muted">${a}</span><b>${v}</b></div>`).join('')}</div>
      ${nx?`<p class="hint">Up next: Lot ${nx.lot} · ${esc(teamName(nx))}${nx.isPool?'':' · '+esc(flightName(nx.flight))}</p>`:(P?'<p class="hint">The pool is the final lot.</p>':`<p class="hint">Last team.${poolTeams(c).length?` The pool (Lot ${poolLotNum(c)}) comes up next.`:''}</p>`)}`;
    const bIn=r.querySelector('#raB'), pIn=r.querySelector('#raP'), bn=r.querySelector('#raBn');
    const upd=()=>{ const x=bidderByNum(c,bIn.value); bn.textContent=bIn.value?(x?x.name:'New bidder number — it will be added'):''; }; bIn.oninput=upd; upd();
    const next=()=>{ seq=auctionSeq(c); if(i<seq.length-1) i++; draw(r); };
    const toPool=()=>{ setPooled(c,l,true); persist(); toast(`${teamName(l)} → the pool (Lot ${poolLotNum(c)})`); next(); };
    const sell=()=>{ const num=String(bIn.value).trim(), price=parseFloat(String(pIn.value).replace(/[$,]/g,''))||0;
      if(!P&&!(price>0)){ if(confirm('No price entered. Send this team to the pool?')) toPool(); else pIn.focus(); return; }
      if(price>0&&!num){ toast('Enter the bidder number'); bIn.focus(); return; }
      if(!P&&c.minBid&&price<c.minBid){ if(confirm(`${fmt(price)} is under the ${fmt(c.minBid)} minimum.\n\nOK sends the team to the pool. Cancel lets you change the price.`)) toPool(); else pIn.focus(); return; }
      const x=num?addBidder(num):null;
      if(P) c.pool={bidderId:price>0&&x?x.id:'',price:price>0?price:0};
      else { setPooled(c,l,false); l.bidderId=price>0&&x?x.id:''; l.price=price>0?price:0; }
      persist(); if(P){ toast('The pool is sold'); draw(r); } else next(); };
    r.querySelector('#raSold').onclick=sell;
    const pb=r.querySelector('#raPool'); if(pb) pb.onclick=toPool;
    [bIn,pIn].forEach(e=>e.onkeydown=ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); if(e===bIn) pIn.focus(); else sell(); } });
    r.querySelector('#raPrev').onclick=()=>{ i=Math.max(0,i-1); draw(r); };
    r.querySelector('#raSkip').onclick=next;
    setTimeout(()=>bIn.focus(),30);
  };
  openDrawer({kicker:t.name+' · Calcutta',title:'Run the auction',saveLabel:'Done',wide:true,body:'<div id="raBody" style="display:flex;flex-direction:column;gap:14px"></div>',wire:r=>draw(r.querySelector('#raBody')),save:()=>{}});
}

const cashierLink=t=>SITE_BASE+'cashier.html?k='+encodeURIComponent(calc(t).share.token);
const newToken=()=>Array.from(crypto.getRandomValues(new Uint8Array(24)),b=>'abcdefghijkmnpqrstuvwxyz23456789'[b%32]).join('');
/* create, replace or (token null) turn off a shared cashier / check-in row; admin links go through the database function */
function shareRow(tid,token,name,doc){ return KEYMODE?keyRPC('hub_key_share',{p_tid:tid,p_token:token,p_name:name,p_doc:doc})
  :token?sb.from('calcutta_share').upsert({tid,token,name,doc,version:1,updated_at:new Date().toISOString()}):sb.from('calcutta_share').update({token:null}).eq('tid',tid); }
function calcPeople(t){ return (t.field||[]).map(p=>{ const m=memberById(p.memberId); return m?{id:m.id,name:tidyName(memberName(m))}:null; }).filter(Boolean).sort((a,b)=>a.name.localeCompare(b.name)); }
const SHARE_ST={};
/* the last cashier copy this device merged with — needed to tell what changed here; kept per device */
const shareBase={ get(t){ const c=calc(t); if(c._base){ this.set(t,c._base,c._ver); delete c._base; delete c._ver; }   // move older shared copies here
    try{ return JSON.parse(localStorage.getItem('mga_cbase_'+t.id)||'null'); }catch(_){ return null; } },
  set(t,doc,ver){ try{ localStorage.setItem('mga_cbase_'+t.id,JSON.stringify({doc,ver})); }catch(_){} } };
const shareSt=t=>Object.assign({},calc(t).share||{},SHARE_ST[t.id]||{});
async function calcShareSync(t){
  const c=calc(t); if(!c.share||!c.share.token||!CLOUD||!sessionOK) return false;
  c.people=calcPeople(t); c.name=t.name;
  const sb0=shareBase.get(t); calcStamp(c,sb0&&sb0.doc);
  const token=c.share.token;
  const get=async()=>{ const {data,error}=await sb.rpc('calcutta_get',{p_token:token}); if(error) throw new Error(error.message); if(!data) throw new Error('The cashier link is off'); return data; };
  const put=async(doc,ver)=>{ const {data,error}=await sb.rpc('calcutta_put',{p_token:token,p_doc:doc,p_version:ver}); if(error) throw new Error(error.message); return data; };
  try{
    const before=calcStable(calcDoc(c));
    const res=await calcSyncOnce(get,put,calcDoc(c));
    const d=JSON.parse(JSON.stringify(res.doc)); CALC_KINDS.forEach(k=>{ c[k]=c[k]||[]; syncArr(c[k],d[k]||[]); }); CALC_SET.forEach(k=>{ if(d[k]!==undefined&&!sameJ(c[k],d[k])) c[k]=isObj(c[k])&&isObj(d[k])?syncTo(c[k],d[k]):d[k]; }); c._su=d._su||0; c._del=d._del||[];

}
let calcShareTimer=null, calcShareBusy=false;
async function calcShareAll(){
  if(calcShareBusy) return; const ts=db.tournaments.filter(t=>t.calcutta&&t.calcutta.share&&t.calcutta.share.token); if(!ts.length) return;
  db.tournaments.forEach(x=>{ const sh=x.calcutta&&x.calcutta.share; if(sh&&('state' in sh||'at' in sh||'msg' in sh)) x.calcutta.share={token:sh.token,created:sh.created}; if(x.calcutta&&x.calcutta._base) shareBase.get(x); });
  const dataBefore=stable(db);
  calcShareBusy=true; let changed=false;
  try{ for(const t of ts) changed=(await calcShareSync(t))||changed; } finally{ calcShareBusy=false; }
  if(stable(db)!==dataBefore){ if(typeof syncSuppress!=='undefined'){ syncSuppress=true; persist(); syncSuppress=false; } else persist(); }
  if(changed&&view.page==='tournament'&&view.ttab==='calcutta') render();
}
function calcStampNow(){ for(const t of db.tournaments){ const c=t.calcutta; if(!(c&&c.share&&c.share.token)) continue; const b0=shareBase.get(t); if(b0&&b0.doc) calcStamp(c,b0.doc); } }
function calcAfterPersist(){ if(calcShareBusy||!CLOUD||!sessionOK) return; if(!db.tournaments.some(t=>t.calcutta&&t.calcutta.share&&t.calcutta.share.token)) return; clearTimeout(calcShareTimer); calcShareTimer=setTimeout(calcShareAll,700); }

/* search: a lot matches its number, either player, the captain, the buyer's name or paddle */
function lotMatches(c,l,q){ q=String(q||'').trim().toLowerCase().replace(/^#/,''); if(!q) return true;
  if(l.isPool){ const b=bidderById(c,l.bidderId); return /pool/.test(q)||String(l.lot)===q||(b&&(String(b.num)===q||b.name.toLowerCase().includes(q)))||l.teams.some(x=>lotMatches(c,x,q)); }
  if(String(l.lot)===q) return true;
  const b=bidderById(c,l.bidderId), cb=l.prebuy?captainBidder(c,l):null, pb=l.pooled&&c.pool&&bidderById(c,c.pool.bidderId);
  if(/^\d+$/.test(q)) return [b,cb,pb].some(x=>x&&String(x.num)===q);   // a bare number is a lot or a paddle, exactly
  const hay=[l.p1,l.p2,flightName(l.flight),b&&b.name,pb&&pb.name,cb&&cb.name].filter(Boolean).join(' ').toLowerCase();
  if(hay.includes(q)) return true;
  return [b,cb,pb].some(x=>x&&String(x.num)===q);
}
function bidderMatches(c,b,q){ q=String(q||'').trim().toLowerCase().replace(/^#/,''); if(!q) return true;
  if(String(b.num)===q||b.name.toLowerCase().includes(q)) return true;
  return bidderOwes(c,b).lots.some(l=>String(l.lot)===q||(!l.isPool&&teamName(l).toLowerCase().includes(q))); }

/* ============ Teams in the field that aren't in the Calcutta yet ============ */
function fieldTeamsMissing(t){
  const c=calc(t), byTeam=new Map();
  for(const p of t.field||[]){ if(!p.memberId) continue; const a=byTeam.get(p.team)||[]; a.push(p); byTeam.set(p.team,a); }
  const have=new Set(), haveNames=new Set();
  c.lots.forEach(l=>{ [l.m1,l.m2].filter(Boolean).forEach(id=>have.add(id)); [l.p1,l.p2].forEach(n=>haveNames.add(nameKey(n))); });
  const out=[];
  for(const [team,ps] of byTeam){ if(ps.length<1) continue;
    const ms=ps.map(p=>memberById(p.memberId)).filter(Boolean); if(!ms.length) continue;
    if(ms.some(m=>have.has(m.id)||haveNames.has(nameKey(memberName(m))))) continue;      // already a lot
    const idx=ms.map(m=>typeof parseIndex==='function'?parseIndex(m.hcp):null);
    out.push({team,members:ms,names:ms.map(m=>tidyName(memberName(m))),i:idx,idx:idx.every(v=>v!=null)?Math.round(idx.reduce((a,v)=>a+v,0)*10)/10:null}); }
  return out.sort((a,b)=>a.team-b.team);
}
/* suggest a flight from where the team index falls among the existing flights */
function suggestFlight(c,idx){
  const F=new Map(); c.lots.forEach(l=>{ if(l.idx==null||l.idx==='') return; const f=String(l.flight); const r=F.get(f)||[Infinity,-Infinity]; r[0]=Math.min(r[0],+l.idx); r[1]=Math.max(r[1],+l.idx); F.set(f,r); });
  if(idx==null||!F.size) return [...F.keys()][0]||'';
  let best='',d=Infinity; for(const [f,[lo,hi]] of F){ const dist=idx<lo?lo-idx:idx>hi?idx-hi:0; if(dist<d){ d=dist; best=f; } } return best; }
function addFieldTeams(t){
  const c=calc(t), miss=fieldTeamsMissing(t);
  if(!miss.length){ toast('Every team in the field is already in the Calcutta'); return; }
  const flights=[...new Set(c.lots.map(l=>String(l.flight)))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
  const next=c.lots.reduce((a,l)=>Math.max(a,+l.lot||0),0)+1;
  openDrawer({kicker:t.name+' · Calcutta',title:`Add ${miss.length===1?'a team':miss.length+' teams'} from the field`,saveLabel:miss.length===1?'Add to the Calcutta':`Add ${miss.length} teams`,
    body:`<p style="margin:0">${miss.length===1?'This team is':'These teams are'} in the tournament field but not in the Calcutta. Pick a flight and a lot number for each; the pool moves to the next number automatically.</p>
      ${miss.map((m,k)=>{ const sug=suggestFlight(c,m.idx); return `<div class="card pad" style="display:flex;flex-direction:column;gap:10px">
        <label class="check" style="font-size:15px"><input type="checkbox" id="afOn${k}" checked> <b>${esc(m.names.join(' & '))}</b> <span class="muted">· Team ${esc(m.team)}${m.idx!=null?` · team index ${idxTxt2(m.idx)}`:''}</span></label>
        ${pair(field('Flight','afF'+k,sug,{type:'select',options:flights.map(f=>[f,flightName(f)]),hint:m.idx!=null&&sug?`Suggested from the team index (${idxTxt2(m.idx)}).`:''}),field('Lot number','afL'+k,next+k,{type:'number',hint:'Defaults to the end of the order. A number already in use moves that lot and the ones after it down one.'}))}</div>`; }).join('')}`,
    save:()=>{ let added=0;
      miss.forEach((m,k)=>{ if(!$('afOn'+k).checked) return;
        const lot=Math.max(1,parseInt(fv('afL'+k),10)||next+k), flight=fv('afF'+k);
        if(c.lots.some(l=>+l.lot===lot)) c.lots.forEach(l=>{ if(+l.lot>=lot) l.lot=+l.lot+1; });   // make room
        c.lots.push({id:uid(),lot,p1:m.names[0],p2:m.names[1]||'',i1:m.i[0],i2:m.i[1]??null,idx:m.idx,flight,fun:false,bidderId:'',price:0,m1:m.members[0].id,m2:(m.members[1]||{}).id||''});
        added++; });
      if(!added){ toast('Nothing selected'); return false; }
      c.lots.sort((a,b)=>a.lot-b.lot); toast(`${added} team${added===1?'':'s'} added to the Calcutta`); }});
}

function bidderRows(t){ const c=calc(t), f=view.ccBF||'all';
  return c.bidders.filter(b=>bidderMatches(c,b,view.ccBQ)).map(b=>({b,o:bidderOwes(c,b)}))
    .filter(({b,o})=>f==='all'||(f==='buyers'?o.total>0:o.total>0&&!b.paid)); }
function bidderListHTML(t){
  const c=calc(t), f=view.ccBF||'all', open=view.ccOpen||{}, rows=bidderRows(t);
  if(!c.bidders.length) return '<div class="empty" style="padding:22px"><span>Add bidders one at a time, or number every player in the field.</span></div>';
  const head=`<div class="bid-bar"><div class="seg">${[['all','All'],['buyers','Buyers'],['unpaid','Unpaid']].map(([k,l])=>`<button class="${f===k?'on':''}" data-cbf="${k}">${l}</button>`).join('')}</div>
    ${rows.some(r=>r.o.lots.length)?`<button class="btn sm" id="ccExpAll">${rows.filter(r=>r.o.lots.length).every(r=>open[r.b.id])?'Collapse all':'Expand all'}</button>`:''}</div>`;
  const body=rows.map(({b,o})=>{ const isOpen=!!open[b.id]&&o.lots.length;
    const lines=o.lots.map(l=>l.isPool
      ?`<div class="bl-row"><span class="bl-n">${l.lot}</span><span class="bl-t"><b>The Pool</b><small>${esc(l.teams.map(x=>'Lot '+x.lot+' '+teamName(x)).join(' · '))}</small></span><span class="bl-f">Pool</span><b class="bl-p">${fmt(l.price)}</b></div>`
      :`<div class="bl-row"><span class="bl-n">${l.lot}</span><span class="bl-t">${esc(teamName(l))}${buyInOf(c).on?`<small>buyer owns ${ownership(c,l).buyer}%</small>`:''}</span><span class="bl-f">${esc(flightName(l.flight))}</span><b class="bl-p">${fmt(l.price)}</b></div>`).join('');
    return `<div class="bid-item${isOpen?' open':''}">
      <div class="tr num click cc-bid" data-cbx="${b.id}" style="grid-template-columns:22px 56px minmax(0,1fr) 70px 104px 74px 40px" aria-expanded="${isOpen}">
        <span class="chev">${o.lots.length?(isOpen?'▾':'▸'):''}</span><b>#${esc(b.num)}</b><span class="trunc">${esc(b.name)}</span>
        <span class="r muted cc-n">${o.lots.length?`${o.lots.length} lot${o.lots.length===1?'':'s'}`:''}</span>
        <b class="r">${o.total?fmt(o.total):'<span class="muted" style="font-weight:500">—</span>'}</b>
        <span class="r">${o.total?(b.paid?`<span class="chip ok">Paid</span>`:'<span class="chip warn">Owes</span>'):''}</span>
        <span class="ib" data-cbe="${b.id}" title="Edit bidder" role="button">${I.edit}</span></div>
      ${isOpen?`<div class="bid-detail">${lines}<div class="bl-row tot"><span class="bl-n"></span><span class="bl-t"><b>Total owed</b><small>${b.paid?`Paid${b.method?' by '+esc(b.method):''}`:'Not paid yet'}</small></span><span class="bl-f"></span><b class="bl-p">${fmt(o.total)}</b></div></div>`:''}</div>`; }).join('');
  return head+(body||`<div class="tr"><span class="muted">No bidders match${view.ccBQ?` “${esc(view.ccBQ)}”`:''}.</span></div>`);
}

function ckData(t){ if(!t.checklist) t.checklist={sections:[],tasks:[]}; const k=t.checklist; k.sections=k.sections||[]; k.tasks=k.tasks||[]; return k; }
function ckFromTemplate(tpl){ const sections=[], tasks=[];
  tpl.forEach(([title,sub,groups])=>{ const sid=uid(); sections.push({id:sid,title,sub});
    groups.forEach(([g,items])=>items.forEach(([text,tag])=>tasks.push({id:uid(),section:sid,group:g,text,tag:tag||'',memberId:'',notes:'',done:false}))); });
  return {sections,tasks}; }
const boardRoles=id=>db.board.filter(b=>b.memberId===id).map(b=>b.role);
const ckWho=id=>{ const m=memberById(id); return m?tidyName(memberName(m)):''; };
/* type-ahead for assignees: board members first, then everyone */
function ckMatches(q){ const base=memberMatches({field:[]},q,30);
  return base.map(h=>({...h,board:boardRoles(h.m.id)})).sort((a,b)=>(b.board.length?1:0)-(a.board.length?1:0)||b.sc-a.sc).slice(0,7); }
function ckPicker(r,initialId){ // wires #ckA input + #ckAList; returns ()=>memberId
  let linked=initialId||'', hits=[], cur=0; const inp=r.querySelector('#ckA'), list=r.querySelector('#ckAList'), who=r.querySelector('#ckAWho');
  const show=()=>{ who.innerHTML=linked?`Assigned to <b>${esc(ckWho(linked))}</b>${boardRoles(linked).length?' · '+esc(boardRoles(linked).join(', ')):''}`:(inp.value.trim()?'<span class="neg">No member matches — pick from the list</span>':'Unassigned'); };
  const close=()=>{ list.style.display='none'; };
  const pick=h=>{ linked=h.m.id; inp.value=h.name; close(); show(); };
  const draw=()=>{ const q=inp.value.trim(); hits=q?ckMatches(q):db.board.filter(b=>b.memberId).map(b=>({m:memberById(b.memberId),name:ckWho(b.memberId),board:boardRoles(b.memberId)})).filter((h,i,a)=>h.m&&a.findIndex(x=>x.m.id===h.m.id)===i); cur=0;
    if(!hits.length){ close(); return; }
    list.innerHTML=(q?'':'<div class="muted" style="padding:6px 12px;font-size:11.5px;font-weight:700;letter-spacing:.06em">BOARD</div>')+hits.map((h,k)=>`<div data-k="${k}" style="padding:9px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;${k===cur?'background:#F6ECCF':''}"><span>${esc(h.name)}</span><span class="muted" style="font-size:12px">${esc(h.board.join(', '))}</span></div>`).join('');
    list.style.display='block'; list.querySelectorAll('[data-k]').forEach(d=>d.onmousedown=e=>{ e.preventDefault(); pick(hits[+d.dataset.k]); }); };
  inp.oninput=()=>{ linked=''; draw(); show(); }; inp.onfocus=()=>{ if(!inp.value.trim()) draw(); };
  inp.onkeydown=e=>{ if(list.style.display==='none') return; if(e.key==='ArrowDown'||e.key==='ArrowUp'){ cur=(cur+(e.key==='ArrowDown'?1:-1)+hits.length)%hits.length; list.querySelectorAll('[data-k]').forEach((d,k)=>d.style.background=k===cur?'#F6ECCF':''); e.preventDefault(); }
    else if(e.key==='Enter'||e.key==='Tab'){ if(hits[cur]){ pick(hits[cur]); if(e.key==='Enter') e.preventDefault(); } } else if(e.key==='Escape'){ close(); e.stopPropagation(); } };
  inp.onblur=()=>setTimeout(close,120); show();
  return ()=>linked;
}

    body:field('Task','ckT',task.text,{type:'textarea'})+pickerHTML(task.memberId)+
      field('Notes','ckN',task.notes||'',{type:'textarea'})+

    del:isNew?null:()=>{ k.tasks=k.tasks.filter(x=>x!==task); },delLabel:'Delete task'});

function editSection(t,s){

    save:()=>{ const ti=fv('csT'); if(!ti){ toast('Give it a title'); return false; } Object.assign(s,{title:ti,sub:fv('csS')}); if(isNew) k.sections.push(s); },

function ckMatch(task){ const f=view.ckF, q=view.ckQ.trim().toLowerCase();
  if(f==='open'&&task.done) return false; if(f==='done'&&!task.done) return false; if(f==='unassigned'&&task.memberId) return false;
  if(view.ckWho&&task.memberId!==view.ckWho) return false;
  if(q&&!(task.text.toLowerCase().includes(q)||(task.notes||'').toLowerCase().includes(q)||ckWho(task.memberId).toLowerCase().includes(q))) return false; return true; }

/* =====================================================================
   Check-in core — shared by the hub and the registration page.
   doc = { name, players:[{id,last,first,partner,team,par3,in,at,u}], _del:[] }
   Each player carries u (last changed); copies merge player by player, newest wins.
   ===================================================================== */
const ckStable=x=>{ if(Array.isArray(x)) return '['+x.map(ckStable).join(',')+']'; if(x&&typeof x==='object') return '{'+Object.keys(x).filter(k=>x[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+ckStable(x[k])).join(',')+'}'; return JSON.stringify(x===undefined?null:x); };
const ckStrip=p=>{ const o=Object.assign({},p); delete o.u; return o; };
function ckStamp(doc,base,now){ now=now||Date.now(); const bm=new Map(((base&&base.players)||[]).map(p=>[p.id,{s:ckStable(ckStrip(p)),u:p.u||0}]));
  for(const p of doc.players||[]){ const b=bm.get(p.id); if(!b||b.s!==ckStable(ckStrip(p))){ if(!((p.u||0)>(b?b.u:0))) p.u=now; } } }
function ckMerge(r,l){ r=r||{}; l=l||{}; const m=new Map(); for(const p of r.players||[]) m.set(p.id,p);
  for(const p of l.players||[]){ const c=m.get(p.id); if(!c||(p.u||0)>=(c.u||0)) m.set(p.id,p); }
  return {name:l.name||r.name, players:[...m.values()].sort((a,b)=>(a.last+' '+a.first).localeCompare(b.last+' '+b.first))}; }
async function ckSyncOnce(get,put,local){
  for(let n=0;n<4;n++){ const rem=await get(); const merged=ckMerge(rem.doc,local);
    if(ckStable(merged)===ckStable(rem.doc)) return {doc:rem.doc,version:rem.version,wrote:false};
    try{ const v=await put(merged,rem.version); return {doc:merged,version:v,wrote:true}; }catch(e){ if(!/conflict/i.test(e.message||'')) throw e; } }
  throw new Error('Too many people saving at once — try again'); }
const ckCounts=doc=>{ const ps=doc.players||[], inn=ps.filter(p=>p.in).length, teams=new Map();
  ps.forEach(p=>{ const t=teams.get(p.team)||[0,0]; t[0]++; if(p.in) t[1]++; teams.set(p.team,t); });
  return {total:ps.length,in:inn,left:ps.length-inn,teams:teams.size,teamsDone:[...teams.values()].filter(([a,b])=>a===b).length}; };

/* =====================================================================
   Check-in — per tournament, per player. Lives on each field entry as p.checkin = {at} (absent = not yet).
   A private registration link lets the person at the table check players in without the board login;
   it reuses the cashier-link storage (row id = tournament id + ':checkin') and RPCs.
   ===================================================================== */
TT.splice(TT.findIndex(x=>x[0]==='field')+1,0,['checkin','Check-in']);
view.ckiQ=''; view.ckiF='all';
function ckPlayers(t){
  const par3q=(t.fieldQuestions||[]).find(q=>q.kind==='par3');
  const rows=(t.field||[]).map(p=>{ const m=memberById(p.memberId); const full=tidyName(m?memberName(m):(p.name||'')); const parts=full.split(' ');
    return {p,id:p.id,first:m&&m.first?tidyName(m.first):parts.slice(0,-1).join(' '),last:m&&m.last?tidyName(m.last):parts.slice(-1)[0]||'',team:p.team,par3:!!(par3q&&String((p.answers||{})[par3q.key]||'').toLowerCase().startsWith('y'))}; });
  // the hub's member records sometimes have first/last swapped (e.g. "andy, sauter"); keep display sane
  rows.forEach(r=>{ if(r.last.toLowerCase()==='andy'&&r.first.toLowerCase()==='sauter'){ r.last='Sauter'; r.first='Andy'; } });
  const byTeam=new Map(); rows.forEach(r=>{ const a=byTeam.get(r.team)||[]; a.push(r); byTeam.set(r.team,a); });
  rows.forEach(r=>{ const mate=(byTeam.get(r.team)||[]).find(x=>x!==r); r.partner=mate?`${mate.first} ${mate.last}`:''; r.mate=mate; });
  return rows.sort((a,b)=>a.last.localeCompare(b.last)||a.first.localeCompare(b.first));
}
/* search: a player's own name first; partners only if no one matches by name; a number is a team */
function ckFilter(rows,q,get){ q=String(q||'').trim().toLowerCase().replace(/^#/,''); if(!q) return rows;
  if(/^\d+$/.test(q)) return rows.filter(r=>String(get(r).team)===q);
  const words=q.replace(/,/g,' ').split(/\s+/).filter(Boolean);
  const own=rows.filter(r=>{ const x=get(r), h=`${x.first} ${x.last}`.toLowerCase(); return words.every(w=>h.includes(w)); });
  return own.length?own:rows.filter(r=>{ const x=get(r), h=`${x.first} ${x.last} ${x.partner}`.toLowerCase(); return words.every(w=>h.includes(w)); }); }
const ckTime=iso=>iso?new Date(iso).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}):'';

async function ckShareSync(t){

  try{ const res=await ckSyncOnce(get,put,ckDocFromField(t)); ckBase.set(t,JSON.parse(JSON.stringify(res.doc)));
    let changed=false; const byId=new Map((t.field||[]).map(p=>[p.id,p]));

/* =====================================================================
   50/50 Drawing — per tournament (t.raffle). Built to be verifiable:
   · tickets are tournament + ticket number (numbers restart each tournament)
   · players are identified by name (email/phone were often the seller's); the board confirms
     look-alike names before the list is locked
   · locking computes a SHA-256 fingerprint of the full ticket list; the list can't change after
   · each draw uses crypto.getRandomValues with rejection sampling (every eligible ticket equally likely),
     is saved the instant it's drawn, and records the random value, the eligible count and the winning ticket
   · once someone wins, all of their tickets leave the drum; voids need a reason and stay in the log
   ===================================================================== */
TT.splice(TT.findIndex(x=>x[0]==='calcutta')+1,0,['raffle','50/50 Drawing']);
const rfKey=(f,l)=>(String(f||'').trim()+' '+String(l||'').trim()).toLowerCase().replace(/\s+/g,' ');
function rfData(t){ return t.raffle; }
/* tickets are stored compactly: [tournamentIdx, ticketNo, nameIdx, rowNo] */
const tkLabel=(tour,no)=>String(no).startsWith('M')?`${tour} · manual ticket, row ${String(no).slice(1)}`:`${tour} · ticket #${no}`;
function rfTickets(R){ return R.tickets.map(([ti,no,ni,row])=>({tour:R.tours[ti],no,first:R.names[ni][0],last:R.names[ni][1],row,key:rfPlayerKey(R,R.names[ni])})); }
function rfPlayerKey(R,[f,l]){ let k=rfKey(f,l); const seen=new Set(); while(R.merges&&R.merges[k]&&!seen.has(k)){ seen.add(k); k=R.merges[k]; } return k; }
function rfPlayerName(R,key){ const n=R.names.find(n=>rfKey(n[0],n[1])===key); return n?`${n[0]} ${n[1]}`:key; }
function rfCanon(R){ return rfTickets(R).map(x=>`${x.tour}|${x.no}|${x.first}|${x.last}|${x.row}`).sort().join('\n'); }
async function rfFingerprint(R){ const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(rfCanon(R)+'\n#merges:'+JSON.stringify(Object.entries(R.merges||{}).sort())));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('').toUpperCase(); }
const fpShort=fp=>fp?fp.slice(0,4)+' '+fp.slice(4,8)+' '+fp.slice(8,12)+' '+fp.slice(12,16):'';
/* look-alike names the board must rule on before locking */
function rfSuspects(R){
  const nick={chris:'christopher',mike:'michael',bob:'robert',dan:'daniel',jim:'james',tom:'thomas',matt:'matthew',ben:'benjamin',andy:'andrew',rick:'richard',bill:'william',jeff:'jeffrey',tim:'timothy',ken:'kenneth',nick:'nicholas',pete:'peter',steve:'stephen',greg:'gregory',tony:'anthony'};
  const fn=s=>nick[s.toLowerCase()]||s.toLowerCase();
  const lev=(a,b)=>{ const d=Array.from({length:a.length+1},(_,i)=>[i]); for(let j=1;j<=b.length;j++) d[0][j]=j; for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++) d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[a.length][b.length]; };
  const counts=new Map(); for(const [,,ni] of R.tickets){ const k=rfKey(...R.names[ni]); counts.set(k,(counts.get(k)||0)+1); }
  const ppl=[...new Map(R.names.map(n=>[rfKey(n[0],n[1]),n])).values()], out=[];
  for(let i=0;i<ppl.length;i++) for(let j=i+1;j<ppl.length;j++){ const [a1,b1]=ppl[i], [a2,b2]=ppl[j];
    const fsame=fn(a1)===fn(a2)||a1.toLowerCase().startsWith(a2.toLowerCase())||a2.toLowerCase().startsWith(a1.toLowerCase());
    const l1=b1.toLowerCase(), l2=b2.toLowerCase(), lclose=(l1.length>2&&l2.length>2&&lev(l1,l2)<=Math.max(1,Math.floor(Math.min(l1.length,l2.length)/5)))||((l1.length<=2||l2.length<=2)&&(l1.startsWith(l2.replace('.',''))||l2.startsWith(l1.replace('.',''))));
    if(fsame&&lclose&&rfKey(a1,b1)!==rfKey(a2,b2)){ const k1=rfKey(a1,b1), k2=rfKey(a2,b2), id=[k1,k2].sort().join('~');
      out.push({id,a:{key:k1,name:`${a1} ${b1}`,n:counts.get(k1)||0},b:{key:k2,name:`${a2} ${b2}`,n:counts.get(k2)||0},decided:(R.rulings||{})[id]}); } }
  return out;
}
function rfEligible(R){ const winners=new Set(R.draws.filter(d=>!d.void).map(d=>d.playerKey)); return rfTickets(R).filter(x=>!winners.has(x.key)).sort((a,b)=>(a.tour+'|'+String(a.no).padStart(6,'0')+'|'+a.row).localeCompare(b.tour+'|'+String(b.no).padStart(6,'0')+'|'+b.row)); }
/* unbiased secure pick: reject values that would favour low indexes */
function secureIndex(n){ const lim=Math.floor(0x100000000/n)*n, a=new Uint32Array(1); let r; do{ crypto.getRandomValues(a); r=a[0]; }while(r>=lim); return {r,index:r%n}; }
const rfMoney=v=>'$'+Math.round(+v||0).toLocaleString('en-US');

function rfImport(t){

  openDrawer({kicker:t.name+' · 50/50 Drawing',title:'Upload the ticket list',saveLabel:'Import tickets',
    body:`<p style="margin:0">Upload the “All tickets sold” export (CSV or Excel) with Tournament, Ticket #, First Name and Last Name columns. Email and phone are ignored — they were often the seller’s.</p>

/* ---------- payouts ----------
   Each team gets a finish (l.place) within its flight; equal numbers are ties. There is no tie-breaker:
   tied teams share the combined money for every place they cover (two tied for 1st split 1st + 2nd). */
const ordinal=n=>{ const s=['th','st','nd','rd'], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); };
function calcPayouts(c){
  const T=calcTotalsC(c), stakes=calcStakes(c), byLot=new Map(); stakes.forEach(s=>{ const a=byLot.get(s.lot.id)||[]; a.push(s); byLot.set(s.lot.id,a); });
  const cents=v=>Math.round(v*100)/100, flights=[], people=new Map();
  for(const f of T.byF){
    const ls=c.lots.filter(l=>flightName(l.flight)===f.flight), placed=ls.filter(l=>c0(l.place)>0).sort((a,b)=>c0(a.place)-c0(b.place));
    const money=c.payout.map(p=>Math.max(0,f.net)*c0(p)/100), rows=[]; let i=0;
    while(i<placed.length){ const grp=placed.filter(l=>c0(l.place)===c0(placed[i].place)), start=i, end=i+grp.length-1;
      const pot=money.slice(start,end+1).reduce((a,v)=>a+v,0), potC=Math.round(pot*100), base=Math.floor(potC/grp.length), extra=potC-base*grp.length;
      grp.sort((a,b)=>a.lot-b.lot);
      const label=(grp.length>1?'T':'')+ordinal(start+1);
      grp.forEach((l,gi)=>rows.push({lot:l,pos:start+1,label,tie:grp.length,covers:[start+1,Math.min(end+1,money.length)],amount:start<money.length?(base+(gi<extra?1:0))/100:0}));
      i+=grp.length; }
    const covered=new Set(); rows.forEach(r=>{ for(let p=r.pos;p<r.pos+r.tie;p++) covered.add(p); });
    const unplaced=money.map((m,k)=>({place:k+1,m})).filter(x=>x.m>0&&!covered.has(x.place)), allPlaced=ls.length>0&&ls.every(l=>c0(l.place)>0);
    flights.push({flight:f.flight,net:f.net,money,rows,unplaced,allPlaced,paid:cents(rows.reduce((a,r)=>a+r.amount,0)),teams:ls});
    for(const r of rows){ if(!(r.amount>0)) continue;
      const ss=byLot.get(r.lot.id)||[], teamC=Math.round(r.amount*100); let given=0;
      for(const [si,s] of ss.entries()){ const o=s.owner, k=o.key, amtC=si===ss.length-1?teamC-given:Math.round(teamC*s.pct/100); given+=amtC; const amt=amtC/100;
        if(!people.has(k)) people.set(k,{key:k,name:o.name,num:o.num||'',bidderId:o.bidderId||'',total:0,items:[]});
        const p=people.get(k); if(o.num&&!p.num){ p.num=o.num; p.bidderId=o.bidderId; }
        p.items.push({lot:r.lot,flight:f.flight,label:r.label,pct:s.pct,kind:s.kind,teamPays:r.amount,amount:amt}); p.total=cents(p.total+amt); } }
  }
  return {flights,people:[...people.values()].sort((a,b)=>b.total-a.total||a.name.localeCompare(b.name)),total:cents(flights.reduce((a,f)=>a+f.paid,0))};
}

function wirePayouts(el,t){
  const c=calc(t);
  el.querySelectorAll('[data-po]').forEach(s=>s.onchange=()=>{ const l=c.lots.find(x=>x.id===s.dataset.po); const v=parseInt(s.value,10); if(v>0) l.place=v; else delete l.place; persist(); render(); });
  el.querySelectorAll('[data-pox]').forEach(r=>r.onclick=e=>{ if(e.target.closest('select')) return; view.poOpen=view.poOpen||{}; view.poOpen[r.dataset.pox]=!view.poOpen[r.dataset.pox]; render(); });
  el.querySelectorAll('[data-pop]').forEach(s=>s.onchange=()=>{ c.paidOut=Object.assign({},c.paidOut||{}); const k=s.dataset.pop; if(s.value) c.paidOut[k]={paid:true,method:s.value,at:new Date().toISOString()}; else delete c.paidOut[k]; persist(); render(); });
  el.querySelectorAll('[data-cctab-go]').forEach(b=>b.onclick=()=>{ const tb=el.querySelector(`[data-cctab="${b.dataset.cctabGo}"]`); if(tb) tb.click(); });
  const cl=$('poClear'); if(cl) cl.onclick=()=>{ if(!confirm('Clear every finish in every flight?')) return; c.lots.forEach(l=>{ delete l.place; }); persist(); render(); };
  const px=$('poXlsx'); if(px) px.onclick=()=>exportPayoutsXLSX(t);
  const pp=$('poPdf'); if(pp) pp.onclick=()=>payoutsPDF(t,{amounts:true});
  const pn=$('poPdfNames'); if(pn) pn.onclick=()=>payoutsPDF(t,{amounts:false});

  try{ await loadJsPDF(); }catch(e){ toast(e.message); return; }

  [['ps400','PS-400.ttf','PublicSans','normal'],['ps700','PS-700.ttf','PublicSans','bold'],['ps800','PS-800.ttf','PublicSansXB','normal'],['cg700','CG-700.ttf','Cormorant','bold']].forEach(([k,f,fam,st])=>{ doc.addFileToVFS(f,PDF_FONTS[k]); doc.addFont(f,fam,st); });
  const NAVY=[15,42,56],GOLD=[199,161,58],GOLDL=[216,183,95],GOLDDK=[126,95,26],IVORY=[251,250,245],LINE=[225,217,198],INK=[20,34,43],MUTED=[86,98,106],POS=[31,107,74];
  const L=40,R2=572,W=612,H=792, font=(f,s,z,c)=>{ doc.setFont(f,s); doc.setFontSize(z); doc.setTextColor(...c); };
  const page=()=>{ doc.setFillColor(...IVORY); doc.rect(0,0,W,H,'F'); };
  const rounds=R.rounds, rl=r=>dayLabel(t,r.day).split(' · ')[0].slice(0,3)+(rounds.filter(x=>x.day===r.day).length>1?' '+(rounds.filter(x=>x.day===r.day).indexOf(r)+1):'');
  const cw=Math.min(62,Math.floor(170/Math.max(1,rounds.length))), nameW=R2-L-44-40-rounds.length*cw-66;
  page();
  font('PublicSans','normal',8.4,[214,218,220]); const sub=doc.splitTextToSize(`${dateRange(t)} · ${rounds.map(r=>`${dayLabel(t,r.day).split(' · ')[0]}: ${formatSummary(r)}`).join(' · ')} · ${R.unit==='strokes'?(t.resultsBasis||'net')+' to par':R.unit}${R.final?'':' · as of '+new Date().toLocaleString()}`,R2-L-90);
  const bandH=74+Math.max(0,sub.length-1)*11;
  doc.setFillColor(...GOLD); doc.roundedRect(L,32,R2-L,bandH+4,8,8,'F'); doc.setFillColor(...NAVY); doc.roundedRect(L,32,R2-L,bandH,8,8,'F'); doc.rect(L,32+bandH-12,R2-L,8,'F');
  if(crest) doc.addImage(crest,'PNG',L+16,42,54*914/1180,54);
  font('PublicSansXB','normal',6.8,GOLDL); doc.text(`${(orgName()||'').toUpperCase()} · ${t.season||''}`,L+76,56,{charSpace:1.2});
  font('Cormorant','bold',24,[255,255,255]); doc.text(`${t.name} — ${R.final?'Final Results':'Results'}`,L+76,80);
  font('PublicSans','normal',8.4,[214,218,220]); doc.text(sub,L+76,96);
  let y=32+bandH+26;
  const flights=[...new Set(R.list.map(u=>u.flight))].sort((a,b)=>(a||'~').localeCompare(b||'~'));
  const head=label=>{ if(y>H-80){ doc.addPage(); page(); y=48; } font('PublicSansXB','normal',7.4,GOLDDK); doc.text(label.toUpperCase(),L,y,{charSpace:1.1}); y+=6; doc.setDrawColor(...GOLD); doc.setLineWidth(1); doc.line(L,y,R2,y); y+=12;
    font('PublicSans','bold',7.6,MUTED); doc.text('POS',L,y); doc.text(R.list[0].isTeam?'TEAM':'PLAYER',L+30,y); let x=L+30+nameW; rounds.forEach(r=>{ doc.text(rl(r).toUpperCase(),x+cw-2,y,{align:'right'}); x+=cw; }); doc.text('TOTAL',R2-2,y,{align:'right'}); y+=10; };
  const row=(u,pos,i)=>{ if(y>H-40){ doc.addPage(); page(); y=48; head('continued'); }
    if(i%2===0){ doc.setFillColor(255,255,255); doc.rect(L-4,y-9,R2-L+8,15,'F'); }
    font('PublicSans','bold',9.4,pos.startsWith('1')&&!pos.startsWith('1'+'0')&&pos.replace('T','')==='1'?GOLDDK:INK); doc.text(pos,L,y);
    font('PublicSans',pos.replace('T','')==='1'?'bold':'normal',9.4,INK); doc.text(doc.splitTextToSize(u.name,nameW-6)[0],L+30,y);
    let x=L+30+nameW; font('PublicSans','normal',9,u.complete?INK:MUTED); rounds.forEach(r=>{ const c=u.rounds[r.id]; doc.text(c&&c.n?c.txt+(c.complete?'':'*'):'—',x+cw-2,y,{align:'right'}); x+=cw; });
    font('PublicSans','bold',10,R.unit==='strokes'&&u.total<0?POS:INK); doc.text(R.mixed?'—':u.totalTxt,R2-2,y,{align:'right'}); y+=15; };
  flights.forEach(f=>{ const us=R.list.filter(u=>u.flight===f); head(f?`Flight ${f}`:'Results'); us.forEach((u,i)=>row(u,f?u.flightPosTxt:u.posTxt,i)); y+=10; });
  if(flights.length>1){ head('Overall'); R.list.slice(0,Math.min(R.list.length,15)).forEach((u,i)=>row(u,u.posTxt,i)); y+=6; }
  font('PublicSans','normal',7.6,MUTED); doc.text(`${R.list.some(u=>!u.complete)?'* round not finished · ':''}Ties share a position. ${t.hcpDiff?`Partner handicap differential cap: ${t.hcpDiff} strokes. `:''}Generated by the ${orgShort()} hub, ${new Date().toLocaleString()}.`,L,H-28,{maxWidth:R2-L});
  if(opt.returnDoc) return doc;
  doc.save(`${slugify(t.name)}-results${R.final?'-final':''}.pdf`); toast('Results sheet downloaded');
}
/* Keeps every open device on the latest version: checks version.json about once a minute and, when a
   newer build is live, reloads at a safe moment (nothing unsaved, no editor open, not mid-typing). */
(function(){
  const ME='20261009165927'; let ready=false, lastCheck=0;
  const typing=()=>{ const a=document.activeElement; return a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.value&&a.type!=='search'; };
  const safe=()=>!typing()&&(typeof window.__canReload!=='function'||window.__canReload());
  async function check(){ lastCheck=Date.now(); if(location.protocol==='file:') return;
    try{ const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'}); if(!r.ok) return; const v=await r.json(); if(v&&v.build&&v.build!==ME) ready=true; }catch(_){} }
  setInterval(()=>{ if(ready){ if(safe()) location.reload(); } else if(Date.now()-lastCheck>60000) check(); },3000);
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') check(); });
  window.__build=ME;
})();

boot();
</script>
