      const cells=nines.map(([x,y])=>range(x,y).map(h=>{ const v=main(h); const scr=holeFormat(pub,h)==='scramble';
        if(v==null){ const tph=scr?scrambleTeamPH(pub,t.members):null, kk=tph==null?0:strokesOn(tph,hc(t.captain)[h-1]); return `<td>${kk>0?'<span class="wc-dot"></span>'.repeat(Math.min(kk,2)):''}</td>`; }
        const o=other(h); return `<td><span class="wc-s ${shape(v,T[h].par)}">${v}</span>${o!=null&&o!==v?`<span class="wc-n" title="${basisNet?'Gross':'Net'} ${o}">${o}</span>`:''}</td>`; }).join('')+`<td class="wc-tot">${sumH(main,x,y)}</td>`).join('');
      const gross=sumH(h=>T[h]?T[h].gross:null,1,18), net=sumH(h=>T[h]&&T[h].net!=null?T[h].net:null,1,18);

      return `<tr class="wc-t"><th>${opt.split?'Team':lab}${basisNet?' net':''}<small>${E(t.members.map(p=>p.name.split(' ').slice(-1)[0]).join(' & '))}</small></th>${cells}${endCols?`<td class="wc-tot">${basisNet?net:gross}</td><td class="wc-tot">${tph!=null?phTxt(tph):''}</td><td class="wc-tot wc-net">${net}</td>`:''}</tr>`; };
    const body=TEAM?teams.map(t=>t.members.map(pRow).join('')+tRow(t)).join(''):ps.map(pRow).join('');
    return `<div class="wc-wrap"><table>${fmtRow}${head}${tees}${hcpM}${parRow}${body}${hcpW}</table></div>`;
  }).join(opt.split?'<div style="height:8px"></div>':'');
  const status=pub.status==='final'?'<span class="wc-final">FINAL</span>':'';
  const key=`<div class="wc-key"><span><span class="wc-s b">3</span>Birdie</span><span><span class="wc-s e">2</span>Eagle</span><span><span class="wc-s o">5</span>Bogey</span><span><span class="wc-s d">6</span>Double+</span><span><em>3</em>Net where a stroke is given</span>${TEAM&&eventFormats(pub).some(f=>f!=='scramble')?`<span><i></i>Ball that counted</span>`:''}${eventFormats(pub).includes('scramble')?'<span><b class="wc-xk"></b>Team plays one ball (scramble)</span>':''}</div>`;
  return `<div class="wc" style="--wc-accent:${accent}"><div class="wc-top"><div><div class="nm">${E(c.name)}</div><small>Walnut Creek Country Club · Mansfield, Texas</small></div><div class="ev"><b>${E(pub.name)}</b>${E([pub.date?new Date(pub.date+'T12:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'',g.label,formatSummary(pub)].filter(Boolean).join(' · '))}<br>${status}</div></div>${tables}${key}<div class="wc-sign"><span>Scorer ________________</span><span>Attest ________________</span></div></div>`;
}

/* ---------- formats per nine + USGA handicap allowances ----------
   WHS Appendix C recommendations: individual stroke play 95%; four-ball stroke play 85%;
   2-player scramble 35% low / 15% high; 4-player scramble 25/20/15/10%. Shamble isn't in
   Appendix C — defaulted to 85% (it plays as four-ball after the drive); set it per event. */
const TEAM_FORMATS=['bestball','scramble','shamble'];
const USGA_ALLOW={stroke:95,bestball:85,shamble:85,scramble2:[35,15],scramble3:[30,20,10],scramble4:[25,20,15,10]};
FORMAT_LABEL.scramble='Scramble'; FORMAT_LABEL.shamble='Shamble'; FORMAT_LABEL.split='Split format';
function holeFormat(pub,h){ return pub.format==='split'?(h<=9?pub.front:pub.back):(pub.format||'stroke'); }
function eventFormats(pub){ return pub.format==='split'?[pub.front,pub.back]:[pub.format||'stroke']; }
function isTeamEvent(pub){ return eventFormats(pub).some(f=>TEAM_FORMATS.includes(f)); }
function formatSummary(pub){ return pub.format==='split'?`Front: ${FORMAT_LABEL[pub.front]} · Back: ${FORMAT_LABEL[pub.back]}`:(FORMAT_LABEL[pub.format]||'Stroke play'); }
function allowOf(pub){ return Object.assign({},USGA_ALLOW,pub.allow||{}); }
/* a player's playing handicap for a per-player format (stroke / best ball / shamble) */
function segPH(pub,p,fmt){ if(typeof p.ch!=='number') return typeof p.ph==='number'?p.ph:null; const a=allowOf(pub)[fmt==='stroke'?'stroke':fmt]; return whsRound(p.ch*(+a||100)/100); }
/* a scramble team's handicap: course handicaps low→high, weighted by the scramble percentages */
function scrambleTeamPH(pub,members){ const chs=members.map(p=>p.ch).filter(v=>typeof v==='number').sort((a,b)=>a-b); if(chs.length!==members.length||!chs.length) return null;
  const A=allowOf(pub), pct=A['scramble'+chs.length]||A.scramble4.slice(0,chs.length); return whsRound(chs.reduce((t,ch,i)=>t+ch*(+pct[i]||0)/100,0)); }
/* teams in playing order; the first player listed carries the team's score on scramble holes */
function groupTeams(g){ const m=new Map(); for(const p of g.players||[]){ const k=teamKey(p); if(!m.has(k)) m.set(k,[]); m.get(k).push(p); } return [...m.entries()].map(([k,ms])=>({key:k,members:ms,captain:ms[0]})); }
/* one team's result on one hole: {gross, net, par, by} (by = player whose ball counted, if any) */
function teamHole(pub,c,t,h,scores){
  const fmt=holeFormat(pub,h), hcpOf=p=>(c.hcp[p.set||'M']||c.hcp.M)[h-1], parOf=p=>(c.par[p.set||'M']||c.par.M)[h-1];
  if(fmt==='scramble'){ const s=+((scores[t.captain.id]||{})[h]); if(!s) return null; const tph=scrambleTeamPH(pub,t.members);
    return {gross:s,net:tph==null?null:s-strokesOn(tph,hcpOf(t.captain)),par:parOf(t.captain),by:null,fmt}; }
  let best=null; for(const p of t.members){ const s=+((scores[p.id]||{})[h]); if(!s) continue; const ph=segPH(pub,p,fmt), k=ph==null?0:strokesOn(ph,hcpOf(p)), par=parOf(p);
    const cand={gross:s,net:ph==null?null:s-k,par,by:p.id,fmt}; const key=pub.scoring==='net'&&cand.net!=null?cand.net-par:s-par;
    if(!best||key<best.key) best=Object.assign(cand,{key}); }
  return best;
}
function teamBoard(pub,scores,opt){
  opt=opt||{}; const rows=[];
  for(const g of pub.groups||[]){ const c=pub.courses[g.course]; if(!c) continue;
    for(const t of groupTeams(g)){ let n=0,gross=0,toPar=0,net=0,netToPar=0,netOK=true;
      for(let h=1;h<=18;h++){ const r=teamHole(pub,c,t,h,scores); if(!r) continue; n++; gross+=r.gross; toPar+=r.gross-r.par; if(r.net==null) netOK=false; else { net+=r.net; netToPar+=r.net-r.par; } }
      const fl=[...new Set(t.members.map(p=>p.flight).filter(Boolean))];
      rows.push({id:t.key,name:t.members.map(p=>p.name).join(' / '),members:t.members.map(p=>p.id),group:g.label||'',groupId:g.id,course:g.course,courseName:c.name,
        n,gross,toPar,thru:n===18?'F':String(n),net:netOK?net:null,netToPar:netOK?netToPar:null,flight:fl.join('/'),team:true}); } }
  const byNet=opt.sort==='net', key=r=>byNet?(r.netToPar==null?9999:r.netToPar):r.toPar;
  const pool=opt.flight?rows.filter(r=>r.flight===opt.flight):rows;
  const played=pool.filter(r=>r.n>0).sort((a,b)=>key(a)-key(b)||b.n-a.n||a.gross-b.gross||a.name.localeCompare(b.name)), idle=pool.filter(r=>!r.n).sort((a,b)=>a.name.localeCompare(b.name));
  let pos=0,prev=null; played.forEach((r,i)=>{ const k=key(r); if(prev===null||k!==prev){ pos=i+1; prev=k; } r.pos=pos; });
  played.forEach(r=>{ r.posTxt=(played.filter(x=>x.pos===r.pos).length>1?'T':'')+r.pos; }); idle.forEach(r=>{ r.posTxt='—'; });
  return played.concat(idle);
}
/* team events rank teams (players view only makes sense without scramble holes) */
function eventBoard(pub,scores,opt){ opt=opt||{}; const noPlayers=eventFormats(pub).includes('scramble');
  return isTeamEvent(pub)&&(opt.view!=='players'||noPlayers)?teamBoard(pub,scores,opt):leaderboard(pub,scores,opt); }
function bestBallBoard(pub,scores,opt){ return teamBoard(pub,scores,opt); }

/* =====================================================================
   MGA Hub — Golf: courses, live-scoring events, groups with custom IDs,
   share link for the public scoring page, and live leaderboards.
   Event setup lives in the hub's data; when an event is saved it's published
   to golf_events (public info + group IDs). Scores live in golf_scores.
   ===================================================================== */
I.golf=svg('<path d="M12 21V3l7 3.5-7 3.5"/><ellipse cx="12" cy="21" rx="6" ry="1.5"/>');
NAV.splice(2,0,['golf','Golf',I.golf]);
view.gtab='events'; view.geid=null; view.getab='groups'; view.gcourse='oak';

/* ---------- data ---------- */
function golfData(){
  if(!db.golf) db.golf={courses:clone(WCCC_COURSES),events:[],localScores:{}};
  const g=db.golf; g.courses=g.courses&&g.courses.length?g.courses:clone(WCCC_COURSES); g.events=g.events||[]; g.localScores=g.localScores||{};
  if((g.ratingsVersion||0)<RATINGS_VERSION){ for(const c of g.courses){ const seed=WCCC_COURSES.find(x=>x.id===c.id); if(!seed) continue;
      c.tees=seed.tees.map(st=>{ const old=c.tees.find(t=>t.name===st.name); return Object.assign({},clone(st),old&&old.yards&&!st.yards?{yards:old.yards}:{}); }); }
    g.ratingsVersion=RATINGS_VERSION; }
  for(const c of g.courses) for(const t of c.tees) if(!t.rating) t.rating={};
  for(const e of g.events){ migrateAllow(e); if(!e.scoring) e.scoring='gross'; if(!e.format) e.format='stroke'; e.flights=e.flights||{count:0,names:[]}; e.pool=e.pool||[]; }
  return g;
}
const courseById=id=>golfData().courses.find(c=>c.id===id);
/* formats + allowances per event (USGA defaults; an older single allowance carries over to its format) */
function migrateAllow(e){ if(!e.allow){ e.allow=clone(USGA_ALLOW); if(e.allowance!=null&&e.allowance!==100&&(e.format==='stroke'||e.format==='bestball')) e.allow[e.format]=+e.allowance; }
  e.allow=Object.assign(clone(USGA_ALLOW),e.allow); if(!e.front) e.front='scramble'; if(!e.back) e.back='shamble'; }
const evFormats=ev=>ev.format==='split'?[ev.front,ev.back]:[ev.format||'stroke'];
const evTeam=ev=>evFormats(ev).some(f=>TEAM_FORMATS.includes(f));
const evPlayerFmt=ev=>evFormats(ev).find(f=>f!=='scramble')||'stroke';
const evSummary=ev=>ev.format==='split'?`Front ${FORMAT_LABEL[ev.front]} · Back ${FORMAT_LABEL[ev.back]}`:(FORMAT_LABEL[ev.format]||'Stroke play');
const GEV=()=>golfData().events.find(e=>e.id===view.geid);
const CODE_CHARS='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function newCode(ev){ let c; do{ c=Array.from({length:5},()=>CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)]).join(''); }while(ev.groups.some(g=>g.code===c)); return c; }
const slugify=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'event';
function scoringLink(ev){ const base=location.href.split('#')[0].split('?')[0].replace(/[^/]*$/,''); return base+'score.html?e='+encodeURIComponent(ev.slug); }
function playerIndex(p){ const own=p.index!=null&&String(p.index).trim()!==''?p.index:null; const m=p.memberId?memberById(p.memberId):null; return parseIndex(own!=null?own:(m?m.hcp:null)); }
function playerHcp(ev,grp,p){ const c=courseById(grp.course); const idx=playerIndex(p); const ch=c?courseHcp(idx,c,p.tee||ev.defaultTee||'White',p.set||'M'):null;
  const A=Object.assign({},USGA_ALLOW,ev.allow||{}), pct=+A[evPlayerFmt(ev)]||100;
  return {idx,ch,ph:ch==null?null:whsRound(ch*pct/100),missing:idx==null?'index':ch==null?'rating':''}; }
/* every player in the event: in a group, or on the roster waiting for one */
function evPlayers(ev){ return ev.groups.flatMap(grp=>grp.players.map(p=>({p,grp}))).concat((ev.pool||[]).map(p=>({p,grp:null}))); }
function courseFor(ev,p,grp){ if(grp) return grp.course; const F=ev.flights||{}; return (F.courseOf&&F.courseOf[p.flight])||(F.courses&&F.courses!=='split'?F.courses:'')||ev.defaultCourse||'oak'; }
const hcpOf=(ev,p,grp)=>playerHcp(ev,{course:courseFor(ev,p,grp)},p);
function publicEvent(ev){
  const courses={}; const tt=db.tournaments.find(x=>x.id===ev.tournamentId); const ftm=new Map(tt?tt.field.map(p=>[p.memberId,'T'+(p.team||0)]):[]);
  for(const g of ev.groups){ if(!courses[g.course]){ const c=courseById(g.course); if(c) courses[g.course]={name:c.name,par:c.par,hcp:c.hcp,tees:Object.fromEntries(c.tees.map(t=>[t.name,t.yards||null]))}; } }
  return {slug:ev.slug,name:ev.name,date:ev.date,status:ev.status,club:'Walnut Creek Country Club',courses,
    groups:ev.groups.map(g=>({id:g.id,label:g.label||'',course:g.course,startHole:+g.startHole||1,teeTime:g.teeTime||'',players:g.players.map(p=>{ const h=playerHcp(ev,g,p); return {id:p.id,name:p.name,tee:p.tee||ev.defaultTee||'White',set:p.set||'M',ch:h.ch,ph:h.ph,flight:p.flight||'',team:evTeam(ev)?(p.team||ftm.get(p.memberId)||''):''}; })})),
    format:ev.format||'stroke',front:ev.front,back:ev.back,allow:Object.assign({},USGA_ALLOW,ev.allow||{}),scoring:ev.scoring||'gross',flights:(ev.flights&&ev.flights.names)||[]};
}

/* ---------- publishing + scores ---------- */
const golfScores={}; let golfSub=null;
async function publishEvent(ev){
  if(!CLOUD||!sessionOK) return;
  const codes=Object.fromEntries(ev.groups.map(g=>[String(g.code).toUpperCase(),g.id]));
  const {error}=await sb.from('golf_events').upsert({id:ev.id,slug:ev.slug.toLowerCase(),public:publicEvent(ev),codes,updated_at:new Date().toISOString()});
  if(error) toast(/duplicate|unique/i.test(error.message)?'That link is already used by another event — pick a different one':/relation|does not exist/i.test(error.message)?'Run golf-setup.sql in Supabase to turn on live scoring':'Couldn’t publish the event: '+error.message);
}
function golfSave(ev){ persist(); publishEvent(ev); }
function scoresFor(ev){ return CLOUD&&sessionOK?(golfScores[ev.id]||{}):(golfData().localScores[ev.id]||{}); }
async function loadScores(ev){
  if(!CLOUD||!sessionOK) return;
  const {data,error}=await sb.from('golf_scores').select('player_id,hole,strokes').eq('event_id',ev.id);
  if(error) return;
  const m={}; for(const r of data||[]) (m[r.player_id]=m[r.player_id]||{})[r.hole]=r.strokes; golfScores[ev.id]=m;
  if(!golfSub){ golfSub=sb.channel('golf-scores').on('postgres_changes',{event:'*',schema:'public',table:'golf_scores'},p=>{
      const r=p.new&&p.new.event_id?p.new:p.old; if(!r||!golfScores[r.event_id]) return;
      const m2=golfScores[r.event_id]; if(p.eventType==='DELETE'){ if(m2[r.player_id]) delete m2[r.player_id][r.hole]; } else (m2[r.player_id]=m2[r.player_id]||{})[r.hole]=r.strokes;
      if(!drawerOpen()&&['golf','dash'].includes(view.page)) render(); }).subscribe(); }
  if(!drawerOpen()) render();
}
async function setScore(ev,pid,hole,strokes){
  if(CLOUD&&sessionOK){
    const q=strokes?sb.from('golf_scores').upsert({event_id:ev.id,player_id:pid,hole,strokes,updated_at:new Date().toISOString()}):sb.from('golf_scores').delete().eq('event_id',ev.id).eq('player_id',pid).eq('hole',hole);
    const {error}=await q; if(error){ toast('Couldn’t save score: '+error.message); return false; }
    const m=(golfScores[ev.id]=golfScores[ev.id]||{}); m[pid]=m[pid]||{}; if(strokes) m[pid][hole]=strokes; else delete m[pid][hole]; return true;
  }
  const L=golfData().localScores, m=(L[ev.id]=L[ev.id]||{}); m[pid]=m[pid]||{}; if(strokes) m[pid][hole]=strokes; else delete m[pid][hole]; persist(); return true;
}
const liveEvents=()=>golfData().events.filter(e=>e.status==='live');

/* Courses: scorecards */

   <div class="tw"><table class="scard num"><thead><tr><th scope="col">Hole</th>${[1,2,3,4,5,6,7,8,9].map(h=>`<th scope="col">${h}</th>`).join('')}<th scope="col" class="st">Out</th>${[10,11,12,13,14,15,16,17,18].map(h=>`<th scope="col">${h}</th>`).join('')}<th scope="col" class="st">In</th><th scope="col" class="st">Tot</th></tr></thead><tbody>
   ${c.tees.map(t=>t.yards?rowH(t.name,t.yards,'tee tee-'+t.name.toLowerCase().replace('/','-')):`<tr class="tee"><th scope="row">${esc(t.name)}</th>${'<td class="muted">·</td>'.repeat(9)}<td class="st">${t.total?t.total[0]:''}</td>${'<td class="muted">·</td>'.repeat(9)}<td class="st">${t.total?t.total[1]:''}</td><td class="st">${t.total?G_SUM(t.total):''}</td></tr>`).join('')}
   ${rowH('Par',c.par.M,'par')}${rowH('Men’s hcp',c.hcp.M,'hcp',false)}${rowH('Women’s par',c.par.W,'par2')}${rowH('Women’s hcp',c.hcp.W,'hcp',false)}
   </tbody></table></div></div>

   <div class="tw"><table class="scard num" style="min-width:560px"><thead><tr><th scope="col">Tee</th><th scope="col">Men · rating</th><th scope="col">Men · slope</th><th scope="col">Women · rating</th><th scope="col">Women · slope</th></tr></thead><tbody>
   ${c.tees.map((t,ti)=>`<tr class="tee tee-${t.name.toLowerCase()}"><th scope="row">${esc(t.name)}</th>${['M','W'].map(s=>`<td><input class="inp r" style="height:34px;width:84px" inputmode="decimal" data-cr="${ti}|${s}|cr" value="${(t.rating&&t.rating[s]&&t.rating[s].cr)||''}" aria-label="${t.name} ${s==='M'?'men':'women'} course rating"></td><td><input class="inp r" style="height:34px;width:70px" inputmode="numeric" data-cr="${ti}|${s}|slope" value="${(t.rating&&t.rating[s]&&t.rating[s].slope)||''}" aria-label="${t.name} ${s==='M'?'men':'women'} slope"></td>`).join('')}</tr>`).join('')}
   </tbody></table></div></div>
`;
  $('crSave').onclick=()=>{ let bad=0; el.querySelectorAll('[data-cr]').forEach(i=>{ const [ti,s,k]=i.dataset.cr.split('|'); const t=c.tees[+ti]; t.rating=t.rating||{}; t.rating[s]=t.rating[s]||{};
      const v=i.value.trim(); if(!v){ delete t.rating[s][k]; return; } const n=parseFloat(v); if(!isFinite(n)||(k==='slope'&&(n<55||n>155))||(k==='cr'&&(n<50||n>85))){ bad++; return; } t.rating[s][k]=n; });
    if(bad){ toast(bad+' value'+(bad>1?'s look':' looks')+' off — slope is 55–155, rating 50–85'); return; }
    persist(); golfData().events.forEach(e=>{ if(e.groups.some(gr=>gr.course===c.id)) publishEvent(e); }); toast('Ratings saved'); render(); };

/* Event editor */

function flightUnits(ev,basis,unit,courseOf){
  const t=db.tournaments.find(x=>x.id===ev.tournamentId);
  const teamOf=new Map(t?t.field.map(p=>[p.memberId,p.team||0]):[]);
  const all=[]; for(const {p,grp} of evPlayers(ev)){ const h=playerHcp(ev,{course:(courseOf&&courseOf(p))||courseFor(ev,p,grp)},p); all.push({p,grp,h,val:basis==='index'?h.idx:h.ch}); }
  if(unit==='team'&&(t||evTeam(ev))){ const m=new Map();
    for(const x of all){ const k=x.p.team?'e'+x.p.team:teamOf.has(x.p.memberId)?'t'+teamOf.get(x.p.memberId):'p'+x.p.id; (m.get(k)||m.set(k,[]).get(k)).push(x); }
    return [...m.values()].map(ms=>({members:ms,val:ms.some(x=>x.val==null)?null:ms.reduce((a,x)=>a+x.val,0),label:ms.map(x=>x.p.name).join(' / ')})); }
  return all.map(x=>({members:[x],val:x.val,label:x.p.name}));
}
/* per = units per group (2 teams in a foursome, or 4 players). Flights are sized in whole groups so no
   group mixes flights; group counts differ by at most one, and any leftover units go to the last flight. */
function planFlights(ev,count,basis,unit,per,courseOf){
  per=Math.max(1,per||1);
  const units=flightUnits(ev,basis,unit,courseOf), missing=units.filter(u=>u.val==null);
  const ok=units.filter(u=>u.val!=null).sort((a,b)=>a.val-b.val||a.label.localeCompare(b.label));
  const n=ok.length, G=Math.floor(n/per), left=n%per, k=Math.max(1,Math.min(count,Math.max(1,G))), base=Math.floor(G/k), extra=G%k, flights=[]; let i=0;
  for(let f=0;f<k;f++){ const size=(base+(f<extra?1:0))*per+(f===k-1?left:0); flights.push({name:FLIGHT_NAMES[f],units:ok.slice(i,i+size)}); i+=size; }
  // boundary ties: same handicap on both sides of a split
  const ties=[]; for(let f=0;f<flights.length-1;f++){ const a=flights[f].units, b=flights[f+1].units; if(a.length&&b.length&&a[a.length-1].val===b[0].val) ties.push(`${flights[f].name}/${flights[f+1].name} split at ${fmtH(a[a.length-1].val,basis)}`); }
  return {flights,missing,ties};
}
/* each flight: which course, and shotgun or tee times (first time + gap, off hole 1 or 10) */
function flightPlan(ev){ const F=ev.flights||{}; F.plan=F.plan||{};
  (F.names||[]).forEach(n=>{ const p=F.plan[n]=F.plan[n]||{}; if(!p.course) p.course=(F.courseOf&&F.courseOf[n])||'oak'; if(!p.start) p.start='shotgun'; if(!p.first) p.first='08:30'; if(p.gap==null) p.gap=8; if(!p.hole) p.hole=1; });
  F.courseOf=Object.fromEntries((F.names||[]).map(n=>[n,F.plan[n].course])); return F.plan; }
const fmtTime=t=>{ const [h,m]=String(t||'').split(':').map(Number); if(!isFinite(h)) return t||''; const ap=h>=12?'PM':'AM'; return ((h%12)||12)+':'+String(m||0).padStart(2,'0')+' '+ap; };
const addMin=(t,min)=>{ const [h,m]=String(t).split(':').map(Number); const x=(h*60+(m||0)+min)%1440; return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0'); };
function buildFlightGroups(ev,plan,per,mode,start,startOf){
  const groups=[];
  plan.flights.forEach(f=>{ for(let i=0;i<f.units.length;i+=per){ const us=f.units.slice(i,i+per);
    groups.push({flight:f.name,units:us,sum:us.reduce((a,u)=>a+u.val,0)}); } });
  // courses: whole flights go to one course, filling Oak first up to half the groups
  const byFlight=plan.flights.map(f=>({name:f.name,n:groups.filter(x=>x.flight===f.name).length}));
  const courseOf={}; if(mode&&typeof mode==='object'){ byFlight.forEach(f=>{ courseOf[f.name]=mode[f.name]||'oak'; }); } else if(mode==='split'){ const half=groups.length/2; let acc=0; byFlight.forEach(f=>{ courseOf[f.name]=acc<half&&(acc+f.n<=half+f.n/2)?'oak':'pecan'; if(courseOf[f.name]==='oak') acc+=f.n; }); }
  else byFlight.forEach(f=>{ courseOf[f.name]=mode; });
  const out=[];
  // tee-time flights: groups off the tee in order of combined handicap
  if(startOf) for(const f of plan.flights){ const sp=startOf[f.name]; if(!sp||sp.start!=='tee') continue;
    groups.filter(x=>x.flight===f.name).sort((a,b)=>a.sum-b.sum).forEach((x,i)=>{ const cid=courseOf[f.name], tt=addMin(sp.first||'08:30',i*(+sp.gap||8));
      out.push({id:uid(),code:newCode({groups:out}),course:cid,startHole:+sp.hole||1,teeTime:tt,flight:x.flight,label:`${cid==='oak'?'Oak':'Pecan'} ${fmtTime(tt)} · Flight ${x.flight}`,
        players:x.units.flatMap(u=>u.members.map(m=>({...m.p,flight:x.flight})))}); }); }
  for(const cid of ['oak','pecan']){
    const gs=groups.filter(x=>courseOf[x.flight]===cid&&!(startOf&&startOf[x.flight]&&startOf[x.flight].start==='tee')).sort((a,b)=>a.sum-b.sum);
    const c=courseById(cid); const par5=c?c.par.M.map((p,i)=>p>=5?i+1:0).filter(Boolean):[];
    gs.forEach((x,i)=>{ let hole=1, tag='';
      const st=startOf&&startOf[x.flight]?'shotgun':start;
      if(st==='shotgun'){ if(i<18) hole=i+1; else { const j=i-18; hole=par5.length?par5[j%par5.length]:(j%18)+1; tag=' B'; } }
      out.push({id:uid(),code:newCode({groups:out}),course:cid,startHole:hole,flight:x.flight,
        label:`${cid==='oak'?'Oak':'Pecan'} ${st==='shotgun'?hole+tag:'#'+(i+1)} · Flight ${x.flight}`,
        players:x.units.flatMap(u=>u.members.map(m=>({...m.p,flight:x.flight})))}); });
  }
  out.courseOf=courseOf; return out;
}
const fmtH=(v,basis)=>v==null?'—':basis==='index'?idxTxt(Math.round(v*10)/10):(v<0?'+'+Math.abs(v):String(v));

/* ============ Step 1 · Field ============ */

    ${rows.map(({p,grp})=>{ const h=hcpOf(ev,p,grp); return `<div class="tr num click" data-fp="${p.id}" style="${cols}"><div class="cell2"><b class="trunc">${esc(p.name)}</b>${p.memberId?'':'<small>Guest</small>'}</div><span class="muted">${p.team?'Team '+(/^T\d+$/.test(p.team)?p.team.slice(1):teamN.get(p.team)):'—'}</span><span class="r">${h.idx==null?'<span class="neg">—</span>':idxTxt(h.idx)}</span><span class="r">${fmtH(h.ch,'course')}</span><span class="muted">${esc(p.tee||ev.defaultTee)}</span><span>${p.flight?`<span class="chip gold">${esc(p.flight)}</span>`:'<span class="muted">—</span>'}</span><span class="muted">${grp?esc(grp.code):'—'}</span><span class="ib">${I.edit}</span></div>`; }).join('')}</div></div>`
    :`<div class="empty"><b>No players yet</b><span>${t?`Import the ${esc(t.name)} field — teams and handicaps come with it.`:'Add players, or link a tournament to import its field.'}</span></div>`}</div>
  ${all.length?`<div style="display:flex;justify-content:flex-end"><button class="btn" id="gfNext">Next: set flights ${I.chev}</button></div>`:''}`;
  const imp=$('gfImp'); if(imp) imp.onclick=()=>importFieldToEvent(ev,t);

  const nx=$('gfNext'); if(nx) nx.onclick=()=>{ view.getab='flights'; render(); };
  el.querySelectorAll('[data-fp]').forEach(r=>r.onclick=()=>editFieldPlayer(ev,all.find(x=>x.p.id===r.dataset.fp)));

function importFieldToEvent(ev,t){
  const inEv=new Map(evPlayers(ev).filter(x=>x.p.memberId).map(x=>[x.p.memberId,x]));
  const fieldIds=new Set(t.field.map(p=>p.memberId));
  const add=t.field.filter(p=>!inEv.has(p.memberId));
  const gone=evPlayers(ev).filter(x=>x.p.memberId&&!fieldIds.has(x.p.memberId));
  const teamChange=t.field.filter(p=>inEv.has(p.memberId)&&inEv.get(p.memberId).p.team!=='T'+(p.team||0)).length;
  openDrawer({kicker:ev.name+' · Field',title:'Import field',saveLabel:add.length||gone.length||teamChange?'Import':'Close',
    body:`<div class="grid g3" style="gap:10px">${[['In '+t.name,t.field.length],['New to this event',add.length],['Already here',t.field.length-add.length]].map(([l,v])=>`<div class="card pad kpi" style="padding:14px"><span class="lbl">${esc(l)}</span><span class="v num" style="font-size:30px">${v}</span></div>`).join('')}</div>
      <p class="hint">Players come in with their ${esc(t.name)} team and the Handicap Index on their member profile, on the ${esc(ev.defaultTee||'White')} tees (change any player afterward).${teamChange?` ${teamChange} player${teamChange===1?'’s':'s’'} team changed and will be updated.`:''}</p>
      ${gone.length?`<label class="check" style="align-items:flex-start"><input type="checkbox" id="ifRm" checked><span>Remove the ${gone.length} player${gone.length===1?'':'s'} no longer in the ${esc(t.name)} field <span class="muted">(${esc(gone.slice(0,5).map(x=>x.p.name).join(', '))}${gone.length>5?'…':''})</span></span></label>`:''}
      ${ev.flights.count&&add.length?'<div class="banner">Flights are already set. New players come in without a flight — re-run flights afterward.</div>':''}`,
    save:()=>{ if(!add.length&&!gone.length&&!teamChange) return;
      add.forEach(fp=>{ const m=memberById(fp.memberId); ev.pool.push({id:uid(),memberId:fp.memberId,name:m?memberName(m):'Player',tee:ev.defaultTee||'White',set:'M',team:'T'+(fp.team||0),index:'',flight:''}); });
      t.field.forEach(fp=>{ const x=inEv.get(fp.memberId); if(x) x.p.team='T'+(fp.team||0); });
      if(gone.length&&$('ifRm').checked){ const rm=new Set(gone.map(x=>x.p.id)); ev.pool=ev.pool.filter(p=>!rm.has(p.id)); ev.groups.forEach(grp=>{ grp.players=grp.players.filter(p=>!rm.has(p.id)); }); }
      golfSave(ev); toast(`${add.length} player${add.length===1?'':'s'} imported`); }});
}

      ${f.ps.sort((a,b)=>(val(a)??99)-(val(b)??99)).map(x=>`<div class="tr num" style="grid-template-columns:minmax(0,1fr) 44px 58px;min-height:40px;font-size:13px"><span class="trunc">${esc(x.p.name)}</span><span class="r muted">${fmtH(val(x),F.basis)}</span><select class="inp" data-mv="${x.p.id}" aria-label="Move ${esc(x.p.name)}" style="height:30px;padding:0 4px;font-size:12px">${F.names.map(n=>`<option${n===f.n?' selected':''}>${n}</option>`).join('')}</select></div>`).join('')}</div>`; }).join('')}</div>
   ${withH.some(x=>!x.p.flight)?`<p class="hint">${withH.filter(x=>!x.p.flight).length} players aren’t in a flight (no handicap). Add their index and re-flight.</p>`:''}
   <div style="display:flex;justify-content:flex-end"><button class="btn pri" id="flNext">Next: build groups from flights ${I.chev}</button></div>`:''}`;
  $('flGo').onclick=()=>{ const n=parseInt(fv('flN'),10); if(!(n>=1&&n<=10)){ toast('Enter 1–10 flights'); return; }
    const basis=fv('flB'), unit=teams?fv('flU'):'player', gsize=+fv('flG')||4, cmode=fv('flC');
    const us0=flightUnits(ev,basis,unit), sz={}; us0.forEach(u=>sz[u.members.length]=(sz[u.members.length]||0)+1); const tsz=+Object.entries(sz).sort((a,b)=>b[1]-a[1])[0]?.[0]||1;
    const per=Math.max(1,Math.round(gsize/tsz));
    let plan=planFlights(ev,n,basis,unit,per,p=>cmode==='split'?'':cmode), groups=buildFlightGroups(ev,plan,per,cmode,'shotgun');
    if(basis==='course'){ for(let pass=0;pass<3;pass++){ const cmap=new Map(groups.flatMap(x=>x.players.map(p=>[p.id,x.course])));
      const next=planFlights(ev,n,basis,unit,per,p=>cmap.get(p.id)); const ng=buildFlightGroups(ev,next,per,cmode,'shotgun');
      const same=ng.every(x=>x.players.every(p=>cmap.get(p.id)===x.course)); plan=next; groups=ng; if(same) break; } }
    const courseOf=groups.courseOf;
    const flat=plan.flights.map(f=>`<div class="mr num" style="grid-template-columns:70px minmax(0,1fr) 110px"><b>Flight ${f.name}</b><div class="cell2"><span>${f.units.length} ${unit==='team'?'teams':'players'} · ${f.units.reduce((a,u)=>a+u.members.length,0)} players</span><small>${Math.ceil(f.units.length/per)} group${Math.ceil(f.units.length/per)===1?'':'s'} · ${courseById(courseOf[f.name])?.name||''}</small></div><span class="r muted">${fmtH(f.units[0]?.val,basis)} – ${fmtH(f.units[f.units.length-1]?.val,basis)}</span></div>`).join('');
    openDrawer({kicker:ev.name+' · Flights',title:`${plan.flights.length} flights`,saveLabel:'Set flights',
      body:`<p style="margin:0">Filled by ${basis==='index'?'Handicap Index':'course handicap'}${unit==='team'?', teams kept together (combined handicap)':''}, lowest in Flight A.</p><div class="mini">${flat}</div>
        ${plan.ties.length?`<div class="banner">Tied handicaps sit on both sides of a split: ${esc(plan.ties.join('; '))}. Broken alphabetically — move anyone by hand after.</div>`:''}
        ${plan.missing.length?`<div class="banner">${plan.missing.length} ${unit==='team'?'team':'player'}${plan.missing.length===1?'':'s'} without a handicap won’t be flighted: ${esc(plan.missing.slice(0,6).map(u=>u.label).join(', '))}${plan.missing.length>6?'…':''}.</div>`:''}
        ${ev.groups.length?'<p class="hint">Flights don’t move anyone between groups — build groups from flights on the next step.</p>':''}`,
      save:()=>{ evPlayers(ev).forEach(({p})=>{ p.flight=''; }); plan.flights.forEach(f=>f.units.forEach(u=>u.members.forEach(x=>{ x.p.flight=f.name; })));
        const old=(ev.flights&&ev.flights.plan)||{};
        ev.flights={count:plan.flights.length,names:plan.flights.map(f=>f.name),basis,unit,groupSize:gsize,perGroup:per,courses:cmode,courseOf,at:new Date().toISOString(),
          plan:Object.fromEntries(plan.flights.map(f=>[f.name,Object.assign({start:'shotgun',first:'08:30',gap:8,hole:1},old[f.name]||{},{course:courseOf[f.name]})]))};
        if(ev.scoring!=='net'&&confirm('Rank the leaderboard by net score? (Flighted events usually do.)')) ev.scoring='net';
        golfSave(ev); toast(`${plan.flights.length} flights set`); }}); };
  const clr=$('flClear'); if(clr) clr.onclick=()=>{ if(!confirm('Remove all flights?')) return; evPlayers(ev).forEach(({p})=>{ p.flight=''; }); ev.flights={count:0,names:[]}; golfSave(ev); render(); };
  const nx=$('flNext'); if(nx) nx.onclick=()=>{ view.getab='groups'; render(); buildGroupsFromFlights(ev); };
  el.querySelectorAll('[data-fp]').forEach(inp=>inp.onchange=()=>{ const [n,k]=inp.dataset.fp.split('|'); const P=flightPlan(ev);
    let v=inp.value; if(k==='gap'){ v=Math.max(1,Math.min(30,parseInt(v,10)||8)); } if(k==='hole') v=+v; P[n][k]=v; flightPlan(ev); golfSave(ev); render(); });
  el.querySelectorAll('[data-mv]').forEach(s=>s.onchange=()=>{ const x=all.find(y=>y.p.id===s.dataset.mv); const mates=F.unit==='team'&&x.p.team?all.filter(y=>y.p.team===x.p.team):[x];
    mates.forEach(y=>{ y.p.flight=s.value; }); golfSave(ev); render(); if(mates.length>1) toast(mates.map(y=>y.p.name).join(' & ')+' moved to Flight '+s.value); });
}

/* ============ Step 3 · Groups ============ */
function gGroups(el,ev){
  const cols='grid-template-columns:100px minmax(0,1.1fr) 110px 70px minmax(0,2fr) 40px';
  const F=ev.flights||{}, pool=ev.pool||[];
  el.innerHTML=`<div class="toolbar"><div class="actions">${F.count?`<button class="btn pri" id="ggFl">Build groups from flights</button>`:`<button class="btn pri" id="ggFld"${evPlayers(ev).length?'':' disabled'}>Build groups from field</button>`}<button class="btn" id="ggAdd">${I.plus}Add group</button>${ev.groups.length?`<button class="btn" id="ggPrint">Print scorecards</button>`:''}</div><span class="muted" style="margin-left:auto;font-size:13px">Each group gets its own group ID. Players enter it on the scoring page.</span></div>
  ${pool.length?`<div class="banner">${pool.length} player${pool.length===1?' isn’t':'s aren’t'} in a group yet. ${F.count?'Build groups from flights':'Build groups from the field'} to place them.</div>`:''}
  <div class="card" style="overflow:hidden">${ev.groups.length?`<div class="tw"><div class="t" style="min-width:820px"><div class="tr th" style="${cols}"><span>Group ID</span><span>Group</span><span>Course</span><span>Starts</span><span>Players</span><span></span></div>
   ${ev.groups.slice().sort((a,b)=>(a.teeTime?1:0)-(b.teeTime?1:0)||a.course.localeCompare(b.course)||(a.teeTime||'').localeCompare(b.teeTime||'')||(+a.startHole-+b.startHole)).map(g=>`<div class="tr click" data-gg="${g.id}" style="${cols}"><b style="letter-spacing:.06em;color:var(--navy)">${esc(g.code)}</b>${(()=>{ const hs=g.players.map(p=>playerHcp(ev,g,p).ch); const tot=hs.every(v=>v!=null)&&hs.length?hs.reduce((a,v)=>a+v,0):null; return `<div class="cell2"><span class="trunc">${esc(g.label||'—')}</span>${tot!=null?`<small>Combined ${fmtH(tot,'course')}</small>`:''}</div>`; })()}<span class="muted">${esc(courseById(g.course)?.name||'')}</span><span class="num">${g.teeTime?fmtTime(g.teeTime):'Hole '+(+g.startHole||1)}</span><span class="trunc">${g.players.map(p=>{ const h=playerHcp(ev,g,p); return esc(p.name)+(h.ch!=null?` <span class="muted">(${fmtH(h.ch,'course')})</span>`:''); }).join(', ')||'<span class="muted">No players</span>'}</span><span class="ib">${I.edit}</span></div>`).join('')}</div></div>`
   :`<div class="empty"><b>No groups yet</b><span>${F.count?'Build groups from the flights — groups stay inside each flight, and starting holes follow combined handicap.':'Build groups from the field, or add them by hand.'}</span></div>`}</div>`;
  $('ggAdd').onclick=()=>editGroup(ev,null);
  const pr=$('ggPrint'); if(pr) pr.onclick=()=>printScorecards(ev);
  const a=$('ggFl'); if(a) a.onclick=()=>buildGroupsFromFlights(ev);
  const b=$('ggFld'); if(b) b.onclick=()=>buildGroupsFromField(ev);
  el.querySelectorAll('[data-gg]').forEach(r=>r.onclick=()=>editGroup(ev,ev.groups.find(g=>g.id===r.dataset.gg)));
}
function groupsConfirmNote(ev){ const hasScores=Object.keys(scoresFor(ev)||{}).length>0;
  return ev.groups.length?`<div class="banner">This replaces the ${ev.groups.length} current groups and their group IDs.${hasScores?' Scores already entered stay with each player.':''}${ev.status==='live'?' Scoring is open — re-share group IDs with players.':''}</div>`:''; }
function buildGroupsFromFlights(ev){
  const F=ev.flights; if(!F||!F.count){ toast('Set flights first'); return; }
  const basis=F.basis||'course', unit=F.unit||'player', per=F.perGroup||Math.max(1,Math.round((F.groupSize||4)/(unit==='team'?2:1)));
  const units=flightUnits(ev,basis,unit);
  const plan={flights:F.names.map(n=>({name:n,units:units.filter(u=>u.members.every(m=>m.p.flight===n)&&u.val!=null).sort((a,b)=>a.val-b.val||a.label.localeCompare(b.label))}))};
  const loose=units.filter(u=>!plan.flights.some(f=>f.units.includes(u)));
  const P=flightPlan(ev);
  const preview=start=>{ const gs=buildFlightGroups(ev,plan,per,F.courseOf||F.courses||'split',start,P);
    for(let i=0;i<loose.length;i+=per){ const us=loose.slice(i,i+per); gs.push({id:uid(),code:newCode({groups:gs}),course:ev.defaultCourse||'oak',startHole:1,label:'Not flighted',players:us.flatMap(u=>u.members.map(m=>({...m.p})))}); }
    return gs; };
  const summary=gs=>F.names.map(n=>{ const fg=gs.filter(x=>x.flight===n); const tee=P[n]&&P[n].start==='tee'; return `<div class="mr num" style="grid-template-columns:70px minmax(0,1fr)"><b>Flight ${n}</b><div class="cell2"><span>${fg.length} groups · ${courseById(fg[0]?.course)?.name||''} · ${tee?'tee times off hole '+P[n].hole:'shotgun'}</span><small>${tee?fg.map(x=>fmtTime(x.teeTime)).join(', '):'Holes '+fg.map(x=>x.startHole+(/ B /.test(x.label)?'B':'')).join(', ')}</small></div></div>`; }).join('');
  const odd=gs=>gs.filter(x=>x.players.length!==(F.groupSize||4));
  openDrawer({kicker:ev.name+' · Groups',title:'Build groups from flights',saveLabel:'Build groups',
    body:`<p style="margin:0">Groups of ${F.groupSize||4}${unit==='team'?`, ${per} teams each`:''}, formed inside each flight from lowest handicap up, on each flight’s course and start from the Flights tab. Shotgun flights get holes 1, 2, 3… by combined handicap; tee-time flights go off in the same order.</p><input type="hidden" id="bgS" value="shotgun">`+
      `<div class="mini" id="bgSum">${summary(preview('shotgun'))}</div><div id="bgOdd"></div>${groupsConfirmNote(ev)}`,
    wire:r=>{ const upd=()=>{ const gs=preview('shotgun'); r.querySelector('#bgSum').innerHTML=summary(gs); const o=odd(gs); r.querySelector('#bgOdd').innerHTML=o.length?`<div class="banner">${o.length} group${o.length>1?'s':''} won’t be full: ${esc(o.map(x=>x.players.length+' players · '+(x.flight?'Flight '+x.flight:x.label)).join('; '))}.</div>`:''; }; upd(); },
    save:()=>{ const gs=preview('shotgun'); ev.groups=gs.map(({flight,...grp})=>grp); ev.pool=[]; golfSave(ev); toast(`${ev.groups.length} groups built`); }});
}
function buildGroupsFromField(ev){
  const all=evPlayers(ev); if(!all.length){ toast('Import or add the field first'); return; }
  const units=[], seen=new Map(); all.forEach(({p})=>{ const k=p.team||('p'+p.id); if(!seen.has(k)){ seen.set(k,[]); units.push(seen.get(k)); } seen.get(k).push(p); });
  openDrawer({kicker:ev.name+' · Groups',title:'Build groups from the field',saveLabel:'Build groups',
    body:`<p style="margin:0">${all.length} players${units.some(u=>u.length>1)?` in ${units.length} teams — teams stay together`:''}. No flights are set, so groups follow field order.</p>`+
      pair(field('Players per group','bgN',4,{type:'select',options:[[2,'2'],[3,'3'],[4,'4'],[5,'5']]}),field('Courses','bgC','split',{type:'select',options:[['oak','All on Oak'],['pecan','All on Pecan'],['split','Split between Oak and Pecan']]}))+
      field('Start','bgS','shotgun',{type:'select',options:[['shotgun','Shotgun — groups spread across holes 1–18'],['one','Everyone off hole 1']]})+groupsConfirmNote(ev),
    save:()=>{ const size=+fv('bgN'), mode=fv('bgC'), start=fv('bgS'); const groups=[]; let cur=[];
      for(const u of units){ if(cur.length&&cur.length+u.length>size){ groups.push(cur); cur=[]; } cur=cur.concat(u); } if(cur.length) groups.push(cur);
      const half=Math.ceil(groups.length/2); const out=[];
      groups.forEach((ps,i)=>{ const course=mode==='split'?(i<half?'oak':'pecan'):mode; const idx=mode==='split'?(i<half?i:i-half):i;
        const startHole=start==='shotgun'?(idx%18)+1:1; const dbl=start==='shotgun'&&idx>=18?' B':'';
        out.push({id:uid(),code:newCode({groups:out}),label:`${course==='oak'?'Oak':'Pecan'} ${start==='shotgun'?startHole+dbl:'#'+(i+1)}`,course,startHole,players:ps.map(p=>({...p}))}); });
      ev.groups=out; ev.pool=[]; golfSave(ev); toast(`${ev.groups.length} groups built`); }});
}

/* ---------- scorecard viewer ---------- */
function viewCard(ev,grp,highlight){
  const pub=publicEvent(ev), pg=pub.groups.find(x=>x.id===grp.id);
  openDrawer({kicker:ev.name+' · Group '+grp.code,title:'Scorecard',wide:'x',saveLabel:'Correct scores',
    body:scorecardHTML(pub,pg,scoresFor(ev),{highlight})+`<div class="actions" style="justify-content:flex-end"><button class="btn sm" type="button" id="vcPrint">Print</button></div>`,
    wire:r=>{ r.querySelector('#vcPrint').onclick=()=>{ const html=(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(ev.name)} · ${esc(grp.code)}</title><style>${WC_CSS} body{margin:24px} .wc th:first-child,.wc td:first-child{position:static} @page{size:landscape;margin:12mm}</style></head><body>${scorecardHTML(pub,pg,scoresFor(ev),{})}<script>setTimeout(()=>print(),400)<\/script></body></html>`); const w=window.open(URL.createObjectURL(new Blob([html],{type:'text/html'})),'_blank'); if(!w) toast('Allow pop-ups to print'); }; },
    save:()=>{ setTimeout(()=>scoreSheet(ev,grp),0); }});
}

/* ============ Printed tournament scorecards (one per group, QR for live scoring) ============ */
const QR_SRC=['https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js','https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js'];
const groupLink=(ev,grp)=>scoringLink(ev)+'&g='+encodeURIComponent(grp.code);
/* the crest embedded as data so the print page never depends on loading a file */
let CREST_DATA='';
function crestSrc(){ if(CREST_DATA) return CREST_DATA; const abs=location.href.split('#')[0].split('?')[0].replace(/[^/]*$/,'')+'crest.png?v=2';
  try{ const im=document.querySelector('.brand img'); if(im&&im.complete&&im.naturalWidth){ const c=document.createElement('canvas'); c.width=im.naturalWidth; c.height=im.naturalHeight; c.getContext('2d').drawImage(im,0,0); CREST_DATA=c.toDataURL('image/png'); return CREST_DATA; } }catch(_){}
  return abs; }
function printCardHTML(ev,pub,grp,teamKeyOnly){
  const pg0=pub.groups.find(x=>x.id===grp.id), c=pub.courses[grp.course]; if(!pg0||!c) return '';
  const allTeams=isTeamEvent(pub)?groupTeams(pg0):[], mine=teamKeyOnly?allTeams.find(t=>t.key===teamKeyOnly):null;
  const pg=mine?{...pg0,players:mine.members}:pg0, markers=mine?allTeams.filter(t=>t!==mine):[];
  const TEAM=isTeamEvent(pub), net=pub.scoring==='net', start=+grp.startHole||1, split=pub.format==='split', A=allowOf(pub);
  const hc=p=>c.hcp[p.set||'M']||c.hcp.M;
  const tees=[...new Set(pg.players.map(p=>p.tee))].filter(t=>c.tees&&c.tees[t]);
  const holes=Array.from({length:18},(_,i)=>i+1), scr=h=>holeFormat(pub,h)==='scramble';
  const cells=(fn,cls='')=>holes.slice(0,9).map(h=>`<td class="${cls}${h===start?' st':''}${typeof cls==='function'?'':''}">${fn(h)}</td>`).join('')+`<td class="sum">${fn('out')}</td>`+holes.slice(9).map(h=>`<td class="${cls}${h===start?' st':''}">${fn(h)}</td>`).join('')+`<td class="sum">${fn('in')}</td><td class="sum">${fn('tot')}</td>`;
  const cellsX=fn=>holes.slice(0,9).map(h=>fn(h,h===start)).join('')+'<td class="sum"></td>'+holes.slice(9).map(h=>fn(h,h===start)).join('')+'<td class="sum"></td><td class="sum"></td>';
  const sumP=(arr,k)=>k==='out'?arr.slice(0,9).reduce((a,b)=>a+b,0):k==='in'?arr.slice(9).reduce((a,b)=>a+b,0):arr.reduce((a,b)=>a+b,0);
  const phTxt=v=>typeof v==='number'?(v<0?'+'+(-v):v):'';
  const plFmt=eventFormats(pub).find(f=>f!=='scramble');
  const plPH=p=>plFmt?(plFmt==='stroke'?p.ph:segPH(pub,p,plFmt)):null;
  const anyW=pg.players.some(p=>p.set==='W');
  const dots=k=>k>0?'<i></i>'.repeat(Math.min(k,2)):k<0?'<i class="plus">+</i>':'';
  const pRow=p=>`<tr class="pr"><th><b>${esc(p.name)}</b><span>${esc(p.tee)}${p.flight?' · Flight '+esc(p.flight):''}</span></th>${cellsX((h,st)=>{ if(scr(h)) return `<td class="x${st?' st':''}"></td>`;
      const f=holeFormat(pub,h), ph=f==='stroke'?p.ph:segPH(pub,p,f); return `<td class="${st?'st':''}">${typeof ph==='number'?dots(strokesOn(ph,hc(p)[h-1])):''}</td>`; })}<td class="sum hc">${phTxt(plPH(p))}</td><td class="sum"></td></tr>`;
  const teams=TEAM?groupTeams(pg):[];
  const tRow=(t,i)=>{ const tph=eventFormats(pub).includes('scramble')?scrambleTeamPH(pub,t.members):null;
    const what=split?`${FORMAT_LABEL[pub.front]} score front · ${pub.back==='scramble'?'team':'best'} ${net?'net':''} ball back`:(pub.format==='scramble'?'One team score each hole':(net?'Lowest net score each hole':'Lowest score each hole'));
    return `<tr class="tb"><th><b>${mine?'Team':'Team '+(i+1)}${split?'':' '+FORMAT_LABEL[pub.format].toLowerCase()}</b><span>${esc(what)}</span></th>${cellsX((h,st)=>`<td class="${st?'st':''}">${scr(h)&&tph!=null?dots(strokesOn(tph,hc(t.captain)[h-1])):''}</td>`)}<td class="sum hc">${tph!=null?phTxt(tph):''}</td><td class="sum"></td></tr>`; };
  const fmtRow=split?`<tr class="fm"><th>Format</th><td colspan="10">${esc(FORMAT_LABEL[pub.front])}${pub.front==='scramble'?' — one team score':''}</td><td colspan="11">${esc(FORMAT_LABEL[pub.back])}${pub.back==='scramble'?' — one team score':' — everyone plays their own ball'}</td><td colspan="2"></td></tr>`:'';
  const allowTxt=eventFormats(pub).map(f=>f==='scramble'?`scramble ${(A['scramble'+(teams[0]?teams[0].members.length:2)]||A.scramble2).join('/')}%`:`${f==='stroke'?'stroke play':FORMAT_LABEL[f].toLowerCase()} ${A[f]}%`).join(' · ');
  const startBig=grp.teeTime?fmtTime(grp.teeTime):'Hole '+start+(grp.label&&/ B /.test(grp.label)?'B':'');
  const startSub=grp.teeTime?(start!==1?'Tee time · off hole '+start:'Tee time'):'Shotgun start';
  return `<section class="pc${mine?' team':''}">
  <header><img src="${crestSrc()}" alt=""><div class="ttl"><b>${esc(pub.name)}</b><span>${esc([pub.date?new Date(pub.date+'T12:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'}):'',c.name].filter(Boolean).join(' · '))}</span><span>${esc(formatSummary(pub))} · ${net?'Net':'Gross'}${pg.players[0]&&pg.players[0].flight?' · Flight '+esc(pg.players[0].flight):''}</span></div>
    <div class="grp"><span>${esc(startSub)}</span><b class="when">${esc(startBig)}</b><em>Group ${esc(grp.code)}</em></div></header>
  ${mine?`<div class="who"><div><span>Team</span><b>${esc(mine.members.map(p=>p.name).join(' & '))}</b></div><div><span>Marker — keeps this card</span><b>${esc(markers.map(t=>t.members.map(p=>p.name).join(' & ')).join(' · ')||'—')}</b></div></div>`:''}
  <table>
    ${fmtRow}
    <tr class="hd"><th>Hole</th>${cells(h=>typeof h==='number'?h:h==='out'?'Out':h==='in'?'In':'Tot')}<td class="sum">Hcp</td><td class="sum">Net</td></tr>
    ${tees.map(t=>`<tr class="yd"><th>${esc(t)}</th>${cells(h=>typeof h==='number'?c.tees[t][h-1]:sumP(c.tees[t],h))}<td class="sum"></td><td class="sum"></td></tr>`).join('')}
    <tr class="pa"><th>Par</th>${cells(h=>typeof h==='number'?(anyW&&c.par.W[h-1]!==c.par.M[h-1]?c.par.M[h-1]+'/'+c.par.W[h-1]:c.par.M[h-1]):sumP(c.par.M,h))}<td class="sum"></td><td class="sum"></td></tr>
    <tr class="si"><th>Handicap</th>${cells(h=>typeof h==='number'?c.hcp.M[h-1]:'')}<td class="sum"></td><td class="sum"></td></tr>
    ${TEAM?teams.map((t,i)=>t.members.map(pRow).join('')+tRow(t,i)).join(''):pg.players.map(pRow).join('')}
    ${anyW?`<tr class="si"><th>Women’s hcp</th>${cells(h=>typeof h==='number'?c.hcp.W[h-1]:'')}<td class="sum"></td><td class="sum"></td></tr>`:''}
  </table>
  <footer><div class="notes"><span><i></i> Stroke received${pg.players.some(p=>typeof p.ph==='number'&&p.ph<0)?' · <i class="plus">+</i> stroke given back':''}${eventFormats(pub).includes('scramble')?' · <b class="xk"></b> scramble hole — team score only':''} · <b class="stk">▌</b> first hole${net?` · Allowances: ${esc(allowTxt)}`:''}</span>
      <div class="sig">${mine?mine.members.map(p=>`<span>${esc(p.name)}</span>`).join('')+'<span>Marker</span>':'<span>Scorer</span><span>Attest</span>'}</div></div>

function mmDrift(raw,live){

/* one save round-trip: merge with the latest copy and write it only if nobody saved in between */
async function calcSyncOnce(get,put,local){

    if(calcStable(merged)===calcStable(rem.doc)) return {doc:rem.doc,version:rem.version,wrote:false};
    try{ const v=await put(merged,rem.version); return {doc:merged,version:v,wrote:true}; }
    catch(e){ if(!/conflict/i.test(e.message||'')) throw e; }

/* ---------- captains, buyers and shares ----------
   Each team has a captain: the player with the lower Handicap Index (plus handicaps are lower).
   The captain is the buyer of the team's own share — 100% of a pre-bought team, or the team's
   buy-in share (e.g. 25%) of a team that goes to auction — and is paid that share. Buyers don't
   need bidder numbers; if a captain later takes a paddle, everything they own joins that number. */
const nameKey=n=>String(n||'').toLowerCase().replace(/[^a-z\s]/g,' ').split(/\s+/).filter(Boolean).sort().join(' ');
const capIdx=l=>l.cap===1?1:0;
const captainName=l=>[l.p1,l.p2][capIdx(l)]||l.p1||'';
const captainMember=l=>[l.m1,l.m2][capIdx(l)]||'';
function captainBidder(c,l){ const m=captainMember(l), k=nameKey(captainName(l));
  return (m&&c.bidders.find(b=>b.memberId===m))||c.bidders.find(b=>nameKey(b.name)===k)||null; }
/* every share of every team, and who holds it */
function calcStakes(c){
  const bi=buyInOf(c), teamPct=bi.on?c0(bi.pct):0, out=[], pl=poolLot(c);
  const cap=l=>{ const b=captainBidder(c,l); return b?{key:'b:'+b.id,bidderId:b.id,num:b.num,name:b.name,captainOf:l.id}:{key:'m:'+(captainMember(l)||nameKey(captainName(l))),memberId:captainMember(l),name:captainName(l),captainOf:l.id}; };
  const bid=b=>({key:'b:'+b.id,bidderId:b.id,num:b.num,name:b.name});
  for(const l of c.lots){
    if(l.prebuy){ out.push({lot:l,pct:100,kind:'prebuy',owner:cap(l)}); continue; }
    let buyer=null;
    if(l.pooled&&!l.prebuy){ const pb=pl&&pl.price>0?bidderById(c,c.pool.bidderId):null; if(pb) buyer={owner:bid(pb),kind:'pool'}; }
    else if(c0(l.price)>0){ const b=bidderById(c,l.bidderId); if(b) buyer={owner:bid(b),kind:'auction'}; }
    if(buyer) out.push({lot:l,pct:100-teamPct,kind:buyer.kind,owner:buyer.owner});
    if(teamPct>0) out.push({lot:l,pct:teamPct,kind:'team',owner:cap(l)});
  }
  return out;
}
function calcHoldings(c){
  const m=new Map();
  for(const s of calcStakes(c)){ const k=s.owner.key; if(!m.has(k)) m.set(k,{...s.owner,stakes:[]}); const h=m.get(k); h.stakes.push(s); if(s.owner.num&&!h.num){ h.num=s.owner.num; h.bidderId=s.owner.bidderId; } }
  return [...m.values()].sort((a,b)=>(a.num?0:1)-(b.num?0:1)||(+a.num||0)-(+b.num||0)||a.name.localeCompare(b.name));
}

/* =====================================================================
   Calcutta (players auction) — per tournament.
   t.calcutta = { lots:[{id,lot,p1,i1,p2,i2,flight,idx,fun,bidderId,price}],
                  bidders:[{id,num,name,memberId,paid,method}],
                  expenses:[{id,desc,amount,notes}], payout:[40,30,20,10], file, importedAt }
   Expenses come out of the pot evenly across every flight.
   ===================================================================== */
TT.splice(TT.findIndex(x=>x[0]==='budget')+1,0,['calcutta','Calcutta']);
const CALC_PAYOUT=[40,30,20,10];
function calc(t){ if(!t.calcutta) t.calcutta={lots:[],bidders:[],expenses:[],payout:CALC_PAYOUT.slice(),minBid:250}; const c=t.calcutta;
  if(c.minBid==null) c.minBid=250; c.pool=c.pool||{bidderId:'',price:0}; calcNormalize(c); resolveCaptains(t,c);
  c.lots=c.lots||[]; c.bidders=c.bidders||[]; c.expenses=c.expenses||[]; c.payout=c.payout&&c.payout.length?c.payout:CALC_PAYOUT.slice(); return c; }
const calcTotals=t=>calcTotalsC(calc(t));
/* link each lot's two players to member records, then pick the captain (lower Handicap Index) unless set by hand */
function resolveCaptains(t,c){
  const pool=((t.field||[]).map(p=>memberById(p.memberId)).filter(Boolean)).concat(db.members);
  const byKey=new Map(); for(const m of pool){ const k=nameKey(memberName(m)); if(k&&!byKey.has(k)) byKey.set(k,m); }
  const idx=(given,m)=>{ if(given!=null&&given!=='') return +given; const v=m&&typeof parseIndex==='function'?parseIndex(m.hcp):null; return v==null?null:v; };
  for(const l of c.lots){
    const a=l.m1?memberById(l.m1):byKey.get(nameKey(l.p1)), b=l.m2?memberById(l.m2):byKey.get(nameKey(l.p2));
    if(a&&l.m1!==a.id) l.m1=a.id; if(b&&l.m2!==b.id) l.m2=b.id;
    if(l.capSet) continue;
    const i1=idx(l.i1,a), i2=idx(l.i2,b); let cap=0, flag=true;
    if(i1!=null&&i2!=null&&i1!==i2){ cap=i2<i1?1:0; flag=false; }
    if(l.cap!==cap) l.cap=cap; if(!!l.capFlag!==flag) l.capFlag=flag;
  }
}
const capIndexTxt=(l,k)=>{ const id=[l.m1,l.m2][k], m=id&&memberById(id), v=[l.i1,l.i2][k]!=null&&[l.i1,l.i2][k]!==''?+[l.i1,l.i2][k]:(m&&typeof parseIndex==='function'?parseIndex(m.hcp):null); return v==null?'no index':(v<0?'+'+Math.abs(v).toFixed(1):v.toFixed(1)); };
/* ---------- import (the auction-order sheet or the fun-team sheet) ---------- */
function parseCalcSheet(rows){
  const low=r=>r.map(c=>String(c||'').trim().toLowerCase());
  const hi=rows.findIndex(r=>{ const h=low(r); return (h.includes('team')&&h.includes('flight'))||(h.includes('player 1')&&h.includes('flight')); });
  if(hi<0) throw new Error('Couldn’t find the header row — expected columns like Lot, Team, Flight (or Player 1, Player 2, Flight).');
  const h=low(rows[hi]), col=re=>h.findIndex(x=>re.test(x));
  const cLot=col(/^lot$/), cNum=col(/^#$/), cTeam=col(/^team$/), cP1=col(/^player 1$/), cP2=col(/^player 2$/), cFl=col(/^flight$/), cTi=col(/^team index$/),
        cBuyer=col(/^(buyer|bidder|bought by|purchaser)$/), cPrice=col(/^(price|sold for|amount|bid)$/), cFun=col(/^fun team$/);
  const idxCols=h.map((x,i)=>/^index$/.test(x)?i:-1).filter(i=>i>=0);
  const num=v=>{ const s=String(v||'').replace(/[$,\s]/g,''); if(!s) return null; if(/^\+/.test(s)) return -parseFloat(s.slice(1)); const n=parseFloat(s); return isFinite(n)?n:null; };
  const out=[];
  for(const r of rows.slice(hi+1)){
    let p1='',p2='';
    if(cTeam>=0&&r[cTeam]){ [p1,p2]=String(r[cTeam]).split(/\s*&\s*|\s*\/\s*|\s+and\s+/i); }
    else if(cP1>=0){ p1=r[cP1]; p2=cP2>=0?r[cP2]:''; }
    p1=String(p1||'').trim(); p2=String(p2||'').trim(); if(!p1) continue;
    const fl=String(r[cFl]||'').replace(/^flight\s*/i,'').trim();
    out.push({lot:cLot>=0?parseInt(r[cLot],10)||null:(cNum>=0?parseInt(r[cNum],10)||null:null),p1,p2,flight:fl,
      i1:idxCols[0]!=null?num(r[idxCols[0]]):null,i2:idxCols[1]!=null?num(r[idxCols[1]]):null,idx:cTi>=0?num(r[cTi]):null,
      fun:cFun>=0?/^y/i.test(r[cFun]):(cLot>=0&&r[1]==='★'),buyer:cBuyer>=0?String(r[cBuyer]||'').trim():'',price:cPrice>=0?num(r[cPrice]):null});
  }
  if(!out.length) throw new Error('No teams found under the header row.');
  out.forEach((x,i)=>{ if(x.lot==null) x.lot=i+1; if(x.idx==null&&x.i1!=null&&x.i2!=null) x.idx=Math.round((x.i1+x.i2)*10)/10; });
  return out;
}

/* member names from Golf Genius are sometimes all lowercase or oddly capitalized */
function tidyName(n){ n=String(n||'').trim(); if(!n) return n;
  const cap=w=>w?w[0].toUpperCase()+w.slice(1):w;
  return n.split(/\s+/).map(w=>{
    if(w===w.toLowerCase()) w=w.split(/([-'])/).map(cap).join('');           // all lowercase → capitalize each part
    w=w.replace(/-([a-z])/g,(m,c)=>'-'+c.toUpperCase());                      // Cauley-stein → Cauley-Stein
    if(/^([A-Za-z]\.){2,}$/.test(w)) w=w.toUpperCase();                        // R.d. → R.D.
    return w; }).join(' '); }
const nextBidderNum=c=>c.bidders.reduce((a,b)=>Math.max(a,parseInt(b.num,10)||0),0)+1;

/* ---------- bidders ---------- */
/* type-ahead: members ranked by how closely they match what's typed (field players first) */
function memberMatches(t,q,limit){
  q=String(q||'').trim().toLowerCase().replace(/\s+/g,' '); if(!q) return [];
  if(q.includes(',')){ const [a,b]=q.split(',').map(x=>x.trim()); q=(b+' '+a).trim(); }       // "Last, First"
  const inField=new Set((t.field||[]).map(p=>p.memberId));
  const lev=(a,b)=>{ const d=Array.from({length:a.length+1},(_,i)=>[i]); for(let j=1;j<=b.length;j++) d[0][j]=j;
    for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++) d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[a.length][b.length]; };
  const qt=q.split(' ');
  return db.members.map(m=>{ const name=tidyName(memberName(m)), n=name.toLowerCase(), toks=n.split(/[\s-]+/);
      let sc=0;
      if(n.startsWith(q)) sc=100;
      else if(qt.every(w=>toks.some(x=>x.startsWith(w)))) sc=90;
      else if(n.includes(q)) sc=75;
      else { const best=Math.min(...qt.map(w=>Math.min(...toks.map(x=>lev(w,x.slice(0,Math.max(w.length,1)))))));   // typo-tolerant
        const tol=q.length<=3?0:q.length<=4?1:2; if(best<=tol) sc=60-best*10+(qt.some(w=>toks.some(x=>x[0]===w[0]))?5:0); }
      if(sc&&inField.has(m.id)) sc+=5;
      return {m,name,sc}; }).filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc||a.name.localeCompare(b.name)).slice(0,limit||6);
}

        setPooled(c,l,false); persist(); closeDrawer(); render(); toast(`${teamName(l)} taken out of the pool — record its sale from the Lots list`); }); },
    save:()=>{ const num=String(fv('cpB')).trim(), price=fnum('cpP');
      if(price>0&&!num){ toast('Enter the bidder number'); return false; }
      let b=num?bidderByNum(c,num):null; if(num&&!b){ b={id:uid(),num,name:'Bidder '+num,memberId:'',paid:false,method:''}; c.bidders.push(b); c.bidders.sort((a,z)=>(+a.num||0)-(+z.num||0)); }
      c.pool={bidderId:price>0&&b?b.id:'',price:price>0?price:0}; }});
}

function runAuction(t,startId){
  const c=calc(t); if(!c.lots.length){ toast('Import the team sheet first'); return; }
  let seq=auctionSeq(c), i=startId?seq.findIndex(l=>l.id===startId):seq.findIndex(l=>!l.pooled&&!(n0(l.price)>0)&&!(l.isPool&&l.price>0)); if(i<0) i=0;
  const addBidder=num=>{ let x=bidderByNum(c,num); if(!x){ x={id:uid(),num,name:'Bidder '+num,memberId:'',paid:false,method:''}; c.bidders.push(x); c.bidders.sort((a,z)=>(+a.num||0)-(+z.num||0)); } return x; };
  const draw=r=>{ seq=auctionSeq(c); if(i>=seq.length) i=seq.length-1; const l=seq[i], nx=seq[i+1], tot=calcTotals(t), b=bidderById(c,l.bidderId), P=!!l.isPool;
    const status=l.pooled?`<b style="color:#E8A08A">in the pool (Lot ${poolLotNum(c)})</b>`:(n0(l.price)>0?`<b style="color:#D8B75F">sold ${fmt(l.price)} to ${esc(bidderLabel(b))}</b>`:'');
    r.innerHTML=`<div class="card pad" style="display:flex;gap:18px;align-items:center;background:var(--navy);color:#fff;border-color:var(--navy)">
        <div style="text-align:center;min-width:92px"><div style="font-size:11px;font-weight:800;letter-spacing:.14em;color:#D8B75F">LOT</div><div style="font-family:var(--serif,Georgia);font-size:52px;font-weight:700;line-height:1">${l.lot}</div><div style="font-size:12px;color:#AEB8BE">${P?'the pool':'of '+c.lots.length}</div></div>
        <div style="min-width:0">${P?`<div style="font-family:var(--serif,Georgia);font-size:26px;font-weight:700;line-height:1.15">The Pool</div><div style="margin-top:6px;color:#C9CFD2;font-size:13.5px">${l.count} team${l.count===1?'':'s'} that didn’t reach ${fmt(c.minBid)}, sold together${l.price>0?` · <b style="color:#D8B75F">sold ${fmt(l.price)} to ${esc(bidderLabel(b))}</b>`:''}</div>`
          :`<div style="font-family:var(--serif,Georgia);font-size:26px;font-weight:700;line-height:1.15">${esc(l.p1)}<br>${esc(l.p2)}</div><div style="margin-top:6px;color:#C9CFD2;font-size:13.5px">${esc(flightName(l.flight))} · team index ${idxTxt2(l.idx)}${status?' · '+status:''}</div>`}</div></div>
      ${P?`<div class="mini" style="max-height:220px;overflow:auto">${l.teams.map(x=>`<div class="mr num" style="grid-template-columns:60px minmax(0,1fr) 80px"><span class="muted">Lot ${x.lot}</span><span class="trunc">${esc(teamName(x))}</span><span class="muted">${esc(flightName(x.flight))}</span></div>`).join('')}</div>`:''}
      ${pair(field('Bidder number','raB',b?b.num:'',{ph:'e.g. 27',hint:'<span id="raBn"></span>'}),field('Price','raP',n0(l.price)||'',{type:'number',ph:'0',hint:!P&&c.minBid?`Minimum ${fmt(c.minBid)}`:''}))}
      <div class="actions"><button class="btn pri" type="button" id="raSold" style="flex:1">${P?'Sold':'Sold — next lot'}</button>${P?'':`<button class="btn" type="button" id="raPool">No sale → pool</button>`}<button class="btn" type="button" id="raPrev"${i===0?' disabled':''}>‹ Back</button><button class="btn" type="button" id="raSkip"${i>=seq.length-1?' disabled':''}>Skip</button></div>
      <div class="mini">${[['Pot',fmt(tot.pot)],['Sold',`${tot.sold} of ${tot.auctionLots}${tot.prebuy?` · ${tot.prebuy} pre-bought`:''}`],['In the pool',tot.pooled?`${tot.pooled} team${tot.pooled===1?'':'s'} · Lot ${tot.poolLot}`:'none'],['Top price',fmt(tot.top)]].map(([a,v])=>`<div class="mr num" style="grid-template-columns:minmax(0,1fr) auto"><span class="muted">${a}</span><b>${v}</b></div>`).join('')}</div>
      ${nx?`<p class="hint">Up next: Lot ${nx.lot} · ${esc(teamName(nx))}${nx.isPool?'':' · '+esc(flightName(nx.flight))}</p>`:(P?'<p class="hint">The pool is the final lot.</p>':`<p class="hint">Last team.${poolTeams(c).length?` The pool (Lot ${poolLotNum(c)}) comes up next.`:''}</p>`)}`;
    const bIn=r.querySelector('#raB'), pIn=r.querySelector('#raP'), bn=r.querySelector('#raBn');
    const upd=()=>{ const x=bidderByNum(c,bIn.value); bn.textContent=bIn.value?(x?x.name:'New bidder number — it will be added'):''; }; bIn.oninput=upd; upd();
    const next=()=>{ seq=auctionSeq(c); if(i<seq.length-1) i++; draw(r); };
    const toPool=()=>{ setPooled(c,l,true); persist(); toast(`${teamName(l)} → the pool (Lot ${poolLotNum(c)})`); next(); };
    const sell=()=>{ const num=String(bIn.value).trim(), price=parseFloat(String(pIn.value).replace(/[$,]/g,''))||0;
      if(!P&&!(price>0)){ if(confirm('No price entered. Send this team to the pool?')) toPool(); else pIn.focus(); return; }
      if(price>0&&!num){ toast('Enter the bidder number'); bIn.focus(); return; }
      if(!P&&c.minBid&&price<c.minBid){ if(confirm(`${fmt(price)} is under the ${fmt(c.minBid)} minimum.\n\nOK sends the team to the pool. Cancel lets you change the price.`)) toPool(); else pIn.focus(); return; }
      const x=num?addBidder(num):null;
      if(P) c.pool={bidderId:price>0&&x?x.id:'',price:price>0?price:0};
      else { setPooled(c,l,false); l.bidderId=price>0&&x?x.id:''; l.price=price>0?price:0; }
      persist(); if(P){ toast('The pool is sold'); draw(r); } else next(); };
    r.querySelector('#raSold').onclick=sell;
    const pb=r.querySelector('#raPool'); if(pb) pb.onclick=toPool;
    [bIn,pIn].forEach(e=>e.onkeydown=ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); if(e===bIn) pIn.focus(); else sell(); } });
    r.querySelector('#raPrev').onclick=()=>{ i=Math.max(0,i-1); draw(r); };
    r.querySelector('#raSkip').onclick=next;
    setTimeout(()=>bIn.focus(),30);
  };
  openDrawer({kicker:t.name+' · Calcutta',title:'Run the auction',saveLabel:'Done',wide:true,body:'<div id="raBody" style="display:flex;flex-direction:column;gap:14px"></div>',wire:r=>draw(r.querySelector('#raBody')),save:()=>{}});
}

const shareBase={ get(t){ const c=calc(t); if(c._base){ this.set(t,c._base,c._ver); delete c._base; delete c._ver; }   // move older shared copies here
    try{ return JSON.parse(localStorage.getItem('mga_cbase_'+t.id)||'null'); }catch(_){ return null; } },
  set(t,doc,ver){ try{ localStorage.setItem('mga_cbase_'+t.id,JSON.stringify({doc,ver})); }catch(_){} } };
const shareSt=t=>Object.assign({},calc(t).share||{},SHARE_ST[t.id]||{});
async function calcShareSync(t){
  const c=calc(t); if(!c.share||!c.share.token||!CLOUD||!sessionOK) return false;
  c.people=calcPeople(t); c.name=t.name;
  const sb0=shareBase.get(t); calcStamp(c,sb0&&sb0.doc);
  const token=c.share.token;
  const get=async()=>{ const {data,error}=await sb.rpc('calcutta_get',{p_token:token}); if(error) throw new Error(error.message); if(!data) throw new Error('The cashier link is off'); return data; };
  const put=async(doc,ver)=>{ const {data,error}=await sb.rpc('calcutta_put',{p_token:token,p_doc:doc,p_version:ver}); if(error) throw new Error(error.message); return data; };
  try{
    const before=calcStable(calcDoc(c));
    const res=await calcSyncOnce(get,put,calcDoc(c));
    const d=JSON.parse(JSON.stringify(res.doc)); CALC_KINDS.forEach(k=>{ c[k]=c[k]||[]; syncArr(c[k],d[k]||[]); }); CALC_SET.forEach(k=>{ if(d[k]!==undefined&&!sameJ(c[k],d[k])) c[k]=isObj(c[k])&&isObj(d[k])?syncTo(c[k],d[k]):d[k]; }); c._su=d._su||0; c._del=d._del||[];

    return calcStable(calcDoc(c))!==before;

let calcShareTimer=null, calcShareBusy=false;
async function calcShareAll(){
  if(calcShareBusy) return; const ts=db.tournaments.filter(t=>t.calcutta&&t.calcutta.share&&t.calcutta.share.token); if(!ts.length) return;
  db.tournaments.forEach(x=>{ const sh=x.calcutta&&x.calcutta.share; if(sh&&('state' in sh||'at' in sh||'msg' in sh)) x.calcutta.share={token:sh.token,created:sh.created}; if(x.calcutta&&x.calcutta._base) shareBase.get(x); });
  const dataBefore=stable(db);
  calcShareBusy=true; let changed=false;
  try{ for(const t of ts) changed=(await calcShareSync(t))||changed; } finally{ calcShareBusy=false; }
  if(stable(db)!==dataBefore){ if(typeof syncSuppress!=='undefined'){ syncSuppress=true; persist(); syncSuppress=false; } else persist(); }

/* search: a lot matches its number, either player, the captain, the buyer's name or paddle */
function lotMatches(c,l,q){ q=String(q||'').trim().toLowerCase().replace(/^#/,''); if(!q) return true;
  if(l.isPool){ const b=bidderById(c,l.bidderId); return /pool/.test(q)||String(l.lot)===q||(b&&(String(b.num)===q||b.name.toLowerCase().includes(q)))||l.teams.some(x=>lotMatches(c,x,q)); }
  if(String(l.lot)===q) return true;
  const b=bidderById(c,l.bidderId), cb=l.prebuy?captainBidder(c,l):null, pb=l.pooled&&c.pool&&bidderById(c,c.pool.bidderId);
  if(/^\d+$/.test(q)) return [b,cb,pb].some(x=>x&&String(x.num)===q);   // a bare number is a lot or a paddle, exactly
  const hay=[l.p1,l.p2,flightName(l.flight),b&&b.name,pb&&pb.name,cb&&cb.name].filter(Boolean).join(' ').toLowerCase();
  if(hay.includes(q)) return true;
  return [b,cb,pb].some(x=>x&&String(x.num)===q);
}
function bidderMatches(c,b,q){ q=String(q||'').trim().toLowerCase().replace(/^#/,''); if(!q) return true;
  if(String(b.num)===q||b.name.toLowerCase().includes(q)) return true;
  return bidderOwes(c,b).lots.some(l=>String(l.lot)===q||(!l.isPool&&teamName(l).toLowerCase().includes(q))); }

/* ============ Teams in the field that aren't in the Calcutta yet ============ */
function fieldTeamsMissing(t){
  const c=calc(t), byTeam=new Map();
  for(const p of t.field||[]){ if(!p.memberId) continue; const a=byTeam.get(p.team)||[]; a.push(p); byTeam.set(p.team,a); }
  const have=new Set(), haveNames=new Set();
  c.lots.forEach(l=>{ [l.m1,l.m2].filter(Boolean).forEach(id=>have.add(id)); [l.p1,l.p2].forEach(n=>haveNames.add(nameKey(n))); });
  const out=[];
  for(const [team,ps] of byTeam){ if(ps.length<1) continue;
    const ms=ps.map(p=>memberById(p.memberId)).filter(Boolean); if(!ms.length) continue;
    if(ms.some(m=>have.has(m.id)||haveNames.has(nameKey(memberName(m))))) continue;      // already a lot
    const idx=ms.map(m=>typeof parseIndex==='function'?parseIndex(m.hcp):null);
    out.push({team,members:ms,names:ms.map(m=>tidyName(memberName(m))),i:idx,idx:idx.every(v=>v!=null)?Math.round(idx.reduce((a,v)=>a+v,0)*10)/10:null}); }
  return out.sort((a,b)=>a.team-b.team);
}
/* suggest a flight from where the team index falls among the existing flights */
function suggestFlight(c,idx){
  const F=new Map(); c.lots.forEach(l=>{ if(l.idx==null||l.idx==='') return; const f=String(l.flight); const r=F.get(f)||[Infinity,-Infinity]; r[0]=Math.min(r[0],+l.idx); r[1]=Math.max(r[1],+l.idx); F.set(f,r); });
  if(idx==null||!F.size) return [...F.keys()][0]||'';
  let best='',d=Infinity; for(const [f,[lo,hi]] of F){ const dist=idx<lo?lo-idx:idx>hi?idx-hi:0; if(dist<d){ d=dist; best=f; } } return best; }
function addFieldTeams(t){
  const c=calc(t), miss=fieldTeamsMissing(t);
  if(!miss.length){ toast('Every team in the field is already in the Calcutta'); return; }
  const flights=[...new Set(c.lots.map(l=>String(l.flight)))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
  const next=c.lots.reduce((a,l)=>Math.max(a,+l.lot||0),0)+1;
  openDrawer({kicker:t.name+' · Calcutta',title:`Add ${miss.length===1?'a team':miss.length+' teams'} from the field`,saveLabel:miss.length===1?'Add to the Calcutta':`Add ${miss.length} teams`,
    body:`<p style="margin:0">${miss.length===1?'This team is':'These teams are'} in the tournament field but not in the Calcutta. Pick a flight and a lot number for each; the pool moves to the next number automatically.</p>
      ${miss.map((m,k)=>{ const sug=suggestFlight(c,m.idx); return `<div class="card pad" style="display:flex;flex-direction:column;gap:10px">
        <label class="check" style="font-size:15px"><input type="checkbox" id="afOn${k}" checked> <b>${esc(m.names.join(' & '))}</b> <span class="muted">· Team ${esc(m.team)}${m.idx!=null?` · team index ${idxTxt2(m.idx)}`:''}</span></label>
        ${pair(field('Flight','afF'+k,sug,{type:'select',options:flights.map(f=>[f,flightName(f)]),hint:m.idx!=null&&sug?`Suggested from the team index (${idxTxt2(m.idx)}).`:''}),field('Lot number','afL'+k,next+k,{type:'number',hint:'Defaults to the end of the order. A number already in use moves that lot and the ones after it down one.'}))}</div>`; }).join('')}`,
    save:()=>{ let added=0;
      miss.forEach((m,k)=>{ if(!$('afOn'+k).checked) return;
        const lot=Math.max(1,parseInt(fv('afL'+k),10)||next+k), flight=fv('afF'+k);
        if(c.lots.some(l=>+l.lot===lot)) c.lots.forEach(l=>{ if(+l.lot>=lot) l.lot=+l.lot+1; });   // make room
        c.lots.push({id:uid(),lot,p1:m.names[0],p2:m.names[1]||'',i1:m.i[0],i2:m.i[1]??null,idx:m.idx,flight,fun:false,bidderId:'',price:0,m1:m.members[0].id,m2:(m.members[1]||{}).id||''});
        added++; });
      if(!added){ toast('Nothing selected'); return false; }
      c.lots.sort((a,b)=>a.lot-b.lot); toast(`${added} team${added===1?'':'s'} added to the Calcutta`); }});
}

const ckStable=x=>{ if(Array.isArray(x)) return '['+x.map(ckStable).join(',')+']'; if(x&&typeof x==='object') return '{'+Object.keys(x).filter(k=>x[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+ckStable(x[k])).join(',')+'}'; return JSON.stringify(x===undefined?null:x); };

  for(const p of doc.players||[]){ const b=bm.get(p.id); if(!b||b.s!==ckStable(ckStrip(p))){ if(!((p.u||0)>(b?b.u:0))) p.u=now; } } }

    try{ const v=await put(merged,rem.version); return {doc:merged,version:v,wrote:true}; }catch(e){ if(!/conflict/i.test(e.message||'')) throw e; } }

/* =====================================================================
   50/50 Drawing — per tournament (t.raffle). Built to be verifiable:
   · tickets are tournament + ticket number (numbers restart each tournament)
   · players are identified by name (email/phone were often the seller's); the board confirms
     look-alike names before the list is locked
   · locking computes a SHA-256 fingerprint of the full ticket list; the list can't change after
   · each draw uses crypto.getRandomValues with rejection sampling (every eligible ticket equally likely),
     is saved the instant it's drawn, and records the random value, the eligible count and the winning ticket
   · once someone wins, all of their tickets leave the drum; voids need a reason and stay in the log
   ===================================================================== */
TT.splice(TT.findIndex(x=>x[0]==='calcutta')+1,0,['raffle','50/50 Drawing']);
const rfKey=(f,l)=>(String(f||'').trim()+' '+String(l||'').trim()).toLowerCase().replace(/\s+/g,' ');
function rfData(t){ return t.raffle; }
/* tickets are stored compactly: [tournamentIdx, ticketNo, nameIdx, rowNo] */
const tkLabel=(tour,no)=>String(no).startsWith('M')?`${tour} · manual ticket, row ${String(no).slice(1)}`:`${tour} · ticket #${no}`;
function rfTickets(R){ return R.tickets.map(([ti,no,ni,row])=>({tour:R.tours[ti],no,first:R.names[ni][0],last:R.names[ni][1],row,key:rfPlayerKey(R,R.names[ni])})); }
function rfPlayerKey(R,[f,l]){ let k=rfKey(f,l); const seen=new Set(); while(R.merges&&R.merges[k]&&!seen.has(k)){ seen.add(k); k=R.merges[k]; } return k; }
function rfPlayerName(R,key){ const n=R.names.find(n=>rfKey(n[0],n[1])===key); return n?`${n[0]} ${n[1]}`:key; }
function rfCanon(R){ return rfTickets(R).map(x=>`${x.tour}|${x.no}|${x.first}|${x.last}|${x.row}`).sort().join('\n'); }
async function rfFingerprint(R){ const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(rfCanon(R)+'\n#merges:'+JSON.stringify(Object.entries(R.merges||{}).sort())));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('').toUpperCase(); }
const fpShort=fp=>fp?fp.slice(0,4)+' '+fp.slice(4,8)+' '+fp.slice(8,12)+' '+fp.slice(12,16):'';
/* look-alike names the board must rule on before locking */
function rfSuspects(R){
  const nick={chris:'christopher',mike:'michael',bob:'robert',dan:'daniel',jim:'james',tom:'thomas',matt:'matthew',ben:'benjamin',andy:'andrew',rick:'richard',bill:'william',jeff:'jeffrey',tim:'timothy',ken:'kenneth',nick:'nicholas',pete:'peter',steve:'stephen',greg:'gregory',tony:'anthony'};
  const fn=s=>nick[s.toLowerCase()]||s.toLowerCase();
  const lev=(a,b)=>{ const d=Array.from({length:a.length+1},(_,i)=>[i]); for(let j=1;j<=b.length;j++) d[0][j]=j; for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++) d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[a.length][b.length]; };
  const counts=new Map(); for(const [,,ni] of R.tickets){ const k=rfKey(...R.names[ni]); counts.set(k,(counts.get(k)||0)+1); }
  const ppl=[...new Map(R.names.map(n=>[rfKey(n[0],n[1]),n])).values()], out=[];
  for(let i=0;i<ppl.length;i++) for(let j=i+1;j<ppl.length;j++){ const [a1,b1]=ppl[i], [a2,b2]=ppl[j];
    const fsame=fn(a1)===fn(a2)||a1.toLowerCase().startsWith(a2.toLowerCase())||a2.toLowerCase().startsWith(a1.toLowerCase());
    const l1=b1.toLowerCase(), l2=b2.toLowerCase(), lclose=(l1.length>2&&l2.length>2&&lev(l1,l2)<=Math.max(1,Math.floor(Math.min(l1.length,l2.length)/5)))||((l1.length<=2||l2.length<=2)&&(l1.startsWith(l2.replace('.',''))||l2.startsWith(l1.replace('.',''))));

      out.push({id,a:{key:k1,name:`${a1} ${b1}`,n:counts.get(k1)||0},b:{key:k2,name:`${a2} ${b2}`,n:counts.get(k2)||0},decided:(R.rulings||{})[id]}); } }

}

  doc.addPage(); page(); y=48; font('Cormorant','bold',20,NAVY); doc.text('Tickets by player',L,y); font('PublicSans','normal',8.4,MUTED); doc.text(`${ppl.size} players · ${all.length.toLocaleString()} tickets · fingerprint ${R.locked?fpShort(R.locked.fp):'—'}`,L,y+14); y+=30;
  const list=[...ppl.entries()].sort((a,b)=>rfPlayerName(R,a[0]).split(' ').slice(-1)[0].localeCompare(rfPlayerName(R,b[0]).split(' ').slice(-1)[0])||rfPlayerName(R,a[0]).localeCompare(rfPlayerName(R,b[0])));
  const colW=(R2-L)/3, rowsPer=Math.ceil(list.length/3); let top=y;
  list.forEach(([k,n],i)=>{ const col=Math.floor(i/rowsPer), row=i%rowsPer, x=L+col*colW, yy=top+row*13.2;
    if(yy>H-50){ return; } font('PublicSans','normal',8.4,INK); doc.text(rfPlayerName(R,k),x,yy,{maxWidth:colW-40}); font('PublicSans','bold',8.4,NAVY); doc.text(String(n),x+colW-14,yy,{align:'right'}); });
  const N=doc.getNumberOfPages();
  for(let p=1;p<=N;p++){ doc.setPage(p); doc.setDrawColor(...LINE); doc.setLineWidth(.6); doc.line(L,H-34,R2,H-34); font('PublicSansXB','normal',6.4,FOOT); doc.text(`${(t.name||'').toUpperCase()} · 50/50 FINAL DRAWING · OFFICIAL RECORD`,L,H-23,{charSpace:.9}); doc.text(`PAGE ${p} OF ${N}`,R2,H-23,{align:'right',charSpace:.9}); }
  doc.setProperties({title:`${t.name} — 50/50 Final Drawing Record`});
  doc.save(`${(t.name||'Tournament').replace(/[^\w]+/g,'-')}-50-50-Drawing-Record.pdf`);
}

/* =====================================================================
   Retiring the current Member-Member app (app.wcccmga.org). One-time, board-wide:
   a last sync so nothing entered there is lost, an archive download of its data, then the hub
   stops talking to it — no sync checks, pushes, Verify tab or import button. Its table in
   Supabase is left untouched as an archive.
   ===================================================================== */
const legacyRetired=()=>!!(db.legacy&&db.legacy.retired);
function retireLegacy(){
  const linked=db.tournaments.filter(t=>t.source&&t.source.kind==='mm-app');
  openDrawer({kicker:'Member-Member app',title:'Retire the current app',saveLabel:'Retire it',
    body:`<p style="margin:0">The hub takes over from <b>app.wcccmga.org</b> for good. This will:</p>
      <div class="mini">${[['1','Run one last sync, so anything entered in the current app reaches the hub'],['2','Download an archive copy of the current app’s data (its table in Supabase is also left as is)'],['3','Stop all syncing with it — no checks, no pushes; the Verify tab, sync chip and import buttons go away']].map(([n,t])=>`<div class="mr" style="grid-template-columns:24px minmax(0,1fr)"><b>${n}</b><span>${t}</span></div>`).join('')}</div>
      <p class="hint">${linked.length?`Linked tournament${linked.length===1?'':'s'}: ${linked.map(t=>esc(t.name)).join(', ')}.`:'No tournaments are linked to it.'} Then upload the forwarding page to app.wcccmga.org so old bookmarks land in the hub.</p>
      ${!CLOUD||!sessionOK?'<div class="banner">Sign in to the cloud first — the last sync needs it.</div>':''}`,
    save:()=>{ if(!CLOUD||!sessionOK){ toast('Sign in to the cloud first'); return false; }
      (async()=>{
        toast('Running the last sync…');
        for(const t of linked){ if(t.sync&&t.sync.off) continue; await syncTournament(t);
          const st=syncSt(t).state;
          if(st==='conflict'){ toast(`${t.name}: both versions changed — choose one, then retire again`); openSync(t); return; }
          if(st==='error'){ toast(`${t.name}: ${(syncSt(t).msg)||'couldn’t reach the current app'} — nothing retired`); return; } }
        try{ const st=await fetchMMState(); dl(JSON.stringify(st,null,2),'application/json',`member-member-app-archive-${new Date().toISOString().slice(0,10)}.json`); }
        catch(e){ toast('Couldn’t download the archive: '+e.message+' — nothing retired'); return; }
        db.legacy={retired:true,at:new Date().toISOString()}; linked.forEach(t=>{ t.sync={off:true}; });
        persist(); view.ttab=view.ttab==='verify'?'overview':view.ttab; render(); toast('Current app retired · archive downloaded');
      })(); }});
}

/* Keeps every open device on the latest version: checks version.json about once a minute and, when a
   newer build is live, reloads at a safe moment (nothing unsaved, no editor open, not mid-typing). */
(function(){
  const ME='20261003220730'; let ready=false, lastCheck=0;
  const typing=()=>{ const a=document.activeElement; return a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.value&&a.type!=='search'; };
  const safe=()=>!typing()&&(typeof window.__canReload!=='function'||window.__canReload());
  async function check(){ lastCheck=Date.now(); if(location.protocol==='file:') return;
    try{ const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'}); if(!r.ok) return; const v=await r.json(); if(v&&v.build&&v.build!==ME) ready=true; }catch(_){} }
  setInterval(()=>{ if(ready){ if(safe()) location.reload(); } else if(Date.now()-lastCheck>60000) check(); },3000);
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') check(); });
  window.__build=ME;
})();

boot();
</script>
