<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MGA Hub · Walnut Creek Country Club</title>
<link rel="icon" href="crest.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script><!-- window.MM_CONFIG = {url, anonKey, boardEmail}. Missing file = local-only mode. -->
<style>
:root{
  --navy:#0F2A38; --deep:#0A1C27; --gold:#8C6A1F; --goldl:#D8B75F; --ivory:#FBFAF5; --paper:#F4F0E6;
  --line:#E3DCC9; --muted:#56626A; --ink:#14222B; --pos:#1F6B4A; --neg:#A1402B; --card:#fff;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif; --sans:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
body{font-variant-numeric:lining-nums}
.num{font-variant-numeric:lining-nums tabular-nums}
.muted{color:var(--muted)} .pos{color:var(--pos)} .neg{color:var(--neg)} .r{text-align:right}
.serif{font-family:var(--serif)}

/* layout */
.app{display:flex;min-height:100vh}
.side{width:248px;flex-shrink:0;background:var(--navy);color:#E9E4D6;display:flex;flex-direction:column;padding:24px 16px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px 22px;border-bottom:1px solid rgba(216,183,95,.3)}
.brand img{width:44px;height:57px;object-fit:contain}
.brand b{font-family:var(--serif);font-size:26px;color:#fff;line-height:1;display:block}
.brand small{font-size:12px;color:var(--goldl);display:block;margin-top:4px}
.season{padding:18px 8px 10px}
.season label{font-size:12px;font-weight:600;color:#A9A595}
.season select{margin-top:6px;width:100%;height:38px;border-radius:8px;border:1px solid rgba(216,183,95,.4);background:var(--deep);color:#fff;padding:0 10px;font-weight:600}
.navlist{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;color:#C9C5B8;text-decoration:none;font-weight:500;border:none;background:none;text-align:left;width:100%}
.nav:hover{color:#fff;background:rgba(255,255,255,.05)}
.nav.on{background:rgba(216,183,95,.14);color:#fff;box-shadow:inset 0 0 0 1px rgba(216,183,95,.35)}
.nav svg{width:18px;height:18px;flex-shrink:0}
.sidefoot{margin-top:auto;padding:14px 12px 0;border-top:1px solid rgba(216,183,95,.3);display:flex;flex-direction:column;gap:10px;font-size:12.5px;color:#C9C5B8}
.sync{display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:#6FBF8E;flex-shrink:0}
.dot.saving{background:var(--goldl)} .dot.offline{background:#E07B62} .dot.local{background:#9AA3A8}
.linkbtn{background:none;border:none;color:#C9C5B8;padding:0;text-decoration:underline;text-align:left;font-size:12.5px}
.topbar{display:none}
.main{flex-grow:1;min-width:0;padding:36px 44px 60px;display:flex;flex-direction:column;gap:24px;max-width:1400px}

/* type + furniture */
.h1{font-family:var(--serif);font-weight:600;font-size:44px;line-height:1;margin:0;color:var(--navy);letter-spacing:-.01em}
.h2{font-family:var(--serif);font-weight:600;font-size:24px;margin:0;color:var(--navy);line-height:1.1}
.sub{color:var(--muted);margin:6px 0 0}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.rule{height:5px;border-top:1px solid var(--gold);border-bottom:1px solid var(--goldl)}
.crumb{display:flex;gap:8px;font-size:13px;align-items:center}
.crumb button{background:none;border:none;padding:0;color:var(--gold);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px}
.pad{padding:20px 22px}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 22px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.kpi{display:flex;flex-direction:column;gap:6px}
.kpi .v{font-family:var(--serif);font-size:38px;font-weight:600;line-height:1.05;color:var(--navy)}
.kpi .v.pos{color:var(--pos)} .kpi .v.neg{color:var(--neg)}
.lbl{font-size:12px;font-weight:600;color:var(--muted)}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--navy);font-weight:600;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:#CBBF9F}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pri:hover{background:var(--deep)}
.btn.danger{color:var(--neg)}
.btn.sm{height:32px;padding:0 12px;font-size:12.5px}
.btn svg{width:16px;height:16px}
.btn[disabled]{opacity:.5;cursor:default}
.ib{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;border:1px solid transparent;background:none;color:var(--muted);flex-shrink:0}
.ib:hover{border-color:var(--line);color:var(--navy);background:#fff}
.ib svg{width:16px;height:16px}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--paper);color:var(--navy);border:1px solid var(--line);white-space:nowrap}
.chip.gold{background:#F6ECCF;border-color:#E5CF8E;color:#6B4F12}
.chip.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.ok{background:#E3F0E8;border-color:#BCD9C7;color:var(--pos)}
.chip.inact{height:20px;font-size:11px;background:#EDEAE2;border-color:#CFC6AE;color:#5A4E36;margin-left:6px;vertical-align:1px}
.chip.warn{background:#F8E6DF;border-color:#EBC2B3;color:var(--neg)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{padding:12px 16px;font-weight:600;color:var(--muted);background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.on{color:var(--navy);border-color:var(--gold)}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--muted);font-weight:600;font-size:13px}
.seg button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.av{width:32px;height:32px;border-radius:50%;background:var(--paper);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--navy);flex-shrink:0}
.seat{padding:16px 16px 16px 20px;display:flex;flex-direction:column;gap:14px;min-width:0;min-height:168px}
.seat-top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.seat-top .ib{margin-right:-4px}
.seat-who{display:flex;align-items:center;gap:12px;min-width:0;padding-right:4px}
.seat-who .av{width:44px;height:44px;font-size:14px}
.seat-who b{font-size:15px;display:block}
.seat-who small{display:block}
.seat-act{display:flex;gap:8px;margin-top:auto}
.seat-empty{margin-top:auto;height:76px;border-style:dashed;color:var(--gold);width:100%}
.trunc{display:block}
details>summary::-webkit-details-marker{display:none}
details[open]>summary .ib svg{transform:rotate(90deg)}
.rrow{border-top:1px solid var(--line);padding:12px 22px;display:flex;flex-direction:column;gap:8px}
.rtop{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:12px;align-items:center}
.rbot{display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap;padding-left:84px}
@media (max-width:900px){ .rbot{padding-left:0} }
/* golf */
.livedot{width:8px;height:8px;border-radius:50%;background:#6FBF8E;box-shadow:0 0 0 3px rgba(111,191,142,.25);margin-left:auto;flex-shrink:0}
.nav.livelink{font-size:13px;color:#E9E4D6;margin-top:6px;border:1px dashed rgba(111,191,142,.45)}
.nav.livelink .livedot{margin-left:0}
table.scard{border-collapse:collapse;width:100%;min-width:900px;font-size:13px}
table.scard th,table.scard td{border-top:1px solid var(--line);padding:9px 6px;text-align:center}
table.scard thead th{background:var(--navy);color:#fff;font-weight:600;border-top:none}
table.scard tbody th{text-align:left;padding-left:16px;font-weight:600;white-space:nowrap;min-width:110px}
table.scard .st{background:var(--ivory);font-weight:700}
table.scard thead .st{background:var(--deep)}
table.scard tr.par td,table.scard tr.par th{background:#EEF1F2;font-weight:700}
table.scard tr.hcp td{color:var(--muted);font-size:12px}
table.scard tr.tee-gold th{box-shadow:inset 4px 0 0 #C9A227} table.scard tr.tee-blue th{box-shadow:inset 4px 0 0 #1F3F66}
table.scard tr.tee-white th{box-shadow:inset 4px 0 0 #CFC6AE} table.scard tr.tee-red th{box-shadow:inset 4px 0 0 #A1402B} table.scard tr.tee-green th{box-shadow:inset 4px 0 0 #3E6B4A}
table.scard.sheet{min-width:0} table.scard.sheet .inp{height:34px;padding:0 6px;width:56px}
.empty{padding:36px 22px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty b{font-family:var(--serif);font-size:22px;color:var(--navy)}

/* tables */
.tw{overflow-x:auto}
.t{min-width:720px}
.tr{display:grid;align-items:center;gap:12px;padding:0 22px;min-height:50px;border-top:1px solid var(--line)}
.tr.th{min-height:40px;border-top:none;font-size:12px;font-weight:600;color:var(--muted);background:var(--ivory);border-bottom:1px solid var(--line)}
.tr.th + .tr{border-top:none}
.tr.tot{background:var(--ivory);font-weight:700}
.tr.click{cursor:pointer} .tr.click:hover{background:#FDFBF4}
.cell2{display:flex;flex-direction:column;min-width:0}
.cell2 small{font-size:12px;color:var(--muted)}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 22px 10px;background:var(--ivory);border-top:1px solid var(--line)}
.gh b{color:var(--navy)}
.bl{grid-template-columns:minmax(0,1fr) minmax(0,230px) 110px 100px 40px}

/* search */
.search{position:relative;width:340px;max-width:100%}
.search svg{position:absolute;left:12px;top:11px;width:18px;height:18px;color:var(--muted)}
.search input{padding-left:38px}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}

/* forms */
.inp{height:40px;border:1px solid #CFC6AE;border-radius:8px;padding:0 12px;background:#fff;width:100%;font-size:14px}
textarea.inp{height:auto;min-height:84px;padding:10px 12px;resize:vertical}
.fld{display:flex;flex-direction:column;gap:6px}
.frow2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.check{display:flex;align-items:center;gap:8px;font-weight:500}
.check input{width:18px;height:18px;accent-color:var(--navy);flex-shrink:0;margin:1px 0 0}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,28,39,.45);opacity:0;pointer-events:none;transition:opacity .18s;z-index:40}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:520px;max-width:100%;background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column;transform:translateX(100%);visibility:hidden;transition:transform .2s ease,visibility 0s .2s;z-index:50}
.drawer.wide{width:min(780px,100%)}
.drawer.xwide{width:min(1180px,100%)}
.drawer.show{transform:none;visibility:visible;box-shadow:-18px 0 50px rgba(10,28,39,.16);transition:transform .2s ease}
.dhead{padding:24px 28px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dhead .h2{font-size:30px;margin-top:2px}
.dbody{padding:22px 28px;display:flex;flex-direction:column;gap:18px;overflow-y:auto;flex-grow:1}
.dfoot{padding:14px 28px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;background:var(--ivory)}
.mini{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.mini .mr{display:grid;gap:8px;padding:6px 12px;align-items:center;border-top:1px solid var(--line)}
.mini .mr.h{background:var(--ivory);font-size:12px;font-weight:600;color:var(--muted);border-top:none;padding:8px 12px}
.mini .inp{height:34px;padding:0 8px}
.sumrows{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.sumrows div{display:flex;justify-content:space-between}
.sumrows .big{font-weight:700;font-size:16px;color:var(--navy)}
.pick{display:flex;flex-direction:column;max-height:50vh;overflow-y:auto;border:1px solid var(--line);border-radius:8px}
.pick button{display:flex;align-items:center;gap:12px;padding:10px 14px;border:none;border-top:1px solid var(--line);background:#fff;text-align:left}
.pick button:first-child{border-top:none}
.pick button.on{background:#F6ECCF}
.pick button[disabled]{opacity:.5}

/* toast + login */
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:80;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:none;border:none;color:var(--goldl);font-weight:700;padding:0}
.login{position:fixed;inset:0;background:var(--navy);display:none;align-items:center;justify-content:center;z-index:90;padding:20px}
.login.show{display:flex}
.login .card{width:380px;max-width:100%;padding:32px;display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center}
.login img{width:96px}
.banner{background:#F6ECCF;border:1px solid #E5CF8E;color:#5C4410;border-radius:10px;padding:12px 16px;font-size:13.5px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}

/* responsive: web first, still usable on a phone */
@media (max-width:1100px){ .g4{grid-template-columns:repeat(2,minmax(0,1fr))} .split{grid-template-columns:minmax(0,1fr)} }
@media (max-width:900px){
  .side{position:fixed;left:0;top:0;z-index:60;transform:translateX(-100%);transition:transform .2s;padding-top:calc(24px + env(safe-area-inset-top,0px))}
  .side.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.4)}
  .topbar{display:flex;align-items:center;gap:10px;background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;position:sticky;top:0;z-index:30}
  .topbar img{width:26px;height:34px;object-fit:contain}
  .topbar b{font-family:var(--serif);font-size:22px}
  .topbar .ib{color:#fff;width:44px;height:44px}
  .app{flex-direction:column}
  .main{padding:20px 16px 48px;gap:18px}
  .h1{font-size:34px}
  .g3,.g2,.frow2{grid-template-columns:minmax(0,1fr)}
  .kpi .v{font-size:30px}
  .tr{padding:0 14px}
  .drawer{width:100%}
  .t.bt{min-width:0}
  .bl{grid-template-columns:minmax(0,1fr) 92px 32px}
  .bl>:nth-child(2),.bl>:nth-child(4){display:none}
  .side{height:100%}
  .dhead,.dbody,.dfoot{padding-left:18px;padding-right:18px}
}
@media (max-width:640px){ .grid.board{grid-template-columns:minmax(0,1fr)} .seat{min-height:0} }
/* checklist */
.ck-g{padding:10px 22px 4px;font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-dk,#7E5F1A);background:var(--ivory,#FBFAF5);border-top:1px solid var(--line)}
.ck-row{display:grid;grid-template-columns:34px minmax(0,1fr) 210px;gap:10px;align-items:center;padding:10px 22px;border-top:1px solid var(--line);cursor:pointer}
.ck-row:hover{background:#FBF7EC}
.ck-box{display:flex;align-items:center;justify-content:center;width:34px;height:34px;margin:-6px 0} .ck-box input{width:20px;height:20px;accent-color:#1F6B4A;cursor:pointer}
.ck-main{display:flex;flex-direction:column;gap:3px;min-width:0} .ck-text{font-size:14.5px;line-height:1.35} .ck-note{font-size:12.5px;color:var(--muted);white-space:pre-wrap}
.ck-who{display:flex;align-items:center;gap:8px;min-width:0;font-size:13.5px;justify-content:flex-start}
.ck-row.done .ck-text{text-decoration:line-through;color:var(--muted)}
@media (max-width:640px){ .ck-row{grid-template-columns:34px minmax(0,1fr);padding:10px 14px} .ck-who{grid-column:2;font-size:12.5px} .ck-g{padding:10px 14px 4px} .ck-sec .cardhead{flex-wrap:wrap;gap:10px} }
/* 50/50 drawing */
.rf-step{display:flex;gap:16px;align-items:flex-start} .rf-n{flex:none;width:30px;height:30px;border-radius:50%;background:#EEE8DA;color:var(--navy,#0F2A38);font-weight:800;display:flex;align-items:center;justify-content:center}
.rf-step.done .rf-n{background:#1F6B4A;color:#fff} .rf-step.wait{opacity:.6} .rf-t{display:block;font-size:16px;margin-bottom:4px}
.rf-sus{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0;border-top:1px dashed var(--line)} .rf-sus>span:first-child{flex:1 1 260px}
.rf-draw{display:flex;align-items:center;gap:14px;justify-content:space-between;padding:12px 14px;border:1px solid var(--line);border-radius:10px;margin-top:8px;background:#fff}
.rf-draw>div{display:flex;flex-direction:column;gap:2px;min-width:0} .rf-draw.void{opacity:.6;text-decoration:line-through}
.rf-ppl{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:0 24px;padding:10px 22px 18px;max-height:380px;overflow:auto}
.rf-ppl>div{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:14px}
.rf-show{position:fixed;inset:0;z-index:200;background:radial-gradient(circle at 50% 35%,#1B3D50,#0A1C27 70%);color:#fff;display:flex;flex-direction:column;font-variant-numeric:lining-nums}
.rf-top{display:flex;align-items:center;gap:18px;padding:22px 36px;border-bottom:3px solid #C7A13A} .rf-top img{width:58px} .rf-top>div{flex:1}
.rf-k{font-size:12px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:#D8B75F} .rf-h{font-family:var(--serif,Georgia),serif;font-size:34px;font-weight:700;line-height:1.05}
.rf-x{background:none;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;width:40px;height:40px;font-size:18px}
.rf-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center}
.rf-lbl{font-size:16px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:#D8B75F} .rf-prize{font-family:var(--serif,Georgia),serif;font-size:min(14vw,120px);font-weight:700;line-height:1}
.rf-ticket{width:min(780px,92vw);border:3px solid #C7A13A;border-radius:18px;background:rgba(10,28,39,.55);padding:26px 30px;box-shadow:0 30px 80px rgba(0,0,0,.45);position:relative}
.rf-ticket::before,.rf-ticket::after{content:'';position:absolute;top:50%;width:28px;height:28px;border-radius:50%;background:#0F2A38;transform:translateY(-50%)} .rf-ticket::before{left:-16px} .rf-ticket::after{right:-16px}
.rf-tk-top{font-size:13px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:#AEB8BE} .rf-tk-name{font-family:var(--serif,Georgia),serif;font-size:min(9vw,76px);font-weight:700;line-height:1.1;margin-top:8px}

<script>
/* =====================================================================
   MGA Hub — core: data model, calculations, storage + sync, import, verify
   Data lives in ONE jsonb row: public.mga_hub (id 'main').
   The current Member-Member app's row (public.mm_tournament) is only ever
   READ here, for importing and cross-verifying. Nothing writes to it.
   ===================================================================== */
const $=id=>document.getElementById(id);
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));
const n0=v=>{const x=parseFloat(v);return isFinite(x)?x:0;};
const fmt=v=>{const x=Math.round(n0(v));return (x<0?'−$':'$')+Math.abs(x).toLocaleString('en-US');};
const fmtS=v=>{const x=Math.round(n0(v));return x>0?'+'+fmt(x):fmt(x);};
const fmt2=v=>{const x=n0(v);return (x<0?'−$':'$')+Math.abs(x).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const sum=(a,f)=>(a||[]).reduce((t,x)=>t+n0(f(x)),0);
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function parseD(s){ if(!s) return null; const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s); return m?new Date(+m[1],+m[2]-1,+m[3]):null; }
function addDays(d,k){ const x=new Date(d); x.setDate(x.getDate()+k); return x; }
function dateRange(t){
  const d=parseD(t.startDate); if(!d) return 'Date TBD';
  const e=addDays(d,(t.days||1)-1);
  if(t.days<=1) return MONTHS[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear();
  return MONTHS[d.getMonth()]+' '+d.getDate()+'–'+(e.getMonth()!==d.getMonth()?MONTHS[e.getMonth()]+' ':'')+e.getDate()+', '+e.getFullYear();
}
function dayLabel(t,i){
  const d=parseD(t.startDate); const nm=['Day 1','Day 2','Day 3'][i];
  if(!d) return nm;
  const x=addDays(d,i); return x.toLocaleDateString('en-US',{weekday:'long'})+' · '+nm;
}
function dayShort(t,i){ const d=parseD(t.startDate); if(!d) return ''; const x=addDays(d,i); return MONTHS[x.getMonth()]+' '+x.getDate(); }
function daysOut(t){ const d=parseD(t.startDate); if(!d) return null; const now=new Date(); now.setHours(0,0,0,0); return Math.round((d-now)/864e5); }

/* ---------- model ---------- */
const HUB_VERSION=1;
const DEFAULT_ROLES=['President','Vice President','Treasurer','Secretary','Tournament Chair','Member at Large','Member at Large'];
const ITEM_KINDS=['Meal','Drinks','Event','Other'];
function newSeason(){ return {dues:{amount:90,installments:2},duesPayments:[],lines:[],txns:[],bank:[],bankBatches:[],bankOpening:{amount:0,date:''}}; }
function emptyHub(){
  const y=String(new Date().getFullYear());
  return {v:HUB_VERSION,activeSeason:y,members:[],board:DEFAULT_ROLES.map(r=>({id:uid(),role:r,memberId:'',term:''})),
          seasons:{[y]:newSeason()},tournaments:[]};
}
function newTournament(o){
  const days=Math.min(3,Math.max(1,+o.days||1));
  return {id:uid(),season:o.season,name:o.name||'New tournament',startDate:o.startDate||'',days,venue:o.venue||'Walnut Creek Country Club',
    status:'Planning',budgetBasis:'planned',entryFee:n0(o.entryFee),skinsFee:n0(o.skinsFee),plannedPlayers:n0(o.plannedPlayers),teamSize:+o.teamSize||2,ggEvent:o.ggEvent||'',
    field:[],sponsors:[],tiers:[],goal:0,
    dayItems:[[],[],[]].slice(0,3),income:[],perPlayer:[],lines:[],
    actuals:{entryFees:0,skins:0,skinsPaid:0},schedule:[],decisions:[],notes:'',source:null};
}
function normalize(d){
  if(!d||typeof d!=='object') return emptyHub();
  d.v=d.v||HUB_VERSION; d.members=d.members||[]; d.board=d.board||[]; d.seasons=d.seasons||{}; d.tournaments=d.tournaments||[];
  if(!d.activeSeason) d.activeSeason=String(new Date().getFullYear());
  if(!d.seasons[d.activeSeason]) d.seasons[d.activeSeason]=newSeason();
  for(const s of Object.values(d.seasons)){ s.dues=s.dues||{amount:90,installments:2}; s.duesPayments=s.duesPayments||[]; s.lines=s.lines||[]; s.txns=s.txns||[]; s.bank=s.bank||[]; s.bankBatches=s.bankBatches||[]; s.bankOpening=s.bankOpening||{amount:0,date:''}; }
  for(const t of d.tournaments){
    t.dayItems=t.dayItems||[[],[],[]]; while(t.dayItems.length<3) t.dayItems.push([]);
    for(const k of ['field','sponsors','tiers','income','perPlayer','lines','schedule','decisions','fieldQuestions']) t[k]=t[k]||[];
    t.actuals=Object.assign({entryFees:0,skins:0,skinsPaid:0},t.actuals||{}); if(!t.budgetBasis) t.budgetBasis='planned';
    (t.dayItems||[]).forEach(d=>(d||[]).forEach(it=>{ if(it.menu) it.menu.svcPct=0; }));
    if(t.source&&t.source.raw) t.source.raw.dinnerSvc=0;
    if(!d.seasons[t.season]) d.seasons[t.season]=newSeason();
  }
  return d;
}

/* ---------- calculations (single source of truth for every number on screen) ---------- */
function menuSubtotal(m){ return sum(m&&m.items,i=>n0(i.qty)*n0(i.unitCost)); }
/* catered menus use the club's all-in prices — nothing is added on top */
function menuCharge(m){ return 0; }
function menuTotal(m){ return menuSubtotal(m); }
/* Budget uses the planned player count unless the board switches it to the field (so a half-filled field doesn't sink the budget). */
function playersUsed(t){ return t.budgetBasis==='field'?t.field.length:n0(t.plannedPlayers); }
function itemQty(t,it){ return it.qtyLink==='players'?playersUsed(t):n0(it.qty); }
function itemTotal(t,it){ return it.menu?menuTotal(it.menu):itemQty(t,it)*n0(it.unitCost); }
function spPaid(s){ return sum(s.payments,p=>p.amount); }
/* ---------- ledger-driven actuals ----------
   A budget line's actual comes from the Treasury ledger once any entry is linked to it;
   until then it uses the number typed on the line. Link = {t: tournament id ('' = MGA), k: kind, id}. */
const INCOME_KINDS=new Set(['inc','entry','skins','mgaInc']);
function ledgerIndex(season){ const s=db.seasons[season], idx={}; if(!s) return idx;
  for(const x of s.txns||[]){ const L=x.link; if(!L||!L.k) continue; const key=(L.t||'')+'|'+L.k+'|'+(L.id||'');
    const signed=n0(x.amount)*((x.dir==='in')===INCOME_KINDS.has(L.k)?1:-1);
    const r=idx[key]||(idx[key]={sum:0,n:0}); r.sum+=signed; r.n++; }
  return idx; }
function linkInfo(season,tid,k,id){ return ledgerIndex(season)[(tid||'')+'|'+k+'|'+(id||'')]||null; }
function actualOf(IX,tid,k,id,manual){ const r=IX[(tid||'')+'|'+k+'|'+(id||'')]; return r?r.sum:n0(manual); }
function tcalc(t){
  const players=playersUsed(t), days=t.days||1;
  const entryFees=players*n0(t.entryFee), skins=players*n0(t.skinsFee);
  const pledged=sum(t.sponsors,s=>s.pledged), received=sum(t.sponsors,spPaid);
  const otherInc=sum(t.income,i=>i.budget);
  const revenue=entryFees+skins+pledged+otherInc;
  const dayTot=[0,1,2].map(i=>i<days?sum(t.dayItems[i],it=>itemTotal(t,it)):0);
  const IX=ledgerIndex(t.season), A=(k,id,m)=>actualOf(IX,t.id,k,id,m);
  const dayAct=[0,1,2].map(i=>i<days?sum(t.dayItems[i],it=>A('item',it.id,it.actual)):0);
  const perPlayer=sum(t.perPlayer,p=>players*n0(p.perPlayer));
  const lineTot=sum(t.lines,l=>l.budget);
  const skinsPayout=skins;
  const expenses=dayTot[0]+dayTot[1]+dayTot[2]+perPlayer+skinsPayout+lineTot;
  const a=t.actuals;
  const revenueA=A('entry','',a.entryFees)+A('skins','',a.skins)+received+sum(t.income,i=>A('inc',i.id,i.actual));
  const expensesA=dayAct[0]+dayAct[1]+dayAct[2]+sum(t.perPlayer,p=>A('pp',p.id,p.actual))+A('skinsPaid','',a.skinsPaid)+sum(t.lines,l=>A('line',l.id,l.actual));
  return {players,entryFees,skins,pledged,received,otherInc,revenue,dayTot,dayAct,perPlayer,lineTot,skinsPayout,expenses,
          net:revenue-expenses,revenueA,expensesA,netA:revenueA-expensesA};
}
/* A tournament counts as past once it's marked Complete or its last day is behind us. */
function tEnd(t){ const d=parseD(t.startDate); return d?addDays(d,(t.days||1)-1):null; }
function isPast(t){ if(t.status==='Complete') return true; const e=tEnd(t); if(!e) return false; const now=new Date(); now.setHours(0,0,0,0); return e<now; }
function seasonTournaments(y){ return db.tournaments.filter(t=>t.season===y).sort((a,b)=>(a.startDate||'9').localeCompare(b.startDate||'9')); }
function scalc(y){
  const s=db.seasons[y]||newSeason(), ts=seasonTournaments(y).map(t=>({t,c:tcalc(t)}));
  const active=db.members.filter(m=>m.status!=='Inactive').length;
  const duesBudget=active*n0(s.dues.amount), duesActual=sum(s.duesPayments,p=>p.amount);
  const incLines=s.lines.filter(l=>l.type==='Income'), expLines=s.lines.filter(l=>l.type!=='Income');
  const tRev=sum(ts,x=>x.c.revenue), tExp=sum(ts,x=>x.c.expenses), tRevA=sum(ts,x=>x.c.revenueA), tExpA=sum(ts,x=>x.c.expensesA);
  const revenue=tRev+duesBudget+sum(incLines,l=>l.budget), expenses=tExp+sum(expLines,l=>l.budget);
  const IX=ledgerIndex(y), mA=l=>actualOf(IX,'',l.type==='Income'?'mgaInc':'mgaExp',l.id,l.actual);
  const revenueA=tRevA+duesActual+sum(incLines,mA), expensesA=tExpA+sum(expLines,mA);
  const raffle=sum(ts,x=>sum(x.t.income.filter(i=>i.source==='raffle'),i=>i.budget));
  const raffleA=sum(ts,x=>sum(x.t.income.filter(i=>i.source==='raffle'),i=>actualOf(IX,x.t.id,'inc',i.id,i.actual)));
  /* Projected season net: actuals for tournaments that are over, budget for the rest, plus MGA-level money
     (dues and MGA lines use actuals once the season's tournaments are all past, budget otherwise). */
  const past=ts.filter(x=>isPast(x.t)), upcoming=ts.filter(x=>!isPast(x.t));
  const tProj=sum(past,x=>x.c.netA)+sum(upcoming,x=>x.c.net);
  const mgaBud=duesBudget+sum(incLines,l=>l.budget)-sum(expLines,l=>l.budget);
  const projected=tProj+mgaBud;
  return {s,ts,active,duesBudget,duesActual,tRev,tExp,revenue,expenses,net:revenue-expenses,past,upcoming,tProj,projected,revenueA,expensesA,netA:revenueA-expensesA,raffle,raffleA,
          pledged:sum(ts,x=>x.c.pledged),received:sum(ts,x=>x.c.received)};
}
function memberDues(y,mid){ const s=db.seasons[y]; return s?sum(s.duesPayments.filter(p=>p.memberId===mid),p=>p.amount):0; }
const memberName=m=>m?[m.first,m.last].filter(Boolean).join(' ')||'(no name)':'';
const initials=m=>m?((m.first||'?')[0]+((m.last||'')[0]||'')).toUpperCase():'—';
const memberById=id=>db.members.find(m=>m.id===id);

/* ---------- import from the current Member-Member app (read-only) ----------
   Converts one year of the old app's state into a hub tournament. Every number
   is carried across unchanged so the Verify tab can prove the budgets match. */
function guessKind(name){ return /dinner|lunch|buffet|snack|hors|breakfast|meal/i.test(name)?'Meal':/keg|bar\b|beer|margarita|bloody|cocktail|drink/i.test(name)?'Drinks':'Event'; }
function oldResQty(y,i){ return i.qtyLink?n0((y.inputs||{})[i.qtyLink]):n0(i.qty); }
function convertMM(y,year){
  const inp=y.inputs||{}, rev=y.rev||{}, act=y.actuals||{};
  const m=/([A-Za-z]+)\s+(\d{1,2})/.exec((y.info&&y.info.dates)||'');
  let start=''; if(m){ const mi=MONTHS.findIndex(x=>m[1].toLowerCase().startsWith(x.toLowerCase())); if(mi>=0) start=`${year}-${String(mi+1).padStart(2,'0')}-${String(m[2]).padStart(2,'0')}`; }
  const t=newTournament({season:String(year),name:'Member-Member',startDate:start,days:3,venue:(y.info&&y.info.venue)||'Walnut Creek Country Club',
    entryFee:inp.entryFee,skinsFee:inp.skins,plannedPlayers:inp.golfers,teamSize:2});
  t.goal=n0(y.goal);
  t.tiers=(y.tiers||[]).map(x=>({id:x.id||uid(),name:x.name,amt:n0(x.amt)}));

/* ---------- collaborative saving ----------

   shared) and try again. Merging works item by item — tournaments, lots, bidders, members, ledger

function copyStructure(src,t){
  const re=a=>(a||[]).map(x=>Object.assign(clone(x),{id:uid()}));

  t.dayItems=[0,1,2].map(i=>i<t.days?re(src.dayItems[i]).map(x=>{x.actual=0; if(x.menu) x.menu.items=re(x.menu.items); return x;}):[]);

  if(!t.entryFee) t.entryFee=src.entryFee; if(!t.skinsFee) t.skinsFee=src.skinsFee;
}

/* ---------- Import from the current app ---------- */
async function importMM(){
  let state;
  try{ state=await fetchMMState(); }
  catch(e){ return importMMFromFile(e.message); }
  chooseMMYear(state,'the current app');
}
function importMMFromFile(reason){
  openDrawer({kicker:'Import',title:'Import Member-Member',
    body:`<p class="hint">${esc(reason)}.</p><p class="muted" style="margin:0">Choose a backup file downloaded from the current app (⋯ → Backup all data).</p><input type="file" id="impFile" accept="application/json" class="inp" style="padding-top:8px">`,
    wire:r=>{ r.querySelector('#impFile').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const rd=new FileReader();
      rd.onload=()=>{ try{ const d=JSON.parse(rd.result); if(!d.years) throw 0; closeDrawer(); chooseMMYear(d,'the backup file'); }catch(_){ toast('That isn’t a backup from the Member-Member app'); } }; rd.readAsText(f); }; }});
}
function chooseMMYear(state,from){
  const years=Object.keys(state.years||{}).sort((a,b)=>b-a);
  if(!years.length){ toast('No years found in '+from); return; }
  const existing=db.tournaments.find(t=>t.source&&t.source.kind==='mm-app'&&t.source.year===(state.activeYear||years[0]));
  openDrawer({kicker:'Import from '+from,title:'Import Member-Member',saveLabel:existing?'Replace with fresh import':'Import',
    body:field('Year','impYear',state.activeYear||years[0],{type:'select',options:years})+
      `<p class="hint">Brings over sponsors and payments, all three days of food &amp; beverage (the Saturday dinner menu included), income, misc expenses, actuals, the schedule and open decisions. The current app is only read — nothing there changes.</p>`+
      (existing?`<div class="banner">This year is already imported. Importing again replaces that tournament with a fresh copy, so any edits made to it in the hub are lost.</div>`:''),
    save:()=>{
      const yr=fv('impYear'), t=convertMM(state.years[yr],yr);
      if(!db.seasons[yr]) db.seasons[yr]=newSeason();
      const old=db.tournaments.find(x=>x.source&&x.source.kind==='mm-app'&&x.source.year===yr);
      if(old){ t.id=old.id; t.field=old.field; db.tournaments[db.tournaments.indexOf(old)]=t; } else db.tournaments.push(t);
      db.activeSeason=yr; view.page='tournament'; view.tid=t.id; view.ttab='verify'; toast('Imported — checking against the current app');
    }});
}

/* Catered menu: line items × qty × all-in price */
function editMenu(t,di,it){
  const menu=it?clone(it.menu):{items:[],svcPct:0,guests:playersUsed(t)}; menu.svcPct=0;
  const rowsHTML=()=>menu.items.map((x,i)=>`<div class="mr num" style="grid-template-columns:minmax(0,1fr) 64px 84px 76px 28px"><input class="inp" data-mi="${i}" data-k="item" value="${esc(x.item)}" aria-label="Menu item"><input class="inp r" data-mi="${i}" data-k="qty" inputmode="decimal" value="${esc(x.qty)}" aria-label="${esc(x.item)} quantity"><input class="inp r" data-mi="${i}" data-k="unitCost" inputmode="decimal" value="${esc(x.unitCost)}" aria-label="${esc(x.item)} unit price"><b class="r" data-mt="${i}">${fmt(n0(x.qty)*n0(x.unitCost))}</b><button class="ib" data-mdel="${i}" aria-label="Remove ${esc(x.item)}">${I.x}</button></div>`).join('')||'<div class="mr"><span class="muted">No menu items yet.</span></div>';
  const totals=()=>{ const g=n0(menu.guests), tot=menuTotal(menu);
    return `<div class="big"><span>Total <small class="muted" style="font-weight:500">all-in prices</small></span><span>${fmt(tot)}</span></div><div><span class="muted">Per guest</span><span>${g?fmt2(tot/g):'—'}</span></div>`; };
  openDrawer({kicker:dayLabel(t,di)+' · Catered menu',title:it?it.item:'New catered menu',
    body:field('Name','mName',it?.item||'Dinner',{ph:'e.g. Dinner (WCCC)'})+field('Guests','mGuests',menu.guests,{type:'number',hint:'Prices are all-in from the club — nothing is added on top.'})+
      (fieldRSVP(t).headcount!=null&&fieldRSVP(t).headcount!==n0(menu.guests)?`<div class="banner" style="justify-content:space-between"><span>Field RSVPs: <b>${fieldRSVP(t).headcount}</b> (${fieldRSVP(t).dinner} players + ${fieldRSVP(t).guests||0} plus-ones)</span><button class="btn sm" type="button" id="mUseRsvp">Use ${fieldRSVP(t).headcount}</button></div>`:'')+
      `<div class="fld"><div style="display:flex;justify-content:space-between;align-items:center"><span class="lbl">Menu</span><button class="btn sm" id="mAdd" type="button">${I.plus}Add item</button></div>
       <div class="mini"><div class="mr h" style="grid-template-columns:minmax(0,1fr) 64px 84px 76px 28px"><span>Item</span><span class="r">Qty</span><span class="r">Unit $</span><span class="r">Total</span><span></span></div><div id="mRows">${rowsHTML()}</div></div></div>
       <div class="sumrows num" id="mTot">${totals()}</div>`+actField('Actual $ (final bill)','mAct',t.season,t.id,'item',it?.id,it?.actual)+field('Notes','mNotes',it?.notes||'',{type:'textarea'}),
    wire:r=>{
      const rewire=()=>{ r.querySelector('#mRows').innerHTML=rowsHTML(); bind(); r.querySelector('#mTot').innerHTML=totals(); };
      const bind=()=>{ r.querySelectorAll('[data-mi]').forEach(inp=>inp.oninput=()=>{ const x=menu.items[+inp.dataset.mi]; x[inp.dataset.k]=inp.dataset.k==='item'?inp.value:inp.value; const i=+inp.dataset.mi;
          r.querySelector(`[data-mt="${i}"]`).textContent=fmt(n0(x.qty)*n0(x.unitCost)); r.querySelector('#mTot').innerHTML=totals(); });
        r.querySelectorAll('[data-mdel]').forEach(b=>b.onclick=()=>{ menu.items.splice(+b.dataset.mdel,1); rewire(); }); };
      bind();
      r.querySelector('#mAdd').onclick=()=>{ menu.items.push({id:uid(),item:'',qty:0,unitCost:0,notes:''}); rewire(); const ins=r.querySelectorAll('[data-k=item]'); ins[ins.length-1].focus(); };
      const ur=r.querySelector('#mUseRsvp'); if(ur) ur.onclick=()=>{ menu.guests=fieldRSVP(t).headcount; r.querySelector('#mGuests').value=menu.guests; r.querySelector('#mTot').innerHTML=totals(); ur.closest('.banner').remove(); };
      r.querySelector('#mGuests').oninput=e=>{ menu.guests=n0(e.target.value); r.querySelector('#mTot').innerHTML=totals(); };
    },
    save:()=>{ menu.items=menu.items.filter(x=>x.item.trim()||n0(x.qty)||n0(x.unitCost)).map(x=>({...x,qty:n0(x.qty),unitCost:n0(x.unitCost)}));
      menu.guests=fnum('mGuests'); menu.svcPct=0;
      const data={item:fv('mName')||'Catered menu',kind:'Meal',menu,qty:menu.guests,unitCost:0,qtyLink:'',actual:fnum('mAct'),notes:fv('mNotes')};
      if(it) Object.assign(it,data); else t.dayItems[di].push(Object.assign({id:uid()},data)); },
    del:it?()=>{ const i=t.dayItems[di].indexOf(it); t.dayItems[di].splice(i,1); toast('Menu removed',()=>{t.dayItems[di].splice(i,0,it);persist();render();}); }:null});
}

/* Field */
const inactiveBadge=m=>m&&m.status==='Inactive'?' <span class="chip inact" title="Not on the active MGA member list">Not Active</span>':'';
function tField(el,t){
  const size=t.teamSize||2, teams={};
  t.field.forEach(p=>{ (teams[p.team||0]=teams[p.team||0]||[]).push(p); });
  const nums=Object.keys(teams).map(Number).sort((a,b)=>a-b);
  const paid=t.field.filter(p=>p.paid).length, skins=t.field.filter(p=>p.skins).length;
  const cols=`grid-template-columns:80px repeat(${size},minmax(0,1fr)) 120px 40px`;
  const rs=fieldRSVP(t), qs=t.fieldQuestions||[];
  const ansLine=p=>qs.filter(q=>yes((p.answers||{})[q.key])).map(q=>q.short||qShort(q.label)).join(' · ');
  const nInact=t.field.filter(p=>{const m=memberById(p.memberId);return m&&m.status==='Inactive';}).length;
  el.innerHTML=`<div class="grid g4">${kpi('Players in field',String(t.field.length),(size>1?`${nums.length} team${nums.length===1?'':'s'} of ${size}`:'individual')+(nInact?` · ${nInact} not active`:''))}${kpi('Entry fee',fmt(t.entryFee),'per player')}${kpi('Entry fees paid',String(paid),`of ${t.field.length} · ${fmt(paid*n0(t.entryFee))} collected`)}${rs.headcount!=null?kpi('Dinner headcount',String(rs.headcount),`${rs.dinner} players${rs.guests!=null?' + '+rs.guests+' plus-ones':''}`):kpi('Skins entered',String(skins),n0(t.skinsFee)?'× '+fmt(t.skinsFee):'no skins fee set')}</div>
  ${qs.length?`<div class="card pad" style="display:flex;gap:10px 24px;flex-wrap:wrap;align-items:center;font-size:13.5px"><span class="lbl">RSVPs</span>${qs.map(q=>`<span><b class="num">${t.field.filter(p=>yes((p.answers||{})[q.key])).length}</b> <span class="muted">${esc(q.label)}</span></span>`).join('')}${t.rosterFile?`<span class="muted" style="margin-left:auto;font-size:12.5px">From ${esc(t.rosterFile)} · ${new Date(t.rosterImportedAt).toLocaleDateString()}</span>`:''}</div>`:''}
  ${t.budgetBasis!=='field'?`<div class="banner">The budget uses ${n0(t.plannedPlayers)} planned players. Switch it to the field in Tournament details once signups close.</div>`:''}
  <div class="toolbar"><div class="actions"><button class="btn pri" id="fImp">${I.down}Import roster</button><button class="btn" id="fAdd">${I.plus}Add ${size>1?'team':'player'}</button></div><span class="muted" style="margin-left:auto;font-size:13px">Players are picked from Members${db.members.length?'':' — add members first'}.</span></div>
  <div class="card" style="overflow:hidden">${t.field.length?`<div class="tw"><div class="t"><div class="tr th" style="${cols}"><span>${size>1?'Team':'#'}</span>${Array.from({length:size},(_,i)=>`<span>Player ${i+1}</span>`).join('')}<span>Entry</span><span></span></div>
    ${nums.map(n=>`<div class="tr click" data-team="${n}" style="${cols}"><span class="muted">${size>1?'Team '+n:n}</span>${Array.from({length:size},(_,i)=>{const p=teams[n][i];const mm=p&&memberById(p.memberId);return p?`<div class="cell2"><b class="trunc">${esc(mm?memberName(mm):p.name||'Unknown')}${inactiveBadge(mm)}${p.skins?' <span class="chip" style="height:20px;font-size:11px">Skins</span>':''}</b>${ansLine(p)?`<small class="trunc">${esc(ansLine(p))}</small>`:''}</div>`:'<span class="muted">—</span>';}).join('')}<span>${teams[n].every(p=>p.paid)?'<span class="chip ok">Paid</span>':`<span class="chip warn">${fmt(teams[n].filter(p=>!p.paid).length*n0(t.entryFee))} due</span>`}</span><span class="ib">${I.edit}</span></div>`).join('')}</div></div>`:`<div class="empty"><b>No field yet</b><span>Import the Golf Genius roster, or add ${size>1?'teams':'players'} from the member list as they sign up.</span></div>`}</div>`;
  $('fAdd').onclick=()=>editTeam(t,null); $('fImp').onclick=()=>importField(t);
  el.querySelectorAll('[data-team]').forEach(r=>r.onclick=()=>editTeam(t,+r.dataset.team));
}
function editTeam(t,num){
  const size=t.teamSize||2, existing=num!=null?t.field.filter(p=>(p.team||0)===num):[];
  const next=num!=null?num:(Math.max(0,...t.field.map(p=>p.team||0))+1);
  const taken=new Set(t.field.filter(p=>(p.team||0)!==num).map(p=>p.memberId));
  const opts=[['','— Choose member —'],['__new','+ New player (not an MGA member — added as Not Active)']].concat(db.members.slice().sort((a,b)=>memberName(a).localeCompare(memberName(b))).map(m=>[m.id,memberName(m)+(m.status==='Inactive'?' — Not Active':'')+(taken.has(m.id)?' (already in field)':'')]));
  openDrawer({kicker:t.name+' · Field',title:size>1?(num!=null?'Team '+num:'Add team'):(num!=null?'Edit player':'Add player'),
    body:(size>1?field('Team number','tmNum',next,{type:'number'}):'')+Array.from({length:size},(_,i)=>{const p=existing[i]||{};return `<div class="card pad" style="display:flex;flex-direction:column;gap:10px">${field('Player '+(i+1),'tmM'+i,p.memberId||'',{type:'select',options:opts})}<div id="tmB${i}">${inactiveBadge(memberById(p.memberId))?`<span class="chip inact">Not Active</span>`:''}</div>
      <div id="tmN${i}" hidden style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px"><input class="inp" id="tmNF${i}" placeholder="First name" aria-label="New player first name"><input class="inp" id="tmNL${i}" placeholder="Last name" aria-label="New player last name"><input class="inp" id="tmNE${i}" placeholder="Email (optional)" aria-label="New player email"></div><div style="display:flex;gap:10px 18px;flex-wrap:wrap"><label class="check"><input type="checkbox" id="tmP${i}"${p.paid?' checked':''}>Entry paid</label><label class="check"><input type="checkbox" id="tmS${i}"${p.skins?' checked':''}>In skins</label>${(t.fieldQuestions||[]).map((q,qi)=>`<label class="check"><input type="checkbox" id="tmQ${i}_${qi}"${yes((p.answers||{})[q.key])?' checked':''}>${esc(q.short||qShort(q.label))}</label>`).join('')}</div></div>`;}).join('')+
      '<p class="hint">Players who aren’t active MGA members can still play. Pick “New player” to add them to Members as Inactive; they show as Not Active in the field.</p>',
    wire:r=>{ for(let i=0;i<size;i++){ const s=r.querySelector('#tmM'+i); const upd=()=>{ const n=r.querySelector('#tmN'+i); n.hidden=s.value!=='__new'; n.style.display=s.value==='__new'?'grid':'none';
        r.querySelector('#tmB'+i).innerHTML=(s.value==='__new'||inactiveBadge(memberById(s.value)))?'<span class="chip inact">Not Active</span>':''; if(s.value==='__new') r.querySelector('#tmNF'+i).focus(); }; s.onchange=upd; upd(); } },
    save:()=>{ const team=size>1?(+fv('tmNum')||next):next; const picks=[], created=[];
      for(let i=0;i<size;i++){ let mid=fv('tmM'+i); if(!mid) continue;
        if(mid==='__new'){ const f=fv('tmNF'+i), l=fv('tmNL'+i); if(!f&&!l){ toast('Enter the new player’s name'); return false; }
          const dup=db.members.find(m=>(m.first||'').toLowerCase()===f.toLowerCase()&&(m.last||'').toLowerCase()===l.toLowerCase());
          if(dup){ mid=dup.id; } else { const m={id:uid(),first:f,last:l,email:fv('tmNE'+i).toLowerCase(),status:'Inactive',joined:'',notes:'Added from the '+t.name+' field',source:'field'}; created.push(m); mid=m.id; } } if(taken.has(mid)){ toast(memberName(memberById(mid))+' is already in the field'); return false; }
        if(picks.some(p=>p.memberId===mid)){ toast('Same member picked twice'); return false; }
        const prev=existing.find(p=>p.memberId===mid)||existing[i]||{}; const answers=Object.assign({},prev.memberId===mid?prev.answers:{});
        (t.fieldQuestions||[]).forEach((q,qi)=>{ answers[q.key]=$(`tmQ${i}_${qi}`).checked?'Yes':'No'; });
        picks.push({...(prev.memberId===mid?prev:{}),id:(prev.memberId===mid&&prev.id)||uid(),memberId:mid,team,paid:$('tmP'+i).checked,skins:$('tmS'+i).checked,answers}); }
      if(!picks.length){ toast('Pick at least one player'); return false; }
      created.forEach(m=>db.members.push(m));
      t.field=t.field.filter(p=>(p.team||0)!==num).concat(picks);
      if(created.length) toast(created.map(memberName).join(' and ')+' added to Members as Inactive'); },
    del:num!=null?()=>{ t.field=t.field.filter(p=>(p.team||0)!==num); }:null,delLabel:size>1?'Remove team':'Remove player'});
}

function budgetEdit(t,key){
  const [k,a,b]=key.split(':');

  if(k==='inc') return editLine(t,'income',t.income.find(x=>x.id===a));
  if(k==='ln') return editLine(t,'lines',t.lines.find(x=>x.id===a));

  if(k==='a'){
    const lab={entryFees:'Entry fees collected',skins:'Skins / day money collected',skinsPaid:'Skins / day money paid out'}[a];

/* Verify: hub numbers vs the current app, recomputed the old app's way */
function tVerify(el,t){
  const render2=(raw,label)=>{
    const rows=verifyRows(t,raw); let bad=0;
    const body=rows.map(r=>{ if(r[1]===null) return `<div class="gh"><b>${r[0]}</b><span></span></div>`;
      const d=n0(r[2])-n0(r[1]), ok=Math.abs(d)<0.005; if(!ok) bad++;
      return `<div class="tr num" style="grid-template-columns:minmax(0,1fr) 130px 130px 110px 100px;${r[3]?'font-weight:700':''}"><span>${r[0]}</span><span class="r">${fmt2(r[1])}</span><span class="r">${fmt2(r[2])}</span><span class="r ${ok?'muted':'neg'}">${ok?'—':(d>0?'+':'')+fmt2(d)}</span><span class="r">${ok?'<span class="chip ok">Match</span>':'<span class="chip warn">Differs</span>'}</span></div>`; }).join('');
    const o=oldCalc(raw);
    const notes=[];
    if(Math.abs(o.deposited-o.paymentsLogged)>0.005) notes.push(`In the current app, the stored “deposited” total (${fmt2(o.deposited)}) doesn’t equal the payments logged (${fmt2(o.paymentsLogged)}). The hub uses the payments.`);
    el.innerHTML=`<div class="banner" style="${bad?'background:#F8E6DF;border-color:#EBC2B3;color:#6E2A1B':'background:#E3F0E8;border-color:#BCD9C7;color:#174F37'}"><b>${bad?bad+' line'+(bad>1?'s differ':' differs'):'Every line matches'}</b><span>Compared with ${esc(label)}. Numbers for the current app are recomputed exactly the way that app does it.</span></div>
    ${notes.map(n=>`<div class="banner">${esc(n)}</div>`).join('')}
    <div class="toolbar"><div class="actions"><button class="btn pri" id="vLive">${I.refresh}Compare with the live app now</button><button class="btn" id="vRe">${I.down}Re-import from the current app</button><button class="btn" id="vPush">${I.refresh}Push hub changes to the current app</button></div><span class="muted" style="margin-left:auto;font-size:13px">${t.source.pushedAt?'Last pushed '+new Date(t.source.pushedAt).toLocaleString():'Imported '+new Date(t.source.importedAt).toLocaleString()}</span></div>
    <div class="card" style="overflow:hidden"><div class="tw"><div class="t" style="min-width:640px"><div class="tr th" style="grid-template-columns:minmax(0,1fr) 130px 130px 110px 100px"><span>Line</span><span class="r">Current app</span><span class="r">Hub</span><span class="r">Difference</span><span class="r"></span></div>${body}</div></div></div>
    <p class="hint">If you edit this tournament in the hub, differences are expected — they show what changed. “Re-import” replaces the hub copy with a fresh one from the current app.</p>`;
    $('vLive').onclick=async()=>{ try{ const st=await fetchMMState(); const y=st.years&&st.years[t.source.year]; if(!y) throw new Error('Year '+t.source.year+' not found in the current app'); render2(y,'the live current app ('+new Date().toLocaleTimeString()+')'); toast('Compared with the live app'); }catch(e){ toast(e.message); } };
    $('vRe').onclick=importMM; $('vPush').onclick=()=>pushToMM(t);
  };
  render2(t.source.raw,'the snapshot taken at import');
}

function qKind(label){ const l=label.toLowerCase(); return /plus ?1|plus one|\+ ?1|guest/.test(l)?'plus1':/dinner|banquet/.test(l)?'dinner':/par ?3/.test(l)?'par3':'other'; }
function qShort(label){ const k=qKind(label); if(k==='plus1') return '+1'; if(k==='dinner') return 'Dinner'; if(k==='par3') return 'Par 3';
  const s=label.replace(/^(are|will|do|did|would) you\s+/i,'').replace(/\?\s*$/,'').trim(); return s.length>18?s.slice(0,17)+'…':s; }
const yes=v=>/^(y|yes|true|1|x)$/i.test(String(v||'').trim());
function fieldRSVP(t){
  const qs=t.fieldQuestions||[], d=qs.find(q=>q.kind==='dinner'), p1=qs.find(q=>q.kind==='plus1'), p3=qs.find(q=>q.kind==='par3');
  const cnt=q=>q?t.field.filter(p=>yes((p.answers||{})[q.key])).length:null;

  return {dinner,guests,headcount:dinner==null?null:dinner+(guests||0),par3:cnt(p3),others:qs.filter(q=>q.kind==='other').map(q=>({q,n:cnt(q)}))};
}

/* ---------- Member roster import (Golf Genius export, any .xlsx/.xls/.csv) ----------
   Finds the header row itself, maps columns by name, previews new vs. updated,
   and matches existing members by Golf Genius ID → GHIN → email → name so a newer
   export updates people instead of duplicating them. */
function loadXLSX(){ if(window.XLSX) return Promise.resolve();
  return new Promise((ok,bad)=>{ const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'; s.onload=ok; s.onerror=()=>bad(new Error('Couldn’t load the spreadsheet reader — check your connection')); document.head.appendChild(s); }); }
const ROSTER_COLS={
  ggId:/^(id\b|id \(|golf ?genius( player)? id)/, email:/^e-?mail( address)?$/, first:/^first( name)?$/, last:/^last( name)?$/,
  full:/^(full ?name|name|player|golfer)$/, handle:/^handle$/, phone:/(cell|mobile)( phone)?$|^phone( number)?$/, hcp:/^(index|handicap( index)?|hcp|hi)$/,
  ghin:/^ghin( ?(id|#|no\.?|number))?$/, memberNo:/^member ?(#|no\.?|number|id)$/, addr1:/^address ?1?$/, addr2:/^address ?2$/, city:/^city$/, state:/^state$/,
  zip:/^(zip|zip ?code|postal( code)?)$/, team:/^team( ?(id|#|no\.?|number))?$/, entryNo:/^entry( ?(#|no\.?|number))?$/, dob:/(date of )?birth|^dob$/, memberType:/^member ?type$/, mg:/member or guest|^guest$/, gender:/^gender$/
};
async function readRosterFile(f){
  const ext=(f.name.split('.').pop()||'').toLowerCase(); let rows;
  if(ext==='csv'&&!window.XLSX){ try{ await loadXLSX(); }catch(_){ rows=parseCSV(await f.text()); } }
  if(!rows){ await loadXLSX(); const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
    let best=null; for(const n of wb.SheetNames){ const r=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:''}); if(!best||r.length>best.length) best=r; } rows=best||[]; }
  return rows.map(r=>r.map(c=>String(c??'').trim()));
}
function mapRoster(rows){
  let hi=-1, map={};
  for(let i=0;i<Math.min(rows.length,30)&&hi<0;i++){
    const m={}; rows[i].forEach((h,ci)=>{ const k=h.toLowerCase().replace(/\s+/g,' ').trim(); for(const [key,re] of Object.entries(ROSTER_COLS)) if(m[key]===undefined&&re.test(k)){ m[key]=ci; break; } });
    if((m.first!==undefined&&m.last!==undefined)||m.full!==undefined||m.handle!==undefined){ hi=i; map=m; }
  }
  let fileDate=Date.now();
  for(const r of rows.slice(0,Math.max(hi,0))){ const mt=/created on\s+(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2})\s*([AP]M)?/i.exec(r.join(' ')); if(mt){ let hh=+mt[4]%12; if(/pm/i.test(mt[6]||'')) hh+=12; fileDate=new Date(+mt[3],+mt[1]-1,+mt[2],hh,+mt[5]).getTime(); break; } }
  const questions=[];
  if(hi>=0) rows[hi].forEach((h,ci)=>{ if(/\?\s*$|^(are|will|do|did|would) you\b/i.test(h.trim())&&!Object.values(map).includes(ci)) questions.push({ci,label:h.trim()}); });
  if(hi<0) throw new Error('Couldn’t find a header row with First Name and Last Name (or Name)');
  const people=[]; let skippedGuests=0, skippedBlank=0;
  for(const r of rows.slice(hi+1)){
    const g=k=>map[k]!==undefined?(r[map[k]]||'').trim():'';
    let first=g('first'), last=g('last');
    if(!first&&!last){ const h=g('handle'); if(h.includes(',')){ [last,first]=h.split(',').map(s=>s.trim()); } else { const p=(g('full')||h).split(/\s+/).filter(Boolean); first=p.shift()||''; last=p.join(' '); } }
    if(!first&&!last){ if(r.some(c=>c)) skippedBlank++; continue; }
    if(/guest/i.test(g('mg'))){ skippedGuests++; continue; }
    people.push({ggId:g('ggId').replace(/\D/g,'')?g('ggId'):'',first,last,email:g('email').toLowerCase(),phone:g('phone'),hcp:g('hcp'),ghin:g('ghin'),memberNo:g('memberNo'),
      address1:g('addr1'),address2:g('addr2'),city:g('city'),state:g('state'),zip:g('zip'),dob:g('dob'),memberType:g('memberType'),
      team:g('team'),entryNo:g('entryNo'),answers:Object.fromEntries(questions.map(q=>[q.label,(r[q.ci]||'').trim()]))});
  }
  return {people,skippedGuests,skippedBlank,columns:Object.keys(map),questions:questions.map(q=>q.label),fileDate};
}
const ROSTER_FIELDS=[['first','First name'],['last','Last name'],['email','Email'],['phone','Phone'],['hcp','Handicap'],['ghin','GHIN'],['memberNo','Member #'],['ggId','Golf Genius ID'],
  ['address1','Address'],['address2','Address 2'],['city','City'],['state','State'],['zip','Zip'],['dob','Date of birth'],['memberType','Member type']];
function matchMember(p,used,noGG){
  const key=s=>(s||'').toLowerCase().replace(/[^a-z]/g,'');
  const tries=[x=>!noGG&&p.ggId&&x.ggId===p.ggId, x=>p.ghin&&x.ghin===p.ghin, x=>p.email&&(x.email||'').toLowerCase()===p.email, x=>key(x.first)===key(p.first)&&key(x.last)===key(p.last)];
  for(const t of tries){ const m=db.members.find(x=>!used.has(x.id)&&t(x)); if(m) return m; }
  return null;
}
function planRoster(people,fileDate){
  const used=new Set(), plan={add:[],update:[],same:[]};
  for(const p of people){
    const m=matchMember(p,used);
    if(!m){ plan.add.push(p); continue; }
    used.add(m.id);
    const changes=ROSTER_FIELDS.filter(([k])=>p[k]&&String(m[k]??'')!==p[k]&&!(k==='hcp'&&m.hcpAt&&fileDate<m.hcpAt)).map(([k,l])=>({k,l,from:m[k]??'',to:p[k]}));
    if(m.status==='Inactive') changes.push({k:'status',l:'Status',from:'Inactive',to:'Active'});
    (changes.length?plan.update:plan.same).push({m,p,changes});
  }
  plan.missing=db.members.filter(x=>!used.has(x.id)&&x.status!=='Inactive');
  return plan;
}
function importRoster(){
  openDrawer({kicker:'Members',title:'Import member list',

function parseCSV(txt){ const rows=[]; let row=[],cur='',q=false;
  for(let i=0;i<txt.length;i++){ const ch=txt[i];
    if(q){ if(ch==='"'&&txt[i+1]==='"'){cur+='"';i++;} else if(ch==='"') q=false; else cur+=ch; }
    else if(ch==='"') q=true; else if(ch===','){row.push(cur);cur='';} else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&txt[i+1]==='\n') i++; row.push(cur); rows.push(row); row=[]; cur=''; } else cur+=ch; }
  if(cur||row.length){ row.push(cur); rows.push(row); } return rows.filter(r=>r.some(c=>c.trim())); }

/* =====================================================================
   MGA Hub — Treasury: one ledger for the season, budget vs actual across
   every tournament, and bank reconciliation against uploaded statements.
   Book entries = ledger transactions + sponsor payments + dues payments.
   Bank lines are matched to book entries (one-to-one, or several checks
   to one deposit). Nothing is ever matched without the treasurer's OK.
   ===================================================================== */
I.bank=svg('<path d="M3 10l9-6 9 6"/><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8"/><path d="M3 20h18"/>');

/* ---------- dates + money ---------- */
function isoDate(s,year){
  s=String(s??'').trim(); if(!s) return '';
  let m;
  if((m=/^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s))) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  if((m=/^(\d{4})(\d{2})(\d{2})/.exec(s))) return `${m[1]}-${m[2]}-${m[3]}`;
  if((m=/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/.exec(s))){ let y=+m[3]; if(y<100) y+=2000; return `${y}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`; }
  if((m=/^(\d{1,2})\/(\d{1,2})$/.exec(s))&&year) return `${year}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;
  const d=new Date(s); if(!isNaN(d)) return d.toISOString().slice(0,10);
  return '';
}
const dayDiff=(a,b)=>(a&&b)?Math.round((new Date(a)-new Date(b))/864e5):null;
const shortD=s=>{ if(!s) return '—'; const [y,mo,d]=s.split('-'); return `${+mo}/${+d}/${y.slice(2)}`; };
function money(s){ s=String(s??'').trim(); if(!s) return null; let neg=/^\(.*\)$/.test(s)||/-\s*$/.test(s)||/^-/.test(s.replace(/[$\s]/g,''))||/\bDR\b/i.test(s);
  const v=parseFloat(s.replace(/[^0-9.]/g,'')); if(!isFinite(v)) return null; return neg?-v:v; }
const todayISO=()=>{ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };

/* ---------- budget lines a ledger entry can be linked to ---------- */
function budgetLines(y){
  const out=[];
  for(const t of seasonTournaments(y)){
    const g=t.name+(t.startDate?' ('+dayShort(t,0)+')':'');
    out.push({g,v:`${t.id}|entry|`,l:'Entry fees',dir:'in'});
    if(n0(t.skinsFee)) out.push({g,v:`${t.id}|skins|`,l:'Skins / day money collected',dir:'in'});
    t.income.forEach(i=>out.push({g,v:`${t.id}|inc|${i.id}`,l:i.desc,dir:'in'}));
    [0,1,2].slice(0,t.days).forEach(di=>t.dayItems[di].forEach(it=>out.push({g,v:`${t.id}|item|${it.id}`,l:`${dayLabel(t,di).split(' · ')[0]}: ${it.item}`,dir:'out'})));
    t.perPlayer.forEach(p=>out.push({g,v:`${t.id}|pp|${p.id}`,l:p.desc,dir:'out'}));
    if(n0(t.skinsFee)) out.push({g,v:`${t.id}|skinsPaid|`,l:'Skins / day money paid out',dir:'out'});
    t.lines.forEach(l=>out.push({g,v:`${t.id}|line|${l.id}`,l:(l.group?l.group+': ':'')+l.desc,dir:'out'}));
  }
  (db.seasons[y].lines||[]).forEach(l=>out.push({g:'MGA-level',v:`|${l.type==='Income'?'mgaInc':'mgaExp'}|${l.id}`,l:l.desc,dir:l.type==='Income'?'in':'out'}));
  return out;
}
function linkLabel(y,L){
  if(!L||!L.k) return 'Uncategorized';
  const hit=budgetLines(y).find(o=>o.v===`${L.t||''}|${L.k}|${L.id||''}`);
  return hit?`${hit.g.replace(/ \(.*\)$/,'')} · ${hit.l}`:'Line no longer exists';
}

/* ---------- book entries (everything the MGA's books say happened) ---------- */
function bookEntries(y){
  const s=db.seasons[y], out=[];
  for(const x of s.txns) out.push({key:'tx:'+x.id,src:'ledger',ref:x,date:x.date,amount:n0(x.amount),dir:x.dir,desc:x.desc||'(no description)',payee:x.payee||'',method:x.method||'',checkNo:x.checkNo||'',line:linkLabel(y,x.link)});
  for(const t of seasonTournaments(y)) for(const sp of t.sponsors) for(const p of sp.payments||[])
    out.push({key:'sp:'+p.id,src:'sponsor',ref:{t,sp,p},date:isoDate(p.date,y),amount:n0(p.amount),dir:'in',desc:sp.company,payee:'',method:p.method||'',checkNo:p.checkNo||'',line:`${t.name} · Sponsors`});
  for(const p of s.duesPayments){ const m=memberById(p.memberId);
    out.push({key:'du:'+p.id,src:'dues',ref:{p,m},date:isoDate(p.date,y),amount:n0(p.amount),dir:'in',desc:(m?memberName(m):'Member')+' — dues',payee:'',method:p.method||'',checkNo:'',line:'MGA · Dues'}); }
  return out;
}
function matchedKeys(y){ const set=new Map(); for(const b of db.seasons[y].bank) if(b.status==='matched') for(const k of b.matched||[]) set.set(k,b); return set; }

/* ---------- bank statement import ---------- */
const BANK_COLS={date:/^(post(ing|ed)? ?date|trans(action)?\.? ?date|date( posted)?|effective date)$/, desc:/^(description|payee|name|transaction|merchant|narrative)( description)?$/, memo:/^(memo|notes?|extended description|additional info)$/,
  amount:/^(amount|transaction amount|amt|net amount)$/, debit:/^(debit|debits|withdrawal|withdrawals|money out|payments?|charge|debit amount)$/, credit:/^(credit|credits|deposit|deposits|money in|credit amount)$/,
  check:/^(check|chk|cheque|check ?(no|number|#)|ref(erence)?( no)?)$/, balance:/^(running )?balance$/, type:/^(type|transaction type|details|dr\/cr|debit\/credit)$/};
function parseBankTable(rows,year){
  let hi=-1,map={};
  for(let i=0;i<Math.min(rows.length,40)&&hi<0;i++){ const m={}; rows[i].forEach((h,ci)=>{ const k=String(h).toLowerCase().replace(/\s+/g,' ').trim(); for(const [key,re] of Object.entries(BANK_COLS)) if(m[key]===undefined&&re.test(k)){ m[key]=ci; break; } });
    if(m.date!==undefined&&(m.amount!==undefined||m.debit!==undefined||m.credit!==undefined)){ hi=i; map=m; } }
  if(hi<0) throw new Error('Couldn’t find the statement columns — it needs a Date column and either Amount or Debit/Credit columns');
  const out=[];
  for(const r of rows.slice(hi+1)){ const g=k=>map[k]!==undefined?String(r[map[k]]??'').trim():'';
    const date=isoDate(g('date'),year); if(!date) continue;
    let amt=null;
    if(map.amount!==undefined){ amt=money(g('amount')); const ty=g('type').toLowerCase(); if(amt!=null&&amt>0&&/^debit|withdraw|\bdr\b|payment|check_paid|^check/.test(ty)) amt=-amt; }
    if(amt==null){ const d=money(g('debit')), c=money(g('credit')); if(d==null&&c==null) continue; amt=(c?Math.abs(c):0)-(d?Math.abs(d):0); }
    if(!amt) continue;
    const desc=[g('desc'),g('memo')].filter(Boolean).join(' — ');
    let chk=g('check'); if(!chk){ const mm=/\bche?c?k\s*#?\s*(\d{3,})/i.exec(desc); if(mm) chk=mm[1]; }
    out.push({date,amount:Math.round(amt*100)/100,desc:desc||'(no description)',checkNo:chk.replace(/^0+/,''),balance:money(g('balance'))});
  }
  return out;
}
function parseOFX(txt){
  const out=[]; const blocks=txt.split(/<STMTTRN>/i).slice(1);
  const tag=(b,t)=>{ const m=new RegExp('<'+t+'>([^<\\r\\n]*)','i').exec(b); return m?m[1].trim():''; };
  for(const b of blocks){ const amt=money(tag(b,'TRNAMT')); if(!amt) continue;
    out.push({date:isoDate(tag(b,'DTPOSTED').slice(0,8)),amount:Math.round(amt*100)/100,desc:[tag(b,'NAME'),tag(b,'MEMO')].filter(Boolean).join(' — ')||'(no description)',checkNo:tag(b,'CHECKNUM').replace(/^0+/,''),fitid:tag(b,'FITID'),balance:null}); }
  const bal=/<LEDGERBAL>[\s\S]*?<BALAMT>([^<\r\n]+)/i.exec(txt); if(bal&&out.length){ const last=out.reduce((a,b)=>a.date>=b.date?a:b); last.balance=money(bal[1]); }
  return out;
}
async function readBankFile(f,year){
  const ext=(f.name.split('.').pop()||'').toLowerCase();
  if(ext==='ofx'||ext==='qfx'){ const txt=await f.text(); const r=parseOFX(txt); if(!r.length) throw new Error('No transactions found in that OFX/QFX file'); return r; }
  return parseBankTable(await readRosterFile(f),year);
}
const bankKey=b=>b.fitid?'fit:'+b.fitid:`${b.date}|${b.amount.toFixed(2)}|${b.desc.toLowerCase().replace(/\s+/g,' ').slice(0,60)}`;

      <input type="file" id="bankF" accept=".csv,.xlsx,.xls,.ofx,.qfx,text/csv" class="inp" style="padding-top:8px"><p class="hint" id="bankMsg" aria-live="polite"></p>`,
    wire:r=>{ r.querySelector('#bankF').onchange=async e=>{ const f=e.target.files[0]; if(!f) return; const msg=r.querySelector('#bankMsg'); msg.style.color=''; msg.textContent='Reading '+f.name+'…';

/* ---------- matching ---------- */
function subsetSum(cands,target,maxN){
  cands=cands.slice().sort((a,b)=>b.amount-a.amount); const T=Math.round(target*100), vals=cands.map(c=>Math.round(c.amount*100));
  let best=null, steps=0;
  (function dfs(i,sumC,pick){ if(best||steps++>20000) return; if(sumC===T&&pick.length>1){ best=pick.slice(); return; }
    if(pick.length>=maxN) return;
    for(let j=i;j<cands.length;j++){ if(sumC+vals[j]>T) continue; pick.push(j); dfs(j+1,sumC+vals[j],pick); pick.pop(); if(best) return; } })(0,0,[]);
  return best?best.map(j=>cands[j]):null;
}
function suggestMatches(y){
  const s=db.seasons[y], mk=matchedKeys(y), used=new Set(mk.keys());
  const book=bookEntries(y).filter(e=>!used.has(e.key));
  const sugg=new Map();
  const open=s.bank.filter(b=>b.status==='open').sort((a,b)=>a.date.localeCompare(b.date));
  const words=s2=>new Set(String(s2||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>2&&!/^(the|and|llc|inc|from|for|payment|deposit|check|zelle|online|services?|group|company|co)$/.test(w)));
  const nameHit=(b,e)=>{ const bw=words(b.desc); for(const w of words((e.payee||'')+' '+e.desc)) if(bw.has(w)) return 1; return 0; };
  const isTransfer=b=>/\b(transfer|xfer|trnsfr)\b/i.test(b.desc);
  const single=(b,dated)=>{ if(isTransfer(b)) return null; const dir=b.amount>0?'in':'out', amt=Math.abs(b.amount), win=dir==='out'?60:30;
    const c=book.filter(e=>!used.has(e.key)&&e.dir===dir&&Math.abs(e.amount-amt)<0.005&&(dated?(e.date&&Math.abs(dayDiff(b.date,e.date))<=win):!e.date));
    if(!c.length) return null;
    c.sort((p,q)=>((q.checkNo&&q.checkNo===b.checkNo)-(p.checkNo&&p.checkNo===b.checkNo))||(nameHit(b,q)-nameHit(b,p))||(Math.abs(dayDiff(b.date,p.date)??99)-Math.abs(dayDiff(b.date,q.date)??99)));
    return c[0]; };
  // 1) same amount, dated within the window (same check # wins)
  for(const b of open){ const e=single(b,true); if(!e) continue; used.add(e.key); const d=Math.abs(dayDiff(b.date,e.date));
    sugg.set(b.id,{keys:[e.key],entries:[e],why:e.checkNo&&e.checkNo===b.checkNo?'Same check # and amount':(nameHit(b,e)?'Same amount and name, ':'Same amount, ')+`${d} day${d===1?'':'s'} apart`}); }
  // 2) one deposit made up of several payments received in the weeks before it
  for(const b of open){ if(sugg.has(b.id)||b.amount<=0||isTransfer(b)) continue;
    const c=book.filter(e=>!used.has(e.key)&&e.dir==='in'&&e.date&&e.amount<b.amount&&dayDiff(b.date,e.date)>=-3&&dayDiff(b.date,e.date)<=30).slice(0,30);
    const combo=subsetSum(c,b.amount,8);
    if(combo){ combo.forEach(e=>used.add(e.key)); sugg.set(b.id,{keys:combo.map(e=>e.key),entries:combo,why:`${combo.length} payments add up to this deposit`}); } }
  // 3) same amount but the entry has no date — shown as a possibility, never auto-accepted
  for(const b of open){ if(sugg.has(b.id)) continue; const e=single(b,false); if(!e) continue; used.add(e.key);
    sugg.set(b.id,{keys:[e.key],entries:[e],why:'Same amount — the entry has no date, so check it',weak:true}); }
  return sugg;
}
function recTotals(y){
  const s=db.seasons[y], mk=matchedKeys(y), book=bookEntries(y);
  const open=n0(s.bankOpening.amount);
  const bankNet=sum(s.bank,b=>b.amount), bankBal=open+bankNet;
  const outstanding=book.filter(e=>!mk.has(e.key));
  const dit=sum(outstanding.filter(e=>e.dir==='in'),e=>e.amount), oc=sum(outstanding.filter(e=>e.dir==='out'),e=>e.amount);
  const bookBal=open+sum(book,e=>(e.dir==='in'?1:-1)*e.amount);
  const bankOnly=sum(s.bank.filter(b=>b.status!=='matched'),b=>b.amount);
  const last=[...s.bank].filter(b=>b.balance!=null).sort((a,b)=>a.date.localeCompare(b.date)).pop();
  return {open,bankBal,dit,oc,adjBank:bankBal+dit-oc,bookBal,bankOnly,adjBook:bookBal+bankOnly,outstanding,
    needs:s.bank.filter(b=>b.status==='open').length, matched:s.bank.filter(b=>b.status==='matched').length, ignored:s.bank.filter(b=>b.status==='ignored').length,
    stmtBal:last?last.balance:null, stmtDate:last?last.date:null, lastDate:[...s.bank].map(b=>b.date).sort().pop()||''};
}

function findMatch(bl){
  const y=Y(), s=db.seasons[y], mk=matchedKeys(y), dir=bl.amount>0?'in':'out', target=Math.abs(bl.amount);
  const cands=bookEntries(y).filter(e=>e.dir===dir&&!mk.has(e.key))
    .sort((a,b)=>Math.abs(a.amount-target)-Math.abs(b.amount-target)||Math.abs(dayDiff(bl.date,a.date)??999)-Math.abs(dayDiff(bl.date,b.date)??999));
  const picked=new Set();
  const rowsHTML=q=>cands.filter(e=>!q||[e.payee,e.desc,e.line,String(e.amount)].join(' ').toLowerCase().includes(q.toLowerCase())).slice(0,60).map(e=>`<label class="mr num" style="grid-template-columns:22px 70px minmax(0,1fr) 90px;cursor:pointer"><input type="checkbox" data-pk="${e.key}"${picked.has(e.key)?' checked':''} style="width:18px;height:18px;accent-color:var(--navy)"><span class="muted">${shortD(e.date)}</span><div class="cell2"><b class="trunc">${esc(e.payee||e.desc)}</b><small class="trunc">${esc(e.line)}</small></div><b class="r">${fmt2(e.amount)}</b></label>`).join('')||'<div class="mr"><span class="muted">No open entries in that direction.</span></div>';
  const total=()=>sum(cands.filter(e=>picked.has(e.key)),e=>e.amount);

    body:`<div class="banner" style="justify-content:space-between"><span class="trunc">${esc(bl.desc)}</span><b class="num">${fmt2(bl.amount)}</b></div>

      <div class="sumrows num"><div><span class="muted">Picked</span><span id="fmT">$0.00</span></div><div><span class="muted">Bank line</span><span>${fmt2(target)}</span></div><div class="big"><span>Difference</span><span id="fmD">${fmt2(target)}</span></div></div>`,
    wire:r=>{ const bind=()=>r.querySelectorAll('[data-pk]').forEach(cb=>cb.onchange=()=>{ cb.checked?picked.add(cb.dataset.pk):picked.delete(cb.dataset.pk); const t=total(); r.querySelector('#fmT').textContent=fmt2(t); const d=target-t; const el2=r.querySelector('#fmD'); el2.textContent=fmt2(d); el2.style.color=Math.abs(d)<0.005?'var(--pos)':''; });
      bind(); r.querySelector('#fmQ').oninput=e=>{ r.querySelector('#fmL').innerHTML=rowsHTML(e.target.value); bind(); }; },
    save:()=>{ if(!picked.size){ toast('Tick at least one entry'); return false; }
      if(Math.abs(total()-target)>=0.005){ toast(`Picked ${fmt2(total())} — needs to equal ${fmt2(target)}. For a difference like a fee, add it to the books.`); return false; }
      bl.matched=[...picked]; bl.status='matched'; toast('Matched'); }});
}

    for(const p of g.players||[]){ const par=c.par[p.set||'M']||c.par.M, sc=scores[p.id]||{};
      const hc=c.hcp[p.set||'M']||c.hcp.M, ph=typeof p.ph==='number'?p.ph:null;
      let n=0,gross=0,parPlayed=0,out=0,inn=0,got=0;
      for(let h=1;h<=18;h++){ const s=+sc[h]; if(!s) continue; n++; gross+=s; parPlayed+=par[h-1]; if(h<=9) out+=s; else inn+=s; if(ph!=null) got+=strokesOn(ph,hc[h-1]); }
      rows.push({id:p.id,name:p.name,group:g.label||'',groupId:g.id,course:g.course,courseName:c.name,tee:p.tee,n,gross,toPar:gross-parPlayed,out,inn,thru:n===18?'F':String(n),par,ph,flight:p.flight||'',net:ph==null?null:gross-got,netToPar:ph==null?null:gross-got-parPlayed});
    } }

  const key=r=>byNet?(r.netToPar==null?9999:r.netToPar):r.toPar;
  const pool=opt.flight?rows.filter(r=>r.flight===opt.flight):rows;
  const played=pool.filter(r=>r.n>0).sort((a,b)=>key(a)-key(b)||b.n-a.n||a.gross-b.gross||a.name.localeCompare(b.name));
  const idle=pool.filter(r=>!r.n).sort((a,b)=>a.name.localeCompare(b.name));
  let pos=0,prev=null; played.forEach((r,i)=>{ const k=key(r); if(prev===null||k!==prev){ pos=i+1; prev=k; } r.pos=pos; });
  played.forEach(r=>{ r.posTxt=(played.filter(x=>x.pos===r.pos).length>1?'T':'')+r.pos; });
  idle.forEach(r=>{ r.posTxt='—'; });
  return played.concat(idle);
}

/* ---------- handicaps (World Handicap System) ----------
   Course Handicap = Index × Slope ÷ 113 + (Course Rating − Par), rounded (.5 up).
   Playing Handicap = Course Handicap × allowance %, rounded. */
function parseIndex(v){ if(v==null) return null; const s=String(v).trim(); if(!s) return null; const plus=/^\+/.test(s); const n=parseFloat(s.replace('+','')); if(!isFinite(n)) return null; return plus?-Math.abs(n):n; }

const whsRound=x=>Math.sign(x)*Math.floor(Math.abs(x)+0.5);
function teeRating(course,teeName,set){ const t=(course.tees||[]).find(x=>x.name===teeName); const r=t&&t.rating&&t.rating[set||'M']; return r&&+r.cr&&+r.slope?{cr:+r.cr,slope:+r.slope}:null; }
function courseHcp(index,course,teeName,set){ if(index==null) return null; const r=teeRating(course,teeName,set); if(!r) return null;
  const par=G_SUM(course.par[set||'M']||course.par.M); return whsRound(index*r.slope/113+(r.cr-par)); }
/* strokes a player gets on one hole from a playing handicap (plus handicaps give strokes back, from hcp 18 up) */
function strokesOn(ph,holeHcp){ if(!ph) return 0; if(ph>0) return Math.floor(ph/18)+(holeHcp<=ph%18?1:0); const g=-ph; return -(Math.floor(g/18)+(holeHcp>18-(g%18)?1:0)); }

/* ---------- best ball ----------
   Each player plays their own ball; the team's score on a hole is the best (lowest) score among
   its players who've posted that hole — gross, or net after each player's strokes. */
function teamKey(p){ return p.team||('solo:'+p.id); }
function bestBallBoard(pub,scores,opt){
  opt=opt||{}; const teams=new Map();
  for(const g of pub.groups||[]){ const c=pub.courses[g.course]; if(!c) continue;
    for(const p of g.players||[]){ const k=teamKey(p); if(!teams.has(k)) teams.set(k,{id:k,members:[],group:g.label||'',groupId:g.id,course:g.course,courseName:c.name}); teams.get(k).members.push({p,c}); } }
  const rows=[];
  for(const t of teams.values()){
    let n=0,gross=0,toPar=0,net=0,netToPar=0,netOK=t.members.every(m=>typeof m.p.ph==='number');
    for(let h=1;h<=18;h++){ let bg=null,bgp=null,bn=null,bnp=null;
      for(const {p,c} of t.members){ const s=+((scores[p.id]||{})[h]); if(!s) continue; const par=(c.par[p.set||'M']||c.par.M)[h-1];
        if(bg===null||s-par<bgp){ bg=s; bgp=s-par; }
        if(netOK){ const k=strokesOn(p.ph,(c.hcp[p.set||'M']||c.hcp.M)[h-1]); if(bn===null||s-k-par<bnp){ bn=s-k; bnp=s-k-par; } } }
      if(bg===null) continue; n++; gross+=bg; toPar+=bgp; if(netOK){ net+=bn; netToPar+=bnp; } }
    const flights=[...new Set(t.members.map(m=>m.p.flight).filter(Boolean))];
    rows.push({id:t.id,name:t.members.map(m=>m.p.name).join(' / '),members:t.members.map(m=>m.p.id),group:t.group,groupId:t.groupId,course:t.course,courseName:t.courseName,
      n,gross,toPar,thru:n===18?'F':String(n),net:netOK?net:null,netToPar:netOK?netToPar:null,flight:flights.length===1?flights[0]:flights.join('/'),team:true});
  }
  const byNet=opt.sort==='net', key=r=>byNet?(r.netToPar==null?9999:r.netToPar):r.toPar;
  const pool=opt.flight?rows.filter(r=>r.flight===opt.flight):rows;
  const played=pool.filter(r=>r.n>0).sort((a,b)=>key(a)-key(b)||b.n-a.n||a.gross-b.gross||a.name.localeCompare(b.name));
  const idle=pool.filter(r=>!r.n).sort((a,b)=>a.name.localeCompare(b.name));
  let pos=0,prev=null; played.forEach((r,i)=>{ const k=key(r); if(prev===null||k!==prev){ pos=i+1; prev=k; } r.pos=pos; });
  played.forEach(r=>{ r.posTxt=(played.filter(x=>x.pos===r.pos).length>1?'T':'')+r.pos; }); idle.forEach(r=>{ r.posTxt='—'; });

}
/* the board for an event: teams for best ball (unless players are asked for), players for stroke play */
function eventBoard(pub,scores,opt){ opt=opt||{}; return pub.format==='bestball'&&opt.view!=='players'?bestBallBoard(pub,scores,opt):leaderboard(pub,scores,opt); }

function ensureCardCSS(){ if(typeof document==='undefined'||document.getElementById('wc-css')) return; const s=document.createElement('style'); s.id='wc-css'; s.textContent=WC_CSS; document.head.appendChild(s); }
function scorecardHTML(pub,g,scores,opt){
  opt=opt||{}; ensureCardCSS();

  const E=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const accent=g.course==='pecan'?'#A2343A':'#1F3552';
  const halves=opt.split?[[1,9],[10,18]]:[[1,18]];
  const ps=g.players, TEAM=isTeamEvent(pub), basisNet=(pub.scoring==='net'), split=pub.format==='split';
  const par=p=>c.par[p.set||'M']||c.par.M, hc=p=>c.hcp[p.set||'M']||c.hcp.M;
  const sc=p=>scores[p.id]||{};
  const phFor=(p,h)=>{ const f=holeFormat(pub,h); if(f==='scramble') return null; return f==='stroke'?p.ph:segPH(pub,p,f); };
  const k=(p,h)=>{ const ph=phFor(p,h); return typeof ph==='number'?strokesOn(ph,hc(p)[h-1]):0; };
  const teesUsed=[...new Set(ps.map(p=>p.tee))].filter(t=>c.tees&&t in c.tees);
  const anyW=ps.some(p=>p.set==='W');

  const short=n=>{ const w=String(n).trim().split(/\s+/); return opt.split&&w.length>1?w[0][0]+'. '+w.slice(1).join(' '):n; };
  const shape=(s,pr)=>{ const d=s-pr; return d<=-2?'e':d===-1?'b':d===1?'o':d>=2?'d':''; };
  const range=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
  const sumH=(fn,a,b)=>{ let t=0,n=0; for(let h=a;h<=b;h++){ const v=fn(h); if(v!=null){ t+=v; n++; } } return n?t:''; };
  const phTxt=v=>typeof v==='number'?(v<0?'+'+(-v):v):'';

    const endCols=(a===1&&b===18)||b===18;
    const fmtRow=split?`<tr class="wc-fmt"><th>Format</th>${nines.map(([x,y])=>`<td colspan="${y-x+2}">${E(FORMAT_LABEL[holeFormat(pub,x)])}${holeFormat(pub,x)==='scramble'?' · team score':''}</td>`).join('')}${endCols?'<td colspan="3"></td>':''}</tr>`:'';
    const head=`<tr class="wc-h"><th>Hole</th>${nines.map(([x,y,l])=>range(x,y).map(h=>`<th>${h}</th>`).join('')+`<th class="wc-tot">${l}</th>`).join('')}${endCols?'<th class="wc-tot">Tot</th><th class="wc-tot">Hcp</th><th class="wc-tot">Net</th>':''}</tr>`;
    const lineRow=(cls,label,valFn,totFn)=>`<tr class="${cls}"><th>${label}</th>${nines.map(([x,y])=>range(x,y).map(h=>`<td>${valFn(h)??''}</td>`).join('')+`<td class="wc-tot">${totFn?totFn(x,y):''}</td>`).join('')}${endCols?`<td class="wc-tot">${totFn?totFn(1,18):''}</td><td class="wc-tot"></td><td class="wc-tot"></td>`:''}</tr>`;
    const tees=teesUsed.map(t=>{ const y=c.tees[t]; return lineRow('t-'+t.toLowerCase().replace('/','-'),E(t),h=>y?y[h-1]:'·',(x,z)=>y?sumH(h=>y[h-1],x,z):''); }).join('');
    const hcpM=lineRow('wc-hc','Men’s Handicap',h=>c.hcp.M[h-1]);
    const parRow=lineRow('wc-par','Par',h=>(anyW&&c.par.W[h-1]!==c.par.M[h-1])?c.par.M[h-1]+'/'+c.par.W[h-1]:c.par.M[h-1],(x,z)=>sumH(h=>c.par.M[h-1],x,z));
    const hcpW=anyW?lineRow('wc-hc','Women’s Handicap',h=>c.hcp.W[h-1]):'';
    const pRow=p=>{ const S=sc(p), own=h=>holeFormat(pub,h)!=='scramble'&&S[h]?+S[h]:null;

        if(!s) return `<td>${kk>0?'<span class="wc-dot"></span>'.repeat(Math.min(kk,2)):''}</td>`;
        return `<td class="${TEAM&&counted.has(p.id+'|'+h)?'wc-c':''}"><span class="wc-s ${shape(s,par(p)[h-1])}">${s}</span>${kk?`<span class="wc-n" title="Net ${s-kk}">${s-kk}</span>`:''}</td>`; }).join('')+`<td class="wc-tot">${gT(x,y)}</td>`).join('');
      const ph=plFmt?(plFmt==='stroke'?p.ph:segPH(pub,p,plFmt)):null; const allOwn=range(1,18).every(h=>holeFormat(pub,h)==='scramble'||S[h]);
      return `<tr class="wc-p${opt.highlight&&(opt.highlight===p.id||opt.highlight===p.team)?' wc-me':''}"><th title="${E(p.name)}">${E(short(p.name))}<small>${E(p.tee)}${p.flight?' · Flight '+E(p.flight):''}${typeof ph==='number'?' · plays '+phTxt(ph):''}</small></th>${cells}${endCols?`<td class="wc-tot">${gT(1,18)}</td><td class="wc-tot">${phTxt(ph)}</td><td class="wc-tot wc-net">${allOwn&&typeof ph==='number'?nT(1,18):''}</td>`:''}</tr>`; };
