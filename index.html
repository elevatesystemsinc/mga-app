<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MGA Hub · Walnut Creek Country Club</title>
<link rel="icon" href="crest.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script><!-- window.MM_CONFIG = {url, anonKey, boardEmail}. Missing file = local-only mode. -->
<style>
:root{
  --navy:#0F2A38; --deep:#0A1C27; --gold:#8C6A1F; --goldl:#D8B75F; --ivory:#FBFAF5; --paper:#F4F0E6;
  --line:#E3DCC9; --muted:#56626A; --ink:#14222B; --pos:#1F6B4A; --neg:#A1402B; --card:#fff;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif; --sans:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .pos{color:var(--pos)} .neg{color:var(--neg)} .r{text-align:right}
.serif{font-family:var(--serif)}

/* layout */
.app{display:flex;min-height:100vh}
.side{width:248px;flex-shrink:0;background:var(--navy);color:#E9E4D6;display:flex;flex-direction:column;padding:24px 16px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px 22px;border-bottom:1px solid rgba(216,183,95,.3)}
.brand img{width:44px;height:57px;object-fit:contain}
.brand b{font-family:var(--serif);font-size:26px;color:#fff;line-height:1;display:block}
.brand small{font-size:12px;color:var(--goldl);display:block;margin-top:4px}
.season{padding:18px 8px 10px}
.season label{font-size:12px;font-weight:600;color:#A9A595}
.season select{margin-top:6px;width:100%;height:38px;border-radius:8px;border:1px solid rgba(216,183,95,.4);background:var(--deep);color:#fff;padding:0 10px;font-weight:600}
.navlist{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;color:#C9C5B8;text-decoration:none;font-weight:500;border:none;background:none;text-align:left;width:100%}
.nav:hover{color:#fff;background:rgba(255,255,255,.05)}
.nav.on{background:rgba(216,183,95,.14);color:#fff;box-shadow:inset 0 0 0 1px rgba(216,183,95,.35)}
.nav svg{width:18px;height:18px;flex-shrink:0}
.sidefoot{margin-top:auto;padding:14px 12px 0;border-top:1px solid rgba(216,183,95,.3);display:flex;flex-direction:column;gap:10px;font-size:12.5px;color:#C9C5B8}
.sync{display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:#6FBF8E;flex-shrink:0}
.dot.saving{background:var(--goldl)} .dot.offline{background:#E07B62} .dot.local{background:#9AA3A8}
.linkbtn{background:none;border:none;color:#C9C5B8;padding:0;text-decoration:underline;text-align:left;font-size:12.5px}
.topbar{display:none}
.main{flex-grow:1;min-width:0;padding:36px 44px 60px;display:flex;flex-direction:column;gap:24px;max-width:1400px}

/* type + furniture */
.h1{font-family:var(--serif);font-weight:600;font-size:44px;line-height:1;margin:0;color:var(--navy);letter-spacing:-.01em}
.h2{font-family:var(--serif);font-weight:600;font-size:24px;margin:0;color:var(--navy);line-height:1.1}
.sub{color:var(--muted);margin:6px 0 0}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.rule{height:5px;border-top:1px solid var(--gold);border-bottom:1px solid var(--goldl)}
.crumb{display:flex;gap:8px;font-size:13px;align-items:center}
.crumb button{background:none;border:none;padding:0;color:var(--gold);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px}
.pad{padding:20px 22px}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 22px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.kpi{display:flex;flex-direction:column;gap:6px}
.kpi .v{font-family:var(--serif);font-size:38px;font-weight:600;line-height:1.05;color:var(--navy)}
.kpi .v.pos{color:var(--pos)} .kpi .v.neg{color:var(--neg)}
.lbl{font-size:12px;font-weight:600;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--navy);font-weight:600;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:#CBBF9F}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pri:hover{background:var(--deep)}
.btn.danger{color:var(--neg)}
.btn.sm{height:32px;padding:0 12px;font-size:12.5px}
.btn svg{width:16px;height:16px}
.btn[disabled]{opacity:.5;cursor:default}
.ib{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;border:1px solid transparent;background:none;color:var(--muted);flex-shrink:0}
.ib:hover{border-color:var(--line);color:var(--navy);background:#fff}
.ib svg{width:16px;height:16px}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--paper);color:var(--navy);border:1px solid var(--line);white-space:nowrap}
.chip.gold{background:#F6ECCF;border-color:#E5CF8E;color:#6B4F12}
.chip.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.ok{background:#E3F0E8;border-color:#BCD9C7;color:var(--pos)}
.chip.warn{background:#F8E6DF;border-color:#EBC2B3;color:var(--neg)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{padding:12px 16px;font-weight:600;color:var(--muted);background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.on{color:var(--navy);border-color:var(--gold)}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--muted);font-weight:600;font-size:13px}
.seg button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.av{width:32px;height:32px;border-radius:50%;background:var(--paper);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--navy);flex-shrink:0}
.empty{padding:36px 22px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty b{font-family:var(--serif);font-size:22px;color:var(--navy)}

/* tables */
.tw{overflow-x:auto}
.t{min-width:720px}
.tr{display:grid;align-items:center;gap:12px;padding:0 22px;min-height:50px;border-top:1px solid var(--line)}
.tr.th{min-height:40px;border-top:none;font-size:12px;font-weight:600;color:var(--muted);background:var(--ivory);border-bottom:1px solid var(--line)}
.tr.th + .tr{border-top:none}
.tr.tot{background:var(--ivory);font-weight:700}
.tr.click{cursor:pointer} .tr.click:hover{background:#FDFBF4}
.cell2{display:flex;flex-direction:column;min-width:0}
.cell2 small{font-size:12px;color:var(--muted)}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 22px 10px;background:var(--ivory);border-top:1px solid var(--line)}
.gh b{color:var(--navy)}
.bl{grid-template-columns:minmax(0,1fr) minmax(0,230px) 110px 100px 40px}

/* search */
.search{position:relative;width:340px;max-width:100%}
.search svg{position:absolute;left:12px;top:11px;width:18px;height:18px;color:var(--muted)}
.search input{padding-left:38px}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}

/* forms */
.inp{height:40px;border:1px solid #CFC6AE;border-radius:8px;padding:0 12px;background:#fff;width:100%;font-size:14px}
textarea.inp{height:auto;min-height:84px;padding:10px 12px;resize:vertical}
.fld{display:flex;flex-direction:column;gap:6px}
.frow2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.check{display:flex;align-items:center;gap:8px;font-weight:500}
.check input{width:18px;height:18px;accent-color:var(--navy)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,28,39,.45);opacity:0;pointer-events:none;transition:opacity .18s;z-index:40}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:520px;max-width:100%;background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column;transform:translateX(100%);visibility:hidden;transition:transform .2s ease,visibility 0s .2s;z-index:50}
.drawer.show{transform:none;visibility:visible;box-shadow:-18px 0 50px rgba(10,28,39,.16);transition:transform .2s ease}
.dhead{padding:24px 28px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dhead .h2{font-size:30px;margin-top:2px}
.dbody{padding:22px 28px;display:flex;flex-direction:column;gap:18px;overflow-y:auto;flex-grow:1}
.dfoot{padding:14px 28px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;background:var(--ivory)}
.mini{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.mini .mr{display:grid;gap:8px;padding:6px 12px;align-items:center;border-top:1px solid var(--line)}
.mini .mr.h{background:var(--ivory);font-size:12px;font-weight:600;color:var(--muted);border-top:none;padding:8px 12px}
.mini .inp{height:34px;padding:0 8px}
.sumrows{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.sumrows div{display:flex;justify-content:space-between}
.sumrows .big{font-weight:700;font-size:16px;color:var(--navy)}
.pick{display:flex;flex-direction:column;max-height:50vh;overflow-y:auto;border:1px solid var(--line);border-radius:8px}
.pick button{display:flex;align-items:center;gap:12px;padding:10px 14px;border:none;border-top:1px solid var(--line);background:#fff;text-align:left}
.pick button:first-child{border-top:none}
.pick button.on{background:#F6ECCF}
.pick button[disabled]{opacity:.5}

/* toast + login */
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:80;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:none;border:none;color:var(--goldl);font-weight:700;padding:0}
.login{position:fixed;inset:0;background:var(--navy);display:none;align-items:center;justify-content:center;z-index:90;padding:20px}
.login.show{display:flex}
.login .card{width:380px;max-width:100%;padding:32px;display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center}
.login img{width:96px}
.banner{background:#F6ECCF;border:1px solid #E5CF8E;color:#5C4410;border-radius:10px;padding:12px 16px;font-size:13.5px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}

/* responsive: web first, still usable on a phone */
@media (max-width:1100px){ .g4{grid-template-columns:repeat(2,minmax(0,1fr))} .split{grid-template-columns:minmax(0,1fr)} }
@media (max-width:900px){
  .side{position:fixed;left:0;top:0;z-index:60;transform:translateX(-100%);transition:transform .2s;padding-top:calc(24px + env(safe-area-inset-top,0px))}
  .side.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.4)}
  .topbar{display:flex;align-items:center;gap:10px;background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;position:sticky;top:0;z-index:30}
  .topbar img{width:26px;height:34px;object-fit:contain}
  .topbar b{font-family:var(--serif);font-size:22px}
  .topbar .ib{color:#fff;width:44px;height:44px}
  .app{flex-direction:column}
  .main{padding:20px 16px 48px;gap:18px}
  .h1{font-size:34px}
  .g3,.g2,.frow2{grid-template-columns:minmax(0,1fr)}
  .kpi .v{font-size:30px}
  .tr{padding:0 14px}
  .drawer{width:100%}
  .t.bt{min-width:0}
  .bl{grid-template-columns:minmax(0,1fr) 92px 32px}
  .bl>:nth-child(2),.bl>:nth-child(4){display:none}
  .side{height:100%}
  .dhead,.dbody,.dfoot{padding-left:18px;padding-right:18px}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><img src="crest.png" alt="Walnut Creek Country Club MGA crest"><div><b>MGA Hub</b><small>Walnut Creek Country Club</small></div></div>
    <div class="season"><label for="seasonSel">Season</label><select id="seasonSel"></select></div>
    <nav class="navlist" id="nav" aria-label="Main"></nav>
    <div class="sidefoot">
      <button class="sync linkbtn" id="syncBtn" style="text-decoration:none"><span class="dot local" id="syncDot"></span><span id="syncTxt">This device only</span></button>
      <p id="syncErr" hidden style="margin:0;font-size:11.5px;color:#F0B8A8;word-break:break-word"></p>
      <div style="display:flex;gap:14px;flex-wrap:wrap"><button class="linkbtn" id="btnBackup">Backup</button><button class="linkbtn" id="btnRestore">Restore</button><button class="linkbtn" id="btnSignOut" hidden>Sign out</button></div>
      <input type="file" id="fileRestore" accept="application/json" hidden>
    </div>
  </aside>
  <header class="topbar"><button class="ib" id="btnMenu" aria-label="Open menu"></button><img src="crest.png" alt=""><b>MGA Hub</b></header>
  <main class="main" id="main"></main>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-modal="true" role="dialog" aria-labelledby="dTitle">
  <div class="dhead"><div><span class="lbl" id="dKicker"></span><h2 class="h2" id="dTitle"></h2></div><button class="ib" id="dClose" aria-label="Close"></button></div>
  <div class="dbody" id="dBody"></div>
  <div class="dfoot" id="dFoot"></div>
</aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="login" id="login">
  <div class="card">
    <img src="crest.png" alt="Walnut Creek Country Club MGA crest">
    <h1 class="h2" style="font-size:30px">MGA Hub</h1>
    <p class="muted" style="margin:0">Board sign-in</p>
    <input class="inp" type="password" id="loginPw" placeholder="Board password" autocomplete="current-password" aria-label="Board password">
    <button class="btn pri" id="loginBtn" style="width:100%">Sign in</button>
    <p class="hint" id="loginErr" style="color:var(--neg);min-height:18px"></p>
  </div>
</div>
<script>
/* =====================================================================
   MGA Hub — core: data model, calculations, storage + sync, import, verify
   Data lives in ONE jsonb row: public.mga_hub (id 'main').
   The current Member-Member app's row (public.mm_tournament) is only ever
   READ here, for importing and cross-verifying. Nothing writes to it.
   ===================================================================== */
const $=id=>document.getElementById(id);
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));
const n0=v=>{const x=parseFloat(v);return isFinite(x)?x:0;};
const fmt=v=>{const x=Math.round(n0(v));return (x<0?'−$':'$')+Math.abs(x).toLocaleString('en-US');};
const fmtS=v=>{const x=Math.round(n0(v));return x>0?'+'+fmt(x):fmt(x);};
const fmt2=v=>{const x=n0(v);return (x<0?'−$':'$')+Math.abs(x).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const sum=(a,f)=>(a||[]).reduce((t,x)=>t+n0(f(x)),0);
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function parseD(s){ if(!s) return null; const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s); return m?new Date(+m[1],+m[2]-1,+m[3]):null; }
function addDays(d,k){ const x=new Date(d); x.setDate(x.getDate()+k); return x; }
function dateRange(t){
  const d=parseD(t.startDate); if(!d) return 'Date TBD';
  const e=addDays(d,(t.days||1)-1);
  if(t.days<=1) return MONTHS[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear();
  return MONTHS[d.getMonth()]+' '+d.getDate()+'–'+(e.getMonth()!==d.getMonth()?MONTHS[e.getMonth()]+' ':'')+e.getDate()+', '+e.getFullYear();
}
function dayLabel(t,i){
  const d=parseD(t.startDate); const nm=['Day 1','Day 2','Day 3'][i];
  if(!d) return nm;
  const x=addDays(d,i); return x.toLocaleDateString('en-US',{weekday:'long'})+' · '+nm;
}
function dayShort(t,i){ const d=parseD(t.startDate); if(!d) return ''; const x=addDays(d,i); return MONTHS[x.getMonth()]+' '+x.getDate(); }
function daysOut(t){ const d=parseD(t.startDate); if(!d) return null; const now=new Date(); now.setHours(0,0,0,0); return Math.round((d-now)/864e5); }

/* ---------- model ---------- */
const HUB_VERSION=1;
const DEFAULT_ROLES=['President','Vice President','Treasurer','Secretary','Tournament Chair','Member at Large','Member at Large'];
const ITEM_KINDS=['Meal','Drinks','Event','Other'];
function newSeason(){ return {dues:{amount:90,installments:2},duesPayments:[],lines:[]}; }
function emptyHub(){
  const y=String(new Date().getFullYear());
  return {v:HUB_VERSION,activeSeason:y,members:[],board:DEFAULT_ROLES.map(r=>({id:uid(),role:r,memberId:'',term:''})),
          seasons:{[y]:newSeason()},tournaments:[]};
}
function newTournament(o){
  const days=Math.min(3,Math.max(1,+o.days||1));
  return {id:uid(),season:o.season,name:o.name||'New tournament',startDate:o.startDate||'',days,venue:o.venue||'Walnut Creek Country Club',
    status:'Planning',budgetBasis:'planned',entryFee:n0(o.entryFee),skinsFee:n0(o.skinsFee),plannedPlayers:n0(o.plannedPlayers),teamSize:+o.teamSize||2,ggEvent:o.ggEvent||'',
    field:[],sponsors:[],tiers:[],goal:0,
    dayItems:[[],[],[]].slice(0,3),income:[],perPlayer:[],lines:[],
    actuals:{entryFees:0,skins:0,skinsPaid:0},schedule:[],decisions:[],notes:'',source:null};
}
function normalize(d){
  if(!d||typeof d!=='object') return emptyHub();
  d.v=d.v||HUB_VERSION; d.members=d.members||[]; d.board=d.board||[]; d.seasons=d.seasons||{}; d.tournaments=d.tournaments||[];
  if(!d.activeSeason) d.activeSeason=String(new Date().getFullYear());
  if(!d.seasons[d.activeSeason]) d.seasons[d.activeSeason]=newSeason();
  for(const s of Object.values(d.seasons)){ s.dues=s.dues||{amount:90,installments:2}; s.duesPayments=s.duesPayments||[]; s.lines=s.lines||[]; }
  for(const t of d.tournaments){
    t.dayItems=t.dayItems||[[],[],[]]; while(t.dayItems.length<3) t.dayItems.push([]);
    for(const k of ['field','sponsors','tiers','income','perPlayer','lines','schedule','decisions']) t[k]=t[k]||[];
    t.actuals=Object.assign({entryFees:0,skins:0,skinsPaid:0},t.actuals||{}); if(!t.budgetBasis) t.budgetBasis='planned';
    if(!d.seasons[t.season]) d.seasons[t.season]=newSeason();
  }
  return d;
}

/* ---------- calculations (single source of truth for every number on screen) ---------- */
function menuSubtotal(m){ return sum(m&&m.items,i=>n0(i.qty)*n0(i.unitCost)); }
function menuCharge(m){ return menuSubtotal(m)*n0(m&&m.svcPct)/100; }
function menuTotal(m){ return menuSubtotal(m)+menuCharge(m); }
/* Budget uses the planned player count unless the board switches it to the field (so a half-filled field doesn't sink the budget). */
function playersUsed(t){ return t.budgetBasis==='field'?t.field.length:n0(t.plannedPlayers); }
function itemQty(t,it){ return it.qtyLink==='players'?playersUsed(t):n0(it.qty); }
function itemTotal(t,it){ return it.menu?menuTotal(it.menu):itemQty(t,it)*n0(it.unitCost); }
function spPaid(s){ return sum(s.payments,p=>p.amount); }
function tcalc(t){
  const players=playersUsed(t), days=t.days||1;
  const entryFees=players*n0(t.entryFee), skins=players*n0(t.skinsFee);
  const pledged=sum(t.sponsors,s=>s.pledged), received=sum(t.sponsors,spPaid);
  const otherInc=sum(t.income,i=>i.budget);
  const revenue=entryFees+skins+pledged+otherInc;
  const dayTot=[0,1,2].map(i=>i<days?sum(t.dayItems[i],it=>itemTotal(t,it)):0);
  const dayAct=[0,1,2].map(i=>i<days?sum(t.dayItems[i],it=>it.actual):0);
  const perPlayer=sum(t.perPlayer,p=>players*n0(p.perPlayer));
  const lineTot=sum(t.lines,l=>l.budget);
  const skinsPayout=skins;
  const expenses=dayTot[0]+dayTot[1]+dayTot[2]+perPlayer+skinsPayout+lineTot;
  const a=t.actuals;
  const revenueA=n0(a.entryFees)+n0(a.skins)+received+sum(t.income,i=>i.actual);
  const expensesA=dayAct[0]+dayAct[1]+dayAct[2]+sum(t.perPlayer,p=>p.actual)+n0(a.skinsPaid)+sum(t.lines,l=>l.actual);
  return {players,entryFees,skins,pledged,received,otherInc,revenue,dayTot,dayAct,perPlayer,lineTot,skinsPayout,expenses,
          net:revenue-expenses,revenueA,expensesA,netA:revenueA-expensesA};
}
function seasonTournaments(y){ return db.tournaments.filter(t=>t.season===y).sort((a,b)=>(a.startDate||'9').localeCompare(b.startDate||'9')); }
function scalc(y){
  const s=db.seasons[y]||newSeason(), ts=seasonTournaments(y).map(t=>({t,c:tcalc(t)}));
  const active=db.members.filter(m=>m.status!=='Inactive').length;
  const duesBudget=active*n0(s.dues.amount), duesActual=sum(s.duesPayments,p=>p.amount);
  const incLines=s.lines.filter(l=>l.type==='Income'), expLines=s.lines.filter(l=>l.type!=='Income');
  const tRev=sum(ts,x=>x.c.revenue), tExp=sum(ts,x=>x.c.expenses), tRevA=sum(ts,x=>x.c.revenueA), tExpA=sum(ts,x=>x.c.expensesA);
  const revenue=tRev+duesBudget+sum(incLines,l=>l.budget), expenses=tExp+sum(expLines,l=>l.budget);
  const revenueA=tRevA+duesActual+sum(incLines,l=>l.actual), expensesA=tExpA+sum(expLines,l=>l.actual);
  const raffle=sum(ts,x=>sum(x.t.income.filter(i=>i.source==='raffle'),i=>i.budget));
  const raffleA=sum(ts,x=>sum(x.t.income.filter(i=>i.source==='raffle'),i=>i.actual));
  return {s,ts,active,duesBudget,duesActual,tRev,tExp,revenue,expenses,net:revenue-expenses,revenueA,expensesA,netA:revenueA-expensesA,raffle,raffleA,
          pledged:sum(ts,x=>x.c.pledged),received:sum(ts,x=>x.c.received)};
}

function guessKind(name){ return /dinner|lunch|buffet|snack|hors|breakfast|meal/i.test(name)?'Meal':/keg|bar\b|beer|margarita|bloody|cocktail|drink/i.test(name)?'Drinks':'Event'; }
function oldResQty(y,i){ return i.qtyLink?n0((y.inputs||{})[i.qtyLink]):n0(i.qty); }
function convertMM(y,year){
  const inp=y.inputs||{}, rev=y.rev||{}, act=y.actuals||{};
  const m=/([A-Za-z]+)\s+(\d{1,2})/.exec((y.info&&y.info.dates)||'');
  let start=''; if(m){ const mi=MONTHS.findIndex(x=>m[1].toLowerCase().startsWith(x.toLowerCase())); if(mi>=0) start=`${year}-${String(mi+1).padStart(2,'0')}-${String(m[2]).padStart(2,'0')}`; }
  const t=newTournament({season:String(year),name:'Member-Member',startDate:start,days:3,venue:(y.info&&y.info.venue)||'Walnut Creek Country Club',
    entryFee:inp.entryFee,skinsFee:inp.skins,plannedPlayers:inp.golfers,teamSize:2});
  t.goal=n0(y.goal);
  t.tiers=(y.tiers||[]).map(x=>({id:uid(),name:x.name,amt:n0(x.amt)}));
  t.sponsors=(y.sponsors||[]).map(s=>({id:uid(),company:s.company||'',contact:s.contact||'',phone:s.phone||'',email:s.email||'',tier:s.tier||'',
    pledged:n0(s.pledged),committee:s.committee||'',notes:s.notes||'',payments:(s.payments||[]).map(p=>({id:uid(),amount:n0(p.amount),method:p.method||'',date:p.date||''}))}));
  const dinnerMenu={items:(y.dinner||[]).map(d=>({id:uid(),item:d.item||'',qty:n0(d.qty),unitCost:n0(d.unitCost),notes:d.notes||''})),svcPct:n0(y.dinnerSvc),guests:n0(inp.satHeadcount)};
  ['Friday','Saturday','Sunday'].forEach((day,di)=>{
    t.dayItems[di]=((y.fb||{})[day]||[]).map(i=>{
      const it={id:uid(),item:i.item||'',kind:guessKind(i.item||''),qty:oldResQty(y,i),unitCost:n0(i.unitCost),actual:n0(i.actual),notes:i.notes||'',qtyLink:''};
      if(i.costLink==='dinner'){ it.menu=clone(dinnerMenu); it.kind='Meal'; it.qty=dinnerMenu.guests; it.unitCost=0; }
      else if(i.qtyLink){ it.notes=(it.notes?it.notes+' · ':'')+'Quantity was linked to '+i.qtyLink+' in the old app'; }
      return it; });
  });
  t.income=[{id:uid(),desc:'Carry forward',budget:n0(rev.carry),actual:n0(act.carry),notes:''},
            {id:uid(),desc:'MGA donation',budget:n0(rev.mga),actual:n0(act.mga),notes:''},
            {id:uid(),desc:'50/50 raffle',budget:n0(rev.raffles),actual:n0(act.raffles),notes:'Season raffle proceeds assigned to Member-Member',source:'raffle'}];
  t.perPlayer=[{id:uid(),desc:'Pro shop spree',perPlayer:n0(inp.proCredit),actual:n0(act.proShop),notes:''}];
  t.lines=[{id:uid(),group:'Prizes',desc:'Flight prize money',budget:n0(y.flightPrizeBudget),actual:n0(act.flight),notes:''}]
    .concat((y.misc||[]).map(x=>({id:uid(),group:'Misc',desc:x.desc||'',budget:n0(x.budget),actual:n0(x.actual),notes:x.notes||''})));
  t.actuals={entryFees:n0(act.entryFees),skins:n0(act.skins),skinsPaid:n0(act.skinsPay)};
  t.schedule=(y.schedule||[]).map((d,di)=>({day:di,label:d.day||'',items:(d.items||[]).map(i=>({id:uid(),time:i.time||'',event:i.event||'',notes:i.notes||''}))}));
  t.decisions=(y.decisions||[]).map(d=>({id:uid(),text:d.text||'',done:!!d.done}));
  t.source={kind:'mm-app',year:String(year),importedAt:new Date().toISOString(),raw:clone(y)};
  return t;
}
/* The old app's calc(), ported line for line (including its use of the STORED
   deposited figure), so the comparison is against what the old app shows. */
function oldCalc(y){
  const n=y.inputs||{}, rev=y.rev||{}, a=y.actuals||{};
  const dinnerSub=sum(y.dinner,i=>n0(i.qty)*n0(i.unitCost)), dinnerTot=dinnerSub+dinnerSub*n0(y.dinnerSvc)/100;
  const lt=i=>i.costLink==='dinner'?dinnerTot:oldResQty(y,i)*n0(i.unitCost);
  const fb=d=>sum((y.fb||{})[d],lt), fbA=d=>sum((y.fb||{})[d],i=>i.actual);
  const pledged=sum(y.sponsors,s=>s.pledged), deposited=sum(y.sponsors,s=>s.deposited);
  const entryFees=n0(n.golfers)*n0(n.entryFee), skinsC=n0(n.golfers)*n0(n.skins);
  const totalRev=entryFees+skinsC+pledged+n0(rev.carry)+n0(rev.mga)+n0(rev.raffles);
  const proShop=n0(n.golfers)*n0(n.proCredit), miscT=sum(y.misc,m=>m.budget), flight=n0(y.flightPrizeBudget);
  const fbF=fb('Friday'),fbS=fb('Saturday'),fbU=fb('Sunday');
  const totalExp=fbF+fbS+fbU+flight+proShop+skinsC+miscT;
  const totalRevA=n0(a.entryFees)+n0(a.skins)+deposited+n0(a.carry)+n0(a.mga)+n0(a.raffles);
  const totalExpA=fbA('Friday')+fbA('Saturday')+fbA('Sunday')+n0(a.flight)+n0(a.proShop)+n0(a.skinsPay)+sum(y.misc,m=>m.actual);
  return {entryFees,skinsC,pledged,carry:n0(rev.carry),mga:n0(rev.mga),raffles:n0(rev.raffles),totalRev,fbF,fbS,fbU,flight,proShop,miscT,totalExp,
          net:totalRev-totalExp,deposited,paymentsLogged:sum(y.sponsors,s=>sum(s.payments,p=>p.amount)),totalRevA,totalExpA,netA:totalRevA-totalExpA,dinnerTot,sponsors:(y.sponsors||[]).length};
}
function verifyRows(t,raw){

    ['Saturday dinner (in Day 2)',o.dinnerTot,dinner],['Flight prizes',o.flight,lg('Prizes')],['Pro shop spree',o.proShop,c.perPlayer],
    ['Day / skins payout',o.skinsC,c.skinsPayout],['Misc & event',o.miscT,lg('Misc')],

  ];

/* ---------- storage + cloud sync ---------- */
const LS_KEY='mga_hub_v1';
const store={ load(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)); }catch(_){ return null; } },
              save(d){ try{ localStorage.setItem(LS_KEY,JSON.stringify(d)); }catch(_){} } };
const CFG=window.MM_CONFIG||{};
const CLOUD=!!(CFG.url&&CFG.anonKey&&window.supabase);
const sb=CLOUD?window.supabase.createClient(CFG.url,CFG.anonKey):null;
const CLIENT=uid();
let db=normalize(store.load()||emptyHub());
let saveT=null, pendingRemote=null, lastPushed='';
/* Stable stringify: Postgres jsonb reorders keys, so plain JSON.stringify can't tell "same data" apart. */
function stable(o){ if(Array.isArray(o)) return '['+o.map(stable).join(',')+']';
  if(o&&typeof o==='object') return '{'+Object.keys(o).filter(k=>k!=='_w'&&k!=='_at').sort().map(k=>JSON.stringify(k)+':'+stable(o[k])).join(',')+'}';
  return JSON.stringify(o); }
let lastSyncErr='';
function setSync(s,err){
  const d=$('syncDot'), t=$('syncTxt'); d.className='dot '+s;
  t.textContent={synced:'All changes saved',saving:'Saving…',offline:'Not saving to cloud — tap to retry',local:'This device only'}[s]||s;
  if(s==='offline'){ const m=err?(err.message||String(err))+(err.code?' ('+err.code+')':''):'Cloud unreachable';
    if(m!==lastSyncErr) toast('Cloud save failed: '+m); lastSyncErr=m; $('syncErr').textContent=m; $('syncErr').hidden=false; }
  else { lastSyncErr=''; $('syncErr').hidden=true; }
}
function persist(){
  db._w=CLIENT; db._at=Date.now(); store.save(db);
  if(!CLOUD||!sessionOK){ setSync('local'); return; }
  setSync('saving'); clearTimeout(saveT); saveT=setTimeout(pushCloud,700);
}
async function pushCloud(){
  const snap=stable(db);
  const {error}=await sb.from('mga_hub').upsert({id:'main',data:db,updated_at:new Date().toISOString()});
  if(error){ setSync('offline',error); return; }
  lastPushed=snap; setSync('synced');
}
function applyRemote(remote){
  remote=normalize(remote);
  if(stable(remote)===stable(db)) return;
  if(drawerOpen()){ pendingRemote=remote; return; }
  db=remote; store.save(db); render(); toast('Updated from another device');
}
let sessionOK=false, cloudReady=false;
async function startCloud(){
  setSync('saving');
  const {data:row,error}=await sb.from('mga_hub').select('data').eq('id','main').maybeSingle();
  if(error){ setSync('offline',/relation|does not exist/i.test(error.message)?{message:'The mga_hub table is missing — run hub-setup.sql in Supabase'}:error); render(); return; }
  cloudReady=true;
  if(row&&row.data){ db=normalize(row.data); store.save(db); setSync('synced'); }
  else await pushCloud();
  render();
  sb.channel('mga-hub').on('postgres_changes',{event:'*',schema:'public',table:'mga_hub',filter:'id=eq.main'},p=>{
    const r=p.new&&p.new.data; if(!r||r._w===CLIENT) return; applyRemote(r);
  }).subscribe();
  document.addEventListener('visibilitychange',async()=>{
    if(document.visibilityState!=='visible') return;
    const {data:r}=await sb.from('mga_hub').select('data').eq('id','main').maybeSingle();
    if(r&&r.data&&r.data._w!==CLIENT) applyRemote(r.data);
  });
}
/* Read-only fetch of the current app's state, for import + verify. */
async function fetchMMState(){
  if(!CLOUD||!sessionOK) throw new Error('Sign in to the cloud first, or import from a backup file');
  const {data:row,error}=await sb.from('mm_tournament').select('data').eq('id','main').maybeSingle();
  if(error) throw error; if(!row||!row.data) throw new Error('No data found in the current app');
  return row.data;
}

function copyStructure(src,t){
  const re=a=>(a||[]).map(x=>Object.assign(clone(x),{id:uid()}));
  t.tiers=re(src.tiers); t.goal=src.goal;
  t.dayItems=[0,1,2].map(i=>i<t.days?re(src.dayItems[i]).map(x=>{x.actual=0; if(x.menu) x.menu.items=re(x.menu.items); return x;}):[]);
  t.income=re(src.income).map(x=>(x.actual=0,x)); t.perPlayer=re(src.perPlayer).map(x=>(x.actual=0,x)); t.lines=re(src.lines).map(x=>(x.actual=0,x));
  t.sponsors=src.sponsors.map(s=>({id:uid(),company:s.company,contact:s.contact,phone:s.phone,email:s.email,tier:s.tier,pledged:0,committee:s.committee,notes:'',payments:[]}));

}

/* ---------- Import from the current app ---------- */
async function importMM(){
  let state;
  try{ state=await fetchMMState(); }
  catch(e){ return importMMFromFile(e.message); }
  chooseMMYear(state,'the current app');
}
function importMMFromFile(reason){
  openDrawer({kicker:'Import',title:'Import Member-Member',
    body:`<p class="hint">${esc(reason)}.</p><p class="muted" style="margin:0">Choose a backup file downloaded from the current app (⋯ → Backup all data).</p><input type="file" id="impFile" accept="application/json" class="inp" style="padding-top:8px">`,
    wire:r=>{ r.querySelector('#impFile').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const rd=new FileReader();
      rd.onload=()=>{ try{ const d=JSON.parse(rd.result); if(!d.years) throw 0; closeDrawer(); chooseMMYear(d,'the backup file'); }catch(_){ toast('That isn’t a backup from the Member-Member app'); } }; rd.readAsText(f); }; }});
}
function chooseMMYear(state,from){
  const years=Object.keys(state.years||{}).sort((a,b)=>b-a);
  if(!years.length){ toast('No years found in '+from); return; }
  const existing=db.tournaments.find(t=>t.source&&t.source.kind==='mm-app'&&t.source.year===(state.activeYear||years[0]));
  openDrawer({kicker:'Import from '+from,title:'Import Member-Member',saveLabel:existing?'Replace with fresh import':'Import',
    body:field('Year','impYear',state.activeYear||years[0],{type:'select',options:years})+
      `<p class="hint">Brings over sponsors and payments, all three days of food &amp; beverage (the Saturday dinner menu included), income, misc expenses, actuals, the schedule and open decisions. The current app is only read — nothing there changes.</p>`+
      (existing?`<div class="banner">This year is already imported. Importing again replaces that tournament with a fresh copy, so any edits made to it in the hub are lost.</div>`:''),
    save:()=>{
      const yr=fv('impYear'), t=convertMM(state.years[yr],yr);
      if(!db.seasons[yr]) db.seasons[yr]=newSeason();
      const old=db.tournaments.find(x=>x.source&&x.source.kind==='mm-app'&&x.source.year===yr);
      if(old){ t.id=old.id; t.field=old.field; db.tournaments[db.tournaments.indexOf(old)]=t; } else db.tournaments.push(t);
      db.activeSeason=yr; view.page='tournament'; view.tid=t.id; view.ttab='verify'; toast('Imported — checking against the current app');
    }});
}

/* Field */
function tField(el,t){
  const size=t.teamSize||2, teams={};
  t.field.forEach(p=>{ (teams[p.team||0]=teams[p.team||0]||[]).push(p); });
  const nums=Object.keys(teams).map(Number).sort((a,b)=>a-b);
  const paid=t.field.filter(p=>p.paid).length, skins=t.field.filter(p=>p.skins).length;
  const cols=`grid-template-columns:80px repeat(${size},minmax(0,1fr)) 120px 40px`;
  el.innerHTML=`<div class="grid g4">${kpi('Players in field',String(t.field.length),size>1?`${nums.length} team${nums.length===1?'':'s'} of ${size}`:'individual')}${kpi('Entry fee',fmt(t.entryFee),'per player')}${kpi('Entry fees paid',String(paid),`of ${t.field.length} · ${fmt(paid*n0(t.entryFee))} collected`)}${kpi('Skins entered',String(skins),n0(t.skinsFee)?'× '+fmt(t.skinsFee):'no skins fee set')}</div>
  ${t.budgetBasis!=='field'?`<div class="banner">The budget uses ${n0(t.plannedPlayers)} planned players. Switch it to the field in Tournament details once signups close.</div>`:''}
  <div class="toolbar"><div class="actions"><button class="btn pri" id="fAdd">${I.plus}Add ${size>1?'team':'player'}</button><button class="btn" id="fGG" title="Coming later">${I.down}Import from Golf Genius</button></div><span class="muted" style="margin-left:auto;font-size:13px">Players are picked from Members${db.members.length?'':' — add members first'}.</span></div>
  <div class="card" style="overflow:hidden">${t.field.length?`<div class="tw"><div class="t"><div class="tr th" style="${cols}"><span>${size>1?'Team':'#'}</span>${Array.from({length:size},(_,i)=>`<span>Player ${i+1}</span>`).join('')}<span>Entry</span><span></span></div>
    ${nums.map(n=>`<div class="tr click" data-team="${n}" style="${cols}"><span class="muted">${size>1?'Team '+n:n}</span>${Array.from({length:size},(_,i)=>{const p=teams[n][i];const mm=p&&memberById(p.memberId);return `<span class="trunc" style="font-weight:600">${p?esc(mm?memberName(mm):p.name||'Unknown')+(p.skins?' <span class="chip" style="height:20px;font-size:11px">Skins</span>':''):'<span class="muted">—</span>'}</span>`;}).join('')}<span>${teams[n].every(p=>p.paid)?'<span class="chip ok">Paid</span>':`<span class="chip warn">${fmt(teams[n].filter(p=>!p.paid).length*n0(t.entryFee))} due</span>`}</span><span class="ib">${I.edit}</span></div>`).join('')}</div></div>`:`<div class="empty"><b>No field yet</b><span>Add ${size>1?'teams':'players'} from the member list as they sign up.</span></div>`}</div>`;
  $('fAdd').onclick=()=>editTeam(t,null); $('fGG').onclick=()=>toast('Golf Genius sync is planned — needs API access from Golf Genius');
  el.querySelectorAll('[data-team]').forEach(r=>r.onclick=()=>editTeam(t,+r.dataset.team));
}
function editTeam(t,num){
  const size=t.teamSize||2, existing=num!=null?t.field.filter(p=>(p.team||0)===num):[];
  const next=num!=null?num:(Math.max(0,...t.field.map(p=>p.team||0))+1);
  const taken=new Set(t.field.filter(p=>(p.team||0)!==num).map(p=>p.memberId));
  const opts=[['','— Choose member —']].concat(db.members.filter(m=>m.status!=='Inactive'||existing.some(p=>p.memberId===m.id)).sort((a,b)=>memberName(a).localeCompare(memberName(b))).map(m=>[m.id,memberName(m)+(taken.has(m.id)?' (already in field)':'')]));
  openDrawer({kicker:t.name+' · Field',title:size>1?(num!=null?'Team '+num:'Add team'):(num!=null?'Edit player':'Add player'),
    body:(size>1?field('Team number','tmNum',next,{type:'number'}):'')+Array.from({length:size},(_,i)=>{const p=existing[i]||{};return `<div class="card pad" style="display:flex;flex-direction:column;gap:10px">${field('Player '+(i+1),'tmM'+i,p.memberId||'',{type:'select',options:opts})}<div style="display:flex;gap:18px"><label class="check"><input type="checkbox" id="tmP${i}"${p.paid?' checked':''}>Entry paid</label><label class="check"><input type="checkbox" id="tmS${i}"${p.skins?' checked':''}>In skins</label></div></div>`;}).join('')+
      (db.members.length?'':'<div class="banner">No members yet — add them on the Members page first.</div>'),
    save:()=>{ const team=size>1?(+fv('tmNum')||next):next; const picks=[];
      for(let i=0;i<size;i++){ const mid=fv('tmM'+i); if(!mid) continue; if(taken.has(mid)){ toast(memberName(memberById(mid))+' is already in the field'); return false; }
        if(picks.some(p=>p.memberId===mid)){ toast('Same member picked twice'); return false; }
        picks.push({id:(existing[i]&&existing[i].id)||uid(),memberId:mid,team,paid:$('tmP'+i).checked,skins:$('tmS'+i).checked}); }
      if(!picks.length){ toast('Pick at least one player'); return false; }
      t.field=t.field.filter(p=>(p.team||0)!==num).concat(picks); },
    del:num!=null?()=>{ t.field=t.field.filter(p=>(p.team||0)!==num); }:null,delLabel:size>1?'Remove team':'Remove player'});
}

function editTiers(t){

  openDrawer({kicker:t.name,title:'Sponsor tiers',body:`<div class="mini"><div class="mr h" style="grid-template-columns:minmax(0,1fr) 100px 28px"><span>Tier</span><span class="r">Default $</span><span></span></div><div id="tRows">${rows()}</div></div><button class="btn sm" id="tAdd" type="button" style="align-self:flex-start">${I.plus}Add tier</button><p class="hint">Renaming a tier updates sponsors already on it.</p>`,
    wire:r=>{ const bind=()=>{ r.querySelectorAll('[data-ti]').forEach(e=>e.oninput=()=>tiers[+e.dataset.ti][e.dataset.k]=e.value); r.querySelectorAll('[data-tdel]').forEach(b=>b.onclick=()=>{tiers.splice(+b.dataset.tdel,1);r.querySelector('#tRows').innerHTML=rows();bind();}); };

/* ---------- Member roster import (Golf Genius export, any .xlsx/.xls/.csv) ----------
   Finds the header row itself, maps columns by name, previews new vs. updated,
   and matches existing members by Golf Genius ID → GHIN → email → name so a newer
   export updates people instead of duplicating them. */
function loadXLSX(){ if(window.XLSX) return Promise.resolve();
  return new Promise((ok,bad)=>{ const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'; s.onload=ok; s.onerror=()=>bad(new Error('Couldn’t load the spreadsheet reader — check your connection')); document.head.appendChild(s); }); }
const ROSTER_COLS={
  ggId:/^(id\b|id \(|golf ?genius( player)? id)/, email:/^e-?mail( address)?$/, first:/^first( name)?$/, last:/^last( name)?$/,
  full:/^(full ?name|name|player|golfer)$/, handle:/^handle$/, phone:/(cell|mobile)( phone)?$|^phone( number)?$/, hcp:/^(index|handicap( index)?|hcp|hi)$/,
  ghin:/^ghin( ?(id|#|no\.?|number))?$/, memberNo:/^member ?(#|no\.?|number|id)$/, addr1:/^address ?1?$/, addr2:/^address ?2$/, city:/^city$/, state:/^state$/,
  zip:/^(zip|zip ?code|postal( code)?)$/, dob:/(date of )?birth|^dob$/, memberType:/^member ?type$/, mg:/member or guest|^guest$/, gender:/^gender$/
};
async function readRosterFile(f){
  const ext=(f.name.split('.').pop()||'').toLowerCase(); let rows;
  if(ext==='csv'&&!window.XLSX){ try{ await loadXLSX(); }catch(_){ rows=parseCSV(await f.text()); } }
  if(!rows){ await loadXLSX(); const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
    let best=null; for(const n of wb.SheetNames){ const r=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:''}); if(!best||r.length>best.length) best=r; } rows=best||[]; }
  return rows.map(r=>r.map(c=>String(c??'').trim()));
}
function mapRoster(rows){
  let hi=-1, map={};
  for(let i=0;i<Math.min(rows.length,30)&&hi<0;i++){
    const m={}; rows[i].forEach((h,ci)=>{ const k=h.toLowerCase().replace(/\s+/g,' ').trim(); for(const [key,re] of Object.entries(ROSTER_COLS)) if(m[key]===undefined&&re.test(k)){ m[key]=ci; break; } });
    if((m.first!==undefined&&m.last!==undefined)||m.full!==undefined||m.handle!==undefined){ hi=i; map=m; }
  }
  if(hi<0) throw new Error('Couldn’t find a header row with First Name and Last Name (or Name)');
  const people=[]; let skippedGuests=0, skippedBlank=0;
  for(const r of rows.slice(hi+1)){
    const g=k=>map[k]!==undefined?(r[map[k]]||'').trim():'';
    let first=g('first'), last=g('last');
    if(!first&&!last){ const h=g('handle'); if(h.includes(',')){ [last,first]=h.split(',').map(s=>s.trim()); } else { const p=(g('full')||h).split(/\s+/).filter(Boolean); first=p.shift()||''; last=p.join(' '); } }
    if(!first&&!last){ if(r.some(c=>c)) skippedBlank++; continue; }
    if(/guest/i.test(g('mg'))){ skippedGuests++; continue; }
    people.push({ggId:g('ggId').replace(/\D/g,'')?g('ggId'):'',first,last,email:g('email').toLowerCase(),phone:g('phone'),hcp:g('hcp'),ghin:g('ghin'),memberNo:g('memberNo'),
      address1:g('addr1'),address2:g('addr2'),city:g('city'),state:g('state'),zip:g('zip'),dob:g('dob'),memberType:g('memberType')});
  }
  return {people,skippedGuests,skippedBlank,columns:Object.keys(map)};
}
const ROSTER_FIELDS=[['first','First name'],['last','Last name'],['email','Email'],['phone','Phone'],['hcp','Handicap'],['ghin','GHIN'],['memberNo','Member #'],['ggId','Golf Genius ID'],
  ['address1','Address'],['address2','Address 2'],['city','City'],['state','State'],['zip','Zip'],['dob','Date of birth'],['memberType','Member type']];
function matchMember(p,used){
  const key=s=>(s||'').toLowerCase().replace(/[^a-z]/g,'');
  const tries=[x=>p.ggId&&x.ggId===p.ggId, x=>p.ghin&&x.ghin===p.ghin, x=>p.email&&(x.email||'').toLowerCase()===p.email, x=>key(x.first)===key(p.first)&&key(x.last)===key(p.last)];
  for(const t of tries){ const m=db.members.find(x=>!used.has(x.id)&&t(x)); if(m) return m; }
  return null;
}
function planRoster(people){
  const used=new Set(), plan={add:[],update:[],same:[]};
  for(const p of people){
    const m=matchMember(p,used);
    if(!m){ plan.add.push(p); continue; }
    used.add(m.id);
    const changes=ROSTER_FIELDS.filter(([k])=>p[k]&&String(m[k]??'')!==p[k]).map(([k,l])=>({k,l,from:m[k]??'',to:p[k]}));
    (changes.length?plan.update:plan.same).push({m,p,changes});
  }
  plan.missing=db.members.filter(x=>!used.has(x.id)&&x.status!=='Inactive');
  return plan;
}
function importRoster(){
  openDrawer({kicker:'Members',title:'Import member list',
    body:`<p style="margin:0">Upload the Golf Genius contact list export (<b>.xlsx</b>) or any spreadsheet or CSV with first and last name columns.</p>
      <p class="hint">Picks up email, handicap index, GHIN, Golf Genius ID, phone and address. People already in the hub are matched by Golf Genius ID, GHIN, email, then name, so uploading a newer export updates them instead of adding duplicates. You’ll see a preview before anything is saved.</p>
      <input type="file" id="rosterF" accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv" class="inp" style="padding-top:8px"><p class="hint" id="rosterMsg" aria-live="polite"></p>`,
    wire:r=>{ r.querySelector('#rosterF').onchange=async e=>{ const f=e.target.files[0]; if(!f) return; const msg=r.querySelector('#rosterMsg'); msg.style.color=''; msg.textContent='Reading '+f.name+'…';
      try{ const res=mapRoster(await readRosterFile(f)); if(!res.people.length) throw new Error('No people found under the header row'); closeDrawer(); previewRoster(res,f.name); }
      catch(err){ msg.style.color='var(--neg)'; msg.textContent=err.message||'Couldn’t read that file'; } }; }});
}
function previewRoster(res,fname){
  const plan=planRoster(res.people);
  const li=(t,sub)=>`<div class="mr" style="grid-template-columns:minmax(0,1fr)"><div class="cell2"><b>${t}</b>${sub?`<small>${sub}</small>`:''}</div></div>`;
  const more=(n,shown)=>n>shown?`<div class="mr"><span class="muted">+ ${n-shown} more</span></div>`:'';
  const SHOW=8;
  openDrawer({kicker:'Import · '+fname,title:'Review import',saveLabel:`Import ${plan.add.length+plan.update.length} change${plan.add.length+plan.update.length===1?'':'s'}`,
    body:`<div class="grid g3" style="gap:10px">${[['New',plan.add.length],['Updated',plan.update.length],['No change',plan.same.length]].map(([l,v])=>`<div class="card pad kpi" style="padding:14px"><span class="lbl">${l}</span><span class="v num" style="font-size:30px">${v}</span></div>`).join('')}</div>
      <p class="hint">${res.people.length} people read from the file${res.skippedGuests?` · ${res.skippedGuests} guests skipped`:''}${res.skippedBlank?` · ${res.skippedBlank} rows without a name skipped`:''}.</p>
      ${plan.add.length?`<div class="fld"><span class="lbl">New members</span><div class="mini">${plan.add.slice(0,SHOW).map(p=>li(esc(p.first+' '+p.last),esc([p.email,p.hcp&&'Index '+p.hcp,p.ghin&&'GHIN '+p.ghin].filter(Boolean).join(' · ')))).join('')}${more(plan.add.length,SHOW)}</div></div>`:''}
      ${plan.update.length?`<div class="fld"><span class="lbl">Updates to existing members</span><div class="mini">${plan.update.slice(0,SHOW).map(u=>li(esc(memberName(u.m)),u.changes.map(c=>esc(c.l)+': '+(c.from?esc(c.from)+' → ':'')+esc(c.to)).join(' · '))).join('')}${more(plan.update.length,SHOW)}</div><p class="hint">Blank cells in the file never erase what’s already in the hub.</p></div>`:''}
      ${plan.missing.length?`<label class="check" style="align-items:flex-start;font-weight:400"><input type="checkbox" id="rosterInact"><span>Mark the ${plan.missing.length} active member${plan.missing.length===1?'':'s'} not in this file as Inactive <span class="muted">(${esc(plan.missing.slice(0,4).map(memberName).join(', '))}${plan.missing.length>4?'…':''})</span></span></label>`:''}`,
    save:()=>{
      const inact=$('rosterInact')&&$('rosterInact').checked;
      if(!plan.add.length&&!plan.update.length&&!inact){ toast('Nothing to change — the hub already matches this file'); return; }
      const before=clone(db.members);
      for(const p of plan.add){ const m={id:uid(),status:'Active',joined:'',notes:''}; ROSTER_FIELDS.forEach(([k])=>{ m[k]=p[k]||''; }); m.source='roster'; db.members.push(m); }
      for(const u of plan.update){ u.changes.forEach(c=>{ u.m[c.k]=c.to; }); if(u.m.status==='Inactive') u.m.status='Active'; }
      if(inact) plan.missing.forEach(m=>m.status='Inactive');
      db.rosterImportedAt=new Date().toISOString(); db.rosterFile=fname;
      toast(`${plan.add.length} added · ${plan.update.length} updated${inact?` · ${plan.missing.length} marked inactive`:''}`,()=>{ db.members=before; persist(); render(); });
    }});
}
function parseCSV(txt){ const rows=[]; let row=[],cur='',q=false;
  for(let i=0;i<txt.length;i++){ const ch=txt[i];
    if(q){ if(ch==='"'&&txt[i+1]==='"'){cur+='"';i++;} else if(ch==='"') q=false; else cur+=ch; }
    else if(ch==='"') q=true; else if(ch===','){row.push(cur);cur='';} else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&txt[i+1]==='\n') i++; row.push(cur); rows.push(row); row=[]; cur=''; } else cur+=ch; }
  if(cur||row.length){ row.push(cur); rows.push(row); } return rows.filter(r=>r.some(c=>c.trim())); }
/* ---------- Board ---------- */
function vBoard(m){
  m.innerHTML=head('Board',`${Y()} MGA board. Each seat is filled from the member list.`,btn('Add seat','bAdd','',I.plus))+`
  <div class="grid g4">${db.board.map(b=>{const mm=memberById(b.memberId);return `<div class="card pad" style="display:flex;flex-direction:column;gap:12px"><div style="display:flex;justify-content:space-between;align-items:center"><span class="lbl">${esc(b.role)}</span><button class="ib" data-bs="${b.id}" aria-label="Edit ${esc(b.role)} seat">${I.edit}</button></div>
    ${mm?`<div style="display:flex;align-items:center;gap:12px"><span class="av" style="width:44px;height:44px;font-size:14px">${initials(mm)}</span><div class="cell2"><b style="font-size:15px">${esc(memberName(mm))}</b><small>${b.term?'Term through '+esc(b.term):esc(mm.email||'')}</small></div></div><div class="actions"><button class="btn sm" data-bp="${b.id}">Change</button><button class="btn sm" data-bc="${b.id}">Vacate</button></div>`
    :`<button class="btn" data-bp="${b.id}" style="border-style:dashed;height:76px;color:var(--gold)">${I.plus}Fill seat from members</button>`}</div>`;}).join('')}</div>`;
  m.querySelectorAll('[data-bp]').forEach(x=>x.onclick=()=>pickMember(db.board.find(b=>b.id===x.dataset.bp)));
  m.querySelectorAll('[data-bc]').forEach(x=>x.onclick=()=>{ const b=db.board.find(s=>s.id===x.dataset.bc), was=b.memberId; b.memberId=''; persist(); render(); toast('Seat vacated',()=>{b.memberId=was;persist();render();}); });
  m.querySelectorAll('[data-bs]').forEach(x=>x.onclick=()=>editSeat(db.board.find(b=>b.id===x.dataset.bs)));
  $('bAdd').onclick=()=>editSeat(null);
}
function pickMember(seat){
  if(!db.members.length){ toast('Add members first'); go('members'); return; }
  let chosen=seat.memberId;
  const list=db.members.filter(x=>x.status!=='Inactive').sort((a,b)=>memberName(a).localeCompare(memberName(b)));
  const html=q=>list.filter(x=>memberName(x).toLowerCase().includes(q.toLowerCase())).map(x=>{const on=db.board.filter(b=>b.memberId===x.id&&b.id!==seat.id).map(b=>b.role);
    return `<button type="button" data-pk="${x.id}" class="${x.id===chosen?'on':''}"><span class="av">${initials(x)}</span><b>${esc(memberName(x))}</b><span class="muted" style="margin-left:auto;font-size:12.5px">${on.length?esc(on.join(', ')):''}</span></button>`;}).join('')||'<span class="muted" style="padding:14px">No matches.</span>';
  openDrawer({kicker:seat.role,title:'Choose a member',saveLabel:'Add to board',
    body:`<input class="inp" id="pkQ" placeholder="Search members" aria-label="Search members"><div class="pick" id="pkL">${html('')}</div>`,
    wire:r=>{ const bind=()=>r.querySelectorAll('[data-pk]').forEach(b=>b.onclick=()=>{ chosen=b.dataset.pk; r.querySelectorAll('[data-pk]').forEach(x=>x.classList.toggle('on',x===b)); });
      bind(); r.querySelector('#pkQ').oninput=e=>{ r.querySelector('#pkL').innerHTML=html(e.target.value); bind(); }; },
    save:()=>{ if(!chosen){ toast('Pick a member'); return false; } seat.memberId=chosen; toast(memberName(memberById(chosen))+' is now '+seat.role); }});
}
function editSeat(seat){
  openDrawer({kicker:'Board',title:seat?'Edit seat':'Add seat',body:field('Role','bsR',seat?.role||'',{ph:'e.g. Handicap Chair'})+field('Term through','bsT',seat?.term||'',{ph:'e.g. 2027'}),
    save:()=>{ const r=fv('bsR'); if(!r){ toast('Name the role'); return false; } if(seat) Object.assign(seat,{role:r,term:fv('bsT')}); else db.board.push({id:uid(),role:r,memberId:'',term:fv('bsT')}); },
    del:seat?()=>{ db.board=db.board.filter(b=>b!==seat); }:null,delLabel:'Remove seat'});
}

/* ---------- Season budget ---------- */
function vBudget(m){
  const y=Y(), sc=scalc(y), s=sc.s;
  const cols='grid-template-columns:minmax(160px,2fr) 140px 130px 130px 120px 120px';
  const r=(n,d,rv,ex,nt,act,cls='',attr='')=>`<div class="tr num ${cls}" ${attr} style="${cols}"><span style="font-weight:600;color:var(--navy)">${n}</span><span class="muted">${d}</span><span class="r">${rv}</span><span class="r">${ex}</span><b class="r ${typeof nt==='number'?netCls(nt):''}">${typeof nt==='number'?fmtS(nt):nt}</b><span class="r muted">${act}</span></div>`;
  m.innerHTML=head('Season budget','Tournaments are self-sustaining; dues are the MGA’s own income. Everything rolls up here.',btn('Add MGA line','sbAdd','',I.plus))+`
  <div class="grid g3">${kpi('Budgeted revenue',fmt(sc.revenue),'tournaments + dues + MGA lines')}${kpi('Budgeted expenses',fmt(sc.expenses),'tournaments + MGA lines')}${kpi('Season net',fmtS(sc.net),'Actual so far: '+fmtS(sc.netA),netCls(sc.net))}</div>
  <div class="card" style="overflow:hidden"><div class="cardhead"><h2 class="h2">Tournaments</h2></div><div class="tw"><div class="t" style="min-width:820px">
    <div class="tr th" style="${cols}"><span>Tournament</span><span>Dates</span><span class="r">Revenue</span><span class="r">Expenses</span><span class="r">Net</span><span class="r">Actual net</span></div>
    ${sc.ts.map(({t,c})=>r(esc(t.name),dateRange(t).replace(/, \d{4}$/,''),fmt(c.revenue),fmt(c.expenses),c.net,fmtS(c.netA),'click',`data-open="${t.id}"`)).join('')||'<div class="tr"><span class="muted">No tournaments this season.</span></div>'}
    ${r('Tournaments subtotal','',fmt(sc.tRev),fmt(sc.tExp),sc.tRev-sc.tExp,'','tot')}
  </div></div></div>
  <div class="card" style="overflow:hidden"><div class="cardhead"><h2 class="h2">MGA-level money</h2></div><div class="tw"><div class="t" style="min-width:820px">
    <div class="tr th" style="${cols}"><span>Line</span><span>Basis</span><span class="r">Budget</span><span class="r"></span><span class="r"></span><span class="r">Actual</span></div>
    ${r('Annual dues',`${sc.active} × ${fmt(s.dues.amount)}`,fmt(sc.duesBudget),'','','<span>'+fmt(sc.duesActual)+'</span>','click','id="sbDues"')}
    <div class="tr" style="${cols};border-top:none;min-height:0;padding-bottom:12px"><span class="muted" style="font-size:12.5px;grid-column:1/-1">${n0(s.dues.installments)>1?`Charged as ${s.dues.installments} × ${fmt(n0(s.dues.amount)/s.dues.installments)}, `:''}not prorated. Actual comes from dues recorded on each member.</span></div>
    ${r('50/50 raffle (all season)','Assigned to tournaments',fmt(sc.raffle)+' → tournaments','','',fmt(sc.raffleA))}
    <div class="tr" style="${cols};border-top:none;min-height:0;padding-bottom:12px"><span class="muted" style="font-size:12.5px;grid-column:1/-1">Collected at every event and counted in the tournament it’s assigned to (Member-Member), so it isn’t added again here.</span></div>
    ${s.lines.map(l=>r(esc(l.desc),esc(l.type),l.type==='Income'?fmt(l.budget):'',l.type==='Income'?'':fmt(l.budget),'',fmt(l.actual),'click',`data-sl="${l.id}"`)).join('')}
  </div></div></div>`;
  wireCommon(m);
  $('sbDues').onclick=editDues; $('sbAdd').onclick=()=>editSeasonLine(null);
  m.querySelectorAll('[data-sl]').forEach(x=>x.onclick=()=>editSeasonLine(s.lines.find(l=>l.id===x.dataset.sl)));
}
function editSeasonLine(l){
  const s=db.seasons[Y()];
  openDrawer({kicker:Y()+' season · MGA-level',title:l?l.desc:'Add MGA line',body:field('Description','slD',l?.desc||'',{ph:'e.g. Year-end banquet'})+field('Type','slT',l?.type||'Expense',{type:'select',options:['Income','Expense']})+pair(field('Budget $','slB',l?.budget??'',{type:'number'}),field('Actual $','slA',l?.actual||'',{type:'number'})),
    save:()=>{ const d=fv('slD'); if(!d){ toast('Add a description'); return false; } const data={desc:d,type:fv('slT'),budget:fnum('slB'),actual:fnum('slA')};
      if(l) Object.assign(l,data); else s.lines.push(Object.assign({id:uid()},data)); },
    del:l?()=>{ s.lines=s.lines.filter(x=>x!==l); }:null});
}

/* ---------- chrome, login, boot ---------- */
function newSeasonPrompt(){
  const ys=Object.keys(db.seasons).map(Number), next=String(Math.max(...ys,new Date().getFullYear())+1);
  openDrawer({kicker:'Seasons',title:'New season',body:field('Year','nsY',next,{type:'number'})+`<label class="check"><input type="checkbox" id="nsC" checked>Carry over dues settings</label><p class="hint">Tournaments aren’t copied automatically — create each one with “Start from” to copy last year’s structure.</p>`,
    save:()=>{ const y=String(Math.round(fnum('nsY'))); if(!/^\d{4}$/.test(y)){ toast('Enter a 4-digit year'); return false; } if(db.seasons[y]){ db.activeSeason=y; return; }
      const cur=db.seasons[Y()]; db.seasons[y]=newSeason(); if($('nsC').checked) db.seasons[y].dues=clone(cur.dues); db.activeSeason=y; toast(y+' season created'); }});
}
function dl(content,type,name){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([content],{type})); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
function wireChrome(){
  $('btnMenu').innerHTML=I.menu; $('dClose').innerHTML=I.x;
  $('btnMenu').onclick=()=>$('side').classList.toggle('open');
  $('dClose').onclick=closeDrawer; $('scrim').onclick=closeDrawer;
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&drawerOpen()) closeDrawer(); });
  $('seasonSel').onchange=e=>{ if(e.target.value==='__new'){ e.target.value=Y(); newSeasonPrompt(); return; } db.activeSeason=e.target.value; persist(); go(view.page==='tournament'?'tournaments':view.page); };
  $('btnBackup').onclick=()=>{ dl(JSON.stringify(db,null,2),'application/json','mga_hub_backup_'+new Date().toISOString().slice(0,10)+'.json'); toast('Backup downloaded'); };
  $('btnRestore').onclick=()=>$('fileRestore').click();
  $('fileRestore').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader();
    r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.tournaments||!d.seasons) throw 0; if(!confirm('Replace everything in the hub with this backup?')) return; db=normalize(d); persist(); go('dash'); toast('Backup restored'); }catch(_){ toast('That isn’t an MGA Hub backup'); } };
    r.readAsText(f); e.target.value=''; };
  $('syncBtn').onclick=()=>{ if(!CLOUD||!sessionOK) return; if(!cloudReady) startCloud(); else { setSync('saving'); pushCloud(); } };
  $('btnSignOut').onclick=async()=>{ await sb.auth.signOut(); location.reload(); };
}
async function doLogin(){
  const pw=$('loginPw').value; if(!pw) return; $('loginBtn').disabled=true; $('loginErr').textContent='';
  const {error}=await sb.auth.signInWithPassword({email:CFG.boardEmail,password:pw});
  $('loginBtn').disabled=false;
  if(error){ $('loginErr').textContent='That password didn’t work.'; return; }
  $('login').classList.remove('show'); sessionOK=true; $('btnSignOut').hidden=false; startCloud();
}
async function boot(){
  wireChrome(); render();
  if(!CLOUD){ setSync('local'); return; }
  $('loginBtn').onclick=doLogin; $('loginPw').onkeydown=e=>{ if(e.key==='Enter') doLogin(); };
  const {data}=await sb.auth.getSession();
  if(data&&data.session){ sessionOK=true; $('btnSignOut').hidden=false; startCloud(); }
  else { $('login').classList.add('show'); setTimeout(()=>$('loginPw').focus(),100); }
}
boot();
</script>
