<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F2A38">
<meta name="robots" content="noindex">
<title>Event · Flagstick</title>
<link rel="icon" href="favicon.png?v=3">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<style>
:root{--navy:#0F2A38;--gold:#C7A13A;--goldl:#D8B75F;--golddk:#7E5F1A;--paper:#F4F0E6;--ivory:#FBFAF5;--line:#E3DCC9;--muted:#56626A;--ink:#14222B;--pos:#1F6B4A;--neg:#B5443A;
  --serif:'Cormorant Garamond',Georgia,serif;--sans:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box} html,body{margin:0} [hidden]{display:none!important}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;font-variant-numeric:lining-nums}
button,input,textarea,select{font:inherit;color:inherit} button{cursor:pointer}
.top{background:radial-gradient(circle at 10% 40%,#1B3D50,var(--navy) 65%);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 14px;display:flex;align-items:center;gap:14px;border-bottom:3px solid var(--gold)}
.top img{height:44px;max-width:120px;object-fit:contain} .top .t{flex:1;min-width:0} .top b{display:block;font-family:var(--serif);font-size:24px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .top small{color:#C9CFD2;font-size:13px}
.top .me{font-size:12.5px;color:#D8B75F;font-weight:700;text-align:right;white-space:nowrap}
main{max-width:760px;margin:0 auto;padding:16px 14px 90px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;margin-bottom:14px}
h1{font-family:var(--serif);font-size:32px;line-height:1.05;margin:0 0 6px;color:var(--navy)} h2{font-family:var(--serif);font-size:24px;margin:0 0 10px;color:var(--navy);line-height:1.05}
.muted{color:var(--muted)} .hint{font-size:13px;color:var(--muted)} p{margin:0 0 8px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 0 14px;padding-bottom:2px} .tabs button{flex:none;height:40px;padding:0 16px;border-radius:999px;border:1.5px solid #CFC6AE;background:#fff;font-weight:700;font-size:14px} .tabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.inp{width:100%;height:46px;border:1.5px solid #CFC6AE;border-radius:10px;padding:0 12px;background:#fff;font-size:16px} textarea.inp{height:auto;padding:10px 12px}
.lbl{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:10px 0 4px}
.btn{height:48px;padding:0 18px;border-radius:12px;border:1.5px solid #CFC6AE;background:#fff;font-weight:700;font-size:15px;color:var(--navy)} .btn.pri{background:var(--navy);border-color:var(--navy);color:#fff} .btn.gold{background:var(--gold);border-color:var(--gold);color:var(--navy)} .btn.w{width:100%} .btn:disabled{opacity:.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:#fff} .item.mine{border-color:var(--pos);box-shadow:inset 3px 0 0 var(--pos)} .item.out{border-color:var(--neg);box-shadow:inset 3px 0 0 var(--neg)}
.item .hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start} .item .hd b{font-size:17px} .item .hd .no{color:var(--muted);font-weight:700;margin-right:6px}
.item .cur{font-family:var(--serif);font-size:28px;color:var(--navy);line-height:1;white-space:nowrap} .item .sub{font-size:13px;color:var(--muted);margin-top:4px}
.item .bid{display:flex;gap:8px;margin-top:10px;align-items:center} .item .bid .inp{width:120px;height:44px} .item .bid .btn{height:44px}
.chip{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--ivory);border:1px solid var(--line);color:var(--muted)} .chip.ok{background:#E3F0E8;color:var(--pos);border-color:#BFD9C8} .chip.bad{background:#F6E0DD;color:var(--neg);border-color:#E6B9B3}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;font-weight:600;z-index:60;max-width:92vw;text-align:center}
.fs{margin:20px 0 0;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;gap:6px;align-items:center;justify-content:center} .fs img{height:18px}
.therm{height:12px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:8px} .therm div{height:100%;background:linear-gradient(90deg,var(--gold),#E0C060)}
@media (max-width:480px){ .row2{grid-template-columns:1fr} }
</style>
</head>
<body>
<header class="top"><img id="hLogo" src="flagstick-crest-light.svg" alt=""><div class="t"><b id="hTitle">Event</b><small id="hSub"></small></div><div class="me" id="hMe"></div></header>
<main id="main"><div class="card"><p class="muted">Loading…</p></div></main>
<script>
/* The event page for a nonprofit's gala (fund-setup.sql): the evening, tickets (an RSVP — pay at the door), and the silent
   auction. A guest joins with a name and phone and gets a paddle number; bids go through fund_bid, which refuses anything
   under the minimum or after bidding closes. The page re-reads the auction every 6 seconds. Nothing here is a login. */
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CFG=window.MM_CONFIG||{}; const sb=(CFG.url&&CFG.anonKey&&window.supabase)?window.supabase.createClient(CFG.url,CFG.anonKey,{auth:{persistSession:false}}):null;
const QS=new URLSearchParams(location.search); const KEY=(QS.get('k')||'').trim(), CKEY=(QS.get('c')||'').trim(), PROG=QS.get('p')==='1'; const ls={get(k){ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(_){ return null; } },set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(_){ } }};
const fmt=v=>'$'+Number(v||0).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0});
let E=null, D=null, ME=null, TAB=CKEY?'cashier':'about', MY=[], busy=false, timer=null, draftBids={}, CASH=null, cq='', cpad=null;
async function rpc(fn,args){ const {data,error}=await sb.rpc(fn,Object.assign({p_token:KEY},args||{})); if(error) throw new Error((error.message||'failed').replace(/^.*?: /,'')); return data; }
function toast(m){ const d=document.createElement('div'); d.className='toast'; d.textContent=m; document.body.appendChild(d); setTimeout(()=>d.remove(),2800); }
function fail(t,x){ $('main').innerHTML=`<div class="card"><h1>${esc(t)}</h1><p class="muted">${esc(x||'')}</p></div>`; }
async function load(){ if(!sb) return fail('Not connected','This page is not available right now.'); if(!KEY) return fail('No event','Open the link the organization sent you.');
  let r=null; try{ r=CKEY?await rpc('fund_cashier_get',{p_key:CKEY}):await rpc('fund_get'); }catch(e){ return fail(CKEY?'Not a cashier link':'Couldn’t load the event',e.message); } if(!r) return fail('This link is not valid','Ask the organization for the current one.');
  E=r; D=r.doc||{}; if(CKEY) CASH={priv:r.priv||{},bidders:r.bidders||[],actions:r.actions||[]}; ME=ls.get('fs_fund_'+E.fid); $('hTitle').textContent=D.name||'Event'; $('hSub').textContent=D.org||''; if(D.brand) $('hLogo').src=D.brand; document.title=`${D.name||'Event'} · ${D.org||''}`; $('hMe').textContent=ME?`${ME.name} · paddle #${ME.paddle}`:'';
  if(ME){ try{ MY=await rpc('fund_my',{p_bidder:ME.id}); }catch(_){ MY=[]; } }
  if(!document.activeElement||!document.activeElement.matches('input,textarea')) render(); }
function closesTxt(){ const s=D.silent||{}; if(s.closed||E.status==='closed') return 'Bidding is closed'; if(s.closesAt){ const t=new Date(s.closesAt), ms=t-Date.now(); if(ms<=0) return 'Bidding is closed'; const mins=Math.round(ms/60000); return `Bidding closes ${mins<90?'in '+mins+' min':t.toLocaleString('en-US',{weekday:'short',hour:'numeric',minute:'2-digit'})}`; } return 'Bidding is open'; }
const bidOpen=()=>{ const s=D.silent||{}; return E.status==='open'&&!s.closed&&!(s.closesAt&&new Date(s.closesAt)-Date.now()<=0); };
function render(){ if(PROG) return renderProgress(); const s=D.silent||{}, items=(s.items||[]).slice().sort((a,b)=>(+a.no||0)-(+b.no||0)), highs=E.highs||{}, myMap={}; MY.forEach(m=>myMap[m.item]=m);
  const date=D.date?new Date(D.date+'T12:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'}):'';
  const tabs=(CASH?[['cashier','Cashier']]:[]).concat([['about','The evening'],['tickets','Tickets'],['silent',`Silent auction${items.length?' · '+items.length:''}`],['mine',`My bids${MY.length?' · '+MY.length:''}`]]).filter(([k])=>!(k==='tickets'&&!(D.tickets||[]).length));
  let body='';
  if(TAB==='cashier'&&CASH){ body=cashierHTML(); }
  else
  if(TAB==='about'){ const raised=Object.values(highs).reduce((a,h)=>a+Number(h.amount||0),0);
    body=`<div class="card"><h1>${esc(D.name||'')}</h1><p class="muted">${esc(date)}${D.time?' · '+esc(D.time):''}${D.venue?' · '+esc(D.venue):''}</p>${D.descr?`<p style="margin-top:12px;white-space:pre-wrap">${esc(D.descr)}</p>`:''}
      ${items.length?`<p style="margin-top:14px"><span class="chip ${bidOpen()?'ok':''}">${esc(closesTxt())}</span> <span class="hint">${items.length} silent auction items · ${E.bidders||0} bidders so far</span></p>`:''}</div>
      ${D.progress&&D.progress.goal?`<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline"><b style="font-size:20px;color:var(--navy)">${fmt(D.progress.raised)} <span class="muted" style="font-size:14px">of ${fmt(D.progress.goal)}</span></b><b style="color:var(--golddk)">${D.progress.pct}%</b></div><div class="therm"><div style="width:${Math.min(100,D.progress.pct)}%"></div></div></div>`:''}
      ${(D.levels||[]).length?`<div class="card"><h2>Sponsorship</h2>${D.levels.map(l=>`<p><b>${esc(l.name)}</b> · ${fmt(l.amount)}${l.perks?`<br><span class="hint">${esc(l.perks)}</span>`:''}</p>`).join('')}</div>`:''}
      ${(D.raffles||[]).length?`<div class="card"><h2>Raffles</h2>${D.raffles.map(r=>`<p><b>${esc(r.name)}</b> · ${fmt(r.price)} a ticket${r.prizes.length?`<br><span class="hint">${r.prizes.map(p=>esc(p.name)+(p.winner?' — won by '+esc(p.winner.name)+' (ticket '+p.winner.ticket+')':'')).join(' · ')}</span>`:''}</p>`).join('')}<p class="hint">Tickets are sold in the room.</p></div>`:''}`; }
  else if(TAB==='tickets'){ body=`<div class="card"><h2>Tickets</h2>${(D.tickets||[]).map(t=>`<p><b>${esc(t.name)}</b> · ${fmt(t.price)}${t.descr?`<br><span class="hint">${esc(t.descr)}</span>`:''}</p>`).join('')}
      ${D.rsvp?`<div style="margin-top:14px"><span class="lbl">Reserve</span><div class="row2"><input class="inp" id="rvN" placeholder="Your name" value="${esc(ME?ME.name:'')}"><input class="inp" id="rvE" placeholder="E-mail" type="email"></div><div class="row2" style="margin-top:10px"><input class="inp" id="rvP" placeholder="Phone" type="tel"><select class="inp" id="rvT">${(D.tickets||[]).map(t=>`<option value="${esc(t.id)}">${esc(t.name)} · ${fmt(t.price)}</option>`).join('')}</select></div><div class="row2" style="margin-top:10px"><input class="inp" id="rvQ" type="number" min="1" max="20" value="1" placeholder="How many"><input class="inp" id="rvNo" placeholder="A note (seating, dietary)"></div><button class="btn pri w" id="rvGo" style="margin-top:12px">Reserve</button><p class="hint" style="margin-top:8px">We will hold your seats; payment is taken at the door or at checkout.</p></div>`:'<p class="hint">Registration is closed.</p>'}</div>`; }
  else if(TAB==='silent'){ body=`<div class="card"><h2>Silent auction</h2><p><span class="chip ${bidOpen()?'ok':''}">${esc(closesTxt())}</span> <span class="hint">Minimum raise ${fmt(s.minRaise||10)}</span></p>
      ${ME?'':`<div style="margin-top:10px"><span class="lbl">Join to bid</span><div class="row2"><input class="inp" id="jnN" placeholder="Your name"><input class="inp" id="jnP" placeholder="Mobile number" type="tel"></div><input class="inp" id="jnE" placeholder="E-mail (for your receipt)" type="email" style="margin-top:10px"><button class="btn pri w" id="jnGo" style="margin-top:10px">Get my paddle</button></div>`}</div>
      ${items.map(it=>{ const h=highs[it.id], my=myMap[it.id], min=h?Number(h.amount)+Number(s.minRaise||10):Math.max(1,Number(it.start||1)), bought=it.buyNow>0&&h&&Number(h.amount)>=it.buyNow, cls=my?(my.leading?'mine':'out'):'';
        return `<div class="item ${cls}" id="it-${it.id}"><div class="hd"><div><span class="no">${it.no?'#'+it.no:''}</span><b>${esc(it.name)}</b>${it.category?` <span class="chip">${esc(it.category)}</span>`:''}<div class="sub">${it.donor?'Donated by '+esc(it.donor)+' · ':''}value ${fmt(it.value)}${it.buyNow>0?' · buy now '+fmt(it.buyNow):''}</div>${it.descr?`<div class="sub" style="color:var(--ink)">${esc(it.descr)}</div>`:''}</div><div style="text-align:right"><div class="cur">${h?fmt(h.amount):fmt(it.start||0)}</div><div class="sub">${h?`paddle #${h.paddle} · ${h.n} bid${h.n===1?'':'s'}`:'opening bid'}</div></div></div>
          ${my?`<div class="sub" style="margin-top:6px"><span class="chip ${my.leading?'ok':'bad'}">${my.leading?'You are the high bidder':'You have been outbid'}</span></div>`:''}
          ${bidOpen()&&ME&&!bought?`<div class="bid"><input class="inp" type="number" inputmode="numeric" min="${min}" step="1" value="${draftBids[it.id]||min}" data-bi="${it.id}"><button class="btn pri" data-bb="${it.id}">Bid</button>${it.buyNow>0?`<button class="btn gold" data-bn="${it.id}">Buy now ${fmt(it.buyNow)}</button>`:''}</div>`:bought?'<div class="sub" style="margin-top:6px"><span class="chip">Sold at buy now</span></div>':''}</div>`; }).join('')||'<div class="card"><p class="muted">No items yet.</p></div>'}`; }
  else { body=`<div class="card"><h2>My bids</h2>${ME?`<p class="hint">${esc(ME.name)} · paddle #${ME.paddle}</p>`:'<p class="muted">Join the silent auction to bid.</p>'}${MY.map(m=>{ const it=items.find(x=>x.id===m.item)||{name:'Item'}; return `<div class="item ${m.leading?'mine':'out'}"><div class="hd"><div><span class="no">${it.no?'#'+it.no:''}</span><b>${esc(it.name)}</b><div class="sub">your bid ${fmt(m.mine)} · high ${fmt(m.high)}</div></div><span class="chip ${m.leading?'ok':'bad'}">${m.leading?(bidOpen()?'Leading':'Won'):'Outbid'}</span></div></div>`; }).join('')||(ME?'<p class="muted">No bids yet — the items are on the Silent auction tab.</p>':'')}
      ${!bidOpen()&&MY.some(m=>m.leading)?'<p style="margin-top:10px"><b>Congratulations.</b> Please see checkout before you leave to settle up and collect your items.</p>':''}</div>`; }
  $('main').innerHTML=`<div class="tabs">${tabs.map(([k,l])=>`<button class="${TAB===k?'on':''}" data-tab="${k}">${l}</button>`).join('')}</div>${body}<div class="fs"><img src="flagstick-crest.svg" alt="">Flagstick</div>`;
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ TAB=b.dataset.tab; render(); window.scrollTo(0,0); });
  const jn=$('jnGo'); if(jn) jn.onclick=join; const rv=$('rvGo'); if(rv) rv.onclick=rsvp; if(TAB==='cashier'&&CASH) wireCashier();
  document.querySelectorAll('[data-bi]').forEach(i=>i.oninput=()=>{ draftBids[i.dataset.bi]=i.value; });
  document.querySelectorAll('[data-bb]').forEach(b=>b.onclick=()=>bid(b.dataset.bb,Number(document.querySelector(`[data-bi="${b.dataset.bb}"]`).value)));
  document.querySelectorAll('[data-bn]').forEach(b=>b.onclick=()=>{ const it=items.find(x=>x.id===b.dataset.bn); if(confirm(`Buy “${it.name}” now for ${fmt(it.buyNow)}?`)) bid(it.id,Number(it.buyNow)); }); }
/* ---- the cashier: every paddle, what it owes, and the four things a cashier records (fund_cashier → the hub absorbs them) ---- */
const money=v=>'$'+Number(v||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
function cashPaddles(){ const P=CASH.priv, map=new Map(); (P.guests||[]).forEach(g=>map.set(+g.paddle,{paddle:+g.paddle,name:g.name,guest:g})); (CASH.bidders||[]).forEach(b=>{ if(!map.has(+b.paddle)) map.set(+b.paddle,{paddle:+b.paddle,name:b.name,bidder:b}); }); return [...map.values()].sort((a,b)=>a.paddle-b.paddle); }
function cashState(){ // the event as recorded, plus what cashiers have recorded since (the hub has not taken those in yet)
  const P=JSON.parse(JSON.stringify(CASH.priv||{})); const done=new Set(P.absorbed||[]); P.lots=P.lots||[]; P.raffles=P.raffles||[]; P.donations=P.donations||[]; P.payments=P.payments||[];
  for(const a of CASH.actions||[]){ if(done.has(a.id)) continue; const d=a.data||{}, pd=+d.paddle||0; if(!pd) continue;
    if(a.kind==='sale'){ const l=P.lots.find(x=>x.id===d.lot); if(l&&!l.sold) l.sold={paddle:pd,amount:+d.amount||0}; }
    else if(a.kind==='raffle'){ const r=P.raffles.find(x=>x.id===d.raffle); if(r&&!r.locked){ const q=Math.max(1,parseInt(d.qty)||1), from=r.tickets.reduce((m,t)=>Math.max(m,t.to),0)+1; r.tickets.push({paddle:pd,qty:q,from,to:from+q-1,pending:true}); } }
    else if(a.kind==='donation') P.donations.push({paddle:pd,amount:+d.amount||0,note:d.note||''});
    else if(a.kind==='payment') P.payments.push({paddle:pd,amount:+d.amount||0,method:d.method||'Cash',ref:d.ref||'',at:a.at}); }
  return P; }
function cashLines(P,n){ const L=[], H=E.highs||{}; (P.guests||[]).filter(g=>+g.paddle===n).forEach(g=>{ const t=(P.tickets||[]).find(x=>x.id===g.ticketId); if(t&&t.price>0) L.push({txt:`${t.name} × ${g.qty}`,amount:t.price*g.qty}); });
  if(P.closed) (P.items||[]).forEach(it=>{ const h=H[it.id]; if(h&&+h.paddle===n&&Number(h.amount)>=(it.reserve||0)) L.push({txt:`Silent auction · ${it.no?'#'+it.no+' ':''}${it.name}`,amount:Number(h.amount)}); });
  P.lots.filter(l=>l.sold&&+l.sold.paddle===n).forEach(l=>L.push({txt:`Live auction · ${l.no?'#'+l.no+' ':''}${l.name}`,amount:l.sold.amount}));
  P.raffles.forEach(r=>r.tickets.filter(t=>+t.paddle===n).forEach(t=>L.push({txt:`${r.name} · ${t.qty} ticket${t.qty===1?'':'s'}${t.pending?' (just recorded)':''}`,amount:r.price*t.qty})));
  P.donations.filter(d=>+d.paddle===n).forEach(d=>L.push({txt:d.note?`Gift · ${d.note}`:'Gift',amount:d.amount}));
  const owed=L.reduce((a,x)=>a+x.amount,0), paid=P.payments.filter(p=>+p.paddle===n).reduce((a,p)=>a+p.amount,0); return {lines:L,owed,paid,due:Math.round((owed-paid)*100)/100,pays:P.payments.filter(p=>+p.paddle===n)}; }
function cashierHTML(){ const P=cashState(), pads=cashPaddles().map(p=>Object.assign(p,cashLines(P,p.paddle))), q=cq.toLowerCase(), shown=pads.filter(p=>!q||String(p.paddle).includes(q)||p.name.toLowerCase().includes(q)), due=pads.filter(p=>p.due>0.004);
  const sel=cpad!=null?pads.find(p=>p.paddle===cpad):null;
  if(sel){ const lots=P.lots.filter(l=>!l.sold), rafs=P.raffles.filter(r=>!r.locked);
    return `<div class="card"><button class="btn" id="cxBack" style="height:40px;margin-bottom:10px">‹ All paddles</button><h2>#${sel.paddle} · ${esc(sel.name)}</h2>${sel.lines.map(l=>`<p style="display:flex;justify-content:space-between;gap:10px"><span>${esc(l.txt)}</span><b>${money(l.amount)}</b></p>`).join('')||'<p class="muted">Nothing owed yet.</p>'}
      <p style="display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:8px"><b>Owed</b><b>${money(sel.owed)}</b></p>${sel.pays.map(p=>`<p style="display:flex;justify-content:space-between" class="muted"><span>Paid · ${esc(p.method)}${p.ref?' · '+esc(p.ref):''}</span><span>−${money(p.amount)}</span></p>`).join('')}<p style="display:flex;justify-content:space-between;font-size:20px"><b>${sel.due>0.004?'Due':'Settled'}</b><b style="color:${sel.due>0.004?'var(--neg)':'var(--pos)'}">${money(sel.due)}</b></p></div>
      <div class="card"><h2>Take a payment</h2><div class="row2"><input class="inp" id="cxPA" inputmode="decimal" placeholder="Amount" value="${sel.due>0?sel.due:''}"><select class="inp" id="cxPM">${['Credit card','Cash','Check','Zelle','Other'].map(m=>`<option>${m}</option>`).join('')}</select></div><div class="row2" style="margin-top:10px"><input class="inp" id="cxPR" placeholder="Check #, last four"><button class="btn pri" id="cxPay">Record payment</button></div></div>
      ${lots.length?`<div class="card"><h2>Live auction · sold to #${sel.paddle}</h2><div class="row2"><select class="inp" id="cxLot">${lots.map(l=>`<option value="${esc(l.id)}" data-r="${l.reserve||0}" data-v="${l.value||0}">${l.no?'#'+l.no+' · ':''}${esc(l.name)}${l.reserve?' · reserve '+money(l.reserve):''}</option>`).join('')}</select><input class="inp" id="cxLA" inputmode="decimal" placeholder="Hammer price"></div><button class="btn pri w" id="cxSale" style="margin-top:10px">Record the sale</button></div>`:''}
      ${rafs.length?`<div class="card"><h2>Raffle tickets</h2><div class="row2"><select class="inp" id="cxRf">${rafs.map(r=>`<option value="${esc(r.id)}">${esc(r.name)} · ${money(r.price)}</option>`).join('')}</select><input class="inp" id="cxRQ" type="number" min="1" value="5"></div><button class="btn pri w" id="cxRaf" style="margin-top:10px">Sell tickets</button></div>`:''}
      <div class="card"><h2>Gift · paddle raise</h2><div class="row2"><input class="inp" id="cxDA" inputmode="decimal" placeholder="Amount"><input class="inp" id="cxDN" placeholder="Note" value="Paddle raise"></div><button class="btn pri w" id="cxDon" style="margin-top:10px">Record the gift</button></div>`; }
  return `<div class="card"><h2>Cashier</h2><p class="hint">${pads.length} paddles · ${due.length} still owe ${money(due.reduce((a,p)=>a+p.due,0))}${P.closed?'':' · silent-auction wins count once bidding is closed'}</p><input class="inp" id="cxQ" placeholder="Paddle number or name…" value="${esc(cq)}" autocomplete="off"><div style="margin-top:10px"><button class="btn" id="cxNew" style="height:40px">New paddle (walk-in)</button></div></div>
    ${shown.map(p=>`<div class="item" data-cx="${p.paddle}" style="cursor:pointer"><div class="hd"><div><span class="no">#${p.paddle}</span><b>${esc(p.name)}</b><div class="sub">${p.lines.map(l=>esc(l.txt)).join(' · ')||'nothing yet'}</div></div><div style="text-align:right"><div class="cur" style="color:${p.due>0.004?'var(--neg)':'var(--pos)'}">${money(p.due)}</div><div class="sub">owes ${money(p.owed)} · paid ${money(p.paid)}</div></div></div></div>`).join('')||'<div class="card"><p class="muted">No paddles yet.</p></div>'}`; }
function wireCashier(){ const q=$('cxQ'); if(q){ q.oninput=()=>{ cq=q.value; const pos=q.selectionStart; render(); const nq=$('cxQ'); if(nq){ nq.focus(); nq.setSelectionRange(pos,pos); } }; } document.querySelectorAll('[data-cx]').forEach(d=>d.onclick=()=>{ cpad=+d.dataset.cx; render(); window.scrollTo(0,0); }); const bk=$('cxBack'); if(bk) bk.onclick=()=>{ cpad=null; render(); };
  const nw=$('cxNew'); if(nw) nw.onclick=async()=>{ const name=prompt('Name'); if(!name) return; const phone=prompt('Mobile number (optional)')||''; try{ const r=await rpc('fund_join',{p_name:name,p_phone:phone,p_email:''}); toast(`Paddle #${r.paddle} · ${r.name}`); await load(); cpad=r.paddle; render(); }catch(e){ toast(e.message); } };
  const act=async(kind,data,msg)=>{ if(busy) return; busy=true; try{ await rpc('fund_cashier',{p_key:CKEY,p_kind:kind,p_data:Object.assign({paddle:cpad,by:'cashier'},data)}); toast(msg); await load(); render(); }catch(e){ toast(e.message); } finally{ busy=false; } };
  const pay=$('cxPay'); if(pay) pay.onclick=()=>{ const a=Number($('cxPA').value); if(!(a>0)){ toast('Enter the amount'); return; } act('payment',{amount:a,method:$('cxPM').value,ref:$('cxPR').value.trim()},`${money(a)} recorded`); };
  const sl=$('cxSale'); if(sl) sl.onclick=()=>{ const s=$('cxLot'), o=s.options[s.selectedIndex], a=Number($('cxLA').value), rsv=Number(o.dataset.r||0); if(!(a>0)){ toast('Enter the hammer price'); return; } if(rsv&&a<rsv&&!confirm(`${money(a)} is under the reserve of ${money(rsv)}. Record it anyway?`)) return; act('sale',{lot:s.value,amount:a},'Sale recorded'); };
  const rf=$('cxRaf'); if(rf) rf.onclick=()=>{ const q=Math.max(1,parseInt($('cxRQ').value)||1); act('raffle',{raffle:$('cxRf').value,qty:q},`${q} ticket${q===1?'':'s'} recorded`); };
  const dn=$('cxDon'); if(dn) dn.onclick=()=>{ const a=Number($('cxDA').value); if(!(a>0)){ toast('Enter the amount'); return; } act('donation',{amount:a,note:$('cxDN').value.trim()},`${money(a)} gift recorded`); }; }
/* the big status bar: the event's goal and what has been raised — for a website, a lobby screen, a post (the event page with &p=1) */
function renderProgress(){ const P=D.progress||{goal:D.goal||0,raised:0,pct:0,streams:[]}; const pct=P.goal?Math.min(100,P.raised/P.goal*100):0; $('hMe').textContent=''; const when=D.date?new Date(D.date+'T12:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'}):'';
  $('main').innerHTML=`<div class="card" style="text-align:center;padding:28px 18px"><div class="hint" style="letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--golddk)">${esc(D.org||'')}</div><h2 style="margin:6px 0 0">${esc(D.name||'')}</h2>${when?`<p class="hint">${when}${D.venue?' · '+esc(D.venue):''}</p>`:''}<h1 style="font-size:52px;margin:14px 0 2px">${fmt(P.raised)}</h1>${P.goal?`<p class="muted" style="font-size:18px">raised of our ${fmt(P.goal)} goal · <b style="color:var(--navy)">${Math.round(pct)}%</b></p>`:'<p class="muted" style="font-size:18px">raised so far</p>'}
      <div class="therm" style="height:28px;margin-top:18px"><div style="width:${pct}%"></div></div>${P.goal&&P.raised<P.goal?`<p class="hint" style="margin-top:8px">${fmt(P.goal-P.raised)} to go</p>`:P.goal?'<p class="hint" style="margin-top:8px">Goal reached — thank you</p>':''}</div>
    ${(P.streams||[]).length?`<div class="card"><h2>Where it came from</h2>${P.streams.map(s=>`<p style="display:flex;justify-content:space-between"><span>${esc(s.name)}</span><b>${fmt(s.amount)}</b></p>`).join('')}</div>`:''}
    ${D.status==='open'?`<p style="text-align:center"><a class="btn pri" href="${location.pathname}?k=${encodeURIComponent(KEY)}">The event page</a></p>`:''}
    <p class="hint" style="text-align:center">Updated ${P.at?new Date(P.at).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):''}</p><div class="fs"><img src="flagstick-crest.svg" alt="">Flagstick</div>`; }
async function join(){ const name=$('jnN').value.trim(), phone=$('jnP').value.trim(), email=$('jnE').value.trim(); if(!name){ toast('Your name, please'); return; } if(!phone&&!email){ toast('A mobile number or e-mail, so we can find you again'); return; }
  try{ const r=await rpc('fund_join',{p_name:name,p_phone:phone,p_email:email}); ME={id:r.id,paddle:r.paddle,name:r.name}; ls.set('fs_fund_'+E.fid,ME); $('hMe').textContent=`${ME.name} · paddle #${ME.paddle}`; toast(`You are paddle #${ME.paddle}`); await load(); render(); }catch(e){ toast(e.message); } }
async function bid(item,amount){ if(busy||!ME) return; if(!amount||amount<=0){ toast('Enter your bid'); return; } busy=true; try{ const r=await rpc('fund_bid',{p_bidder:ME.id,p_item:item,p_amount:amount}); delete draftBids[item]; toast(r&&r.bought?'Yours — bought at buy now':`Bid placed · ${fmt(amount)}`); await load(); render(); }catch(e){ toast(e.message); await load(); render(); } finally{ busy=false; } }
async function rsvp(){ const d={name:$('rvN').value.trim(),email:$('rvE').value.trim(),phone:$('rvP').value.trim(),ticket:$('rvT').value,qty:parseInt($('rvQ').value)||1,note:$('rvNo').value.trim()}; if(!d.name){ toast('Your name, please'); return; } if(!d.email&&!d.phone){ toast('An e-mail or phone, so we can confirm'); return; }
  try{ await rpc('fund_rsvp',{p_data:d}); $('main').querySelector('.card').innerHTML=`<h2>Thank you, ${esc(d.name)}</h2><p>We are holding ${d.qty} × ${esc(((D.tickets||[]).find(t=>t.id===d.ticket)||{}).name||'ticket')} for you. Payment is taken at the door or at checkout.</p>`; }catch(e){ toast(e.message); } }
load(); timer=setInterval(load,6000); document.addEventListener('visibilitychange',()=>{ if(!document.hidden) load(); });
/* Keeps every open device on the latest version: checks version.json about once a minute and, when a
   newer build is live, reloads at a safe moment (nothing unsaved, no editor open, not mid-typing).
   The host's CDN caches version.json and the pages separately (up to 5 min each), so right after a deploy they can
   disagree in either direction. Two rules keep that from turning into a reload loop: only a build NEWER than this
   page counts, and a reload is tried once per build — if the page that comes back is still the old one, the CDN
   hasn't caught up; wait a while before trying that build again. */
(function(){
  const ME='20261030220608', KEY='au_tried', RETRY=10*60*1000; let ready=false, lastCheck=0;
  const typing=()=>{ const a=document.activeElement; return a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.value&&a.type!=='search'; };
  const safe=()=>!typing()&&(typeof window.__canReload!=='function'||window.__canReload());
  const tried=()=>{ try{ const [b,t]=(sessionStorage.getItem(KEY)||'').split('|'); return b?{build:b,at:+t||0}:null; }catch(_){ return null; } };
  async function check(){ lastCheck=Date.now(); if(location.protocol==='file:') return;
    try{ const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'}); if(!r.ok) return; const v=await r.json(); if(!v||!v.build||!(v.build>ME)) return;
      const t=tried(); if(t&&t.build===v.build&&Date.now()-t.at<RETRY) return;   // already reloaded for this build and still got the old page
      ready=v.build; }catch(_){} }
  setInterval(()=>{ if(ready){ if(safe()){ try{ sessionStorage.setItem(KEY,ready+'|'+Date.now()); }catch(_){ } location.reload(); } } else if(Date.now()-lastCheck>60000) check(); },3000);
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') check(); });
  window.__build=ME;
})();
</script>
