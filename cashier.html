<style>

body{font-variant-numeric:lining-nums} .num{font-variant-numeric:lining-nums tabular-nums} .muted{color:var(--muted)} .pos{color:var(--pos)} .neg{color:var(--neg)} .r{text-align:right}
.top{background:var(--navy);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 20px 12px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20}

.banner{background:#F6ECCF;border:1px solid #E5CF8E;color:#5C4410;border-radius:10px;padding:12px 14px;font-size:14px;margin-bottom:12px}
@media (max-width:760px){ .kpis{grid-template-columns:1fr 1fr} .two{grid-template-columns:1fr} }
.meta{display:contents}
.fcards{display:none}

@media (max-width:640px){
  main{padding:14px 12px 60px} .kpi{padding:12px} .kpi b{font-size:24px}
  .tabs{overflow-x:auto} .tabs button{white-space:nowrap;padding:10px 10px}
  .bar .chips{width:100%} .bar .btn{width:100%;justify-content:center}
  .row.h.lots,.row.h.bids{display:none}
  .row.lot{grid-template-columns:40px minmax(0,1fr) auto!important;grid-template-areas:"lot team price" "lot meta price";row-gap:3px;padding:10px 12px}
  .row.lot>.c-lot{grid-area:lot;font-size:17px} .row.lot>.c-team{grid-area:team;white-space:normal;font-weight:600} .row.lot>.c-price{grid-area:price;font-size:16px}

  .row.bid>.c-num{grid-area:num} .row.bid>.c-name{grid-area:name;white-space:normal;font-weight:600} .row.bid>.c-edit{grid-area:edit;justify-self:end;width:40px;justify-content:center}
  .row.bid>.c-bought{grid-area:meta;font-size:12.5px} .row.bid>.c-owes{grid-area:owes} .row.bid>.c-pay{grid-area:pay}
  .sheet .hd .n{font-size:32px;min-width:48px} .sheet .hd b{font-size:19px}
  .modal{padding:4vh 10px}

<body>
<header class="top"><img src="crest.png?v=2" alt=""><div class="t"><b id="tName">Calcutta</b><small>Calcutta · Cashier</small></div><span class="pill" id="sync">Connecting…</span></header>
<main id="main"><div class="card" style="padding:22px"><p class="muted">Loading…</p></div></main>
<script>
/* =====================================================================
   Calcutta core — pure logic shared by the hub and the cashier page.
   ===================================================================== */
const c0=v=>{ const x=parseFloat(v); return isFinite(x)?x:0; };
const flightName=f=>/^\d+$/.test(String(f))?'Flight '+f:String(f||'—');
const idxTxt2=v=>v==null||v===''?'—':(+v<0?'+'+Math.abs(+v).toFixed(1):(+v).toFixed(1));
const teamName=l=>l&&l.isPool?`The Pool (${l.count} team${l.count===1?'':'s'})`:`${l.p1} & ${l.p2}`;
/* teams that didn't reach the minimum; sold together as one extra lot after the last one */
/* team buy-in: every team owns a share of itself (default 25% for $300) before the auction;
   a team can pre-buy the rest (default $900 more) and then isn't auctioned at all */
const BUYIN_DEFAULT={on:false,pct:25,amount:300,prebuyExtra:900};   // off unless turned on for this Calcutta
const buyInOf=c=>Object.assign({},BUYIN_DEFAULT,c.buyIn||{});
function teamDue(c,l){ const bi=buyInOf(c); if(!bi.on) return 0; return c0(bi.amount)+(l.prebuy?c0(bi.prebuyExtra):0); }
/* a team's own payments, kept apart: the buy-in (its 25%) and, if pre-bought, the pre-buy (the rest) */
function teamParts(c,l){ const bi=buyInOf(c); if(!bi.on) return [];
  const ps=teamPlayers(l), each=c0(bi.amount)/(ps.length||1);
  const out=ps.map((name,i)=>({kind:'buyin',label:`${name} · buy-in`,player:i,name,amount:each,pay:(l.buyInP||[])[i]||{}}));
  if(l.prebuy){ const pe=c0(bi.prebuyExtra)/(ps.length||1); ps.forEach((name,i)=>out.push({kind:'prebuy',label:`${name} · pre-buy`,player:i,name,amount:pe,pay:(l.prebuyP||[])[i]||{}})); }
  return out; }
/* older data kept the whole $1,200 on the buy-in; split it once */
const teamPlayers=l=>[l.p1,l.p2].filter(Boolean);
/* per-player buy-in payment: set one player's, keeping the other's */
function setBuyInPay(l,i,pay){ const n=teamPlayers(l).length||1; l.buyInP=Array.from({length:n},(_,k)=>(l.buyInP||[])[k]||{paid:false,method:''}); l.buyInP[i]={paid:!!pay.paid,method:pay.paid?(pay.method||''):''}; }
function calcNormalize(c){ for(const l of c.lots||[]){
    if(l.buyIn&&!l.buyInP){ const n=teamPlayers(l).length||1; l.buyInP=Array.from({length:n},()=>({paid:!!l.buyIn.paid,method:l.buyIn.paid?(l.buyIn.method||''):''})); }   // older data: one team payment → each player
    if(l.prebuy&&l.buyIn&&l.buyIn.paid&&!l.prebuyPay&&!l.prebuyP) l.prebuyPay={paid:true,method:l.buyIn.method||''};
    if(l.prebuyPay&&!l.prebuyP){ const n=teamPlayers(l).length||1; l.prebuyP=Array.from({length:n},()=>({paid:!!l.prebuyPay.paid,method:l.prebuyPay.paid?(l.prebuyPay.method||''):''})); }   // one team payment → each player
    delete l.prebuyPay; } return c; }
function setPrebuyPay(l,i,pay){ const n=teamPlayers(l).length||1; l.prebuyP=Array.from({length:n},(_,k)=>(l.prebuyP||[])[k]||{paid:false,method:''}); l.prebuyP[i]={paid:!!pay.paid,method:pay.paid?(pay.method||''):''}; }
const ownership=(c,l)=>{ const bi=buyInOf(c); return l.prebuy?{team:100,buyer:0}:(bi.on?{team:c0(bi.pct),buyer:100-c0(bi.pct)}:{team:0,buyer:100}); };
const poolTeams=c=>c.lots.filter(l=>l.pooled&&!l.prebuy);
const poolLotNum=c=>c.lots.reduce((a,l)=>Math.max(a,+l.lot||0),0)+1;
function poolLot(c){ const ts=poolTeams(c); return ts.length?{id:'__pool',isPool:true,lot:poolLotNum(c),count:ts.length,teams:ts,bidderId:c.pool.bidderId,price:c0(c.pool.price),flight:'Pool'}:null; }
const auctionSeq=c=>{ const p=poolLot(c); return c.lots.filter(l=>!l.prebuy).concat(p?[p]:[]); };
function setPooled(c,l,on){ l.pooled=!!on; if(on){ l.price=0; l.bidderId=''; l.prebuy=false; } if(!poolTeams(c).length) c.pool={bidderId:'',price:0}; }
function setPrebuy(c,l,on){ l.prebuy=!!on; if(on){ l.price=0; l.bidderId=''; l.pooled=false; if(!l.prebuyP) l.prebuyP=teamPlayers(l).map(()=>({paid:false,method:''})); } if(!poolTeams(c).length) c.pool={bidderId:'',price:0}; }
function calcTotalsC(c){
  const flights=[...new Set(c.lots.map(l=>flightName(l.flight)))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
  const exp=c.expenses.reduce((a,e)=>a+c0(e.amount),0), share=flights.length?exp/flights.length:0;
  const pt=poolTeams(c), pp=c0(c.pool.price), perPoolTeam=pt.length&&pp>0?pp/pt.length:0;   // pool price shared by its teams' flights
  const byF=flights.map(f=>{ const ls=c.lots.filter(l=>flightName(l.flight)===f);
    const sold=ls.filter(l=>!l.pooled&&!l.prebuy&&c0(l.price)>0), inPool=ls.filter(l=>l.pooled&&!l.prebuy), pre=ls.filter(l=>l.prebuy);
    const fromPool=inPool.length*perPoolTeam, auction=sold.reduce((a,l)=>a+c0(l.price),0), buyIns=ls.reduce((a,l)=>a+teamDue(c,l),0);
    const gross=auction+fromPool+buyIns, net=gross-share;
    return {flight:f,teams:ls.length,sold:sold.length,pooled:inPool.length,prebuy:pre.length,fromPool,auction,buyIns,gross,share,net,places:c.payout.map(p=>Math.max(0,net)*c0(p)/100)}; });
  const pot=byF.reduce((a,f)=>a+f.gross,0), soldLots=c.lots.filter(l=>!l.pooled&&!l.prebuy&&c0(l.price)>0), pre=c.lots.filter(l=>l.prebuy).length;
  const buyIns=byF.reduce((a,f)=>a+f.buyIns,0), auctionTotal=byF.reduce((a,f)=>a+f.auction,0)+pp;
  const prices=soldLots.map(l=>c0(l.price)).concat(pp>0?[pp]:[]);
  return {flights,byF,exp,share,pot,net:pot-exp,sold:soldLots.length+(pp>0?pt.length:0),auctionLots:c.lots.length-pre,prebuy:pre,buyIns,auctionTotal,lots:c.lots.length,pooled:pt.length,poolPrice:pp,poolLot:pt.length?poolLotNum(c):null,
          top:prices.reduce((a,v)=>Math.max(a,v),0),avg:prices.length?prices.reduce((a,v)=>a+v,0)/prices.length:0,payPct:c.payout.reduce((a,p)=>a+c0(p),0)};
}
const bidderById=(c,id)=>c.bidders.find(b=>b.id===id);
const bidderByNum=(c,n)=>c.bidders.find(b=>String(b.num)===String(n).trim());
const bidderLabel=b=>b?`#${b.num} ${b.name}`:'—';
function bidderOwes(c,b){ const ls=c.lots.filter(l=>!l.pooled&&l.bidderId===b.id&&c0(l.price)>0); const p=poolLot(c); if(p&&p.bidderId===b.id&&p.price>0) ls.push(p); return {lots:ls,total:ls.reduce((a,l)=>a+c0(l.price),0)}; }


/* payments: what's been collected, by method, and what's still owed */
const PAY_METHODS=['Cash','Zelle','Credit card','Check'];
function calcPayments(c){
  /* three kinds of money, never mixed: auction purchases (paid by the buyer), team buy-ins and pre-buys (paid by the team) */
  const KINDS=['auction','buyin','prebuy'], zero=()=>{ const o={}; PAY_METHODS.forEach(m=>o[m]=0); o.notRecorded=0; return o; };
  const g={}; KINDS.forEach(k=>g[k]={by:zero(),due:0,paid:0,owed:0,count:0,countPaid:0});
  let buyers=0, paid=0;
  const add=(k,amt,pay)=>{ const G=g[k]; G.due+=amt; G.count++; if(pay&&pay.paid){ G.paid+=amt; G.countPaid++; if(pay.method&&G.by[pay.method]!=null) G.by[pay.method]+=amt; else G.by.notRecorded+=amt; } else G.owed+=amt; };
  for(const b of c.bidders){ const o=bidderOwes(c,b); if(!(o.total>0)) continue; buyers++; if(b.paid) paid++; add('auction',o.total,b.paid?{paid:true,method:b.method}:null); }
  for(const l of c.lots) for(const p of teamParts(c,l)) if(p.amount>0) add(p.kind,p.amount,p.pay);
  const by={}; PAY_METHODS.forEach(m=>by[m]=KINDS.reduce((a,k)=>a+g[k].by[m],0));
  const notRecorded=KINDS.reduce((a,k)=>a+g[k].by.notRecorded,0), collected=KINDS.reduce((a,k)=>a+g[k].paid,0), outstanding=KINDS.reduce((a,k)=>a+g[k].owed,0);
  const hasCount=c.cashCount!=null&&c.cashCount!=='', expectedCash=c0(c.cashFloat)+by.Cash;
  return {by,g,notRecorded,collected,outstanding,buyers,paid,bidPaid:g.auction.paid,
    biDue:g.buyin.due+g.prebuy.due,biPaid:g.buyin.paid+g.prebuy.paid,biOwed:g.buyin.owed+g.prebuy.owed,biTeams:g.buyin.count,biTeamsPaid:g.buyin.countPaid,
    expectedCash,cashCount:hasCount?c0(c.cashCount):null,overShort:hasCount?c0(c.cashCount)-expectedCash:null};
}
/* ---------- shared editing (hub + cashiers) ----------
   Each team, bidder and expense carries a last-changed time (u). Before saving, anything that changed
   since the last sync is stamped; when two copies meet, the newer version of each item wins, deletes
   travel as tombstones, and settings (minimum, payout, pool, cash counts) merge as one unit. */
const CALC_KINDS=['lots','bidders','expenses'];
const CALC_SET=['minBid','payout','pool','cashCount','cashFloat','file','importedAt','buyIn','paidOut'];
function calcStable(x){ if(Array.isArray(x)) return '['+x.map(calcStable).join(',')+']'; if(x&&typeof x==='object') return '{'+Object.keys(x).filter(k=>x[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+calcStable(x[k])).join(',')+'}'; return JSON.stringify(x===undefined?null:x); }
const calcStrip=e=>{ const o=Object.assign({},e); delete o.u; return o; };
const calcSettings=c=>{ const o={}; CALC_SET.forEach(k=>{ o[k]=c[k]===undefined?null:c[k]; }); return o; };
function calcDoc(c){ const d={}; CALC_KINDS.forEach(k=>d[k]=JSON.parse(JSON.stringify(c[k]||[]))); CALC_SET.forEach(k=>{ if(c[k]!==undefined) d[k]=JSON.parse(JSON.stringify(c[k])); });
  d._su=c._su||0; d._del=JSON.parse(JSON.stringify(c._del||[])); if(c.people) d.people=c.people; if(c.name) d.name=c.name; return d; }
function calcStamp(c,base,now){
  now=now||Date.now(); base=base||{}; c._del=c._del||[];
  for(const k of CALC_KINDS){ const bm=new Map((base[k]||[]).map(e=>[e.id,{s:calcStable(calcStrip(e)),u:e.u||0}])); const ids=new Set();
    for(const e of c[k]||[]){ ids.add(e.id); const b0=bm.get(e.id);
      if(!b0||b0.s!==calcStable(calcStrip(e))){ if(!((e.u||0)>(b0?b0.u:0))) e.u=now; } }   // stamp once per change, not on every check
    for(const id of bm.keys()) if(!ids.has(id)&&!c._del.some(d=>d.kind===k&&d.id===id)) c._del.push({kind:k,id,u:now}); }
  if(calcStable(calcSettings(c))!==calcStable(calcSettings(base))&&!((c._su||0)>(base._su||0))) c._su=now;
}
function calcMerge(r,l){
  r=r||{}; l=l||{}; const out={};
  const dm=new Map(); for(const d of (r._del||[]).concat(l._del||[])){ const key=d.kind+'|'+d.id; if(!dm.has(key)||dm.get(key).u<d.u) dm.set(key,d); }

/* one save round-trip: merge with the latest copy and write it only if nobody saved in between */
async function calcSyncOnce(get,put,local){

    if(calcStable(merged)===calcStable(rem.doc)) return {doc:rem.doc,version:rem.version,wrote:false};
    try{ const v=await put(merged,rem.version); return {doc:merged,version:v,wrote:true}; }
    catch(e){ if(!/conflict/i.test(e.message||'')) throw e; }

/* ---------- captains, buyers and shares ----------
   Each team has a captain: the player with the lower Handicap Index (plus handicaps are lower).
   The captain is the buyer of the team's own share — 100% of a pre-bought team, or the team's
   buy-in share (e.g. 25%) of a team that goes to auction — and is paid that share. Buyers don't
   need bidder numbers; if a captain later takes a paddle, everything they own joins that number. */

const captainMember=l=>[l.m1,l.m2][capIdx(l)]||'';
function captainBidder(c,l){ const m=captainMember(l), k=nameKey(captainName(l));
  return (m&&c.bidders.find(b=>b.memberId===m))||c.bidders.find(b=>nameKey(b.name)===k)||null; }
/* every share of every team, and who holds it */
function calcStakes(c){
  const bi=buyInOf(c), teamPct=bi.on?c0(bi.pct):0, out=[], pl=poolLot(c);
  const cap=l=>{ const b=captainBidder(c,l); return b?{key:'b:'+b.id,bidderId:b.id,num:b.num,name:b.name,captainOf:l.id}:{key:'m:'+(captainMember(l)||nameKey(captainName(l))),memberId:captainMember(l),name:captainName(l),captainOf:l.id}; };
  const bid=b=>({key:'b:'+b.id,bidderId:b.id,num:b.num,name:b.name});
  for(const l of c.lots){
    if(l.prebuy){ out.push({lot:l,pct:100,kind:'prebuy',owner:cap(l)}); continue; }
    let buyer=null;
    if(l.pooled&&!l.prebuy){ const pb=pl&&pl.price>0?bidderById(c,c.pool.bidderId):null; if(pb) buyer={owner:bid(pb),kind:'pool'}; }
    else if(c0(l.price)>0){ const b=bidderById(c,l.bidderId); if(b) buyer={owner:bid(b),kind:'auction'}; }
    if(buyer) out.push({lot:l,pct:100-teamPct,kind:buyer.kind,owner:buyer.owner});
    if(teamPct>0) out.push({lot:l,pct:teamPct,kind:'team',owner:cap(l)});

}
function calcHoldings(c){

}

    const sold=()=>{ const num=bi.value.trim(), price=c0(String(pi.value).replace(/[$,]/g,''));
      if(!(price>0)){ toast('Enter the price'); pi.focus(); return; } if(!num){ toast('Enter the bidder number'); bi.focus(); return; }
      if(!P&&doc.minBid&&price<doc.minBid){ if(confirm(`${fmt(price)} is under the ${fmt(doc.minBid)} minimum.\n\nOK sends the team to the pool. Cancel lets you change the price.`)){ edit(d=>setPooled(d,d.lots.find(x=>x.id===id),true)); close(); toast('Sent to the pool'); } else pi.focus(); return; }
      edit(d=>{ const x=ensureBidder(d,num); if(P) d.pool={bidderId:x.id,price}; else { const t=d.lots.find(z=>z.id===id); setPooled(d,t,false); t.bidderId=x.id; t.price=price; } });
      close(); toast(`Lot ${l.lot} sold · ${fmt(price)}`); };
    m.querySelector('#mSold').onclick=sold; [bi,pi].forEach(e=>e.onkeydown=ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); if(e===bi) pi.focus(); else sold(); } });
    const pb=m.querySelector('#mPool'); if(pb) pb.onclick=()=>{ edit(d=>setPooled(d,d.lots.find(x=>x.id===id),true)); close(); toast(`Lot ${l.lot} → the pool`); };
    m.querySelector('#mClr').onclick=()=>{ if(!confirm('Clear this lot’s sale?')) return; edit(d=>{ if(P) d.pool={bidderId:'',price:0}; else { const t=d.lots.find(z=>z.id===id); setPooled(d,t,false); t.price=0; t.bidderId=''; } }); close(); };
  });
}
function paneBidders(el){
  const ql=bq.toLowerCase().trim();
  const rows=doc.bidders.filter(b=>!ql||String(b.num)===ql||b.name.toLowerCase().includes(ql)).map(b=>({b,o:bidderOwes(doc,b)})).filter(({b,o})=>bf==='all'||(bf==='buyers'?o.total>0:o.total>0&&!b.paid)), HOLD=calcHoldings(doc);
  const owedAll=doc.bidders.filter(b=>!b.paid).reduce((a,b)=>a+bidderOwes(doc,b).total,0);
  const cols='grid-template-columns:64px minmax(0,1.4fr) minmax(0,1fr) 100px 150px 36px';
  el.innerHTML=`<div class="bar"><input class="inp search" id="bq" placeholder="Find a bidder — number or name" value="${esc(bq)}" autocomplete="off"><button class="btn pri" id="bAdd">+ Add bidder</button></div>
    <div class="bar" style="justify-content:space-between"><div class="chips">${[['all','All'],['buyers','Buyers'],['unpaid','Unpaid']].map(([k,l])=>`<button data-bf="${k}" class="${bf===k?'on':''}">${l}</button>`).join('')}</div><span class="muted" style="font-size:13px">${fmt(owedAll)} still owed · tap a buyer to see their lots</span></div>
    <div class="card"><div class="row h bids" style="${cols}"><span>#</span><span>Name</span><span>Bought</span><span class="r">Owes</span><span>Paid</span><span></span></div>
    ${rows.map(({b,o})=>`<div class="row bid${o.lots.length?' exp':''}" data-bx="${b.id}" style="${cols}"><b class="c-num">${o.lots.length?(bOpen[b.id]?'▾ ':'▸ '):''}#${esc(b.num)}</b><span class="c-name trunc">${esc(b.name)}</span><span class="c-bought trunc muted" style="font-size:13px">${(()=>{ const h=HOLD.find(x=>x.bidderId===b.id); const caps=h?h.stakes.filter(s=>s.kind==='prebuy'||s.kind==='team').map(s=>`Lot ${s.lot.lot} ${s.kind==='prebuy'?'pre-bought':s.pct+'% own team'}`):[]; return o.lots.map(l=>l.isPool?'Pool':'Lot '+l.lot).concat(caps).join(', ')||'Nothing bought yet'; })()}</span><b class="c-owes r num">${o.total?fmt(o.total):''}</b>
      <span class="c-pay">${o.total?`<select class="pay${b.paid?' paid':''}" data-pay="${b.id}" aria-label="Payment for bidder ${esc(b.num)}"><option value="">Not paid</option>${PAY_METHODS.map(mm=>`<option${b.paid&&b.method===mm?' selected':''}>${mm}</option>`).join('')}</select>`:''}</span>
      <button class="btn c-edit" data-eb="${b.id}" style="height:34px;padding:0 10px" aria-label="Edit bidder ${esc(b.num)}">✎</button></div>${bOpen[b.id]&&o.lots.length?`<div class="bdet">${o.lots.map(l=>`<div class="bdl"><b>Lot ${l.lot}</b><span>${l.isPool?'The Pool · '+esc(l.teams.map(x=>teamName(x)).join(', ')):esc(teamName(l))+' · '+esc(flightName(l.flight))}</span><b class="num">${fmt(l.price)}</b></div>`).join('')}<div class="bdl tot"><b>Total</b><span>${b.paid?'Paid'+(b.method?' · '+esc(b.method):''):'Not paid yet'}</span><b class="num">${fmt(o.total)}</b></div></div>`:''}`).join('')||'<div class="row"><span class="muted">No bidders yet.</span></div>'}</div>`;
  $('bq').oninput=e=>{ bq=e.target.value; paneBidders(el); const i=$('bq'); i.focus(); i.setSelectionRange(bq.length,bq.length); };
  $('bAdd').onclick=()=>openBidder(null);
  el.querySelectorAll('[data-bf]').forEach(x=>x.onclick=()=>{ bf=x.dataset.bf; paneBidders(el); });
  el.querySelectorAll('[data-bx].exp').forEach(r=>r.onclick=e=>{ if(e.target.closest('select,button')) return; bOpen[r.dataset.bx]=!bOpen[r.dataset.bx]; paneBidders(el); });
  el.querySelectorAll('[data-pay]').forEach(s=>s.onchange=()=>{ const v=s.value; edit(d=>{ const b=d.bidders.find(x=>x.id===s.dataset.pay); b.paid=!!v; b.method=v||''; }); toast(v?`Marked paid · ${v}`:'Marked not paid'); });
  el.querySelectorAll('[data-eb]').forEach(x=>x.onclick=()=>openBidder(x.dataset.eb));
}
function openBidder(id){
  const b=id?doc.bidders.find(x=>x.id===id):null, people=doc.people||[];
  modal(`<div class="hd"><div class="n"><small>BIDDER</small>${b?esc(b.num):'+'}</div><div><b>${b?esc(b.name):'Add a bidder'}</b><span>${b?'Edit name or number':'Type a name — players in the field come up as you type'}</span></div></div>
    <div class="bd"><div class="fld" style="position:relative"><label for="nN">Name</label><input class="inp" id="nN" value="${esc(b?b.name:'')}" autocomplete="off"><div class="sug" id="nS" hidden></div></div>
      <div class="fld"><label for="nU">Bidder number</label><input class="inp num" id="nU" inputmode="numeric" value="${esc(b?b.num:nextNum())}" autocomplete="off"></div>
      <div class="acts"><button class="btn pri" id="nOk">${b?'Save':'Add bidder'}</button>${b?'<button class="btn warn" id="nDel">Remove</button>':''}<button class="btn" id="nX">Cancel</button></div></div>`,
  (m,close)=>{ const ni=m.querySelector('#nN'), su=m.querySelector('#nS'), ui=m.querySelector('#nU'); let hits=[],cur=0,linked=b?b.memberId:'';
    const draw=()=>{ const v=ni.value.trim().toLowerCase(); hits=v?people.filter(p=>p.name.toLowerCase().split(/\s+/).some(w=>w.startsWith(v))||p.name.toLowerCase().includes(v)).slice(0,6):[]; cur=0;
      su.hidden=!hits.length; su.innerHTML=hits.map((p,k)=>`<div data-k="${k}" class="${k===cur?'on':''}">${esc(p.name)}${doc.bidders.some(x=>x.memberId===p.id&&x!==b)?` <span class="muted">· already #${esc(doc.bidders.find(x=>x.memberId===p.id).num)}</span>`:''}</div>`).join('');
      su.querySelectorAll('[data-k]').forEach(d=>d.onmousedown=e=>{ e.preventDefault(); pick(hits[+d.dataset.k]); }); };
    const pick=p=>{ ni.value=p.name; linked=p.id; su.hidden=true; ui.focus(); ui.select(); };
    ni.oninput=()=>{ linked=''; draw(); }; ni.onblur=()=>setTimeout(()=>su.hidden=true,120);
    ni.onkeydown=e=>{ if(!su.hidden&&(e.key==='ArrowDown'||e.key==='ArrowUp')){ cur=(cur+(e.key==='ArrowDown'?1:-1)+hits.length)%hits.length; su.querySelectorAll('[data-k]').forEach((d,k)=>d.className=k===cur?'on':''); e.preventDefault(); }
      else if(e.key==='Enter'){ e.preventDefault(); if(!su.hidden&&hits[cur]) pick(hits[cur]); else ui.focus(); } };
    setTimeout(()=>ni.focus(),30);
    const ok=()=>{ const name=ni.value.trim(), num=ui.value.trim(); if(!name){ toast('Enter a name'); ni.focus(); return; } if(!num){ toast('Enter a bidder number'); ui.focus(); return; }
      if(doc.bidders.some(x=>x!==b&&String(x.num)===num)){ toast(`Bidder #${num} is already taken`); ui.focus(); return; }
      if(linked&&doc.bidders.some(x=>x!==b&&x.memberId===linked)){ toast(`${name} already has a number`); return; }
      edit(d=>{ if(b){ const x=d.bidders.find(z=>z.id===b.id); Object.assign(x,{name,num,memberId:linked||x.memberId||''}); d.bidders.sort((a,z)=>(+a.num||0)-(+z.num||0)); } else { d.bidders.push({id:uid(),num,name,memberId:linked,paid:false,method:''}); d.bidders.sort((a,z)=>(+a.num||0)-(+z.num||0)); } });
      close(); toast(b?'Bidder saved':`Bidder #${num} added`); };
    m.querySelector('#nOk').onclick=ok; ui.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); ok(); } };
    const del=m.querySelector('#nDel'); if(del) del.onclick=()=>{ const o=bidderOwes(doc,b); if(!confirm(o.lots.length?`#${b.num} bought ${o.lots.length} lot${o.lots.length>1?'s':''}. Remove anyway? Those sales will show no buyer.`:`Remove bidder #${b.num}?`)) return;
      edit(d=>{ d.lots.forEach(l=>{ if(l.bidderId===b.id) l.bidderId=''; }); if(d.pool&&d.pool.bidderId===b.id) d.pool.bidderId=''; d.bidders=d.bidders.filter(x=>x.id!==b.id); }); close(); };
    m.querySelector('#nX').onclick=close; });
}
function paneTotals(el,T,P){
  const plc=['1st','2nd','3rd','4th','5th','6th','7th','8th'], fc=`grid-template-columns:minmax(0,1fr) 60px 100px 96px 100px ${doc.payout.map(()=>'84px').join(' ')}`;
  el.innerHTML=`<div class="card" style="margin-bottom:16px"><h2 class="h2">By flight</h2><div class="sub">Expenses (${fmt(T.exp)}) come out evenly across ${T.flights.length} flights${T.pooled?'; the pool’s price is shared by its teams’ flights':''}.</div>
      <div class="fcards">${T.byF.map(f=>`<div class="fcard"><div class="fc1"><b>${esc(f.flight)}</b><b class="num ${f.net<0?'neg':''}">${fmt(f.net)} <small class="muted">net</small></b></div>
          <div class="fc2 num muted">${fmt(f.gross)} gross${f.buyIns?` (${fmt(f.auction+f.fromPool)} auction · ${fmt(f.buyIns)} buy-ins)`:''} · −${fmt(f.share)} expenses · ${f.sold}/${f.teams-f.prebuy} sold${f.pooled?` · ${f.pooled} in pool`:''}${f.prebuy?` · ${f.prebuy} pre-bought`:''}</div>
          <div class="fc3 num">${doc.payout.map((p,i)=>`<span><small class="muted">${plc[i]||i+1}</small> ${fmt(f.places[i])}</span>`).join('')}</div></div>`).join('')}
        <div class="fcard tot"><div class="fc1"><b>Total</b><b class="num">${fmt(T.net)} <small class="muted">net</small></b></div><div class="fc2 num muted">${fmt(T.pot)} gross · −${fmt(T.exp)} expenses · ${T.sold}/${T.lots} sold</div></div></div>
      <div class="ftable" style="overflow-x:auto;-webkit-overflow-scrolling:touch"><div style="min-width:${520+doc.payout.length*84}px"><div class="row h" style="${fc}"><span>Flight</span><span class="r">Sold</span><span class="r">Gross</span><span class="r">Expenses</span><span class="r">Net pot</span>${doc.payout.map((p,i)=>`<span class="r">${plc[i]||i+1} ${p}%</span>`).join('')}</div>
      ${T.byF.map(f=>`<div class="row num" style="${fc}"><b>${esc(f.flight)}</b><span class="r muted">${f.sold}/${f.teams}</span><span class="r">${fmt(f.gross)}</span><span class="r neg">−${fmt(f.share)}</span><b class="r ${f.net<0?'neg':''}">${fmt(f.net)}</b>${f.places.map(v=>`<span class="r">${fmt(v)}</span>`).join('')}</div>`).join('')}
      <div class="row num tot" style="${fc}"><span>Total</span><span class="r">${T.sold}/${T.lots}</span><span class="r">${fmt(T.pot)}</span><span class="r neg">−${fmt(T.exp)}</span><span class="r">${fmt(T.net)}</span>${doc.payout.map((p,i)=>`<span class="r">${fmt(T.byF.reduce((a,f)=>a+f.places[i],0))}</span>`).join('')}</div></div></div></div>
    <div class="card" style="margin-bottom:16px"><h2 class="h2">Buyers &amp; shares</h2><div class="sub">Everyone to pay out — captains own their team’s share with or without a paddle.</div>
      ${calcHoldings(doc).map(h=>`<div class="row" style="grid-template-columns:62px minmax(0,1fr);align-items:start"><b class="num">${h.num?'#'+esc(h.num):'<span class="muted" style="font-size:12px;font-weight:500">no paddle</span>'}</b><div style="min-width:0"><b>${esc(h.name)}</b><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:4px">${h.stakes.map(st=>`<span class="tag ${st.kind==='prebuy'?'ok':st.kind==='team'?'':'p'}">Lot ${st.lot.lot} · ${st.pct}%${st.kind==='prebuy'?' · pre-bought':st.kind==='team'?' · own team':st.kind==='pool'?' · pool':''}</span>`).join('')}</div></div></div>`).join('')||'<div class="row"><span class="muted">No buyers yet.</span></div>'}</div>
    <div class="two"><div class="card"><h2 class="h2">Payments</h2><div class="sub">${buyInOf(doc).on?'Auction purchases are paid by the buyer; buy-ins and pre-buys by the team.':`${P.paid} of ${P.buyers} buyers paid`}</div>
      ${(()=>{ const BI=buyInOf(doc).on, K=BI?[['auction','Auction'],['buyin','Buy-ins'],['prebuy','Pre-buys']]:[['auction','Auction']];
        const cols=`grid-template-columns:minmax(0,1fr) ${K.map(()=>'minmax(64px,auto)').join(' ')}${BI?' minmax(70px,auto)':''}`;
        const line=(lab,vals,tot,cls='')=>`<div class="row num ${cls}" style="${cols};gap:8px">${`<span>${lab}</span>`}${vals.map(v=>`<span class="r">${v}</span>`).join('')}${BI?`<b class="r">${tot}</b>`:''}</div>`;
        return `<div class="row h" style="${cols};gap:8px"><span>Method</span>${K.map(([,l])=>`<span class="r">${l}</span>`).join('')}${BI?'<span class="r">Total</span>':''}</div>`
          +PAY_METHODS.map(m=>line(m,K.map(([k])=>fmt(P.g[k].by[m])),fmt(P.by[m]))).join('')
          +(P.notRecorded?line('<span class="neg">No method</span>',K.map(([k])=>fmt(P.g[k].by.notRecorded)),fmt(P.notRecorded)):'')
          +line('Collected',K.map(([k])=>fmt(P.g[k].paid)),fmt(P.collected),'tot')
          +line('Still owed',K.map(([k])=>`<span class="${P.g[k].owed?'neg':''}">${fmt(P.g[k].owed)}</span>`),`<span class="${P.outstanding?'neg':''}">${fmt(P.outstanding)}</span>`); })()}</div>
    <div class="card"><h2 class="h2">Cash drawer</h2><div class="sub">Count the cash and compare it with what the payments say should be there.</div>
      <div style="padding:0 16px 16px;display:flex;flex-direction:column;gap:10px">
        <div class="fld"><label for="cf">Starting cash</label><input class="inp num" id="cf" inputmode="decimal" value="${doc.cashFloat??''}" placeholder="0"></div>
        <div class="row num" style="grid-template-columns:minmax(0,1fr) auto;padding:6px 0;border:none"><span class="muted">+ Cash payments (all kinds)</span><b>${fmt(P.by.Cash)}</b></div>
        <div class="row num" style="grid-template-columns:minmax(0,1fr) auto;padding:6px 0;border:none"><b>Should be in the drawer</b><b>${fmt(P.expectedCash)}</b></div>
        <div class="fld"><label for="cc">Cash counted</label><input class="inp num" id="cc" inputmode="decimal" value="${doc.cashCount??''}" placeholder="Count, then enter"></div>
        ${P.overShort==null?'':`<div class="banner" style="margin:0;${Math.abs(P.overShort)<0.005?'background:#E3F0E8;border-color:#BCD9C7;color:#174F37':'background:#F8E6DF;border-color:#EBC2B3;color:#6E2A1B'}"><b>${Math.abs(P.overShort)<0.005?'Balanced ✓':(P.overShort>0?'Over by ':'Short by ')+fmt(Math.abs(P.overShort))}</b></div>`}</div></div></div>`;
  const setCash=(k,v)=>edit(d=>{ d[k]=String(v).trim()===''?null:c0(String(v).replace(/[$,]/g,'')); });
  $('cf').onchange=e=>setCash('cashFloat',e.target.value); $('cc').onchange=e=>setCash('cashCount',e.target.value);
}
window.__canReload=()=>!modalOpen&&!dirty&&!saving;
/* Keeps every open device on the latest version: checks version.json about once a minute and, when a
   newer build is live, reloads at a safe moment (nothing unsaved, no editor open, not mid-typing). */
(function(){
  const ME='20261008144010'; let ready=false, lastCheck=0;
  const typing=()=>{ const a=document.activeElement; return a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.value&&a.type!=='search'; };
  const safe=()=>!typing()&&(typeof window.__canReload!=='function'||window.__canReload());
  async function check(){ lastCheck=Date.now(); if(location.protocol==='file:') return;
    try{ const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'}); if(!r.ok) return; const v=await r.json(); if(v&&v.build&&v.build!==ME) ready=true; }catch(_){} }
  setInterval(()=>{ if(ready){ if(safe()) location.reload(); } else if(Date.now()-lastCheck>60000) check(); },3000);
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') check(); });
  window.__build=ME;
})();

boot();
</script>
