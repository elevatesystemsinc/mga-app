<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F2A38">
<title>Calcutta · Cashier</title>
<link rel="icon" href="crest.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<style>
:root{--navy:#0F2A38;--deep:#0A1C27;--gold:#8C6A1F;--goldl:#D8B75F;--paper:#F4F0E6;--ivory:#FBFAF5;--line:#E3DCC9;--muted:#56626A;--ink:#14222B;--pos:#1F6B4A;--neg:#A1402B;
  --serif:'Cormorant Garamond',Georgia,serif;--sans:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box} html,body{margin:0} [hidden]{display:none!important}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit} button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums} .muted{color:var(--muted)} .pos{color:var(--pos)} .neg{color:var(--neg)} .r{text-align:right}
.top{background:var(--navy);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 20px 12px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20}
.top img{width:34px;height:44px;object-fit:contain}
.top .t{flex:1;min-width:0} .top b{display:block;font-family:var(--serif);font-size:22px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .top small{color:var(--goldl);font-size:12.5px}
.pill{font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;background:rgba(111,191,142,.18);color:#bfe8cf;white-space:nowrap}
.pill.wait{background:rgba(216,183,95,.2);color:var(--goldl)} .pill.off{background:rgba(224,123,98,.22);color:#f3c1b4}
main{max-width:1100px;margin:0 auto;padding:18px 18px 60px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi span{display:block;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.kpi b{display:block;font-family:var(--serif);font-size:30px;line-height:1.1;margin-top:4px}
.kpi small{color:var(--muted);font-size:12.5px}
.tabs{display:flex;gap:6px;margin:18px 0 12px;border-bottom:1px solid var(--line)}
.tabs button{border:none;background:none;padding:10px 14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--navy);border-bottom-color:var(--gold)}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.inp{height:42px;border:1px solid #CFC6AE;border-radius:9px;padding:0 12px;background:#fff;min-width:0}
.search{flex:1 1 260px}
.chips{display:flex;gap:6px} .chips button{height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:13px;color:var(--muted)} .chips button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.btn{height:42px;padding:0 16px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--navy);font-weight:700;display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff} .btn.warn{color:var(--neg)} .btn[disabled]{opacity:.45}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);min-height:48px}
.row.h{border-top:none;background:var(--ivory);font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-height:36px}
.row.click{cursor:pointer} .row.click:hover{background:#FBF7EC}
.row.pool{background:#F6ECCF} .row.dim{opacity:.7} .row.tot{background:var(--ivory);font-weight:800}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:999px;background:#EEF1F2;color:var(--muted)} .tag.p{background:#F6ECCF;color:#6B4F12} .tag.ok{background:#E3F0E8;color:var(--pos)} .tag.due{background:#F8E6DF;color:var(--neg)}
select.pay{height:36px;border:1px solid #CFC6AE;border-radius:8px;padding:0 8px;background:#fff;font-weight:700;width:100%}
select.pay.paid{background:#E3F0E8;border-color:#BCD9C7;color:var(--pos)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.h2{font-family:var(--serif);font-size:24px;margin:0;padding:14px 16px 6px}
.sub{padding:0 16px 12px;color:var(--muted);font-size:13px}
.modal{position:fixed;inset:0;background:rgba(10,28,39,.45);display:flex;align-items:flex-start;justify-content:center;padding:8vh 16px;z-index:50}
.sheet{background:#fff;border-radius:14px;width:min(560px,100%);box-shadow:0 30px 70px rgba(0,0,0,.35);overflow:hidden}
.sheet .hd{background:var(--navy);color:#fff;padding:16px 18px;display:flex;gap:14px;align-items:center}
.sheet .hd .n{font-family:var(--serif);font-size:40px;font-weight:700;line-height:1;min-width:60px;text-align:center}
.sheet .hd .n small{display:block;font-family:var(--sans);font-size:10px;letter-spacing:.14em;color:var(--goldl);font-weight:800}
.sheet .hd b{font-family:var(--serif);font-size:22px;display:block;line-height:1.15} .sheet .hd span{font-size:13px;color:#C9CFD2}
.sheet .bd{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.fld label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px} .fld .inp{width:100%;font-size:18px;height:48px}
.hint{font-size:12.5px;color:var(--muted);min-height:16px}
.acts{display:flex;gap:8px;flex-wrap:wrap} .acts .btn{flex:1;justify-content:center}
.sug{border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-top:4px}
.sug div{padding:9px 12px;cursor:pointer} .sug div.on{background:#F6ECCF}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;font-weight:600;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.banner{background:#F6ECCF;border:1px solid #E5CF8E;color:#5C4410;border-radius:10px;padding:12px 14px;font-size:14px;margin-bottom:12px}
@media (max-width:760px){ .kpis{grid-template-columns:1fr 1fr} .two{grid-template-columns:1fr} }
</style>
</head>
<body>
<header class="top"><img src="crest.png?v=2" alt=""><div class="t"><b id="tName">Calcutta</b><small>Cashier</small></div><span class="pill" id="sync">Connecting…</span></header>
<main id="main"><div class="card" style="padding:22px"><p class="muted">Loading…</p></div></main>
<script>
/* =====================================================================
   Calcutta core — pure logic shared by the hub and the cashier page.
   ===================================================================== */
const c0=v=>{ const x=parseFloat(v); return isFinite(x)?x:0; };
const flightName=f=>/^\d+$/.test(String(f))?'Flight '+f:String(f||'—');
const idxTxt2=v=>v==null||v===''?'—':(+v<0?'+'+Math.abs(+v).toFixed(1):(+v).toFixed(1));
const teamName=l=>l&&l.isPool?`The Pool (${l.count} team${l.count===1?'':'s'})`:`${l.p1} & ${l.p2}`;
/* teams that didn't reach the minimum; sold together as one extra lot after the last one */
const poolTeams=c=>c.lots.filter(l=>l.pooled);
const poolLotNum=c=>c.lots.reduce((a,l)=>Math.max(a,+l.lot||0),0)+1;
function poolLot(c){ const ts=poolTeams(c); return ts.length?{id:'__pool',isPool:true,lot:poolLotNum(c),count:ts.length,teams:ts,bidderId:c.pool.bidderId,price:c0(c.pool.price),flight:'Pool'}:null; }
const auctionSeq=c=>{ const p=poolLot(c); return c.lots.concat(p?[p]:[]); };
function setPooled(c,l,on){ l.pooled=!!on; if(on){ l.price=0; l.bidderId=''; } if(!poolTeams(c).length) c.pool={bidderId:'',price:0}; }
function calcTotalsC(c){
  const flights=[...new Set(c.lots.map(l=>flightName(l.flight)))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
  const exp=c.expenses.reduce((a,e)=>a+c0(e.amount),0), share=flights.length?exp/flights.length:0;
  const pt=poolTeams(c), pp=c0(c.pool.price), perPoolTeam=pt.length&&pp>0?pp/pt.length:0;   // pool price shared by its teams' flights
  const byF=flights.map(f=>{ const ls=c.lots.filter(l=>flightName(l.flight)===f);
    const sold=ls.filter(l=>!l.pooled&&c0(l.price)>0), inPool=ls.filter(l=>l.pooled);
    const fromPool=inPool.length*perPoolTeam, gross=sold.reduce((a,l)=>a+c0(l.price),0)+fromPool, net=gross-share;
    return {flight:f,teams:ls.length,sold:sold.length,pooled:inPool.length,fromPool,gross,share,net,places:c.payout.map(p=>Math.max(0,net)*c0(p)/100)}; });
  const pot=byF.reduce((a,f)=>a+f.gross,0), soldLots=c.lots.filter(l=>!l.pooled&&c0(l.price)>0);
  const prices=soldLots.map(l=>c0(l.price)).concat(pp>0?[pp]:[]);
  return {flights,byF,exp,share,pot,net:pot-exp,sold:soldLots.length+(pp>0?pt.length:0),lots:c.lots.length,pooled:pt.length,poolPrice:pp,poolLot:pt.length?poolLotNum(c):null,
          top:prices.reduce((a,v)=>Math.max(a,v),0),avg:prices.length?prices.reduce((a,v)=>a+v,0)/prices.length:0,payPct:c.payout.reduce((a,p)=>a+c0(p),0)};
}
const bidderById=(c,id)=>c.bidders.find(b=>b.id===id);
const bidderByNum=(c,n)=>c.bidders.find(b=>String(b.num)===String(n).trim());
const bidderLabel=b=>b?`#${b.num} ${b.name}`:'—';
function bidderOwes(c,b){ const ls=c.lots.filter(l=>!l.pooled&&l.bidderId===b.id&&c0(l.price)>0); const p=poolLot(c); if(p&&p.bidderId===b.id&&p.price>0) ls.push(p); return {lots:ls,total:ls.reduce((a,l)=>a+c0(l.price),0)}; }


/* payments: what's been collected, by method, and what's still owed */
const PAY_METHODS=['Cash','Zelle','Credit card','Check'];
function calcPayments(c){
  const by={}; PAY_METHODS.forEach(m=>by[m]=0); let outstanding=0, buyers=0, paid=0, notRecorded=0;
  for(const b of c.bidders){ const o=bidderOwes(c,b); if(!(o.total>0)) continue; buyers++;
    if(b.paid){ paid++; if(b.method&&by[b.method]!=null) by[b.method]+=o.total; else notRecorded+=o.total; } else outstanding+=o.total; }
  const collected=PAY_METHODS.reduce((a,m)=>a+by[m],0)+notRecorded;
  const hasCount=c.cashCount!=null&&c.cashCount!=='';
  const expectedCash=c0(c.cashFloat)+by.Cash;
  return {by,notRecorded,collected,outstanding,buyers,paid,expectedCash,cashCount:hasCount?c0(c.cashCount):null,overShort:hasCount?c0(c.cashCount)-expectedCash:null};
}
/* ---------- shared editing (hub + cashiers) ----------
   Each team, bidder and expense carries a last-changed time (u). Before saving, anything that changed
   since the last sync is stamped; when two copies meet, the newer version of each item wins, deletes
   travel as tombstones, and settings (minimum, payout, pool, cash counts) merge as one unit. */
const CALC_KINDS=['lots','bidders','expenses'];
const CALC_SET=['minBid','payout','pool','cashCount','cashFloat','file','importedAt'];
function calcStable(x){ if(Array.isArray(x)) return '['+x.map(calcStable).join(',')+']'; if(x&&typeof x==='object') return '{'+Object.keys(x).filter(k=>x[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+calcStable(x[k])).join(',')+'}'; return JSON.stringify(x===undefined?null:x); }
const calcStrip=e=>{ const o=Object.assign({},e); delete o.u; return o; };
const calcSettings=c=>{ const o={}; CALC_SET.forEach(k=>{ o[k]=c[k]===undefined?null:c[k]; }); return o; };
function calcDoc(c){ const d={}; CALC_KINDS.forEach(k=>d[k]=JSON.parse(JSON.stringify(c[k]||[]))); CALC_SET.forEach(k=>{ if(c[k]!==undefined) d[k]=JSON.parse(JSON.stringify(c[k])); });
  d._su=c._su||0; d._del=JSON.parse(JSON.stringify(c._del||[])); if(c.people) d.people=c.people; if(c.name) d.name=c.name; return d; }
function calcStamp(c,base,now){
  now=now||Date.now(); base=base||{}; c._del=c._del||[];
  for(const k of CALC_KINDS){ const bm=new Map((base[k]||[]).map(e=>[e.id,calcStable(calcStrip(e))])); const ids=new Set();
    for(const e of c[k]||[]){ ids.add(e.id); if(bm.get(e.id)!==calcStable(calcStrip(e))) e.u=now; }
    for(const id of bm.keys()) if(!ids.has(id)&&!c._del.some(d=>d.kind===k&&d.id===id)) c._del.push({kind:k,id,u:now}); }
  if(calcStable(calcSettings(c))!==calcStable(calcSettings(base))) c._su=now;
}
function calcMerge(r,l){
  r=r||{}; l=l||{}; const out={};
  const dm=new Map(); for(const d of (r._del||[]).concat(l._del||[])){ const key=d.kind+'|'+d.id; if(!dm.has(key)||dm.get(key).u<d.u) dm.set(key,d); }
  const cutoff=Date.now()-3*864e5; out._del=[...dm.values()].filter(d=>d.u>cutoff);
  for(const k of CALC_KINDS){ const m=new Map(); for(const e of r[k]||[]) m.set(e.id,e);
    for(const e of l[k]||[]){ const cur=m.get(e.id); if(!cur||(e.u||0)>=(cur.u||0)) m.set(e.id,e); }
    out[k]=[...m.values()].filter(e=>{ const d=dm.get(k+'|'+e.id); return !d||d.u<(e.u||0); }); }
  out.lots.sort((a,b)=>(+a.lot||0)-(+b.lot||0)); out.bidders.sort((a,b)=>(+a.num||0)-(+b.num||0));
  const win=(l._su||0)>=(r._su||0)?l:r; CALC_SET.forEach(k=>{ const v=win[k]!==undefined?win[k]:(win===l?r[k]:l[k]); if(v!==undefined) out[k]=v; }); out._su=Math.max(l._su||0,r._su||0);
  out.people=l.people||r.people; out.name=l.name||r.name;
  return out;
}
/* one save round-trip: merge with the latest copy and write it only if nobody saved in between */
async function calcSyncOnce(get,put,local){
  for(let n=0;n<4;n++){
    const rem=await get(); const merged=calcMerge(rem.doc,local);
    if(calcStable(merged)===calcStable(rem.doc)) return {doc:rem.doc,version:rem.version,wrote:false};
    try{ const v=await put(merged,rem.version); return {doc:merged,version:v,wrote:true}; }
    catch(e){ if(!/conflict/i.test(e.message||'')) throw e; }
  }
  throw new Error('Too many people saving at once — try again');
}

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>{ const n=Math.round(c0(v)); return (n<0?'−$':'$')+Math.abs(n).toLocaleString('en-US'); };
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const CFG=window.MM_CONFIG||{}; const sb=(CFG.url&&CFG.anonKey&&window.supabase)?window.supabase.createClient(CFG.url,CFG.anonKey,{auth:{persistSession:false}}):null;
const TOKEN=(new URLSearchParams(location.search).get('k')||'').trim(), LS='mga_cashier_'+TOKEN;
let doc=null, base=null, version=0, tab='sales', filt='all', q='', bq='', dirty=false, saving=false, online=true, modalOpen=false, lastErr='';
function toast(m){ const d=document.createElement('div'); d.className='toast'; d.textContent=m; document.body.appendChild(d); setTimeout(()=>d.remove(),2600); }
function setPill(){ const s=$('sync'); if(!online){ s.className='pill off'; s.textContent=dirty?'Offline · changes waiting':'Offline'; return; }
  if(saving||dirty){ s.className='pill wait'; s.textContent='Saving…'; return; } s.className='pill'; s.textContent='● Live · saved'; }
const keep=()=>{ try{ localStorage.setItem(LS,JSON.stringify({doc,base,version,dirty})); }catch(_){} };
const get=async()=>{ const {data,error}=await sb.rpc('calcutta_get',{p_token:TOKEN}); if(error) throw new Error(error.message); if(!data) throw new Error('LINKOFF'); return data; };
const put=async(d,v)=>{ const {data,error}=await sb.rpc('calcutta_put',{p_token:TOKEN,p_doc:d,p_version:v}); if(error) throw new Error(error.message); return data; };
function fail(msg){ $('main').innerHTML=`<div class="card" style="padding:26px"><h2 class="h2" style="padding:0 0 8px">Calcutta cashier</h2><p class="muted">${msg}</p></div>`; $('sync').hidden=true; }
/* every edit: change the working copy, stamp it, save it (merging with anyone else's saves) */
function edit(fn){ fn(doc); calcStamp(doc,base); dirty=true; keep(); render(); saveSoon(); }
let saveT=null; function saveSoon(ms){ clearTimeout(saveT); saveT=setTimeout(syncNow,ms??250); }
async function syncNow(){
  if(saving) { saveSoon(400); return; } saving=true; setPill();
  try{ const res=await calcSyncOnce(get,put,calcDoc(doc)); const before=calcStable(calcDoc(doc));
    doc=res.doc; base=JSON.parse(JSON.stringify(res.doc)); version=res.version; dirty=false; online=true; keep();
    if(calcStable(calcDoc(doc))!==before&&!modalOpen) render(); }
  catch(e){ if(e.message==='LINKOFF'||/invalid link/i.test(e.message)){ saving=false; localStorage.removeItem(LS); return fail('This cashier link has been turned off. Ask the committee for a new one.'); }
    online=false; lastErr=e.message; }
  finally{ saving=false; setPill(); }
}
async function boot(){
  if(!TOKEN) return fail('This link is missing its key. Ask the committee for the cashier link.');
  if(!sb) return fail('The cashier page isn’t connected yet.');
  try{ const saved=JSON.parse(localStorage.getItem(LS)||'null');
    const r=await get(); doc=r.doc; version=r.version; base=JSON.parse(JSON.stringify(r.doc));
    if(saved&&saved.dirty&&saved.doc){ doc=calcMerge(r.doc,saved.doc); dirty=true; }   // changes made while offline, then the page was closed
  }catch(e){ if(e.message==='LINKOFF') return fail('This cashier link has been turned off. Ask the committee for a new one.'); return fail('Couldn’t reach the Calcutta. Check the connection and reload.'); }
  doc.lots=doc.lots||[]; doc.bidders=doc.bidders||[]; doc.expenses=doc.expenses||[]; doc.pool=doc.pool||{bidderId:'',price:0}; doc.payout=doc.payout&&doc.payout.length?doc.payout:[40,30,20,10];
  $('tName').textContent=(doc.name||'Calcutta')+' · Calcutta'; document.title=(doc.name||'Calcutta')+' · Cashier';
  render(); setPill(); if(dirty) saveSoon(0);
  setInterval(()=>{ if(!modalOpen&&!saving&&document.visibilityState==='visible') syncNow(); },4000);
  addEventListener('online',()=>saveSoon(0));
}
const bidderName=id=>{ const b=bidderById(doc,id); return b?`#${b.num} ${b.name}`:'—'; };
const nextNum=()=>doc.bidders.reduce((a,b)=>Math.max(a,parseInt(b.num,10)||0),0)+1;
function ensureBidder(d,num){ let b=bidderByNum(d,num); if(!b){ b={id:uid(),num:String(num),name:'Bidder '+num,memberId:'',paid:false,method:''}; d.bidders.push(b); d.bidders.sort((a,z)=>(+a.num||0)-(+z.num||0)); } return b; }

function render(){
  if(!doc) return; const T=calcTotalsC(doc), P=calcPayments(doc);
  const act=document.activeElement&&document.activeElement.id, selS=act&&document.activeElement.selectionStart;
  $('main').innerHTML=`<div class="kpis">
      <div class="kpi"><span>Pot</span><b class="num">${fmt(T.pot)}</b><small>${T.sold} of ${T.lots} teams sold</small></div>
      <div class="kpi"><span>The pool</span><b class="num">${T.pooled?T.pooled+' team'+(T.pooled===1?'':'s'):'—'}</b><small>${T.pooled?`Lot ${T.poolLot}${T.poolPrice?' · sold '+fmt(T.poolPrice):''}`:(doc.minBid?`under ${fmt(doc.minBid)} goes here`:'no minimum')}</small></div>
      <div class="kpi"><span>Collected</span><b class="num pos">${fmt(P.collected)}</b><small>${P.paid} of ${P.buyers} buyers paid</small></div>
      <div class="kpi"><span>Still owed</span><b class="num ${P.outstanding>0?'neg':''}">${fmt(P.outstanding)}</b><small>${P.buyers-P.paid} buyer${P.buyers-P.paid===1?'':'s'}</small></div></div>
    <div class="tabs">${[['sales','Sales'],['bidders','Bidders & payments'],['totals','Totals']].map(([k,l])=>`<button data-tab="${k}" class="${tab===k?'on':''}">${l}</button>`).join('')}</div>
    <div id="pane"></div>`;
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ tab=b.dataset.tab; render(); });
  ({sales:paneSales,bidders:paneBidders,totals:paneTotals}[tab])($('pane'),T,P);
  if(act&&$(act)){ $(act).focus(); try{ $(act).setSelectionRange(selS,selS); }catch(_){} }
}
function paneSales(el,T){
  const seq=auctionSeq(doc), ql=q.toLowerCase().trim();
  const rows=seq.filter(l=>{ if(filt==='open'&&(l.isPool?l.price>0:(l.pooled||c0(l.price)>0))) return false; if(filt==='pool'&&!(l.isPool||l.pooled)) return false;
    if(!ql) return true; return String(l.lot)===ql||teamName(l).toLowerCase().includes(ql)||(l.isPool&&'pool'.includes(ql)); });
  const cols='grid-template-columns:56px minmax(0,1.6fr) 80px minmax(0,1fr) 100px';
  el.innerHTML=`<div class="bar"><input class="inp search" id="q" placeholder="Find a lot — number or player name" value="${esc(q)}" autocomplete="off"><div class="chips">${[['all','All'],['open','Unsold'],['pool','Pool']].map(([k,l])=>`<button data-f="${k}" class="${filt===k?'on':''}">${l}</button>`).join('')}</div></div>
    ${doc.minBid?`<p class="muted" style="margin:0 0 10px;font-size:13px">Minimum bid ${fmt(doc.minBid)} — teams under it go into the pool${T.pooled?` (Lot ${T.poolLot})`:''}.</p>`:''}
    <div class="card"><div class="row h" style="${cols}"><span>Lot</span><span>Team</span><span>Flight</span><span>Bought by</span><span class="r">Price</span></div>
    ${rows.map(l=>l.isPool?`<div class="row click pool" data-l="__pool" style="${cols}"><b>${l.lot}</b><span class="trunc"><b>The Pool</b> · ${l.count} team${l.count===1?'':'s'}</span><span class="muted">Mixed</span><span class="trunc">${l.price>0?esc(bidderName(l.bidderId)):'<span class="muted">—</span>'}</span><b class="r num">${l.price>0?fmt(l.price):''}</b></div>`
      :`<div class="row click${l.pooled?' dim':''}" data-l="${l.id}" style="${cols}"><b>${l.lot}</b><span class="trunc">${esc(teamName(l))}</span><span class="muted">${esc(flightName(l.flight))}</span><span class="trunc">${l.pooled?'<span class="tag p">In the pool</span>':c0(l.price)>0?esc(bidderName(l.bidderId)):'<span class="muted">—</span>'}</span><b class="r num">${!l.pooled&&c0(l.price)>0?fmt(l.price):''}</b></div>`).join('')||'<div class="row"><span class="muted">No lots match.</span></div>'}</div>`;
  $('q').oninput=e=>{ q=e.target.value; paneSales(el,T); const i=$('q'); i.focus(); i.setSelectionRange(q.length,q.length); };
  $('q').onkeydown=e=>{ if(e.key==='Enter'){ const first=el.querySelector('[data-l]'); if(first) first.click(); } };
  el.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ filt=b.dataset.f; render(); });
  el.querySelectorAll('[data-l]').forEach(r=>r.onclick=()=>openLot(r.dataset.l));
}
function modal(html,wire){ modalOpen=true; const m=document.createElement('div'); m.className='modal'; m.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`; document.body.appendChild(m);
  const close=()=>{ m.remove(); modalOpen=false; render(); }; m.onclick=e=>{ if(e.target===m) close(); }; m.onkeydown=e=>{ if(e.key==='Escape') close(); }; wire(m,close); }
function openLot(id){
  const P=id==='__pool', l=P?poolLot(doc):doc.lots.find(x=>x.id===id); if(!l) return;
  const b=bidderById(doc,l.bidderId);
  modal(`<div class="hd"><div class="n"><small>LOT</small>${l.lot}</div><div style="min-width:0">${P?`<b>The Pool</b><span>${l.count} team${l.count===1?'':'s'} under ${fmt(doc.minBid)}, sold together</span>`:`<b>${esc(l.p1)}<br>${esc(l.p2)}</b><span>${esc(flightName(l.flight))} · team index ${idxTxt2(l.idx)}</span>`}</div></div>
    <div class="bd">${P?`<div class="card">${l.teams.map(x=>`<div class="row" style="grid-template-columns:60px minmax(0,1fr) 80px;min-height:38px"><span class="muted">Lot ${x.lot}</span><span class="trunc">${esc(teamName(x))}</span><span class="muted">${esc(flightName(x.flight))}</span></div>`).join('')}</div>`:''}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div class="fld"><label for="mB">Bidder number</label><input class="inp num" id="mB" inputmode="numeric" value="${esc(b?b.num:'')}" autocomplete="off"><div class="hint" id="mBn"></div></div>
      <div class="fld"><label for="mP">Price</label><input class="inp num" id="mP" inputmode="decimal" value="${c0(l.price)||''}" placeholder="0" autocomplete="off"><div class="hint">${P||!doc.minBid?'':'Minimum '+fmt(doc.minBid)}</div></div></div>
      <div class="acts"><button class="btn pri" id="mSold">Sold</button>${P?'':`<button class="btn" id="mPool">${l.pooled?'Keep in the pool':'Into the pool'}</button>`}<button class="btn warn" id="mClr">Clear</button><button class="btn" id="mX">Cancel</button></div></div>`,
  (m,close)=>{ const bi=m.querySelector('#mB'), pi=m.querySelector('#mP'), hn=m.querySelector('#mBn');
    const upd=()=>{ const x=bidderByNum(doc,bi.value); hn.textContent=bi.value?(x?x.name:'New bidder number — it will be added'):''; }; bi.oninput=upd; upd(); setTimeout(()=>bi.focus(),30);
    const sold=()=>{ const num=bi.value.trim(), price=c0(String(pi.value).replace(/[$,]/g,''));
      if(!(price>0)){ toast('Enter the price'); pi.focus(); return; } if(!num){ toast('Enter the bidder number'); bi.focus(); return; }
      if(!P&&doc.minBid&&price<doc.minBid){ if(confirm(`${fmt(price)} is under the ${fmt(doc.minBid)} minimum.\n\nOK sends the team to the pool. Cancel lets you change the price.`)){ edit(d=>setPooled(d,d.lots.find(x=>x.id===id),true)); close(); toast('Sent to the pool'); } else pi.focus(); return; }
      edit(d=>{ const x=ensureBidder(d,num); if(P) d.pool={bidderId:x.id,price}; else { const t=d.lots.find(z=>z.id===id); setPooled(d,t,false); t.bidderId=x.id; t.price=price; } });
      close(); toast(`Lot ${l.lot} sold · ${fmt(price)}`); };
    m.querySelector('#mSold').onclick=sold; [bi,pi].forEach(e=>e.onkeydown=ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); if(e===bi) pi.focus(); else sold(); } });
    const pb=m.querySelector('#mPool'); if(pb) pb.onclick=()=>{ edit(d=>setPooled(d,d.lots.find(x=>x.id===id),true)); close(); toast(`Lot ${l.lot} → the pool`); };
    m.querySelector('#mClr').onclick=()=>{ if(!confirm('Clear this lot’s sale?')) return; edit(d=>{ if(P) d.pool={bidderId:'',price:0}; else { const t=d.lots.find(z=>z.id===id); setPooled(d,t,false); t.price=0; t.bidderId=''; } }); close(); };
    m.querySelector('#mX').onclick=close; });
}
function paneBidders(el){
  const ql=bq.toLowerCase().trim();
  const rows=doc.bidders.filter(b=>!ql||String(b.num)===ql||b.name.toLowerCase().includes(ql)).map(b=>({b,o:bidderOwes(doc,b)}));
  const cols='grid-template-columns:64px minmax(0,1.4fr) minmax(0,1fr) 100px 150px 36px';
  el.innerHTML=`<div class="bar"><input class="inp search" id="bq" placeholder="Find a bidder — number or name" value="${esc(bq)}" autocomplete="off"><button class="btn pri" id="bAdd">+ Add bidder</button></div>
    <div class="card"><div class="row h" style="${cols}"><span>#</span><span>Name</span><span>Bought</span><span class="r">Owes</span><span>Paid</span><span></span></div>
    ${rows.map(({b,o})=>`<div class="row" style="${cols}"><b>#${esc(b.num)}</b><span class="trunc">${esc(b.name)}</span><span class="trunc muted" style="font-size:13px">${o.lots.map(l=>l.isPool?'Pool':'Lot '+l.lot).join(', ')||'—'}</span><b class="r num">${o.total?fmt(o.total):'—'}</b>
      <span>${o.total?`<select class="pay${b.paid?' paid':''}" data-pay="${b.id}" aria-label="Payment for bidder ${esc(b.num)}"><option value="">Not paid</option>${PAY_METHODS.map(mm=>`<option${b.paid&&b.method===mm?' selected':''}>${mm}</option>`).join('')}</select>`:'<span class="muted" style="font-size:13px">nothing bought</span>'}</span>
      <button class="btn" data-eb="${b.id}" style="height:34px;padding:0 10px" aria-label="Edit bidder ${esc(b.num)}">✎</button></div>`).join('')||'<div class="row"><span class="muted">No bidders yet.</span></div>'}</div>`;
  $('bq').oninput=e=>{ bq=e.target.value; paneBidders(el); const i=$('bq'); i.focus(); i.setSelectionRange(bq.length,bq.length); };
  $('bAdd').onclick=()=>openBidder(null);
  el.querySelectorAll('[data-pay]').forEach(s=>s.onchange=()=>{ const v=s.value; edit(d=>{ const b=d.bidders.find(x=>x.id===s.dataset.pay); b.paid=!!v; b.method=v||''; }); toast(v?`Marked paid · ${v}`:'Marked not paid'); });
  el.querySelectorAll('[data-eb]').forEach(x=>x.onclick=()=>openBidder(x.dataset.eb));
}
function openBidder(id){
  const b=id?doc.bidders.find(x=>x.id===id):null, people=doc.people||[];
  modal(`<div class="hd"><div class="n"><small>BIDDER</small>${b?esc(b.num):'+'}</div><div><b>${b?esc(b.name):'Add a bidder'}</b><span>${b?'Edit name or number':'Type a name — players in the field come up as you type'}</span></div></div>
    <div class="bd"><div class="fld" style="position:relative"><label for="nN">Name</label><input class="inp" id="nN" value="${esc(b?b.name:'')}" autocomplete="off"><div class="sug" id="nS" hidden></div></div>
      <div class="fld"><label for="nU">Bidder number</label><input class="inp num" id="nU" inputmode="numeric" value="${esc(b?b.num:nextNum())}" autocomplete="off"></div>
      <div class="acts"><button class="btn pri" id="nOk">${b?'Save':'Add bidder'}</button>${b?'<button class="btn warn" id="nDel">Remove</button>':''}<button class="btn" id="nX">Cancel</button></div></div>`,
  (m,close)=>{ const ni=m.querySelector('#nN'), su=m.querySelector('#nS'), ui=m.querySelector('#nU'); let hits=[],cur=0,linked=b?b.memberId:'';
    const draw=()=>{ const v=ni.value.trim().toLowerCase(); hits=v?people.filter(p=>p.name.toLowerCase().split(/\s+/).some(w=>w.startsWith(v))||p.name.toLowerCase().includes(v)).slice(0,6):[]; cur=0;
      su.hidden=!hits.length; su.innerHTML=hits.map((p,k)=>`<div data-k="${k}" class="${k===cur?'on':''}">${esc(p.name)}${doc.bidders.some(x=>x.memberId===p.id&&x!==b)?` <span class="muted">· already #${esc(doc.bidders.find(x=>x.memberId===p.id).num)}</span>`:''}</div>`).join('');
      su.querySelectorAll('[data-k]').forEach(d=>d.onmousedown=e=>{ e.preventDefault(); pick(hits[+d.dataset.k]); }); };
    const pick=p=>{ ni.value=p.name; linked=p.id; su.hidden=true; ui.focus(); ui.select(); };
    ni.oninput=()=>{ linked=''; draw(); }; ni.onblur=()=>setTimeout(()=>su.hidden=true,120);
    ni.onkeydown=e=>{ if(!su.hidden&&(e.key==='ArrowDown'||e.key==='ArrowUp')){ cur=(cur+(e.key==='ArrowDown'?1:-1)+hits.length)%hits.length; su.querySelectorAll('[data-k]').forEach((d,k)=>d.className=k===cur?'on':''); e.preventDefault(); }
      else if(e.key==='Enter'){ e.preventDefault(); if(!su.hidden&&hits[cur]) pick(hits[cur]); else ui.focus(); } };
    setTimeout(()=>ni.focus(),30);
    const ok=()=>{ const name=ni.value.trim(), num=ui.value.trim(); if(!name){ toast('Enter a name'); ni.focus(); return; } if(!num){ toast('Enter a bidder number'); ui.focus(); return; }
      if(doc.bidders.some(x=>x!==b&&String(x.num)===num)){ toast(`Bidder #${num} is already taken`); ui.focus(); return; }
      if(linked&&doc.bidders.some(x=>x!==b&&x.memberId===linked)){ toast(`${name} already has a number`); return; }
      edit(d=>{ if(b){ const x=d.bidders.find(z=>z.id===b.id); Object.assign(x,{name,num,memberId:linked||x.memberId||''}); d.bidders.sort((a,z)=>(+a.num||0)-(+z.num||0)); } else { d.bidders.push({id:uid(),num,name,memberId:linked,paid:false,method:''}); d.bidders.sort((a,z)=>(+a.num||0)-(+z.num||0)); } });
      close(); toast(b?'Bidder saved':`Bidder #${num} added`); };
    m.querySelector('#nOk').onclick=ok; ui.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); ok(); } };
    const del=m.querySelector('#nDel'); if(del) del.onclick=()=>{ const o=bidderOwes(doc,b); if(!confirm(o.lots.length?`#${b.num} bought ${o.lots.length} lot${o.lots.length>1?'s':''}. Remove anyway? Those sales will show no buyer.`:`Remove bidder #${b.num}?`)) return;
      edit(d=>{ d.lots.forEach(l=>{ if(l.bidderId===b.id) l.bidderId=''; }); if(d.pool&&d.pool.bidderId===b.id) d.pool.bidderId=''; d.bidders=d.bidders.filter(x=>x.id!==b.id); }); close(); };
    m.querySelector('#nX').onclick=close; });
}
function paneTotals(el,T,P){
  const plc=['1st','2nd','3rd','4th','5th','6th','7th','8th'], fc=`grid-template-columns:minmax(0,1fr) 60px 100px 96px 100px ${doc.payout.map(()=>'84px').join(' ')}`;
  el.innerHTML=`<div class="card" style="margin-bottom:16px"><h2 class="h2">By flight</h2><div class="sub">Expenses (${fmt(T.exp)}) come out evenly across ${T.flights.length} flights${T.pooled?'; the pool’s price is shared by its teams’ flights':''}.</div>
      <div style="overflow-x:auto"><div style="min-width:${520+doc.payout.length*84}px"><div class="row h" style="${fc}"><span>Flight</span><span class="r">Sold</span><span class="r">Gross</span><span class="r">Expenses</span><span class="r">Net pot</span>${doc.payout.map((p,i)=>`<span class="r">${plc[i]||i+1} ${p}%</span>`).join('')}</div>
      ${T.byF.map(f=>`<div class="row num" style="${fc}"><b>${esc(f.flight)}</b><span class="r muted">${f.sold}/${f.teams}</span><span class="r">${fmt(f.gross)}</span><span class="r neg">−${fmt(f.share)}</span><b class="r ${f.net<0?'neg':''}">${fmt(f.net)}</b>${f.places.map(v=>`<span class="r">${fmt(v)}</span>`).join('')}</div>`).join('')}
      <div class="row num tot" style="${fc}"><span>Total</span><span class="r">${T.sold}/${T.lots}</span><span class="r">${fmt(T.pot)}</span><span class="r neg">−${fmt(T.exp)}</span><span class="r">${fmt(T.net)}</span>${doc.payout.map((p,i)=>`<span class="r">${fmt(T.byF.reduce((a,f)=>a+f.places[i],0))}</span>`).join('')}</div></div></div></div>
    <div class="two"><div class="card"><h2 class="h2">Payments</h2><div class="sub">${P.paid} of ${P.buyers} buyers paid</div>
      ${PAY_METHODS.map(m=>`<div class="row num" style="grid-template-columns:minmax(0,1fr) 110px"><span>${m}</span><b class="r">${fmt(P.by[m])}</b></div>`).join('')}
      ${P.notRecorded?`<div class="row num" style="grid-template-columns:minmax(0,1fr) 110px"><span class="neg">Paid, method not recorded</span><b class="r neg">${fmt(P.notRecorded)}</b></div>`:''}
      <div class="row num tot" style="grid-template-columns:minmax(0,1fr) 110px"><span>Collected</span><span class="r">${fmt(P.collected)}</span></div>
      <div class="row num" style="grid-template-columns:minmax(0,1fr) 110px"><span>Still owed</span><b class="r ${P.outstanding>0?'neg':''}">${fmt(P.outstanding)}</b></div></div>
    <div class="card"><h2 class="h2">Cash drawer</h2><div class="sub">Count the cash and compare it with what the payments say should be there.</div>
      <div style="padding:0 16px 16px;display:flex;flex-direction:column;gap:10px">
        <div class="fld"><label for="cf">Starting cash</label><input class="inp num" id="cf" inputmode="decimal" value="${doc.cashFloat??''}" placeholder="0"></div>
        <div class="row num" style="grid-template-columns:minmax(0,1fr) auto;padding:6px 0;border:none"><span class="muted">+ Cash payments</span><b>${fmt(P.by.Cash)}</b></div>
        <div class="row num" style="grid-template-columns:minmax(0,1fr) auto;padding:6px 0;border:none"><b>Should be in the drawer</b><b>${fmt(P.expectedCash)}</b></div>
        <div class="fld"><label for="cc">Cash counted</label><input class="inp num" id="cc" inputmode="decimal" value="${doc.cashCount??''}" placeholder="Count, then enter"></div>
        ${P.overShort==null?'':`<div class="banner" style="margin:0;${Math.abs(P.overShort)<0.005?'background:#E3F0E8;border-color:#BCD9C7;color:#174F37':'background:#F8E6DF;border-color:#EBC2B3;color:#6E2A1B'}"><b>${Math.abs(P.overShort)<0.005?'Balanced ✓':(P.overShort>0?'Over by ':'Short by ')+fmt(Math.abs(P.overShort))}</b></div>`}</div></div></div>`;
  const setCash=(k,v)=>edit(d=>{ d[k]=String(v).trim()===''?null:c0(String(v).replace(/[$,]/g,'')); });
  $('cf').onchange=e=>setCash('cashFloat',e.target.value); $('cc').onchange=e=>setCash('cashCount',e.target.value);
}
boot();
</script>
